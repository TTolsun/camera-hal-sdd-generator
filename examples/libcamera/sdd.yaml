# Ubuntu에서 Meson 빌드 디렉터리를 현재 디렉터리로 두고 실행한다.
# 자세한 절차: ../../docs/libcamera/home-lab.md
source:
  root: ../../../libcamera
  compile_commands: ../../../libcamera/build/compile_commands.json
  # Meson-generated headers are absent from the official Git commit used by source links.
  exclude: ["subprojects/**", "test/**", "build/**"]
  ndk_build:
    enabled: false

output:
  facts_dir: build/facts
  sdd_dir: build/sdd
  diagrams_dir: build/sdd/diagrams

paths:
  sections_file: config/sections.yaml
  consistency_file: config/contracts.yaml
  scenarios_file: config/scenarios.yaml
  prompts: prompts
  templates: ../../templates
  style: ../../style

products:
  file: config/products.yaml

facts:
  # libcamera 는 src/ 와 include/ 아래로만 나뉘므로 1 이면 패키지가 3 개로 뭉친다.
  # 3 이면 src/libcamera/pipeline, src/ipa/ipu3 처럼 검토 단위로 쓸 수 있는 18 개가 나온다.
  package_depth: 3

tools:
  clang_uml: none

agent:
  kind: cli
  runner: codex
  # 사용자 지정 기본값. 각 CLI는 독립 실행하며 사내 모델·제공자는 별도 설정으로 바꾼다.
  model: gpt-6.1-terra
  args: [-c, 'model_reasoning_effort="high"']
  # 문서 간 계약 대조는 대상 주장 하나에도 주 문서의 주장 전체와 근거 발췌를 함께 보낸다. 요청 수명 문서에
  # 절 요약을 넣은 뒤 request-completion 계약의 최소 요청이 41,351자가 되어 한도를 올린다. 근거를 줄이지 않는다.
  max_input_chars: 48000
  timeout_sec: 600
  full_style_guides: false

review:
  require_citations: true
  max_retries: 1
  design_revision: false
  design_grounding: true
  cli_checkpoint: true
  max_calls: 1600
  max_seconds: 14400
  document_max_calls: 160
  document_max_seconds: 7200

documentation:
  enabled: true
  features:
  - id: request-lifecycle
    primary: request-lifecycle.md
    sections:
    - camera-model
    - camera-requests
    - pipeline-handler
    - pipeline-requests
    - request-diagnosis
    scenarios: [queue_request, complete_request, camera_stop]
    symbols: [libcamera::Camera, libcamera::Request, libcamera::PipelineHandler]
  - id: ipu3-lsc
    primary: ipu3-lsc-flow.md
    sections: [ipu3-lsc]
    symbols: [libcamera::ipa::ipu3::algorithms::Lsc]
  - id: rkisp1-dewarp
    primary: rkisp1-dewarp.md
    sections: [pipeline-handler]
    symbols: [libcamera::RkISP1CameraData, libcamera::ConverterDW100Module, libcamera::Dw100VertexMap]
  - id: pipeline-reader
    primary: pipeline-handler.md
    sections:
    - pipeline-requests
    reader_profile: vendor
  - id: request-reader
    primary: request-lifecycle.md
    sections:
    - request-diagnosis
    reader_profile: vendor

  - id: ipa-algorithms
    primary: ipa.md
    sections:
    - ipa-algorithms
  - id: ipu3-lsc-prepare
    primary: ipu3-lsc-flow.md
    sections:
    - ipu3-lsc-prepare
site:
  reader_paths: reader-paths.yaml
  overview_visual: {section: vendor-overview, visual: camera-stack}
  enabled: true
  title: libcamera 설계 문서
  intro: site-intro.md
  guide_visuals: site-guide-visuals.json
  guide_source: {root: ../.., file: examples/libcamera/site-intro.md}
  english_catalog: english.json
  source_url: https://github.com/TTolsun/libcamera-sdd
  # 왼쪽 메뉴의 그룹 순서. 섹션 순서(읽는 차례)와 따로 정한다.
  # 여기에 없는 그룹은 처음 나온 순서대로 뒤에 붙는다.
  nav_groups: ["For Vendor", "For Developer"]

diagrams:
  enabled: true
  max_nodes: 16
  direction: LR
  strip_namespace: 'libcamera::'

visuals:
  on_stale: omit
  file: config/visuals.yaml
  max_nodes: 12
