# Ubuntu에서 Meson 빌드 디렉터리를 현재 디렉터리로 두고 실행한다.
# 자세한 절차: ../../docs/libcamera/home-lab.md
source:
  root: ../../../libcamera
  compile_commands: ../../../libcamera/build/compile_commands.json
  exclude: ["subprojects/**", "test/**"]
  ndk_build:
    enabled: false

output:
  facts_dir: build/facts
  sdd_dir: build/sdd
  diagrams_dir: build/sdd/diagrams

paths:
  sections_file: config/sections.yaml
  scenarios_file: config/scenarios.yaml
  prompts: prompts
  templates: ../../templates
  style: ../../style

facts:
  # libcamera 는 src/ 와 include/ 아래로만 나뉘므로 1 이면 패키지가 3 개로 뭉친다.
  # 3 이면 src/libcamera/pipeline, src/ipa/ipu3 처럼 검토 단위로 쓸 수 있는 18 개가 나온다.
  package_depth: 3

tools:
  clang_uml: none

agent:
  kind: cli
  runner: hermes
  # 공개 libcamera 시험 프로필이며 사내 모델·제공자·reasoning은 model/args로 바꾼다.
  model: qwen3.5:9b-ctx64k
  args: [--provider, custom, --reasoning, high]
  max_input_chars: 40000
  timeout_sec: 600
  full_style_guides: false

review:
  require_citations: true
  max_retries: 1
  design_revision: false
  design_grounding: true

documentation:
  enabled: true
  pages:
    # 빌드한 모든 패키지의 클래스 표라서 크다. 산문이 아니라 표이므로 전체 분량 한도만 넓힌다.
    component-index.md:
      max_markdown_chars: 250000
    # 본문은 약 11,281자이며 18,000자 한도를 유지한다. 원문·응답 복구 기록을 포함한 파일은 약 142,434자다.
    request-lifecycle.md:
      max_markdown_chars: 160000
      max_growth_ratio: 2.0
    # #107 B2: 첫 절을 제품 설명(무엇인가·누구의 문제·계층)과 지원 범위로 넓혀 본문이 기존의 약 1.7배가 된다.
    # 필요한 증가인지 검토한 결과이며, 중복 문장·분량은 사람 검토 전 상태로 남는다.
    vendor-overview.md:
      max_growth_ratio: 2.0
    # #107: Haiku 5.5로 다시 쓴 원고가 기존 9B 원고보다 오류 반환 경로와 예외 조건을 더 많이 설명한다(약 1.7배).
    # 반복 문장 검사는 통과했고 늘어난 내용은 새 근거와 분기 설명이므로 분량 한도만 넓힌다. 사람 검토 전 상태다.
    # 아래 페이지도 같은 모델·같은 이유로 넓힌다. 실제 증가율은 평가 기록에 적고, 한도에 가까우면 분할을 검토한다.
    rkisp1-dewarp.md:
      max_growth_ratio: 2.0
    camera-model.md:
      max_growth_ratio: 2.0
    pipeline-handler.md:
      max_growth_ratio: 2.0
    vendor-integration.md:
      max_growth_ratio: 2.0
    overview.md:
      max_growth_ratio: 2.0
    ipa.md:
      max_growth_ratio: 2.0
    ipu3-lsc-flow.md:
      max_growth_ratio: 2.0
  features:
    - id: request-lifecycle
      primary: request-lifecycle.md
      sections: [camera-model, pipeline-handler]
      scenarios: [queue_request, complete_request, camera_stop]
      symbols: [libcamera::Camera, libcamera::Request, libcamera::PipelineHandler]
    - id: ipu3-lsc
      primary: ipu3-lsc-flow.md
      sections: [ipu3-lsc]
      symbols: [libcamera::ipa::ipu3::algorithms::Lsc]
    - id: rkisp1-dewarp
      primary: rkisp1-dewarp.md
      sections: [pipeline-handler]
      symbols: [libcamera::RkISP1CameraData, libcamera::ConverterDW100Module, libcamera::Dw100VertexMap]

site:
  enabled: true
  title: libcamera 설계 문서
  intro: site-intro.md
  english_catalog: english.json
  source_url: https://github.com/TTolsun/libcamera-sdd
  # 왼쪽 메뉴의 그룹 순서. 섹션 순서(읽는 차례)와 따로 정한다.
  # 여기에 없는 그룹은 처음 나온 순서대로 뒤에 붙는다.
  nav_groups: ["For Vendor", "For Developer"]

diagrams:
  enabled: true
  max_nodes: 16
  direction: LR
  strip_namespace: 'libcamera::'

visuals:
  on_stale: omit
  file: config/visuals.yaml
  max_nodes: 12
