# Ubuntu에서 Meson 빌드 디렉터리를 현재 디렉터리로 두고 실행한다.
# 자세한 절차: ../../docs/libcamera/home-lab.md
source:
  root: ../../../libcamera
  compile_commands: ../../../libcamera/build/compile_commands.json
  # Meson-generated headers are absent from the official Git commit used by source links.
  exclude: ["subprojects/**", "test/**", "build/**"]
  ndk_build:
    enabled: false

output:
  facts_dir: build/facts
  sdd_dir: build/sdd
  diagrams_dir: build/sdd/diagrams

paths:
  sections_file: config/sections.yaml
  consistency_file: config/contracts.yaml
  scenarios_file: config/scenarios.yaml
  prompts: prompts
  templates: ../../templates
  style: ../../style

products:
  file: config/products.yaml

facts:
  # libcamera 는 src/ 와 include/ 아래로만 나뉘므로 1 이면 패키지가 3 개로 뭉친다.
  # 3 이면 src/libcamera/pipeline, src/ipa/ipu3 처럼 검토 단위로 쓸 수 있는 18 개가 나온다.
  package_depth: 3

tools:
  clang_uml: none

agent:
  kind: cli
  runner: codex
  # 사용자 지정 기본값. 각 CLI는 독립 실행하며 사내 모델·제공자는 별도 설정으로 바꾼다.
  model: gpt-6.1-terra
  args: [-c, 'model_reasoning_effort="high"']
  # 문서 간 계약 대조는 대상 주장 하나에도 주 문서의 주장 전체와 근거 발췌를 함께 보낸다. 요청 수명 문서에
  # #249의 조건별 설명을 포함한 실제 대조 요청에서 65,038자를 확인했다. 근거를 줄이지 않고
  # 입력 한도에 여유를 둔다. 사내 환경의 승인된 입력 한도는 별도 설정으로 관리한다.
  max_input_chars: 96000
  timeout_sec: 600
  full_style_guides: false

review:
  require_citations: true
  max_retries: 1
  design_revision: false
  design_grounding: true
  cli_checkpoint: true
  max_calls: 1600
  max_seconds: 14400
  document_max_calls: 160
  document_max_seconds: 7200

# Keep the generation/review H2 in the full rendered reader-item inventory.
# Publication remains opt-in until every current bilingual item is reviewed.
visual_audit:
  require_provenance: true

documentation:
  enabled: true
  features:
  - id: request-lifecycle
    primary: request-lifecycle.md
    sections:
    - camera-model
    - camera-requests
    - pipeline-handler
    - pipeline-requests
    - request-diagnosis
    scenarios: [queue_request, complete_request, camera_stop]
    symbols: [libcamera::Camera, libcamera::Request, libcamera::PipelineHandler]
  - id: ipu3-lsc
    primary: ipu3-lsc-flow.md
    sections: [ipu3-lsc]
    symbols: [libcamera::ipa::ipu3::algorithms::Lsc]
  - id: rkisp1-dewarp
    primary: rkisp1-dewarp.md
    sections: [pipeline-handler]
    symbols: [libcamera::RkISP1CameraData, libcamera::ConverterDW100Module, libcamera::Dw100VertexMap]
  - id: pipeline-reader
    primary: pipeline-handler.md
    sections:
    - pipeline-requests
    reader_profile: vendor
  - id: request-reader
    primary: request-lifecycle.md
    sections:
    - request-diagnosis
    reader_profile: vendor

  - id: ipa-algorithms
    primary: ipa.md
    sections:
    - ipa-algorithms
  - id: ipu3-lsc-prepare
    primary: ipu3-lsc-flow.md
    sections:
    - ipu3-lsc-prepare
site:
  reading_checkpoints:
    request-diagnosis.md: [diagnosis]
  topic_links:
    overview.md:
      request:
      - section: overview
        topic: completion
        label: 버퍼 완료와 요청 전체 완료 구분
      - section: overview
        topic: boundary
        label: 완료 호출자와 스레드 의무
    vendor-integration.md:
      request:
      - section: vendor-integration
        topic: validation
        label: completeRequest 호출 스레드와 함수 반환 후 요청 접근 금지
    request-lifecycle.md:
      journey:
      - section: overview
        topic: request
        label: 접수·버퍼 완료·요청 완료를 함께 확인
      - section: request-diagnosis
        topic: diagnosis
        label: 제보와 관측을 구분해 조사 메모 남기기
    request-diagnosis.md:
      diagnosis:
      - section: pipeline-requests
        topic: queue
        label: 준비 대기와 타임아웃 확인
      - section: request-lifecycle
        topic: journey
        label: 요청 접수와 완료 통지 구분
      - section: request-lifecycle
        topic: stopping
        label: 앱 콜백 연결·스레드의 관찰 계획
  coverage_question_edits:
    scenarios/camera_start.md:
      ca76a601ba35d124ae6ea8d501b931cf47bc636d61797d77775ae3d847a22a9b:
        label: 카메라를 시작할 때 controls, 반환값, 실행 스레드와 ASSERT 조건을 어떻게 확인합니까?
    scenarios/camera_stop.md:
      05ad064f41e1930d03fb45929b6f2aefd2855edfa75764ca94bc0ad3529a9cd1:
        label: 카메라 정지는 상태·연결·진행 중인 요청에 따라 어떻게 처리됩니까?
      b70bb7d3da3d7b0ee4cc270eb1d1fdb2e231ff3732714ef20b9548581179a7eb:
        label: 정지 중 대기 요청은 어떤 순서로 취소·반환되며 재큐잉을 어떻게 막습니까?
    scenarios/configure.md:
      a32900a37253f3bf37741c8cd2b902da5c5a82a500591ff4e9968d3af1644638:
        label: 구성을 적용하기 전에 무엇을 준비하고, 상태·연결 오류를 어떻게 구분합니까?
    scenarios/queue_request.md:
      d06aba734503bd737f0ea49a3074840f9c02a19966b2b0e3fbf23600d8bc06a5:
        label: Camera::queueRequest()의 요청 조건을 확인하고 반환값과 완료 알림을 어떻게 구분합니까?
      ac0df8dce59b62959299298e031e9f81defd90814297f68908cab997ab1e78f4:
        label: 접수된 요청은 언제 장치로 전달되며, 대기·취소·큐잉 실패는 어떻게 처리됩니까?
    overview.md:
      d5114293d4a54fa88c64bf17dee0407a22c90be449297810b15b481684e14a90:
        label: Camera::start()는 어떤 상태에서 호출할 수 있고, 상태 검사 실패 시 무엇을 반환합니까? 시작 타이밍 문서에는
          어떤 TODO가 남아 있습니까?
  overview_visual: {section: vendor-overview, visual: camera-stack}
  enabled: true
  title: libcamera 설계 문서
  intro: site-intro.md
  guide_visuals: site-guide-visuals.json
  guide_source: {root: ../.., file: examples/libcamera/site-intro.md}
  english_catalog: english.json
  source_url: https://github.com/TTolsun/libcamera-sdd
  # 왼쪽 메뉴의 그룹 순서. 섹션 순서(읽는 차례)와 따로 정한다.
  # 여기에 없는 그룹은 처음 나온 순서대로 뒤에 붙는다.
  nav_groups: ["For Vendor", "For Developer"]

diagrams:
  enabled: true
  max_nodes: 16
  direction: LR
  strip_namespace: 'libcamera::'

visuals:
  on_stale: omit
  file: config/visuals.yaml
  max_nodes: 12
