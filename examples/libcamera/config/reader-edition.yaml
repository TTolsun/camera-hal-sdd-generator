  - path: device-integration.md
    group: vendor
    ko: 장치 연동과 검증
    en: Device Integration and Verification
    intro:
      ko: 장치를 연동한 뒤 첫 촬영과 미완료 요청이 있는 상태에서의 정지를 각각 시험하세요. 공개 가상 카메라에서 관찰한 결과와 대상 보드에서 확인할 항목을 구분해 기록하세요.
      en: After integrating the device, test first capture and stopping with incomplete requests separately. Record observations from the public virtual camera separately from checks on the target board.
    links:
      - {path: 'request-flow.md#stop-and-disconnect', ko: 정지 뒤 완료 알림과 상태 판정, en: Completion notifications and status checks after stop}
