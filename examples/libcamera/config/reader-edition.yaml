    group: start
    ko: Architecture
    en: Architecture
    intro:
      ko: 카메라 스택의 계층과 각 구성 요소의 역할, 카메라 탐색 과정과 구성 요소 사이의 경계를 살펴보세요.
      en: Explore the camera stack's layers, the roles of its components, camera discovery, and the boundaries between components.
    sections:
      - {source: index.md, fragment: 카메라-스택의-네-계층, id: camera-stack}
      - {source: overview.md, fragment: 컴포넌트별-책임, id: responsibilities}
