    intro:
      ko: cam을 실행할 수 있는 환경에서 카메라 목록을 확인하세요. 카메라가 감지되면 첫 번째 카메라에서 프레임을 저장해 보세요. 이어서 탐색·구성·시작의 코드 진입점을 차례로 여세요.
      en: List cameras in an environment where cam is available. If a camera is detected, save frames from the first one. Then open the code entry points for discovery, configuration, and startup.
    links:
      - {path: 'request-flow.md#stop-and-disconnect', ko: 취소 상태를 확인하는 코드, en: Code that checks cancellation status}
