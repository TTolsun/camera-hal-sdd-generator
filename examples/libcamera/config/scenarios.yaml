# libclang 대체 경로(tools.clang_uml: none)가 이 진입점에서 호출 순서를 추적한다.
# 아래 시그니처는 커밋 d48b72e710fb1a72b0d291b912c179c93619e1d8 의 정의와 대조했고, 근거 위치를
# 항목마다 적었다. 소스 커밋을 올린 뒤에는 다시 대조해야 한다. 맞지 않으면 extract 로그가
# "진입 함수를 찾지 못했습니다" 와 missing_entries 개수를 보고한다. 그 경고를 무시하면 안 된다.
# 목록에 있다는 것은 정적 호출 순서를 추출했다는 뜻이고, 실행으로 검증했다는 뜻은 아니다.

# glob 은 clang-uml 경로에서만 쓰인다. 이 예제는 tools.clang_uml: none 이므로
# compile DB 의 모든 translation unit 을 그래프에 넣고, glob 은 지정해도 무시된다.
defaults:
  depth: 4
  # 표시에서 뺄 호출. 사실에서 지우지 않고 문서의 호출 순서와 그림에만 적용하며,
  # 뺀 개수는 문서에 적는다. libcamera 의 LOG() 매크로와 Extensible 의 d-pointer 접근자는
  # 호출 그래프의 대부분을 차지해서, 걸러내지 않으면 실제 흐름이 묻힌다.
  hide:
    owners: ["log", "LogMessage", "LogMessageAbortGuard", "tracepoints"]
    names: ["_d", "_o", "_log", "isLogSeverityEnabled", "stream", "basename", "toString", "operator<<"]

scenarios:
  - id: manager_start
    title: 카메라 탐색 (CameraManager::start)
    from: "CameraManager::start()"
    focus:
      - {title: 관리자 시작, names: [start], src: CameraManager}
    # 정의: src/libcamera/camera_manager.cpp:338

  - id: configure
    title: 스트림 구성 (Camera::configure)
    from: "Camera::configure(CameraConfiguration *)"
    focus:
      - {title: 구성 검증, names: [validate]}
      - {title: 파이프라인 구성 대상, names: [configure], src: Camera}
    # 정의: src/libcamera/camera.cpp:1191

  - id: camera_start
    title: 캡처 시작 (Camera::start)
    from: "Camera::start(const ControlList *)"
    focus:
      - {title: 시작 요청 대상, names: [start], src: Camera}
      - {title: 상태 반영, names: [setState], src: Camera}
    # 정의: src/libcamera/camera.cpp:1400

  - id: queue_request
    title: 요청 제출 (Camera::queueRequest)
    from: "Camera::queueRequest(Request *)"
    focus:
      - {title: 요청 상태 확인, names: [status], src: Camera}
      - {title: 요청 제출 대상, names: [queueRequest], src: Camera}
    # 정의: src/libcamera/camera.cpp:1330
    depth: 5

  - id: complete_request
    title: 요청 완료 통지 (PipelineHandler::completeRequest)
    from: "PipelineHandler::completeRequest(Request *)"
    focus:
      - {title: 완료 처리, names: [complete], src: PipelineHandler}
      - {title: 완료 통지, names: [requestComplete], src: PipelineHandler}
      - {title: 대기 요청 처리, names: [doQueueRequests], src: PipelineHandler}
      - {title: 하드웨어별 큐잉 후보, names: [queueRequestDevice], src: PipelineHandler}
    # 정의: src/libcamera/pipeline_handler.cpp:584

  - id: camera_stop
    title: 캡처 종료 요청 (Camera::stop)
    from: "Camera::stop()"
    depth: 5
    focus:
      - {title: 종료 상태 반영, names: [setState], src: Camera}
      - {title: 파이프라인 종료 대상, names: [stop], src: Camera}
      - {title: 종료 뒤 대기 요청 확인, names: [hasPendingRequests], src: Camera}
    # Camera::stop()의 상태 검사와 종료 호출 대상을 추적합니다.
    # invokeMethod 경계 뒤의 취소 처리는 Pipeline Handler의 소스 계약에서 확인합니다.
