sections:
- id: vendor-overview
  group: For Vendor
  nav_section: 도입 판단
  title: libcamera 제품 개요
  output: vendor-overview.md
  kind: prose
  lead: 제공 기능과 공통 설계의 강점을 확인하고 도입할 범위를 판단하세요.
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  design_generation: llm
  semantic_review: true
  show_evidence: true
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandlerIPU3
    - libcamera::PipelineHandlerRkISP1
    - libcamera::Camera
    - libcamera::IPAManager
    class_table: false
  diagram:
    max_nodes: 24
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - src/libcamera/camera_manager.cpp
  - src/ipa/**
  - include/libcamera/ipa/**
  - include/libcamera/internal/ipa_manager.h
  - src/libcamera/camera.cpp
  - Documentation/introduction.rst
  design_requirements:
  - id: value
    question: 어떤 고객 문제를 해결하며 어떤 환경을 대상으로 합니까?
    aspects:
    - benefits
  - id: capabilities
    question: 어떤 기능을 제공하며 지원 범위는 어떤 구현에 달려 있습니까?
    aspects:
    - capabilities
  - id: benefits
    question: 공통 구현을 활용할 수 있는 강점과 그 조건은 무엇입니까?
    aspects:
    - benefits
  design_topics:
  - id: value
    title: 복잡한 카메라를 공통 API로 제어하기
    question: Linux 기반 카메라의 하드웨어 구성과 이미지 제어 알고리즘을 공통 방법으로 다루는 가치를 설명하세요. 제품 성능이나 지원 기종을 보장하지 마세요.
    covers:
    - value
    sources:
    - id: introduction
      file: Documentation/introduction.rst
      start: 'What is libcamera for?

        '
      end: '.. graphviz:: mali-c55.dot'
  - id: capabilities
    title: 제공 기능과 지원 범위
    question: Camera가 하나의 이미지 소스에서 하나 이상의 스트림을 제공하는 기능을 설명하세요. 하드웨어 지원은 장치별 PipelineHandler 구현과 등록에 달려 있습니다. 지원
      기종이나 성능 수치를 추정하지 마세요.
    covers:
    - capabilities
    sources:
    - id: camera
      file: src/libcamera/camera.cpp
      start: '\class Camera

        '
      end: \subsection Camera States
    - id: handler
      file: src/libcamera/pipeline_handler.cpp
      start: \file pipeline_handler.h
      end: using namespace std::chrono_literals;
  - id: benefits
    title: 구현 근거로 보는 강점
    question: PipelineHandler::queueRequest의 공통 구현과 계약이 제공하는 이점을 설명하세요. 준비 대기, 제출 순서, maxQueuedRequestsDevice_ 한도,
      준비 실패·장치 제출 실패 시 취소와 정지 시 요청 추적을 다루세요. 장치 구현자의 completeRequest 통지 책임은 유지하며 처리 속도나 개발 기간 절감량을 추정하지 마세요.
    covers:
    - benefits
    sources:
    - id: queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::queueRequest()
      end: void PipelineHandler::queueRequest(Request *request)
  reader_profile: vendor-overview
  routes:
  - q: 연동 가이드에서 필요한 내용을 확인합니다.
    to: vendor-integration.md
  - q: 지원 범위와 검증에서 필요한 내용을 확인합니다.
    to: vendor-assurance.md
  - q: 장치별 파이프라인을 구현합니다.
    to: pipeline-handler.md
  next:
    title: 연동 가이드
    link: vendor-integration.md
