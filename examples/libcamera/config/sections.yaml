    question: DebayerCpu 벤치마크는 통계 수집과 디베이어 처리만 측정하고 캡처와 출력을 제외합니다. Software ISP를 쓰는 cam 또는 qcam에서 실행되는 참고 절차를 설명하세요.
      제품 전체 지연이나 이 문서의 실제 측정 결과로 표현하지 마세요.
    covers:
    - measurement
    sources:
    - id: benchmark
      file: Documentation/software-isp-benchmarking.rst
      start: The DebayerCpu class has a builtin benchmark.
      end: When it runs it will skip
