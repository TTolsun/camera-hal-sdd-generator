  - id: execution
    title: 스레드와 프로세스 경계
    question: 동기 호출과 비동기 호출은 어디에서 실행됩니까?
    sources:
    - &id012
      id: threaded
      file: utils/codegen/ipc/generators/libcamera_templates/module_ipa_proxy.cpp.tmpl
      start: '{{proxy_name}}Threaded::{{proxy_name}}Threaded('
      end: /* ========================================================================== */
      sha256: af4b12c81ffee2e9979c01a7e7eb188f5568d258ba03e522b60a3608dc226abd
    - &id013
      id: isolated
      file: utils/codegen/ipc/generators/libcamera_templates/module_ipa_proxy.cpp.tmpl
      start: '{{proxy_name}}Isolated::{{proxy_name}}Isolated('
      end: void {{proxy_name}}Isolated::recvMessage(
      sha256: dd0ba6e352ffacd6c27c6ff5bb447af14838d75ca6aed8d056855ec442a97744
    - id: worker-path
      file: src/libcamera/ipa_proxy.cpp
      start: \brief Find a valid full path for a proxy worker
      end: \var IPAProxy::valid_
      sha256: 8cbcadf7036cdb391f4c48af8562cb637752242f9564f1118c949a62df9dbd77
    - &id016
      id: ipc
      file: src/libcamera/ipc_pipe_unixsocket.cpp
      start: IPCPipeUnixSocket::IPCPipeUnixSocket(
      end: '} /* namespace libcamera */'
      sha256: 0abe488ceae72cca0a5b96c7223ffc4cc412ab18f94765fd7f001dc450544f40
    statements:
    - text: Threaded 프록시는 모듈을 적재하여 IPA 인터페이스를 만들고 소유합니다. `init()` 이후 ThreadProxy를 전용 스레드로 이동시키며, `start()`는 스레드를
        시작하고 Blocking 연결로 호출합니다. 비동기 메서드는 Running 상태에서 Queued 연결로 전달하고, 나머지 동기 메서드는 생성 템플릿의 별도 분기에 따라 직접 호출합니다.
      evidence:
      - threaded
      covers:
      - execution
    - text: Isolated 프록시는 `resolvePath()`로 worker 실행 파일의 경로를 찾고 `IPCPipeUnixSocket`을 생성합니다. 소켓 생성과 `Process::start()`가
        성공해야 연결 상태가 설정됩니다. 프로세스를 시작하는 곳은 IPC 파이프이며 `resolvePath()` 자체는 경로만 반환합니다.
      evidence:
      - isolated
      - worker-path
      - ipc
      covers:
      - execution
    - text: Isolated 프록시의 메서드는 인자를 데이터와 파일 디스크립터로 직렬화하여 전달합니다. 인터페이스의 async 메서드는 `sendAsync()`, 동기 메서드는 `sendSync()`를
        사용합니다. 동기 호출의 출력과 반환값은 응답에서 역직렬화합니다.
      evidence:
      - isolated
      covers:
      - execution
