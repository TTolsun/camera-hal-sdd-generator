    question: 공통 큐와 하드웨어 구현은 요청 처리 책임을 어떻게 나눕니까?
  - id: algorithm
    question: IPA 모듈과 실행 방식은 어떻게 선택되며 언제 생성에 실패합니까?
  - id: shutdown
    question: 정지 시 공통 코드와 하드웨어 구현은 무엇을 끝내야 합니까?
  - id: validation
    question: 코드 계약과 별도 실행 검증 항목은 무엇입니까?
  design_topics:
  - id: boundary
    title: 하드웨어와 공통 계층의 경계
    question: 새 하드웨어의 match() 구현자가 장치 매칭 성공과 실패 때 각각 수행할 일과 카메라 등록 책임을 설명하세요. 객체 생성자나 다른 함수의 역할은 추정하지 마세요.
    covers:
    - boundary
    sources:
    - id: handler
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::match(DeviceEnumerator *enumerator)
      end: \brief Search and acquire a MediaDevice
  - id: configuration
    title: 구현할 설정 인터페이스
    question: 하드웨어 구현자가 generateConfiguration()과 configure()를 구현할 때 각각 받는 입력, 만들어야 할 출력과 실패 반환값을 설명하세요. 호출자의 API
      사용 절차와 구현자의 의무를 구분하세요.
    covers:
    - configuration
    sources:
    - id: configuration
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::generateConfiguration()
      end: \fn PipelineHandler::exportFrameBuffers()
  - id: request
    title: 요청을 장치에 전달하고 반환하기
    question: queueRequestDevice 구현자가 버퍼와 파라미터에 대해 지킬 계약과 completeBuffer에서 버퍼 완료와 요청 완료를 구분하는 계약을 설명하세요.
    covers:
    - request
    sources:
    - id: queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::queueRequestDevice()
      end: \brief Complete a buffer for a request
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: bool PipelineHandler::completeBuffer
  - id: algorithm
    title: IPA 모듈 선택과 실패 조건
    question: createIPA()의 모듈 검색, 서명 판정, 생성된 프록시 유효성 검사를 각각 설명하세요. nullptr를 반환하는 분기와 실행 방식을 선택하는 분기를 구분하세요.
    covers:
    - algorithm
    sources:
    - id: selection
      file: include/libcamera/internal/ipa_manager.h
      start: template<typename T>
      end: "return proxy;\n\t}"
  - id: shutdown
    title: 정지와 오류 처리의 책임
    question: 공통 stop과 하드웨어별 stopDevice의 책임을 나누고 대기 요청과 장치 요청이 종료되는 조건을 설명하세요.
    covers:
    - shutdown
    sources:
    - id: stop
