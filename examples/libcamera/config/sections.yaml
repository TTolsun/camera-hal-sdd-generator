        순서로 돌아갑니다. 반환 가능한 요청을 처리한 뒤 대기 요청의 장치 전달을 재개합니다.'
      evidence:
      - completion
      covers:
      - completion
    - text: 완료 통지 함수는 CameraManager 스레드에서 호출해야 합니다. `completeRequest()`가 돌아온 뒤에는 파이프라인이 해당 요청에 접근해서는 안 됩니다. `cancelRequest()`에도
        같은 수명 규칙이 적용됩니다.
      evidence:
      - completion
      covers:
      - completion
  - id: shutdown
    title: 정지와 미완료 요청
    question: 정지 중 재큐잉을 막고 대기 요청을 반환하는 방법은 무엇입니까?
    sources:
    - id: stop
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Stop capturing from all running streams and cancel pending requests
      end: \brief Determine if the camera has any requests pending
      sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
    - *id005
    statements:
    - text: '`stop()`은 대기 큐를 지역 변수로 옮긴 뒤 `stopDevice()`를 호출합니다. 따라서 장치 정지 중 `completeRequest()`가 호출되어도 기존 대기 요청을
        장치에 다시 넣지 않습니다.'
      evidence:
      - stop
      covers:
      - shutdown
    - text: 장치 정지 후 남은 대기 요청을 취소하고 `doQueueRequest()`로 시퀀스 번호와 완료 순서를 유지합니다. 끝에서는 장치 큐와 대기 큐가 비었음을 확인하고 요청 시퀀스를
        0으로 초기화합니다. 하드웨어 구현의 `stopDevice()`는 미완료 요청을 오류 상태로 완료해야 하는 계약을 갖습니다.
      evidence:
      - stop
      covers:
      - shutdown
    - text: 개별 드라이버가 정지 계약을 지키는지, 완료 신호가 종료와 경합할 때 안전한지는 해당 구현과 기기에서 확인해야 합니다. 공통 클래스의 계약만으로 하드웨어 종료를 검증했다고 판단하지
        않습니다.
      evidence:
      - stop
      - completion
      kind: limitation
      covers:
      - shutdown
