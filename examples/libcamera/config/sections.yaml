  design_topics:
  - id: configuration-failure
    title: 구성 실패를 좁히는 순서
    question: 구성 실패를 처음 조사하는 개발자가 src/libcamera/camera.cpp의 Camera::configure에서 상태 검사, validate 결과, 실제 PipelineHandler::configure
      반환, stream 연결 결과 순서로 원인을 좁히도록 설명하세요. 각 단계에서 읽을 값과 다음 분기, 실제 반환 오류 코드와 각각의 원인을 구분하세요. API 주석과 구현의 반환값이 다르면 실제 분기를 우선하세요.
      validate를 디버거에서 재호출하지 말고 원래 호출의 결과를 관찰하세요. validate 후보 목록을 모두 실행하지 말고 실제 config 동적 타입과 pipe_의 구체 구현을 호출 스택에서 확인하도록 안내하세요.
      이는 소스 기반 조사 계획이며 실기기 검증 명령이나 복구 보장이 아닙니다.
