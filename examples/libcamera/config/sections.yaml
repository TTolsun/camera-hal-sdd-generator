      start: option('pipelines',
      end: precedence.')
    parts:
    - id: dedicated
      question: 전용 파이프라인 핸들러로 지원한다고 문서가 적은 하드웨어 플랫폼을 모두 나열하세요. 지원 기종이나 성능은 보장하지 마세요.
      sources:
      - platforms
      answer_contract:
        basis: description
        required_terms:
        - - Mali-C55
        - - IPU3
          - ipu3
        - - rkisp1
        - - rpi/vc4
        reject_patterns: []
    - id: generic
      question: 전용 핸들러 없이 범용으로 지원한다고 문서가 적은 대상을 모두 나열하세요.
      sources:
      - platforms
      answer_contract:
        basis: description
        required_terms:
        - - uvcvideo
        - - simple
        - - vimc
        reject_patterns: []
    - id: build
      question: 빌드할 때 pipelines 옵션으로 파이프라인 핸들러를 고르는 방법과 auto·all의 의미를 설명하세요. 어떤 값이 어떤 기기에 맞는지는 추정하지 마세요.
      sources:
