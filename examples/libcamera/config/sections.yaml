  design_topics:
  - id: value
    title: 무엇이며 누구의 어떤 문제를 푸는가
    question: libcamera가 무엇인지, 누구의 어떤 문제를 푸는지, 사용하면 무엇이 쉬워지는지, 어떤 계층 위에 놓이는지 설명하세요. 제품 성능이나 지원 기종을 보장하지 마세요.
    covers:
    - value
    sources:
    - id: what
      file: Documentation/introduction.rst
      start: libcamera is an open source complex camera support library
      end: involved in capturing images from complex cameras on Linux systems.
    - id: problem
      file: Documentation/introduction.rst
      start: The usage of these drivers to provide a functioning camera stack is a
      end: necessitate bespoke handling.
    - id: for
      file: Documentation/introduction.rst
      start: libcamera provides a complete camera stack for Linux-based systems to abstract
      end: 'having to deal with this:'
    - id: stack
      file: Documentation/introduction.rst
      start: 'The camera stack comprises four software layers. From bottom to top:'
      end: the scope of the libcamera project.
    parts:
    - id: what
      question: libcamera가 어떤 종류의 라이브러리이고 어떤 시스템을 대상으로 하는지 한 문단으로 설명하세요. 제품 성능이나 기종 목록은 이 질문의 범위가 아닙니다. 제품 이름 libcamera와 코드 식별자는 번역하거나 음차하지 말고 원문 그대로 쓰세요.
      sources:
      - what
      answer_contract:
        basis: description
        required_terms:
        - - Linux
        - - libcamera
        reject_patterns: []
    - id: problem
      question: 카메라 하드웨어를 쓰려는 쪽이 기기마다 어떤 문제를 겪는지, 그 일을 누가 맡아 왔는지 한 문단으로 설명하세요. 이유나 영향을 추측하지 마세요. 제품 이름 libcamera와 코드 식별자는 번역하거나 음차하지 말고 원문 그대로 쓰세요.
      sources:
      - problem
    - id: easier
      question: libcamera를 쓰면 하드웨어 구성과 이미지 제어 알고리즘을 다루는 일이 개발자에게 어떻게 달라지는지 한 문단으로 설명하세요. 성능이나 개발 기간 절감량은 추정하지 마세요. 제품 이름 libcamera와 코드 식별자는 번역하거나 음차하지 말고 원문 그대로 쓰세요.
      sources:
      - for
    - id: layers
      question: 카메라 스택의 네 계층을 아래에서 위 순서로, 각 계층이 맡는 일과 함께 설명하세요. 계층에 들어가는 구체적인 도구는 소스가 예로 든 것만 쓰세요. 제품 이름 libcamera와 코드 식별자는 번역하거나 음차하지 말고 원문 그대로 쓰세요.
      sources:
      - stack
      max_statements: 4
  - id: support
    title: 지원하는 하드웨어와 빌드 선택
    question: libcamera가 전용 파이프라인 핸들러로 지원하는 하드웨어 플랫폼과 범용으로 지원하는 대상, 빌드 때 파이프라인 핸들러를 고르는 방법을 설명하세요. 특정 기기의 동작이나 성능을 보장하지 마세요.
    covers:
    - support
    sources:
    - id: platforms
      file: Documentation/platform_support.rst
      start: The library currently supports the following hardware platforms specifically
      end: Virtual media controller driver for test use cases (vimc)
    - id: pipelines
