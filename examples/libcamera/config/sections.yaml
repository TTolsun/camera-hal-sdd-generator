  - id: prepare
    title: 파라미터 갱신 조건
    question: 색온도 변경에 따른 생략 조건과 커널에 전달하는 파라미터를 설명하세요.
    sources:
    - id: prepare
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: static unsigned int quantize(
      end: void Lsc::process(
      sha256: 1d11fc7397b377f682d4fab45d12dd20480e554176aae94ba2708a5f8f747268
    - id: constants
      file: src/ipa/ipu3/algorithms/lsc.cpp
      start: static constexpr unsigned int kMaxNumHCells
      end: int Lsc::init(
      sha256: 7807718b4ae9327f1ca428627d2b00f59ba38ced03261465ee8c79312ea27833
    statements:
    - text: prepare()는 현재 프레임 AWB의 색온도를 읽어 10 단위로 반올림합니다. update가 false일 때만 다음 생략 조건을 검사합니다. 비활성 상태이면 바로 반환하고,
        활성 상태에서도 직전 적용 색온도와의 차이가 5 미만이거나 양자화된 값이 같으면 갱신을 생략합니다. update가 true이면 이 생략 조건들을 적용하지 않습니다.
      evidence:
      - prepare
      - constants
      covers:
      - prepare
    - text: 갱신 경로에서는 use.acc_shd를 1로 설정하고 shd_enable에 현재 활성 상태를 기록합니다. update가 true이고 enabled가 false인 경우에도 이
        플래그를 기록한 뒤 반환하므로, 단순히 비활성 상태의 모든 호출을 생략하는 것은 아닙니다.
      evidence:
      - prepare
      covers:
      - prepare
    - text: 활성 상태에서는 그리드와 크롭 오프셋을 설정하고, 양자화한 색온도로 interpolateComponents()를 호출합니다. 반환된 r·gr·gb·b 배열을 LUT에 복사한
        뒤 마지막으로 적용한 색온도 두 값을 저장합니다. 실제 하드웨어의 적용 시점과 LUT 분할 경계의 적합성은 기기에서 별도로 검증해야 합니다.
      evidence:
      - prepare
      covers:
      - prepare
    - text: '| 조건 | prepare()의 처리 | 변경 검토 지점 |

        |---|---|---|

        | `update=false`, 비활성 상태입니다. | 파라미터를 갱신하지 않고 반환합니다. | 비활성 상태 유지와 비활성화 전환을 구분합니다. |

        | `update=false`, 활성 상태이며 직전 색온도와의 차이가 5 미만이거나 양자화한 값이 같습니다. | LUT 갱신을 생략합니다. | 원래 색온도의 차이와 10 단위로 반올림한 값을 모두 확인합니다. |

        | `update=true`, 비활성 상태입니다. | 갱신 경로에서 `use.acc_shd`와 비활성 `shd_enable`을 기록합니다. | 비활성화 전환을 전달하는 경로를 조기
        반환으로 없애지 않습니다. |

        | 갱신 경로이며 활성 상태입니다. | 그리드·크롭 오프셋과 보간 LUT를 기록하고 색온도를 저장합니다. | 출력 파라미터와 프레임 상태를 함께 대조합니다. |


        '
      evidence:
      - prepare
      covers:
      - prepare
