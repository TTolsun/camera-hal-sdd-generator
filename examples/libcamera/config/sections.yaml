sections:
- id: vendor-overview
  group: For Vendor
  nav_section: 도입 판단
  title: libcamera 제품 개요
  output: vendor-overview.md
  kind: prose
  lead: 제공 기능과 공통 설계의 강점을 확인하고 도입할 범위를 판단하세요.
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  design_generation: llm
  semantic_review: true
  show_evidence: true
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandlerIPU3
    - libcamera::PipelineHandlerRkISP1
    - libcamera::Camera
    - libcamera::IPAManager
    class_table: false
  diagram:
    max_nodes: 24
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - src/libcamera/camera_manager.cpp
  - src/ipa/**
  - include/libcamera/ipa/**
  - include/libcamera/internal/ipa_manager.h
  - src/libcamera/camera.cpp
  - Documentation/introduction.rst
  design_requirements:
  - id: value
    question: 어떤 고객 문제를 해결하며 어떤 환경을 대상으로 합니까?
    aspects:
    - benefits
  - id: capabilities
    question: 어떤 기능을 제공하며 지원 범위는 어떤 구현에 달려 있습니까?
    aspects:
    - capabilities
  - id: benefits
    question: 공통 구현을 활용할 수 있는 강점과 그 조건은 무엇입니까?
    aspects:
    - benefits
  - id: queue-limit
    question: 장치에 동시에 제출하는 요청 수의 기본 한도와 대기 요청의 처리는 무엇입니까?
  design_topics:
  - id: value
    title: 복잡한 카메라를 공통 API로 제어하기
    question: Linux 기반 카메라의 하드웨어 구성과 이미지 제어 알고리즘을 공통 방법으로 다루는 가치를 설명하세요. 제품 성능이나 지원 기종을 보장하지 마세요.
    covers:
    - value
    sources:
    - id: introduction
      file: Documentation/introduction.rst
      start: 'What is libcamera for?

        '
      end: '.. graphviz:: mali-c55.dot'
    parts:
    - id: purpose
      question: 공식 소개가 설명하는 Linux 기반 하드웨어 구성·이미지 제어 알고리즘의 공통화 목적을 한 문단으로 설명하세요. 제품 성능이나 기종 목록은 이 질문의 범위가 아닙니다.
      sources:
      - introduction
      answer_contract:
        basis: description
        required_terms:
        - - Linux
        - - libcamera
        reject_patterns: []
  - id: capabilities
    title: 제공 기능과 지원 범위
    question: Camera가 하나의 이미지 소스에서 하나 이상의 스트림을 제공하는 기능을 설명하세요. 하드웨어 지원은 장치별 PipelineHandler 구현과 등록에 달려 있습니다. 지원 기종이나 성능 수치를
      추정하지 마세요.
    covers:
    - capabilities
    sources:
    - id: camera
      file: src/libcamera/camera.cpp
      start: '\class Camera

        '
      end: \subsection Camera States
    - id: handler
      file: src/libcamera/pipeline_handler.cpp
      start: \file pipeline_handler.h
      end: using namespace std::chrono_literals;
    parts:
    - id: camera
      question: Camera가 모델링하는 이미지 소스와 스트림, 구성·제어·캡처 인터페이스만 설명하세요. 생성자·소멸자와 수명 관리 문장은 다루지 마세요.
      sources:
      - camera
      answer_contract:
        basis: description
        required_terms:
        - - Camera
        - - 스트림
        reject_patterns: []
    - id: hardware
      question: 장치 확보 뒤 Camera를 생성하는 책임과 REGISTER_PIPELINE_HANDLER()로 등록하는 계약을 모두 한 문장으로 설명하세요. 특정 기기 지원 여부는 추정하지 마세요.
      sources:
      - handler
      answer_contract:
        basis: contract
        required_terms:
        - - Camera
        - - REGISTER_PIPELINE_HANDLER
        reject_patterns: []
  - id: benefits
    title: 구현 근거로 보는 강점
    question: PipelineHandler::queueRequest의 공통 구현과 계약이 제공하는 이점을 설명하세요. 준비 대기, 제출 순서, maxQueuedRequestsDevice_ 한도, 준비 실패·장치
      제출 실패 시 취소와 정지 시 요청 추적을 다루세요. 장치 구현자의 completeRequest 통지 책임은 유지하며 처리 속도나 개발 기간 절감량을 추정하지 마세요.
    covers:
    - benefits
    sources:
    - id: queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::queueRequest()
      end: in the same order they have been queued by calling this function.
    - id: failure
      file: src/libcamera/pipeline_handler.cpp
      start: If a Request fails during the preparation phase
      end: fails in queuing the request to the hardware the request is cancelled.
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: Keeping track of queued requests ensures automatic completion of all requests
      end: signalled by the pipeline handler using the completeRequest() function.
    parts:
    - id: queue
      question: 공통 PipelineHandler::queueRequest가 요청을 기다렸다가 전달하는 순서와 maxQueuedRequestsDevice_ 한도는 무엇입니까? 대기 큐 관리의 주체를 호출자로
        바꾸지 말고 이 함수의 동작만 한 문단으로 설명하세요. 실패 처리는 다음 질문에서 다룹니다.
      sources:
      - queue
      answer_contract:
        basis: description
        required_terms:
        - - maxQueuedRequestsDevice_
        - - 준비
        - - 순서
        - - queueRequest
        reject_patterns:
        - pattern: 호출자는.{0,40}(대기|전달)
          message: 대기 큐 관리를 호출자의 동작으로 바꾸지 마세요. 공통 함수와 호출자를 구분하세요.
    - id: failure
      question: 준비 단계 실패와 하드웨어 큐 등록 실패 때의 요청 취소 계약만 한 문단으로 설명하세요.
      sources:
      - failure
      answer_contract:
        basis: description
        required_terms:
        - - 준비
        - - 실패
        - - 취소
        reject_patterns: []
    - id: tracking
      question: 공통 queueRequest의 요청 추적이 stop() 시 완료와 어떤 관계가 있는지만 한 문장으로 설명하세요. 추적을 호출자의 의무로 바꾸지 마세요.
      sources:
      - completion
      answer_contract:
        basis: description
        required_terms:
        - - stop
        reject_patterns:
        - pattern: 호출자는.{0,40}추적
          message: 요청 추적은 공통 함수의 처리입니다. 호출자 의무로 바꾸지 마세요.
    - id: notification
      question: 파이프라인 핸들러가 completeRequest()로 완료를 통지해야 하는 의무만 한 문장으로 설명하세요. stop()의 호출 순서나 자동 완료 후 추가 통지를 추정하지 마세요.
      sources:
      - completion
      answer_contract:
        basis: contract
        required_terms:
        - - completeRequest
        reject_patterns:
        - pattern: 완료.{0,10}(후|뒤)
          message: 원문에 없는 자동 완료와 통지 사이의 순서를 추가하지 마세요.
  - id: queue-limit
    title: 장치 요청 한도와 대기 큐
    question: PipelineHandler 생성자의 장치 요청 한도 기본값과 장치 큐·대기 큐의 구분을 설명하세요.
    covers:
    - queue-limit
    sources:
    - id: default
      file: include/libcamera/internal/pipeline_handler.h
      start: PipelineHandler(CameraManager *manager,
      end: virtual ~PipelineHandler();
    - id: queue
      file: src/libcamera/pipeline_handler.cpp
      start: \var PipelineHandler::maxQueuedRequestsDevice_
      end: \fn PipelineHandler::name()
    parts:
    - id: default
      question: PipelineHandler 생성자 선언에서 maxQueuedRequestsDevice의 기본값은 몇입니까? 그 정수 값을 숫자로 명시하여 한 문장으로 답하세요.
      sources:
      - default
    - id: queue
      question: maxQueuedRequestsDevice_가 제한하는 요청 수는 어느 큐에 해당합니까? 한 문장으로 답하세요.
      sources:
      - queue
    - id: waiting
      question: 애플리케이션이 장치 한도보다 많은 요청을 제출하면 나머지 요청은 어디에서 기다립니까? 한 문장으로 답하세요.
      sources:
      - queue
  reader_profile: vendor-overview
  routes:
  - q: 연동 가이드에서 필요한 내용을 확인합니다.
    to: vendor-integration.md
  - q: 지원 범위와 검증에서 필요한 내용을 확인합니다.
    to: vendor-assurance.md
  - q: 장치별 파이프라인을 구현합니다.
    to: pipeline-handler.md
  next:
    title: 연동 가이드
    link: vendor-integration.md
- id: vendor-assurance
  group: For Vendor
  nav_section: 도입 판단
  title: 지원 범위와 검증
  output: vendor-assurance.md
  kind: prose
  lead: 지원 조건과 구성 제약을 확인하고 제품 도입 전에 검증할 범위를 정하세요.
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  design_generation: llm
  semantic_review: true
  show_evidence: true
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandlerIPU3
    - libcamera::PipelineHandlerRkISP1
    - libcamera::Camera
    - libcamera::IPAManager
    class_table: false
  diagram:
    max_nodes: 24
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - src/libcamera/camera_manager.cpp
  - src/ipa/**
  - include/libcamera/ipa/**
  - include/libcamera/internal/ipa_manager.h
  - src/libcamera/camera.cpp
  - Documentation/software-isp-benchmarking.rst
  design_requirements:
  - id: constraints
    question: 지원 전제와 제약은 무엇이며 별도 검증할 항목은 무엇입니까?
    aspects:
    - constraints
  - id: measurement
    question: 참고 벤치마크가 측정하는 범위와 별도 제품 검증 범위는 무엇입니까?
    aspects:
    - verification
  design_topics:
  - id: constraints
    title: 지원 조건과 제약
    question: CameraConfiguration::validate의 Invalid·Adjusted·Valid를 구분하고 Adjusted이면 스트림 파라미터 변경이나 스트림 삭제가 가능해 호출자가 다시 확인해야
      함을 설명하세요. generateConfiguration의 roles와 하드웨어 지원 한계, configure의 검증된 입력과 실패 계약을 설명하세요. 특정 해상도·동시 스트림 수·성능을 보장하지 마세요.
    covers:
    - constraints
    sources:
    - id: invalid
      file: src/libcamera/camera.cpp
      start: '\retval CameraConfiguration::Invalid '
      end: configuration is empty.
    - id: adjusted
      file: src/libcamera/camera.cpp
      start: '\retval CameraConfiguration::Adjusted '
      end: configuration carefully.
      scope:
        start: \fn CameraConfiguration::validate()
        end: '*/'
    - id: valid
      file: src/libcamera/camera.cpp
      start: \fn CameraConfiguration::validate()
      end: hasn't been adjusted.
      scope:
        start: \fn CameraConfiguration::validate()
        end: '*/'
    - &id001
      id: generate-result
      file: src/libcamera/pipeline_handler.cpp
      start: \return A valid CameraConfiguration if the requested roles can be satisfied,
      end: or a null pointer otherwise.
      scope:
        start: \fn PipelineHandler::generateConfiguration()
        end: '*/'
    - &id002
      id: configure-input
      file: src/libcamera/pipeline_handler.cpp
      start: The configuration is guaranteed to have been validated with
      end: not perform further validation
      scope:
        start: \fn PipelineHandler::configure()
        end: '*/'
    - &id003
      id: configure-result
      file: src/libcamera/pipeline_handler.cpp
      start: \context This function is called from the CameraManager thread.
      end: \return 0 on success or a negative error code otherwise
      scope:
        start: \fn PipelineHandler::configure()
        end: '*/'
    - id: adjusted-state
      file: src/libcamera/camera.cpp
      start: '\retval CameraConfiguration::Adjusted '
      end: and is now valid.
      scope:
        start: \fn CameraConfiguration::validate()
        end: '*/'
    - id: adjusted-changes
      file: src/libcamera/camera.cpp
      start: Parameters may have changed for any stream
      end: removed.
      scope:
        start: \fn CameraConfiguration::validate()
        end: '*/'
    parts:
    - id: invalid
      question: CameraConfiguration::Invalid의 의미와 어떤 경우에만 발생할 수 있는지 설명하세요. 발생 조건의 한정과 가능성을 보존하세요. 질문의 모든 항목을 한 문장으로 설명하세요.
      sources:
      - invalid
      answer_contract:
        basis: description
        required_terms:
        - - Invalid
        reject_patterns:
        - pattern: (조정|수정).{0,15}없거나
          message: Invalid의 무효·조정 불가 조건과 극단적인 경우의 예시를 또는 조건으로 바꾸지 마세요.
    - id: adjusted
      question: CameraConfiguration::Adjusted가 나타내는 구성의 조정 여부와 조정 후 유효성만 한 문장으로 설명하세요.
      sources:
      - adjusted-state
      answer_contract:
        basis: description
        required_terms:
        - - Adjusted
        - - 유효
    - id: adjusted-changes
      question: Adjusted에서 어느 스트림의 파라미터가 바뀌었을 수 있는지와 스트림 구성 삭제 가능성을 한 문장으로 설명하세요. 일부 변경 가능성과 모든 스트림의 일괄 변경을 구분하고 any와 may를
        보존하세요.
      sources:
      - adjusted-changes
      answer_contract:
        basis: description
        required_terms:
        - - 파라미터
        - - 제거
          - 삭제
        - - 수 있
          - 수있
          - 가능
        reject_patterns:
        - pattern: 모든\s*스트림
          message: 원문은 파라미터 변경 가능 범위이며 모든 스트림의 일괄 변경을 뜻하지 않습니다.
    - id: adjusted-review
      question: CameraConfiguration::Adjusted일 때 호출자가 수행해야 하는 확인 의무만 한 문장으로 설명하세요.
      sources:
      - adjusted
      answer_contract:
        basis: contract
        required_terms:
        - - Adjusted
        - - 호출자
        - - 확인
    - id: valid
      question: CameraConfiguration::Valid이면 원래 구성의 유효성과 조정 여부가 어떠합니까? 이 상태만 한 문단으로 설명하세요. 질문의 모든 항목을 한 문장으로 설명하세요.
      sources:
      - valid
      answer_contract:
        basis: description
        required_terms:
        - - Valid
    - id: roles
      question: generateConfiguration이 roles를 받아 유효한 구성을 반환하거나 요청 용도를 충족할 수 없을 때 null을 반환하는 지원 조건만 설명하세요. 해상도·동시 스트림 수를 추정하지
        마세요. 질문의 모든 항목을 한 문장으로 설명하세요.
      sources:
      - generate-result
      answer_contract:
        basis: description
        required_terms:
        - - generateConfiguration
        - - roles
          - 역할 목록
          - 스트림 용도
          - 스트림 역할
        - - 'null'
          - nullptr
        reject_patterns: []
    - id: configure-input
      question: configure의 검증된 입력 전제와 구현자의 추가 검증 금지 의무를 설명하세요. 질문의 모든 항목을 한 문장으로 설명하세요.
      sources:
      - configure-input
      answer_contract:
        basis: contract
        required_terms:
        - - configure
        - - validate
    - id: configure
      question: configure의 성공·실패 시 구현자가 반환해야 하는 값을 설명하세요. 검증된 입력을 받는다는 사실만으로 구성 성공이 보장된다고 추정하지 마세요. 질문의 모든 항목을 한 문장으로 설명하세요.
      sources:
      - configure-result
      answer_contract:
        basis: contract
        required_terms:
        - - configure
        - - '0'
        - - 음수
        reject_patterns: []
  - id: measurement
    title: 성능 근거를 읽는 기준
    question: DebayerCpu 벤치마크는 통계 수집과 디베이어 처리만 측정하고 캡처와 출력을 제외합니다. Software ISP를 쓰는 cam 또는 qcam에서 실행되는 참고 절차를 설명하세요. 제품 전체
      지연이나 이 문서의 실제 측정 결과로 표현하지 마세요.
    covers:
    - measurement
    sources:
    - id: benchmark
      file: Documentation/software-isp-benchmarking.rst
      start: The DebayerCpu class has a builtin benchmark.
      end: When it runs it will skip
    - id: settings
      file: include/libcamera/internal/software_isp/benchmark.h
      start: class Benchmark
      end: '} /* namespace libcamera */'
    - id: implementation
      file: src/libcamera/software_isp/benchmark.cpp
      start: Benchmark::Benchmark(
      end: '} /* namespace libcamera */'
    parts:
    - id: default-skip
      question: Benchmark의 skipBeforeMeasure_에 선언된 초기값을 소스에서 읽어 이 값이 무엇을 세는지 설명하세요.
      sources:
      - settings
      answer_contract:
        basis: implementation
        required_terms:
        - - skipBeforeMeasure_
        reject_patterns: []
    - id: default-frames
      question: Benchmark의 framesToMeasure_에 선언된 초기값을 소스에서 읽어 이 값이 무엇을 세는지 설명하세요. 프레임 개수와 초당 프레임 수를 구분하세요.
      sources:
      - settings
      answer_contract:
        basis: implementation
        required_terms:
        - - framesToMeasure_
        reject_patterns: []
    - id: overrides
      question: Benchmark 생성자가 software_isp.measure 설정의 skip과 number를 읽고 설정이 없을 때 어떤 값을 유지하는지 한 문단으로 설명하세요. 초기값 숫자는 반복하지 마세요.
      sources:
      - settings
      - implementation
