    - text: 이후 공유 LSC 상태, 현재 프레임의 LSC 상태와 요청 controls를 공통 알고리즘의 queueRequest()에 전달합니다. 여기서 설명하는 것은 IPU3 래퍼의 전달 동작이며,
        모든 제어 값의 처리 규칙이나 콜백 실행 스레드까지 확인한 것은 아닙니다.
