  - id: benefits
    title: 장치 구현자가 공통 계층에서 얻는 것
    question: PipelineHandler::queueRequest의 공통 구현과 계약이 장치 구현자에게 해 주는 일을 설명하세요. 준비 대기, 제출 순서, maxQueuedRequestsDevice_ 한도, 준비 실패·장치 제출 실패 시 취소와 정지 시 요청 추적을 다루세요. 장치 구현자의 completeRequest 통지 책임은 유지하며 처리 속도나 개발 기간 절감량을 추정하지 마세요.
    covers:
    - benefits
    sources:
    - id: queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::queueRequest()
      end: in the same order they have been queued by calling this function.
    - id: failure
      file: src/libcamera/pipeline_handler.cpp
      start: If a Request fails during the preparation phase
      end: fails in queuing the request to the hardware the request is cancelled.
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: Keeping track of queued requests ensures automatic completion of all requests
      end: signalled by the pipeline handler using the completeRequest() function.
    parts:
    - id: queue
      question: 공통 PipelineHandler::queueRequest가 요청을 기다렸다가 전달하는 순서와 maxQueuedRequestsDevice_ 한도는 무엇입니까? 대기 큐 관리의 주체를 호출자로 바꾸지 말고 이 함수의 동작만 한 문단으로 설명하세요. 실패 처리는 다음 질문에서 다룹니다.
      sources:
      - queue
      answer_contract:
        basis: description
        required_terms:
        - - maxQueuedRequestsDevice_
        - - 준비
        - - 순서
        - - queueRequest
        reject_patterns:
        - pattern: 호출자는.{0,40}(대기|전달)
          message: 대기 큐 관리를 호출자의 동작으로 바꾸지 마세요. 공통 함수와 호출자를 구분하세요.
    - id: failure
      question: 준비 단계 실패와 하드웨어 큐 등록 실패 때의 요청 취소 계약만 한 문단으로 설명하세요.
      sources:
      - failure
      answer_contract:
        basis: description
        required_terms:
        - - 준비
        - - 실패
        - - 취소
        reject_patterns: []
    - id: completion
      question: 정지할 때 공통 queueRequest의 요청 추적이 대기 중인 요청의 완료를 어떻게 보장하는지, 그리고 파이프라인 핸들러가 completeRequest()로 완료를 통지해야 하는 의무를 한 문단으로 함께 설명하세요. 추적을 호출자의 의무로 바꾸지 말고, stop()의 호출 순서나 자동 완료 뒤 추가 통지는 추정하지 마세요.
      sources:
      - completion
      answer_contract:
        basis: contract
        required_terms:
        - - stop
        - - completeRequest
        reject_patterns:
        - pattern: 호출자는.{0,40}추적
          message: 요청 추적은 공통 함수의 처리입니다. 호출자 의무로 바꾸지 마세요.
        - pattern: 완료.{0,10}(후|뒤)
          message: 원문에 없는 자동 완료와 통지 사이의 순서를 추가하지 마세요.
  - id: queue-limit
    title: 장치 요청 한도와 대기 큐
    question: PipelineHandler 생성자의 장치 요청 한도 기본값과 장치 큐·대기 큐의 구분을 설명하세요.
    covers:
    - queue-limit
    sources:
