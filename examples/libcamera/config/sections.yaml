- id: ipa
  group: For Vendors
  title: IPA 관리와 구현 진입점
  output: ipa.md
  kind: prose
  lead: IPA 모듈 선택, 스레드·프로세스 경계와 요청·결과 인터페이스를 구현 근거로 확인하세요.
  reader: 영상 처리 알고리즘과 프로세스 경계를 분석하는 개발자
  answers:
  - 사실에 포함된 IPA 관련 클래스는 무엇인가?
  - 프록시와 알고리즘 사이에서 추가 확인이 필요한 경계는 무엇인가?
  facts:
