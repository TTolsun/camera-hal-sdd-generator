      start: \brief Stop capturing from all running streams and cancel pending requests
      end: \brief Determine if the camera has any requests pending
  - id: validation
    title: 구현 뒤 확인할 계약과 실행 한계
    question: completeRequest가 반환된 뒤 요청 접근 금지와 애플리케이션 반환 순서를 각각 설명하세요. 이 계약을 구현 뒤 확인할 기준으로 제시하고 실제 실행을 검증했다고 주장하지
      마세요.
    covers:
    - validation
    sources:
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Signal request completion
      end: void PipelineHandler::completeRequest
- id: request-lifecycle
  group: For Vendor
  title: 요청 처리와 문제 진단
  output: request-lifecycle.md
  kind: prose
  lead: 요청의 제출 성공과 촬영 완료를 구분하고, 버퍼를 유지할 기간과 오류가 난 위치를 확인하세요.
  reader: 요청을 연동하고 실패를 진단하는 Vendor 개발자
  answers:
  - 요청을 제출한 뒤 완료될 때까지 어느 단계에서 기다리는가?
  - 요청·버퍼·fence를 언제 다시 사용할 수 있는가?
  - 완료가 오지 않거나 정지할 때 무엇을 확인해야 하는가?
  routes:
  - q: 요청 제출과 완료의 연결을 확인합니다.
    to: '#제출에서-완료까지'
  - q: 자원을 재사용하거나 해제할 시점을 확인합니다.
    to: '#요청버퍼fence의-수명'
  - q: 오류가 난 단계를 찾습니다.
    to: '#실패-위치별-확인-순서'
  - q: 정지와 연결 해제의 차이를 확인합니다.
    to: '#정지와-연결-해제를-구분하기'
  facts:
    classes:
    - libcamera::Camera
    - libcamera::Request
    - libcamera::PipelineHandler
    class_table: false
  diagram:
    enabled: false
  watch:
  - src/libcamera/camera.cpp
  - src/libcamera/request.cpp
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/**
  semantic_review: true
  show_evidence: true
  next:
    title: Pipeline Handler
    link: pipeline-handler.md
  design_topics:
  - id: journey
    title: 제출에서 완료까지
    question: 요청 생성·버퍼 연결·Camera::queueRequest() 제출 반환의 의미, 파이프라인 대기 큐·준비 상태·장치 큐 한도, queueRequestDevice()의 책임,
      버퍼 완료와 요청 완료 및 반환 순서를 구분하세요. 공통 함수 호출 문맥과 애플리케이션 콜백 스레드의 확인 범위를 구분하세요.
    sources:
    - id: create
      file: src/libcamera/camera.cpp
      start: \brief Create a request object for the camera
      end: std::unique_ptr<Request> Camera::createRequest(uint64_t cookie)
    - id: queue
      file: src/libcamera/camera.cpp
      start: \brief Queue a request to the camera
      end: \brief Start capture from camera
    - id: buffer
      file: src/libcamera/request.cpp
      start: \brief Add a FrameBuffer with its associated Stream to the Request
      end: int Request::addBuffer(const Stream *stream, FrameBuffer *buffer,
    - id: device-queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::registerRequest()
      end: \brief Complete a buffer for a request
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
    covers:
    - journey
  - id: resources
    title: 요청·버퍼·fence의 수명
    question: 요청과 버퍼의 소유권·유효 기간, reuse()가 초기화하는 상태·controls·metadata 및 ReuseBuffers 조건, fence 소유권과 재사용 주의, completeRequest()/cancelRequest()
      반환 후 핸들러의 접근 규칙을 설명하세요.
    sources:
    - id: create
      file: src/libcamera/camera.cpp
      start: \brief Create a request object for the camera
      end: std::unique_ptr<Request> Camera::createRequest(uint64_t cookie)
    - id: buffer
      file: src/libcamera/request.cpp
      start: \brief Add a FrameBuffer with its associated Stream to the Request
      end: int Request::addBuffer(const Stream *stream, FrameBuffer *buffer,
    - id: reuse
      file: src/libcamera/request.cpp
      start: \brief Reset the request for reuse
      end: \fn Request::controls()
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
    - id: reuse-flags
      file: src/libcamera/request.cpp
      start: \enum Request::ReuseFlag
      end: \typedef Request::BufferMap
    covers:
    - resources
  - id: diagnosis
    title: 실패 위치별 확인 순서
    question: addBuffer()의 -EEXIST와 queueRequest()의 -ENODEV/-EACCES/-EXDEV/-EINVAL 원인을 코드 조건별로 구분하세요. 제출 후 지연에서는
      준비 대기·장치 전달·버퍼 완료·요청 완료와 선두 Pending 요청을 구분하세요. 실제 로그 메시지나 정상 지연 수치는 만들지 마세요.
    sources:
    - id: queue
      file: src/libcamera/camera.cpp
      start: \brief Queue a request to the camera
      end: \brief Start capture from camera
    - id: buffer
      file: src/libcamera/request.cpp
      start: \brief Add a FrameBuffer with its associated Stream to the Request
      end: int Request::addBuffer(const Stream *stream, FrameBuffer *buffer,
    - id: device-queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::registerRequest()
      end: \brief Complete a buffer for a request
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
    covers:
    - diagnosis
  - id: stopping
    title: 정지와 연결 해제를 구분하기
    question: Camera::stop()의 상태 전환과 blocking 호출, PipelineHandler::stop()의 대기 큐 분리·장치 정지·취소 순서를 설명하세요. disconnect()의
      미완료 요청 TODO와 정상 stop()의 반환 계약, 별도 스레드 콜백 처리의 확인 범위를 구분하세요.
    sources:
    - id: stop
      file: src/libcamera/camera.cpp
      start: \brief Stop capture from camera
      end: \brief Handle request completion and notify application
    - id: device-stop
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Stop capturing from all running streams and cancel pending requests
      end: \brief Determine if the camera has any requests pending
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
    - id: notification
      file: src/libcamera/camera.cpp
      start: \brief Notify camera disconnection
      end: int Camera::exportFrameBuffers(Stream *stream,
    covers:
    - stopping
  - id: review
    title: 변경 검토와 실행 확인
    question: 소스에서 확인할 제출·완료 차이, 명시적 요청 완료 책임, 선두 Pending과 반환 순서, 재사용 초기화, 정지 중 대기 요청 처리를 정리하세요. 정상 반복·fence 대기·장치
      오류·미완료 요청 정지의 실행 확인은 limitation으로 구분하고 실제 시험 결과를 만들지 마세요.
    sources:
    - id: queue
      file: src/libcamera/camera.cpp
      start: \brief Queue a request to the camera
      end: \brief Start capture from camera
    - id: reuse
      file: src/libcamera/request.cpp
      start: \brief Reset the request for reuse
      end: \fn Request::controls()
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
    - id: device-stop
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Stop capturing from all running streams and cancel pending requests
      end: \brief Determine if the camera has any requests pending
    covers:
    - review
  design_requirements:
  - id: journey
    question: 제출 성공 이후의 대기 조건과 완료 책임은 무엇입니까?
    aspects:
    - inputs
    - completion
  - id: resources
    question: 어떤 자원을 누가 유지하고 완료 후 무엇을 초기화해야 합니까?
    aspects:
    - ownership
  - id: diagnosis
    question: 제출 실패와 제출 후 완료 지연을 어떻게 구분합니까?
    aspects:
    - failure
  - id: stopping
    question: 정지 중 요청 반환과 연결 해제의 보장 범위는 어떻게 다릅니까?
    aspects:
    - completion
  - id: review
    question: 문서를 읽고 어떤 질문에 답하고 어떤 실행 증거를 확보해야 합니까?
    aspects:
    - verification
