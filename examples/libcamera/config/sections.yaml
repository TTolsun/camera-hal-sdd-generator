    - id: match
      file: src/libcamera/ipa_module.cpp
      start: \brief Verify if the IPA module matches a given name
      end: std::string IPAModule::logPrefix()
      sha256: 99940db9ea353ad0d8282b7c2148578f4c6054d785ef7aaf690d522b52bafb5b
    - &id014
      id: selection
      file: include/libcamera/internal/ipa_manager.h
      start: template<typename T>
      end: '#if HAVE_IPA_PUBKEY'
      sha256: e0bd5192ea24a8b39d3df7b7b93c8b17614663a0144f6dd0741d410fa321d458
    - id: signature
      file: src/libcamera/ipa_manager.cpp
      start: bool IPAManager::isSignatureValid(
      end: '} /* namespace libcamera */'
      sha256: f657ce54df77453510108b02060166edd7506c982d13d3e4868fadee4065a677
    statements:
    - text: '`IPAManager`는 설정의 모듈 경로, 설치 전 빌드 경로, 설치된 시스템 경로 순으로 IPA 후보를 찾습니다. `IPAModule::match()`는 이름의 일치와 최소·최대
        버전을 포함하는 범위를 확인합니다.'
      evidence:
      - modules
      - match
      covers:
      - selection
    - text: 현재 `createIPA<T>()` 구현은 서명 검증이 성공하면 `T::Threaded`, 실패하면 `T::Isolated`를 생성합니다. 공개 키 지원이 없거나 강제 격리 설정이
        켜져 있거나 서명을 검증하지 못하면 격리 경로를 선택합니다. 라이선스 이름만으로 현재의 실행 방식을 판정하지 않습니다.
      evidence:
