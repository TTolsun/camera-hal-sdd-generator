        프록시는 반환값이 있는 메서드에는 오류를 반환하고 void 메서드에서는 로그를 남긴 뒤 반환합니다.
      evidence:
      - ipc
      - isolated
      covers:
      - errors
    - text: 이벤트 처리 중 재진입과 worker 장애 시 파이프라인의 요청 취소·재시작 정책은 별도의 구현 검토와 실행 검증이 필요합니다.
      evidence:
      - ipc
      - isolated
      kind: limitation
      covers:
      - errors
