        - - all
        reject_patterns: []
  - id: capabilities
    title: 제공 기능과 지원 범위
    question: Camera가 하나의 이미지 소스에서 하나 이상의 스트림을 제공하는 기능을 설명하세요. 하드웨어 지원은 장치별 PipelineHandler 구현과 등록에 달려 있습니다. 지원 기종이나 성능 수치를 추정하지 마세요.
    covers:
    - capabilities
    sources:
    - id: camera
      file: src/libcamera/camera.cpp
      start: '\class Camera

        '
      end: \subsection Camera States
