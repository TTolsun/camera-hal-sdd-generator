- id: pipeline-handler
  group: For Vendor
  nav_section: 연동 구현
  title: Pipeline Handler
  output: pipeline-handler.md
  diagram:
    max_nodes: 24
  kind: prose
  lead: 파이프라인 구현이 지켜야 하는 구성·요청·완료·종료 계약을 확인하세요.
  reader: 파이프라인 구현을 수정하는 개발자
  answers:
  - 공통 클래스와 하드웨어별 구현의 상속 관계는 무엇인가?
  - 설정과 요청 전달에서 직접 확인할 수 있는 메서드는 무엇인가?
  facts:
    classes:
    - libcamera::PipelineHandler
    - libcamera::PipelineHandler*
  watch:
  - src/libcamera/pipeline/**
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/internal/pipeline_handler.h
  - src/libcamera/pipeline/**/meson.build
  - meson.options
  - meson_options.txt
  next:
    title: 시스템 개요
    link: overview.md
  semantic_review: true
  design_topics:
  - id: responsibility
    title: 장치 매칭과 객체 수명
    question: 팩토리를 통한 생성과 shared_ptr 수명, match() 성공·실패 시 장치 확보·해제와 카메라 등록, acquireMediaDevice()의 장치 해제 시점, acquire()/release()의
      호출 짝과 공유 자원 반납 시점을 설명하세요. 특정 드라이버의 전력 최적화 예시는 이 질문의 범위가 아닙니다.
    sources:
    - id: handler
      file: src/libcamera/pipeline_handler.cpp
      start: '\class PipelineHandler

        '
      end: \brief Search and acquire a MediaDevice
    - id: acquisition
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Search and acquire a MediaDevice
      end: \fn PipelineHandler::generateConfiguration()
    covers:
    - responsibility
  - id: configuration
    title: 구성의 입력과 검증 책임
    question: generateConfiguration()의 roles 입력·반환값·호출 문맥과 configure()의 검증 전제·setStream 책임·반환값을 구분해 설명하세요. API 계약의
      의무와 허용을 원문의 강도로 옮기세요.
    sources:
    - id: configuration
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::generateConfiguration()
      end: \fn PipelineHandler::exportFrameBuffers()
    covers:
    - configuration
  - id: queue
    title: 요청 준비와 장치 큐
    question: registerRequest(), queueRequest(), doQueueRequests(), doQueueRequest(), queueRequestDevice()의 역할을
      구분하세요. 대기 큐 추가와 준비 순서, prepare(300ms)의 인자 의미, 대기 큐의 맨 앞 준비 여부와 장치 큐 한도에 따른 반복 중단, 큐 제거와 전달 순서, 취소·장치 오류 분기를
      설명하세요.
    sources:
    - id: queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::registerRequest()
      end: \brief Complete a buffer for a request
    - id: prepare
      file: src/libcamera/request.cpp
      start: \brief Prepare the Request to be queued to the device
      end: \var Request::Private::prepared
    covers:
    - queue
  - id: completion
    title: 버퍼 완료와 요청 반환
    question: completeBuffer()의 알림·추적과 명시적인 completeRequest()를 구분하세요. completeRequest()가 장치 큐 앞의 Pending 상태를 만나면
      반복을 어떻게 처리하는지, 애플리케이션 반환 순서와 핸들러 완료 호출 순서, 대기 요청 전달 재개, 호출 스레드와 반환 후 접근 규칙을 설명하세요.
    sources:
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
    covers:
    - completion
  - id: shutdown
