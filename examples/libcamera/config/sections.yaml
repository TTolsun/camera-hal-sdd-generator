      start: \brief Configure the camera prior to capture
      end: \brief Create a request object for the camera
    - id: access-entry
      file: src/libcamera/camera.cpp
      start: int Camera::configure(CameraConfiguration *config)
      end: 'for (auto &cfg : *config)'
    - id: access
      file: src/libcamera/camera.cpp
      start: int Camera::Private::isAccessAllowed(State low, State high,
      end: void Camera::Private::disconnect()
    - id: validate
      file: src/libcamera/camera.cpp
      start: \fn CameraConfiguration::validate()
      end: \brief Retrieve a reference to a stream configuration
    - id: validation-branch
      file: src/libcamera/camera.cpp
      start: if (config->validate() != CameraConfiguration::Valid) {
      end: std::ostringstream msg
    - id: stream-failure
      file: src/libcamera/camera.cpp
      start: Stream *stream = cfg.stream();
      end: stream->configuration_ = cfg;
    - id: state-return
      file: src/libcamera/camera.cpp
      start: if (currentState >= low && currentState <= high)
      end: void Camera::Private::disconnect()
      scope:
        start: if (currentState >= low && currentState <= high)
        end: void Camera::Private::disconnect()
    parts:
    - id: access-entry
      question: Camera::configure가 isAccessAllowed에 전달하는 상태 범위와 실패 시 반환식을 설명하세요.
      sources:
      - access-entry
      max_statements: 1
    - id: access-disconnected
      question: isAccessAllowed에서 연결 해제로 오류를 반환하는 전체 if 조건식과 반환값을 설명하세요. allowDisconnected 조건을 생략하지 마세요.
      sources:
      - access
      max_statements: 1
    - id: access-state
      question: 이 상태 범위 검사에 도달한 경우 if 조건식과 성공·실패의 실제 반환값을 설명하세요. 앞서 끝난 연결 해제 분기는 설명에 섞지 마세요.
      sources:
      - state-return
      max_statements: 2
    - id: validation
      question: Camera::configure는 validate 결과가 Valid가 아닌 경우 어떤 오류 식별자를 반환합니까? 조건과 Camera::configure의 반환값을 함께 한 문장으로 적으세요.
      sources:
      - validation-branch
      answer_contract:
        basis: implementation
        required_terms:
        - - Valid
        - - EINVAL
        reject_patterns:
        - pattern: validate\(\).{0,30}-EINVAL.{0,10}반환
          message: validate의 Status와 Camera::configure의 오류 코드를 구분하세요.
    - id: validation-status
      question: CameraConfiguration::validate()의 반환 상태와 구성 조정 가능성을 설명하세요. errno 정수 반환과 구분하세요.
      sources:
      - validate
    - id: pipeline
      question: Camera::configure가 PipelineHandler::configure를 invokeMethod로 호출한 뒤 ret를 검사하는 분기만 설명하세요. 반환값이 변환되는지 그대로 반환되는지
        실제 코드를 읽으세요. 특정 장치 오류 코드를 추정하지 마세요.
      max_statements: 2
      sources:
      - configure
      answer_contract:
        basis: implementation
        required_terms:
        - - ret
        reject_patterns:
        - pattern: EINVAL
          message: 이 질문은 파이프라인 호출 결과 ret 분기만 다룹니다. 다른 분기의 EINVAL을 옮기지 마세요.
    - id: stream
      question: Camera::configure의 if (!stream) 블록이 반환하기 전에 어떤 컨테이너 연산을 하고 어떤 오류를 반환합니까? 두 동작을 설명하고 컨테이너 타입이나 물리 장치 장애를 추정하지
        마세요.
      sources:
      - stream-failure
      max_statements: 2
      answer_contract:
        basis: implementation
        required_terms:
        - - clear
          - 비우고
          - 비웁니다
        - - EINVAL
        reject_patterns: []
