sections:
- id: overview
  group: For Developers
  title: 시스템 개요
  output: overview.md
  kind: prose
  lead: 카메라 탐색, 요청 생성과 완료의 책임을 구분한 뒤 수정할 패키지를 찾으세요.
  reader: libcamera 코드를 처음 읽는 개발자
  answers:
  - 카메라 탐색과 요청 생성은 누가 담당하는가?
  - 캡처를 시작하기 위한 상태와 API 순서는 무엇인가?
  - 요청 제출과 완료 사이의 비동기 경계는 어디인가?
  facts:
    packages:
    - src/*
    - include/libcamera*
    classes:
    - libcamera::CameraManager
    - libcamera::Camera
    - libcamera::Request
    - libcamera::PipelineHandler
    - libcamera::IPAManager
    class_table: false
    impact_classes: []
    reading_order: queue_request
  routes:
  - q: 수정할 패키지를 찾습니다.
    to: '#패키지별-역할'
  - q: 패키지 사이의 의존 방향을 확인합니다.
    to: '#패키지-사이의-의존'
  - q: 요청 코드를 읽을 시작점을 찾습니다.
    to: '#코드를-처음-읽는-순서'
  - q: 클래스 단위 책임을 확인합니다.
    to: camera-model.md
  watch:
  - src/**
  - include/libcamera/**
  - '**/meson.build'
  - meson.options
  - meson_options.txt
  next:
    title: 핵심 시나리오
    link: scenarios/index.md
  design_topics:
  - id: responsibility
    title: 컴포넌트별 책임
    question: 카메라 탐색과 요청 생성은 누가 담당합니까?
    sources:
    - id: camera
      file: src/libcamera/camera.cpp
      start: The Camera class models a camera
      end: \section camera_operation
      sha256: e77cee469b7c57430e4bd4b0f08493289c46b57549873521c476df388d591dc2
    - &id001
      id: discovery
      file: src/libcamera/camera_manager.cpp
      start: int CameraManager::Private::init()
      end: void CameraManager::Private::cleanup()
      sha256: 3e94e4e80c878774bd0a93076401d4ffb09e141dc8c87ae805eed5cc9349f938
    - &id002
      id: handler
      file: src/libcamera/pipeline_handler.cpp
      start: '\class PipelineHandler

        '
      end: \brief Search and acquire a MediaDevice
      sha256: e05278df0a06cb963fe79f772e62d4560b62df15c1411a6b49e32f7ca84d9e74
    - &id003
      id: create
      file: src/libcamera/camera.cpp
      start: \brief Create a request object for the camera
      end: \brief Patch a control list
      sha256: 67f9f4155bfff91e13d4c04e35fb427f6f76615a4c9d2ce06b4fc6ad5ac33108
    statements:
    - text: '`CameraManager`의 초기화는 `IPAManager`와 장치 열거기를 만들고 파이프라인 팩토리의 매칭을 시작합니다. `PipelineHandler::match()`는 필요한
        미디어 장치를 확보하여 하나 이상의 `Camera`를 만들고 관리자에 등록하는 계약을 갖습니다.'
      evidence:
      - discovery
      - handler
      covers:
      - responsibility
    - text: '`Camera`는 단일 이미지 소스의 스트림 구성과 캡처를 제어하는 공개 객체입니다. 애플리케이션이 `Camera::createRequest()`를 호출하면 `Camera`가 `Request`를
        생성하여 호출자에게 소유권을 넘기고, 파이프라인에는 `registerRequest()`로 등록합니다.'
      evidence:
      - camera
      - create
      covers:
      - responsibility
  - id: discovery
    title: 탐색과 파이프라인 선택
    question: 여러 파이프라인 구현은 어떻게 선택됩니까?
    sources:
    - *id001
    - *id002
    statements:
    - text: 장치 열거기 생성 또는 열거가 실패하면 초기화는 `-ENODEV`를 반환합니다. 성공하면 설정의 `pipelines_match_list`가 있을 때 지정된 팩토리를 그 순서대로 시도하고,
        없으면 등록된 팩토리를 순회합니다.
      evidence:
      - discovery
      covers:
      - discovery
    - text: 각 팩토리는 핸들러 인스턴스를 만들고 `match()`가 실패할 때까지 반복합니다. 성공한 인스턴스는 한 파이프라인에 필요한 장치를 확보합니다. 등록된 IPU3·RKISP1·UVC
        구현이 하나의 캡처 요청에서 차례로 실행된다는 뜻은 아닙니다. 여러 구현이 등록되어 있어도 사진 한 장을 찍을 때 모두 사용하는 것은 아닙니다.
      evidence:
      - discovery
      - handler
      covers:
      - discovery
  - id: lifecycle
    title: 캡처 세션의 상태와 자원
    question: 캡처를 시작하고 끝내기 위한 API 계약은 무엇입니까?
    sources:
    - &id006
      id: state
      file: src/libcamera/camera.cpp
      start: \section camera_operation
      end: \enddot
      sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
    - *id003
    statements:
    - text: 애플리케이션은 카메라를 `acquire()`하고 `configure()`한 뒤 `start()`하여 요청을 제출합니다. `stop()`은 Running에서 Stopping을 거쳐
        Configured로 돌아가는 경로이며, 사용을 마치면 `release()`합니다. 해제 전에는 재구성과 반복 시작·정지가 가능합니다.
      evidence:
      - state
      covers:
      - lifecycle
    - text: '`createRequest()`는 Configured 또는 Running에서 허용됩니다. 반환된 요청은 호출자가 소유하며 완료 처리에서 삭제하거나 `Request::reuse()`로
        초기화하여 다시 사용할 수 있습니다. 상태를 바꾸는 함수 사이의 동기화는 호출자가 담당합니다.'
      evidence:
      - create
      - state
      covers:
      - lifecycle
  - id: request
    title: 요청 제출과 완료
    question: 요청의 입력과 완료 통지는 어떤 경계를 통과합니까?
    sources:
    - &id004
      id: queue
      file: src/libcamera/camera.cpp
      start: \brief Queue a request to the camera
      end: \brief Start capture from camera
      sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
    - id: pipeline-queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::registerRequest()
      end: \brief Complete a buffer for a request
      sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
    - &id005
      id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
      sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
    statements:
    - text: 애플리케이션은 요청에 버퍼와 컨트롤을 넣습니다. `Camera::queueRequest()`는 Running 상태, 요청이 속한 카메라, 요청 상태, 컨트롤 목록과 활성 스트림을
        확인하고 빈 버퍼 요청을 거절합니다. 검사를 통과하면 `ConnectionTypeQueued`로 파이프라인에 전달하며, 반환값 0은 캡처 완료를 뜻하지 않습니다.
      evidence:
      - queue
      covers:
      - request
    - text: 공통 파이프라인은 요청을 대기 큐에 넣어 준비한 후 장치 큐에 전달합니다. `completeBuffer()`는 버퍼 완료를 알리고, 요청 완료는 별도의 `completeRequest()`가
        처리합니다. 완료된 요청은 제출 순서대로 `Camera::requestComplete()`에 전달됩니다.
      evidence:
      - pipeline-queue
      - completion
      covers:
      - request
  - id: boundary
    title: 스레드 경계와 확인 범위
    question: 코드에서 확인한 호출 경계와 실행 검증 범위는 무엇입니까?
    sources:
    - *id004
    - *id005
    - *id006
    statements:
    - text: '`Camera::queueRequest()`는 API 계약상 threadsafe이며 파이프라인 호출을 큐에 예약합니다. `PipelineHandler::completeRequest()`의
        호출 문맥은 CameraManager 스레드로 명시되어 있습니다. 이 계약을 애플리케이션의 모든 콜백에 동일하게 적용해서는 안 됩니다.'
      evidence:
      - queue
      - completion
      covers:
      - boundary
    - text: 실제 신호 수신자의 연결 방식, 재진입, 센서별 지연과 하드웨어 오류 복구는 이 정적 문서로 검증되지 않습니다. 실행 구성과 수신자 코드를 확인하고 기기에서 관찰해야 합니다.
      evidence:
      - queue
      - completion
      kind: limitation
      covers:
      - boundary
  design_requirements:
  - id: responsibility
    question: 카메라 탐색과 요청 생성은 누가 담당합니까?
  - id: discovery
    question: 여러 파이프라인 구현은 어떻게 선택됩니까?
  - id: lifecycle
    question: 캡처를 시작하고 끝내기 위한 API 계약은 무엇입니까?
  - id: request
    question: 요청의 입력과 완료 통지는 어떤 경계를 통과합니까?
  - id: boundary
    question: 코드에서 확인한 호출 경계와 실행 검증 범위는 무엇입니까?
  show_evidence: true
- id: scenarios
  group: For Developers
  title: 핵심 시나리오
  output: scenarios/index.md
  kind: per-scenario
  lead: 추적하려는 동작을 표에서 고르세요. 각 시나리오에서 주요 호출, 추적 경계와 전체 기록을 확인할 수 있습니다.
  reader: 특정 동작의 호출 경로를 추적하는 개발자
  answers:
  - 진입점에서 어떤 컴포넌트의 호출이 추출되었는가?
  - 어디서 분기하고, 어디서 정적 추적이 끊기는가?
  facts:
    scenarios: '*'
  watch:
  - src/libcamera/**
  - src/ipa/**
  next:
    title: 요청 처리와 문제 진단
    link: request-lifecycle.md
- id: request-lifecycle
  group: For Developers
  title: 요청 처리와 문제 진단
  output: request-lifecycle.md
  kind: prose
  lead: 요청의 제출 성공과 촬영 완료를 구분하고, 버퍼를 유지할 기간과 오류가 난 위치를 확인하세요.
  reader: libcamera를 연동하거나 요청 처리 코드를 수정하는 개발자
  answers:
  - 요청을 제출한 뒤 완료될 때까지 어느 단계에서 기다리는가?
  - 요청·버퍼·fence를 언제 다시 사용할 수 있는가?
  - 완료가 오지 않거나 정지할 때 무엇을 확인해야 하는가?
  routes:
  - q: 요청 제출과 완료의 연결을 확인합니다.
    to: '#제출에서-완료까지'
  - q: 자원을 재사용하거나 해제할 시점을 확인합니다.
    to: '#요청버퍼fence의-수명'
  - q: 오류가 난 단계를 찾습니다.
    to: '#실패-위치별-확인-순서'
  - q: 정지와 연결 해제의 차이를 확인합니다.
    to: '#정지와-연결-해제를-구분하기'
  facts:
    classes:
    - libcamera::Camera
    - libcamera::Request
    - libcamera::PipelineHandler
    class_table: false
  diagram:
    enabled: false
  watch:
  - src/libcamera/camera.cpp
  - src/libcamera/request.cpp
  - src/libcamera/pipeline_handler.cpp
  - include/libcamera/**
  semantic_review: true
  show_evidence: true
  next:
    title: 카메라와 요청 모델
    link: camera-model.md
  design_topics:
  - id: journey
    title: 제출에서 완료까지
    question: 제출 성공 이후의 대기 조건과 완료 책임은 무엇입니까?
    sources:
    - id: create
      file: src/libcamera/camera.cpp
      start: \brief Create a request object for the camera
      end: std::unique_ptr<Request> Camera::createRequest(uint64_t cookie)
      sha256: 9f251ecf5ba569606e9753d3619b88e1aef5a4ce15f816ae97efd283e34b823b
    - id: queue
      file: src/libcamera/camera.cpp
      start: \brief Queue a request to the camera
      end: \brief Start capture from camera
      sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
    - id: buffer
      file: src/libcamera/request.cpp
      start: \brief Add a FrameBuffer with its associated Stream to the Request
      end: int Request::addBuffer(const Stream *stream, FrameBuffer *buffer,
      sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
    - id: device-queue
      file: src/libcamera/pipeline_handler.cpp
      start: \fn PipelineHandler::registerRequest()
      end: \brief Complete a buffer for a request
      sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
      sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
    statements:
    - text: '이 문서는 Camera와 공통 PipelineHandler의 소스 계약을 연결합니다. 장치별 구현의 실행 기록은 아닙니다. 먼저 제출 반환값을 확인하고, 제출에 성공한
        요청은 완료 통지까지 추적하세요.


        | 단계 | 실행 주체와 처리 | 다음 단계의 조건 |

        |---|---|---|

        | 준비 | 애플리케이션이 `createRequest()`로 요청을 만들고 `addBuffer()`로 스트림별 버퍼를 연결합니다. | 요청에는 최소 하나의 버퍼가 필요합니다. |

        | 제출 | `Camera::queueRequest()`가 상태·카메라·컨트롤·스트림을 검사하고 파이프라인 호출을 예약합니다. | 반환값 0은 예약 성공이며 장치 전달이나 촬영
        완료가 아닙니다. |

        | 준비 대기 | 공통 파이프라인이 요청을 대기 큐에 넣고 `prepare(300ms)`를 호출합니다. | 장치 큐 한도 안에서 준비된 요청을 앞에서부터 꺼냅니다. 유효한 fence는 신호를 기다립니다.
        |

        | 장치 전달 | 공통 파이프라인이 장치 큐에 기록하고 `queueRequestDevice()`를 호출합니다. | 구체적인 장치 구현이 버퍼와 파라미터를 적용합니다. 반환 오류는
        요청 취소로 이어집니다. |

        | 완료 | 파이프라인이 `completeBuffer()`와 `completeRequest()`를 구분하여 호출합니다. | 마지막 버퍼 완료만으로 요청이 자동 완료되지 않습니다.
        요청은 제출 순서로 반환됩니다. |


        '
      evidence:
      - create
      - queue
      - buffer
      - device-queue
      - completion
      covers:
      - journey
    - text: 공통 파이프라인의 장치 큐잉과 완료 함수는 CameraManager 스레드에서 실행해야 합니다. 애플리케이션의 완료 콜백 실행 스레드는 신호 연결 방식까지 확인해야 합니다.
        이 표를 모든 콜백의 실행 순서를 보장하는 시퀀스도로 해석하지 마세요.
      evidence:
      - device-queue
      - completion
      covers:
      - journey
  - id: resources
    title: 요청·버퍼·fence의 수명
    question: 어떤 자원을 누가 유지하고 완료 후 무엇을 초기화해야 합니까?
    sources:
    - id: create
      file: src/libcamera/camera.cpp
      start: \brief Create a request object for the camera
      end: std::unique_ptr<Request> Camera::createRequest(uint64_t cookie)
      sha256: 9f251ecf5ba569606e9753d3619b88e1aef5a4ce15f816ae97efd283e34b823b
    - id: buffer
      file: src/libcamera/request.cpp
      start: \brief Add a FrameBuffer with its associated Stream to the Request
      end: int Request::addBuffer(const Stream *stream, FrameBuffer *buffer,
      sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
    - id: reuse
      file: src/libcamera/request.cpp
      start: \brief Reset the request for reuse
      end: \fn Request::controls()
      sha256: 22294a6809bd4c6655824af9603fb3879603cec256c6845e00d3d2a0e6bf7679
    - id: completion
      file: src/libcamera/pipeline_handler.cpp
      start: \brief Complete a buffer for a request
      end: \brief Retrieve the absolute path to a platform configuration file
      sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
    - id: reuse-flags
      file: src/libcamera/request.cpp
      start: \enum Request::ReuseFlag
      end: \typedef Request::BufferMap
      sha256: 9e55d8335a38080c0af78cf267bac78c573636447425e25d394e5b206217e7fe
    statements:
    - text: '| 자원 | 제출과 대기 중의 책임 | 완료 뒤의 처리 |

        |---|---|---|

        | Request | `createRequest()`가 반환한 요청은 호출자가 소유합니다. | 완료 핸들러에서 삭제하거나 `reuse()`로 초기화하여 다시 사용합니다. |

        | FrameBuffer | `addBuffer()`는 참조를 저장합니다. 호출자는 요청 완료 콜백까지 버퍼의 유효성을 보장합니다. | 버퍼 완료 신호 하나만 보고 요청 전체가
        끝났다고 판단하지 않습니다. |

