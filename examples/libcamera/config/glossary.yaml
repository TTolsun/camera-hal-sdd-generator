# libcamera 문서의 용어집.
# 사이트를 만들 때 문서마다 그 문서에 쓰인 용어의 표를 넣고, 전체를 모은 용어집 페이지를 만든다.
# 본문(코드 밖)에 뜻을 적지 않은 약어가 있으면 export-site 가 실패한다.
#   terms  : 처음 읽는 사람에게 뜻을 알려야 하는 용어. definition 은 한두 문장으로 쓴다.
#   common : 설명 없이 써도 되는 일반 약어. 분야 용어는 여기에 넣지 않는다.
# 형식: ../../../docs/reference/glossary.md

terms:
  - term: IPA
    full: Image Processing Algorithms
    definition: >-
      화질 알고리즘을 담은 별도 모듈(.so)입니다. ISP가 보낸 통계를 보고 다음 프레임에 쓸 ISP 설정값을 계산합니다.
      제조사가 소스를 공개하지 않고 제공할 수 있도록 libcamera 본체와 분리되어 있습니다.
    aliases: [IPA 모듈]
  - term: ISP
    full: Image Signal Processor
    definition: >-
      센서가 출력한 원시(bayer) 데이터를 화면에 쓸 수 있는 영상으로 바꾸는 처리 장치입니다.
      블랙 레벨 보정, 렌즈 음영 보정, 화이트 밸런스, 디베이어 등을 수행합니다.
  - term: 소프트웨어 ISP
    definition: >-
      하드웨어 ISP가 없는 장치에서 CPU나 GPU로 ISP 처리를 대신하는 libcamera 구성 요소입니다.
      소스에서는 software_isp, softisp라는 이름을 씁니다.
    aliases: [softisp]
  - term: 3A
    definition: >-
      자동 노출(AE·AGC), 자동 화이트 밸런스(AWB), 자동 초점(AF)을 함께 부르는 말입니다. IPA가 계산하는 대표 알고리즘입니다.
  - term: AGC
    full: Automatic Gain Control
    definition: 장면 밝기에 맞춰 노출 시간과 센서 게인을 정하는 자동 노출 알고리즘입니다.
    aliases: [AE]
  - term: AWB
    full: Auto White Balance
    definition: 조명의 색온도를 추정하고, 흰색이 흰색으로 보이도록 R·G·B 채널별 게인을 정하는 알고리즘입니다.
  - term: AF
    full: Auto Focus
    definition: 렌즈 위치를 움직여 초점을 맞추는 알고리즘입니다.
  - term: LSC
    full: Lens Shading Correction
    definition: >-
      렌즈 특성 때문에 영상 가장자리가 중앙보다 어둡거나 색이 틀어지는 현상(렌즈 음영)을 보정하는 처리입니다.
      화면을 격자로 나눈 보정 표를 곱해서 적용합니다.
    aliases: [렌즈 음영 보정]
  - term: 블랙 레벨
    definition: 빛이 전혀 없을 때도 센서가 내는 기준값입니다. ISP 처리의 첫 단계에서 이 값을 뺍니다.
  - term: bayer
    definition: >-
      센서의 화소마다 R·G·B 중 한 색만 기록하는 색 필터 배열입니다. 이 형식의 원시 데이터는 디베이어를 거쳐야 화소마다 RGB 값을 가집니다.
    aliases: [베이어]
  - term: 디베이어
    definition: bayer 원시 데이터에서 화소마다 빠진 색을 주변 화소로 보간해 RGB 영상을 만드는 처리입니다. 디모자이크라고도 합니다.
    aliases: [debayer]
  - term: 셰이더
    definition: GPU에서 실행되는 작은 프로그램입니다. 소프트웨어 ISP는 디베이어와 색 보정을 GPU 셰이더로 수행할 수 있습니다.
  - term: 튜닝 파일
    definition: >-
      센서와 플랫폼별 알고리즘 매개변수(보정 표, 색 행렬 등)를 담은 YAML 파일입니다. IPA가 시작할 때 읽습니다.
  - term: LUT
    full: Look-Up Table
    definition: 계산 결과를 미리 표로 만들어 두고 입력값으로 바로 찾는 방식입니다. LSC 보정 표가 여기에 해당합니다.
  - term: UQ
    definition: >-
      부호 없는 고정소수점 형식입니다. UQ<m, n>은 정수부 m비트와 소수부 n비트로 값을 나타냅니다.
  - term: IPC
    full: Inter-Process Communication
    definition: >-
      서로 다른 프로세스가 메시지를 주고받는 방식입니다. 서명이 없는 IPA 모듈은 별도 프로세스에서 실행되므로 libcamera가 IPC로 호출합니다.
  - term: 프록시
    definition: >-
      IPA 모듈을 직접 부르지 않고, 같은 인터페이스로 호출을 받아 IPA 스레드나 별도 프로세스로 전달하는 대리 객체입니다.
      빌드할 때 mojom 정의에서 자동 생성됩니다.
  - term: mojom
    definition: IPA 인터페이스의 함수와 자료형을 정의하는 파일 형식입니다. 빌드할 때 이 정의로 프록시 코드를 만듭니다.
  - term: Pipeline Handler
    definition: >-
      특정 하드웨어 플랫폼(IPU3, RKISP1 등)의 미디어 장치를 찾아 카메라를 만들고, 요청을 장치에 넣고 완료를 돌려주는 libcamera 구성 요소입니다.
      플랫폼마다 하나씩 있습니다.
    aliases: [파이프라인 핸들러]
  - term: IPU3
    full: Intel Image Processing Unit 3
    definition: 일부 Intel 노트북 프로세서에 들어 있는 카메라 ISP입니다. libcamera에는 이 장치용 Pipeline Handler와 IPA가 있습니다.
  - term: RKISP1
    full: Rockchip Image Signal Processor 1
    definition: Rockchip SoC와 NXP i.MX8MP 등에 들어 있는 카메라 ISP입니다. libcamera에는 이 장치용 Pipeline Handler와 IPA가 있습니다.
    aliases: [rkisp1]
  - term: mali-c55
    definition: Arm Mali-C55 카메라 ISP입니다. libcamera에는 이 장치용 Pipeline Handler와 IPA가 있습니다.
  - term: 왜곡 보정
    definition: >-
      렌즈 때문에 휘어진 영상을 곧게 펴는 처리입니다. RKISP1 파이프라인은 DW100 장치에 좌표 표(vertex map)를 넣어 수행합니다.
    aliases: [dewarp]
  - term: DW100
    definition: 좌표 표에 따라 영상을 다시 배치해 왜곡을 보정하는 별도 하드웨어 장치입니다. NXP i.MX8MP 등에 들어 있습니다.
  - term: UVC
    full: USB Video Class
    definition: USB 웹캠이 따르는 표준입니다. libcamera는 이 장치를 uvcvideo Pipeline Handler로 다룹니다.
  - term: V4L2
    full: Video4Linux2
    definition: Linux 커널이 카메라와 영상 장치를 다루는 API입니다. libcamera는 이 API로 센서와 ISP 장치를 제어합니다.
  - term: HAL
    full: Hardware Abstraction Layer
    definition: >-
      운영체제가 제조사마다 다른 하드웨어를 같은 인터페이스로 다루게 하는 계층입니다.
      이 프로젝트의 최종 적용 대상은 사내 Android Camera HAL입니다.
  - term: errno
    definition: >-
      Linux 함수가 실패 원인을 알리는 표준 오류 번호입니다. libcamera 함수는 이 값을 음수로 돌려줍니다.
      예를 들어 -ENODEV는 장치 없음, -EACCES는 접근 거부, -EINVAL은 잘못된 인자, -ENOMEM은 메모리 부족,
      -EXDEV는 다른 객체에 속한 자원을 뜻합니다.
    aliases: [EACCES, EINVAL, ENODEV, ENOMEM, EXDEV]
  - term: ASSERT
    definition: libcamera의 디버그 검사 매크로입니다. 디버그 빌드에서 조건이 거짓이면 치명적 로그를 남기고 실행을 중단합니다.
  - term: WSL2
    full: Windows Subsystem for Linux 2
    definition: Windows에서 Linux를 실행하는 환경입니다. 이 사이트는 libcamera를 WSL2에서 빌드하고 추출한 결과로 만듭니다.
  - term: OMM
    definition: 이 사이트의 읽기 화면 배치와 그림 확대·검색 규칙이 참고한 외부 문서 도구입니다. 실행기를 쓰지 않고 규칙만 적용했습니다.

# 회사 이름(NXP)도 뜻을 풀 필요가 없으므로 여기에 둔다.
common: [API, CPU, GPU, ID, LLM, NXP, RGB, TODO, USB, YAML]
