  - id: item-verification
    topic: verification
    kind: ownership
    title: 상태 검사와 시작 결과
    question: Camera::start는 접근 검사와 파이프라인 시작 결과에 따라 무엇을 반환하고 언제 CameraRunning으로 전환합니까?
    condition_display: inline
    nodes:
    - id: access
      label: Camera::start는 isAccessAllowed(Private::CameraConfigured)의 결과를 ret에 저장합니다.
      label_en: Camera::start stores the result of isAccessAllowed(Private::CameraConfigured)
        in ret.
      shape: box
      evidence:
      - source: verification/start-implementation
        sha256: a440ed27d1a8c891ff25f542252c50f9fc3040df4cc04346bf771ee8e4e54b73
        quote: "int Camera::start(const ControlList *controls)\n{\n\tPrivate *const\
          \ d = _d();\n\n\tint ret = d->isAccessAllowed(Private::CameraConfigured);\n\
          \tif (ret < 0)\n\t\treturn ret;\n\n\tLOG(Camera, Debug) << \"Starting capture\"\
          ;\n\n\tASSERT(d->requestSequence_ == 0);\n\n\tif (controls) {\n\t\tControlList\
          \ copy(*controls);\n\t\tpatchControlList(copy);\n\t\tret = d->pipe_->invokeMethod(&PipelineHandler::start,\n\
          \t\t\t\t\t     ConnectionTypeBlocking, this, &copy);\n\t} else {\n\t\tret\
          \ = d->pipe_->invokeMethod(&PipelineHandler::start,\n\t\t\t\t\t     ConnectionTypeBlocking,\
          \ this, nullptr);\n\t}\n\n\tif (ret)\n\t\treturn ret;\n\n\td->setState(Private::CameraRunning);\n\
          \n\treturn 0;\n}"
