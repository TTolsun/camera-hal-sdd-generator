  - id: per-output-vertex-map
    topic: application
    kind: flow
    title: 출력별 맵과 선택적 보정값
    question: ConverterDW100Module::configure는 기저 구성 결과에 따라 무엇을 반환하며 각 출력의 맵을 어떻게 초기화합니까?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: inline
    require_connected: true
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
    sources:
    - configure-only
    prompt: configure-only함수만그리세요. vertexMaps_.clear→converter.configure→if(ret)참이면ret반환,거짓이면inputBufferCount_=inputCfg.bufferCount와hasDewarpParams_=dewarpParams.has_value저장.
      outputCfgs반복은빈경우종료와다음출력반복을보존합니다. 각stream의info.map에입력크기,출력크기,sensorCrop_설정. if(dewarpParams)참이면setDewarpParams,거짓이면건너뜁니다.
      양쪽모두info.update=true뒤다음출력,끝에서0반환. 보정값없는성공도허용하며맵초기화를실기기동작보장으로바꾸지마세요. 실제 고정 소스만
      근거로 한영 노드와 화살표를 생성하세요. C++ if/while 조건은 원문 식을 결정 라벨에 그대로 포함하고 참·거짓 양쪽 및 종료를 일치시키세요.
      각 quote_ids는 노드·간선 양끝 symbol을 실제 인용에 포함해야 합니다. 한영의 부정·순서·호출자 의무·전제는 동일하게 보존하세요.
      영어는 완전한 짧은 문장으로 쓰고 같은 한국어 라벨은 같은 영어 번역만 사용하세요. 설명에는 C++ 멤버 접근 화살표 대신 메서드 이름을 쓰고
      인용은 그대로 보존하세요. 함수 호출 후의 간선은 정상 복귀 때이며 소스 밖 성공·실기기·콜백 시각 보장을 추가하지 마세요. 12노드를 넘으면
      조건을 숨기지 말고 실패로 보고하세요.
    whole_sources:
    - configure-only
