  - id: item-responsibility
    topic: responsibility
    kind: ownership
    title: 클래스별 책임의 관계와 경계
    question: CameraManager, Camera, Request의 책임과 Camera의 공유 수명은 어떻게 나뉘는가?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: evidence
    require_connected: true
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
    sources:
    - manager
    - camera
    - request
    prompt: '독립 항목 조사에서 다음 미충족 관계를 찾았습니다: 세 클래스의 역할과 Camera의 공유 수명을 함께 이해해야 하지만 이 절에는
      이를 설명하는 그림이 없습니다. 이 질문에만 답하는 그림을 만드세요. 다른 질문의 일반 구조도를 반복하거나 소스에 없는 실행·인과 관계를 만들지
      마세요. 구조와 책임은 구성 관계로, 순서는 순서도로, 상태·실패는 결정과 양쪽 결과로, 소유권은 보유·반환 관계로 표현합니다. 실제 if/while의
      참·거짓 양쪽과 종료를 보존하되 전체 함수가 아닌 일부 계약 관계이면 그 범위를 라벨에서 밝힙니다. 각 화살표가 인용한 구절 묶음에는 양 끝
      symbol이 실제로 존재해야 합니다. 필요한 근거가 없으면 새 사실을 지어내지 마세요. 한영 모두 같은 조건·부정·반환 경계를 보존하며,
      영문 노드는 90자 이내, 영문 화살표는 70자 이내의 완전한 짧은 문장으로 직접 요약하세요. 상한에 맞추려고 문장 끝을 자르거나 제어 문자를
      넣지 마세요. 복잡한 단일 질문이 12개 노드에 안 맞으면 조건을 생략해 통과시키지 말고 실패 원인을 남겨 질문 분할과 소스 창을 다시 검토하게
      하세요. 같은 한국어 라벨을 반복한다면 영어 대응도 정확히 같은 문자열을 쓰세요. 서로 다른 영어 뜻을 같은 한국어 라벨로 뭉개지 마세요.'
  - id: item-concurrency
    topic: concurrency
    kind: ownership
    title: 'API 호출 계약: 동기화와 완료 함수의 스레드'
    question: 어떤 API 호출에 threadsafe·상태 조건과 호출자 동기화 의무가 있고, 어떤 완료 함수를 CameraManager 스레드에서
      호출해야 합니까? 앱 콜백 전달 방식은 이 그림 범위 밖입니다.
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: evidence
    require_connected: false
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
      - pattern: (?s)\A(?!.*last buffer[^\n]*(?:does not|doesn.t|never|not automatically|not
          auto)[^\n]*request).*
        message: Preserve the last-buffer no-automatic-request-completion rule in English.
    sources:
    - create
    - queue
    - start
    - stop
    - completion
    - callback-signal
    prompt: 'API 문서의 호출 계약만 정리하는 책임 관계도입니다. 실제 구현의 전체 제어 흐름이나 앱 콜백 배송 순서를 나타내지 않습니다.
      다음9symbol을 각각 노드로 사용하세요: createRequest, Camera::queueRequest, Camera::start, Camera::stop,
      caller, PipelineHandler::completeBuffer, completeRequest, CameraManager, PipelineHandler::cancelRequest.
      완료 함수 그룹, 시작·중지 동기화 그룹, 생성·큐 호출 그룹은 서로 연결되지 않아도 됩니다. source에 있는 직접 호출 계약의 관계만
      그리고 모든 condition_ref는 always로 지정하세요. createRequest는 threadsafe 및 Configured 또는
      Running, queueRequest는 threadsafe 및 Running, start는 Configured 및 다른 상태 영향 함수와
      caller 동기화, stop은 어느 상태에서나 호출 가능하고 Running이 아니면 아무 작업도 하지 않으며 caller 동기화를 보존하세요.
      completeBuffer와 completeRequest는 CameraManager 스레드 호출 의무, cancelRequest는 completeRequest와
      같은 규칙이라는 사실을 구분하세요. completeBuffer에서 마지막 버퍼 완료가 요청을 자동 완료하지 않으며 completeRequest로
      명시적 완료해야 한다는 부정을 한영에서 모두 보존하세요. completeRequest 노드는 이미 완료된 요청을 순서 제약 없이 전달할 수
      있지만 애플리케이션에는 제출 순서로 반환한다는 API 계약을 설명하세요. completeRequest를 호출할 때마다 camera 신호가 즉시
      발생한다는 화살표나 표현을 넣지 마세요. CameraManager 스레드 의무는 파이프라인 완료 함수의 호출 문맥이며 앱 콜백 전달·실기기
      동작은 별도 범위입니다. queueRequest의 no-lock 주석으로 PipelineHandler가 상태를 검사한다고 주장하는 노드·간선은
      넣지 마세요. 각 노드와 화살표의 양끝 symbol이 실제 개별 인용문에 있어야 합니다. 한국어와 영어의 조건·부정·의무가 같아야 하며 노드160자·간선96자
      내 완결된 문장으로 작성하세요.'
    required_symbols:
    - createRequest
    - Camera::queueRequest
    - Camera::start
    - Camera::stop
    - caller
    - PipelineHandler::completeBuffer
    - completeRequest
    - CameraManager
    - PipelineHandler::cancelRequest
  - id: disconnection-state-notification
    topic: disconnection
    kind: state
    title: 연결 해제 알림과 상태 정리
    question: Camera의 연결 해제 알림은 실행 상태 변경과 플래그 설정 뒤 어떤 순서로 전달되며 대기 요청 처리는 어디까지 구현되었습니까?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    require_connected: true
    condition_display: evidence
    sources:
    - access
    - notification
    prompt: Camera::disconnect가 Private::disconnect를 호출하고 반환 뒤 disconnected 신호를 내보내는
      경로에만 집중합니다. Private::disconnect에서는 실행 중인 상태이면 Configured로 바꾸고, 그 외 상태는 유지한 뒤 disconnected_를
      true로 설정합니다. 실제 상태 조건의 참·거짓 양쪽과 신호까지의 반환 순서를 보존합니다. API 접근 검사 오버로드는 다른 그림이 설명하므로
      넣지 않습니다. 대기 요청 처리는 주석의 TODO이며 이 발췌에 취소·완료 구현이 없다는 사실을 알림 노드의 짧은 문구로 남깁니다. TODO를
      실행 단계나 취소 완료 화살표로 그리지 않습니다. 자원 해제와 release를 허용하려는 상태 변경 의도와 실제 호출 실행을 구분합니다. 모든
      화살표는 양 끝 symbol이 실제 있는 구절 묶음을 인용합니다. 영문 노드는 90자 안팎, 화살표는 70자 이내로 완전한 문장으로 쓰며 문장
      끝을 자르지 않습니다. 같은 한국어 라벨은 같은 영어 문자열로 대응시킵니다.
  - id: disconnection-access-results
    topic: disconnection
    kind: decision
    title: 해제 상태와 API 접근 결과
    question: 유효한 상태 인자로 호출한 두 isAccessAllowed 오버로드에서 연결 해제 예외와 단일·범위 상태 조건은 반환 결과를
      어떻게 결정합니까?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    require_connected: true
    condition_display: evidence
    sources:
    - access-exact
    - access-range
    prompt: 이 그림은 서로 다른 두 isAccessAllowed 오버로드의 계약 비교이며 런타임에 두 함수가 차례로 실행된다는 순서도가 아닙니다.
      공통으로 allowDisconnected가 거짓이고 disconnected_가 참이면 먼저 -ENODEV를 반환합니다. 그 밖에는 단일 상태
      오버로드의 일치 조건과 범위 오버로드의 범위 조건을 서로 다른 대안으로 표시하고 각각 참이면 0을 반환합니다. 각 상태 조건이 거짓인 경로에서만
      대응 상태 인자의 ASSERT 검사와 이후 로그·-EACCES 경로가 있습니다. ASSERT를 함수 시작의 검사로 옮기거나 잘못된 상태 인자에도
      항상 -EACCES가 보장된다고 쓰지 않습니다. ASSERT 뒤에 그린 오류 반환 경로는 그 검사가 통과하는 유효 인자 경로라는 전제를 한영
      라벨에 보존하며 ASSERT 실패를 정상 오류 반환으로 그리지 않습니다. 두 오버로드를 연결하려고 실제 없는 호출 화살표를 만들지 않습니다.
      공통 입력 조건에서 두 계약 대안으로 갈라지는 관계임을 분명히 표시합니다. Private::disconnect의 상태 변경과 알림은 별도 그림이
      다루므로 반복하지 않습니다. 실제 if 조건은 condition_ref로 연결하고 참·거짓 모두를 보존합니다. 모든 간선의 인용 묶음에 양
      끝 symbol이 실제 존재해야 합니다. 영문 노드는 90자 안팎, 화살표는 70자 이내의 완전한 문장으로 요약하고 같은 한국어는 같은 영어로
      대응시킵니다.
  - id: stop-running-and-noop
    topic: shutdown
    kind: decision
    title: stop의 즉시 반환과 실행 중 정리
    question: Camera::stop()은 실행 중이 아닐 때 무엇을 유지하고, 실행 중일 때 접근 검사·정지·대기 요청·상태 변경을 어떤
      순서로 처리합니까?
    generation: llm
    max_nodes: 10
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: evidence
    require_connected: true
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
    sources:
    - stop
    prompt: 독립 근거 검토에서 잘못된 경로를 발견했습니다. !isRunning() 참이면 아무 상태도 바꾸지 않는 return0 종료 노드로
      바로 가야 합니다. 요청 비어 있음 ASSERT와 CameraConfigured는 실행 중 경로에서 동기 중지를 마친 뒤에만 실행됩니다. 두
      return0 경로를 같은 상태변경 노드로 합치지 마세요. queueRequest는 별도 그림이며 연결하거나 호출 순서를 가정하지 마세요.  다른
      질문의 일반 구조도를 반복하거나 소스에 없는 실행·인과 관계를 만들지 마세요. 구조와 책임은 구성 관계로, 순서는 순서도로, 상태·실패는 결정과
      양쪽 결과로, 소유권은 보유·반환 관계로 표현합니다. 실제 if/while의 참·거짓 양쪽과 종료를 보존하되 전체 함수가 아닌 일부 계약 관계이면
      그 범위를 라벨에서 밝힙니다. 각 화살표가 인용한 구절 묶음에는 양 끝 symbol이 실제로 존재해야 합니다. 필요한 근거가 없으면 새 사실을
      지어내지 마세요. 한영 모두 같은 조건·부정·반환 경계를 보존하며, 영문 노드는 90자 이내, 영문 화살표는 70자 이내의 완전한 짧은 문장으로
      직접 요약하세요. 상한에 맞추려고 문장 끝을 자르거나 제어 문자를 넣지 마세요. 복잡한 단일 질문이 12개 노드에 안 맞으면 조건을 생략해
      통과시키지 말고 실패 원인을 남겨 질문 분할과 소스 창을 다시 검토하게 하세요. 같은 한국어 라벨을 반복한다면 영어 대응도 정확히 같은 문자열을
      쓰세요. 서로 다른 영어 뜻을 같은 한국어 라벨로 뭉개지 마세요.
  - id: queue-validation-order
    topic: shutdown
    kind: decision
    title: queueRequest의 검사와 접수 경계
