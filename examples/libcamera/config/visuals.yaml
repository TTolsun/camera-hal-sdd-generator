    - id: docancel
      label: doCancelRequest는 각 대기 버퍼를 취소하고 카메라의 bufferCompleted를 각 버퍼에 대해 emit한 뒤 cancelled_를
        true로 설정하고 pending_와 notifiers_를 비우고 timer_를 초기화합니다.
      label_en: doCancelRequest cancels pending buffers, emits camera's bufferCompleted
        for each, sets cancelled_ true, clears pending_ and notifiers_, then resets
        timer_.
      shape: box
      evidence:
      - source: cancellation/cancel
        sha256: 2ebca1d1d70536890988dda71397aa6d74337bedfa357851d4dd87cedc502544
        quote: "void Request::Private::doCancelRequest()\n{\n\tRequest *request = _o<Request>();\n\
          \n\tfor (FrameBuffer *buffer : pending_) {\n\t\tbuffer->_d()->cancel();\n\t\
          \tcamera_->bufferCompleted.emit(request, buffer);\n\t}\n\n\tcancelled_ = true;\n\
          \tpending_.clear();\n\tnotifiers_.clear();\n\ttimer_.reset();\n}\n\n/**\n\
          \ * \\brief Cancel a queued request\n *\n * Mark the request and its associated\
          \ buffers as cancelled and complete it.\n *\n * Set each pending buffer in\
          \ error state and emit the buffer completion signal\n * before completing\
          \ the Request.\n */\nvoid Request::Private::cancel()\n{\n\tLIBCAMERA_TRACEPOINT(request_cancel,\
          \ this);\n\n\tRequest *request = _o<Request>();\n\tASSERT(request->status()\
          \ == RequestPending);\n\n\tdoCancelRequest();\n}"
    - id: queue
      label: doQueueRequest는 카메라의 queuedRequests_에 요청을 추가하고 현재 requestSequence_를 요청의
        sequence_에 저장한 뒤 카메라 카운터를 증가시킵니다.
      label_en: doQueueRequest adds the request to camera's queuedRequests_, stores
        its requestSequence_ in sequence_, then increments the camera counter.
      shape: box
      evidence:
      - source: cancellation/pipeline-stop
        sha256: 956220c79c4d6c71b49e6af0c06af322f392187b2b7ffbcfb272d03b5b8c5442
        quote: "\\brief Stop capturing from all running streams and cancel pending requests\n\
