      접근 가능한 인용으로 보존합니다. 노드 160자, 간선 96자 상한에서 조건이 길면 적절한 노드로 나누고 문장을 자르거나 제어 문자를 넣지
      마세요. 이 검사의 성공은 별도 근거 검토나 사람 승인이 아닙니다.
