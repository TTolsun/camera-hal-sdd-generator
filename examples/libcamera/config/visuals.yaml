          \ not be accessed once this function returns."
  request-diagnosis:
  - id: queue-gates
    topic: diagnosis
    kind: flow
    title: 선두 요청을 전달하거나 반복을 멈추는 조건
    question: waitingRequests_ 순회에서 준비 상태와 queuedRequests_ 소프트웨어 큐 크기는 어떻게 전달을 제한합니까?
    nodes:
    - id: waiting
      label: waitingRequests_에 항목이 있는가?
      label_en: Does waitingRequests_ contain an item?
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: while (!data->waitingRequests_.empty())
      shape: decision
    - id: limit
      label: queuedRequests_ 크기가 maxQueuedRequestsDevice_인가?
      label_en: Does queuedRequests_ size equal maxQueuedRequestsDevice_?
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: if (data->queuedRequests_.size() == maxQueuedRequestsDevice_)
      shape: decision
    - id: ready
      label: 선두 요청의 prepared_가 참인가?
      label_en: Is the front request prepared_?
      evidence:
      - source: diagnosis/prepared-branch
        sha256: f655f79ce0ac9e9361d1759b2974e6f382b7fe1e9e3aa35b51952572af8d5a6f
        quote: if (!request->_d()->prepared_)
      shape: decision
    - id: forward
      label: 먼저 pop(), 이어 doQueueRequest(request)
      label_en: pop() first, then doQueueRequest(request)
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "data->waitingRequests_.pop();\n\t\tdoQueueRequest(request);"
    - id: end
      label: 이 호출의 전달 반복 종료
      label_en: End this invocation's forwarding loop
      evidence:
      - source: diagnosis/prepared-branch
        sha256: f655f79ce0ac9e9361d1759b2974e6f382b7fe1e9e3aa35b51952572af8d5a6f
        quote: "if (!request->_d()->prepared_)\n\t\t\tbreak;"
    edges:
    - from: waiting
      to: limit
      label: 예
      label_en: 'Yes'
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: while (!data->waitingRequests_.empty())
    - from: waiting
      to: end
      label: 아니요
      label_en: 'No'
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: while (!data->waitingRequests_.empty())
    - from: limit
      to: end
      label: '예: break'
      label_en: 'Yes: break'
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "if (data->queuedRequests_.size() == maxQueuedRequestsDevice_)\n\t\t\
          \tbreak;"
    - from: limit
      to: ready
      label: '아니요: 선두 확인'
      label_en: 'No: inspect front'
      evidence:
      - source: diagnosis/prepared-branch
        sha256: f655f79ce0ac9e9361d1759b2974e6f382b7fe1e9e3aa35b51952572af8d5a6f
        quote: Request *request = data->waitingRequests_.front();
    - from: ready
      to: end
      label: '아니요: break'
      label_en: 'No: break'
      evidence:
      - source: diagnosis/prepared-branch
        sha256: f655f79ce0ac9e9361d1759b2974e6f382b7fe1e9e3aa35b51952572af8d5a6f
        quote: "if (!request->_d()->prepared_)\n\t\t\tbreak;"
    - from: ready
      to: forward
      label: 예
      label_en: 'Yes'
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "data->waitingRequests_.pop();\n\t\tdoQueueRequest(request);"
    - from: forward
      to: waiting
      label: 반복 조건 재검사
      label_en: Recheck loop condition
      evidence:
      - source: diagnosis/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "doQueueRequest(request);\n\t}"
