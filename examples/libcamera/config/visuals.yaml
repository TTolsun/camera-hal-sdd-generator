schema: 1
sections:
  camera-model:
  - id: camera-states
    topic: state
    kind: state
    title: 카메라 상태와 허용 호출
    question: 성공한 상태 전이와 상태를 유지하는 호출을 구분하세요. 상태 변경 함수의 동기화는 호출자가 책임집니다.
    nodes:
    - id: available
      label: Available
      label_en: Available
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Available;'
    - id: acquired
      label: Acquired
      label_en: Acquired
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Acquired;'
    - id: configured
      label: Configured
      label_en: Configured
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Configured;'
    - id: running
      label: Running
      label_en: Running
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Running;'
    - id: stopping
      label: Stopping
      label_en: Stopping
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Stopping;'
    edges:
    - from: available
      to: available
      label: release()
      label_en: release()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Available -> Available [label = "release()"]
    - from: available
      to: acquired
      label: acquire()
      label_en: acquire()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Available -> Acquired [label = "acquire()"]
    - from: acquired
      to: available
      label: release()
      label_en: release()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Acquired -> Available [label = "release()"]
    - from: acquired
      to: configured
      label: configure()
      label_en: configure()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Acquired -> Configured [label = "configure()"]
    - from: configured
      to: available
      label: release()
      label_en: release()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Configured -> Available [label = "release()"]
    - from: configured
      to: configured
      label: configure(), createRequest()
      label_en: configure(), createRequest()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Configured -> Configured [label = "configure(), createRequest()"]
    - from: configured
      to: running
      label: start()
      label_en: start()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Configured -> Running [label = "start()"]
    - from: running
      to: stopping
      label: stop()
      label_en: stop()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Running -> Stopping [label = "stop()"]
    - from: stopping
      to: configured
      label: 정지 처리 종료
      label_en: stop finished
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Stopping -> Configured;
    - from: running
      to: running
      label: createRequest(), queueRequest()
      label_en: createRequest(), queueRequest()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Running -> Running [label = "createRequest(), queueRequest()"]
  request-lifecycle:
  - id: request-ownership
    topic: resources
    kind: ownership
    title: 요청과 버퍼를 유지할 기간
    question: 요청의 소유권은 호출자에게 있습니다. 버퍼 참조를 연결해도 호출자의 버퍼 유지 책임은 계속됩니다.
    nodes:
    - id: caller
      label: 호출자가 Request를 소유
      label_en: Caller owns Request
      evidence:
      - source: resources/create
        sha256: 9f251ecf5ba569606e9753d3619b88e1aef5a4ce15f816ae97efd283e34b823b
        quote: The ownership of the returned request is passed to the caller
    - id: buffer
      label: Request가 버퍼를 참조
      label_en: Request references buffer
      evidence:
      - source: resources/buffer
        sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
        quote: A reference to the buffer is stored in the request.
    - id: callback
      label: 요청 완료 콜백
      label_en: Request completion callback
      evidence:
      - source: resources/buffer
        sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
        quote: "until the request complete\n * callback is called."
    - id: delete
      label: 요청 삭제
      label_en: Delete request
      evidence:
      - source: resources/create
        sha256: 9f251ecf5ba569606e9753d3619b88e1aef5a4ce15f816ae97efd283e34b823b
        quote: "The request may be deleted in the completion\n * handler"
    - id: reuse
      label: reuse() 후 다시 제출
      label_en: Reset before requeue
      evidence:
      - source: resources/reuse
        sha256: 22294a6809bd4c6655824af9603fb3879603cec256c6845e00d3d2a0e6bf7679
        quote: be reused and requeued without destruction.
    edges:
    - from: caller
      to: buffer
      label: addBuffer()
      label_en: addBuffer()
      evidence:
      - source: resources/buffer
        sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
        quote: A reference to the buffer is stored in the request.
    - from: buffer
      to: callback
      label: 이 시점까지 버퍼를 유효하게 유지
      label_en: Keep buffer valid until this point
      evidence:
      - source: resources/buffer
        sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
        quote: "for ensuring that the buffer will remain valid until the request complete\n * callback is called."
    - from: callback
      to: delete
      label: 완료 핸들러에서 삭제 가능
      label_en: May delete in completion handler
      evidence:
      - source: resources/create
        sha256: 9f251ecf5ba569606e9753d3619b88e1aef5a4ce15f816ae97efd283e34b823b
        quote: "The request may be deleted in the completion\n * handler"
    - from: callback
      to: reuse
      label: 재사용 전 상태 초기화
      label_en: Reset state before reuse
      evidence:
      - source: resources/reuse
        sha256: 22294a6809bd4c6655824af9603fb3879603cec256c6845e00d3d2a0e6bf7679
        quote: "This function shall be called\n * prior to queueing the request to the camera"
  - id: request-stages
    topic: journey
    kind: flow
    title: 제출·준비·장치 처리·완료의 연결
    question: 접수 성공 뒤에도 준비 대기와 장치 처리가 남습니다. 정상 촬영 경로의 계약을 연결한 그림이며 실제 실행 시간이나 전체 실패 경로를 나타내지 않습니다.
    nodes:
    - id: queue
      label: Camera::queueRequest()
      label_en: Camera::queueRequest()
      evidence:
      - source: journey/queue
        sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
        quote: int Camera::queueRequest(Request *request)
    - id: waiting
      label: 대기열과 준비 단계
      label_en: Waiting queue and preparation
      evidence:
      - source: journey/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: data->waitingRequests_.push(request);
    - id: device
      label: queueRequestDevice()
      label_en: queueRequestDevice()
      evidence:
      - source: journey/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: int ret = queueRequestDevice(camera, request);
    - id: buffer
      label: completeBuffer()
      label_en: completeBuffer()
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: bool PipelineHandler::completeBuffer(Request *request, FrameBuffer *buffer)
    - id: remaining
      label: 버퍼 추적 상태 갱신
      label_en: Update buffer completion tracking
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: completion and updates the request's internal buffer tracking.
    - id: request
      label: completeRequest()
      label_en: completeRequest()
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: void PipelineHandler::completeRequest(Request *request)
    - id: application
      label: 제출 순서로 애플리케이션 반환
      label_en: Return to application in submission order
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: "This function ensures that requests will be returned to the application in\n * submission order"
    edges:
    - from: queue
      to: waiting
      label: 핸들러 호출을 큐에 예약
      label_en: Queue the handler invocation
      evidence:
      - source: journey/queue
        sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
        quote: ConnectionTypeQueued, request);
    - from: waiting
      to: device
      label: 준비·큐 한도 통과, 취소되지 않은 요청
      label_en: Prepared, within queue limit and not cancelled
      evidence:
      - source: journey/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "if (request->_d()->cancelled_) {\n\t\tcompleteRequest(request);\n\t\treturn;\n\t}\n\n\tint ret = queueRequestDevice(camera, request);"
    - from: device
      to: buffer
      label: 장치 구현자가 버퍼 완료 통지
      label_en: Device handler signals buffer completion
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: This function shall be called by pipeline handlers to signal completion of
    - from: buffer
      to: remaining
      label: 버퍼 완료 알림
      label_en: Notify buffer completion
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: camera->bufferCompleted.emit(request, buffer);
    - from: remaining
      to: request
      label: 후처리 뒤 구현자가 명시적으로 호출
      label_en: Handler explicitly completes after remaining work
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: They shall complete requests explicitly with completeRequest().
    - from: request
      to: application
      label: 선두 미완료 요청 뒤의 반환은 대기
      label_en: Wait behind an incomplete head request
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: "if (req->status() == Request::RequestPending)\n\t\t\tbreak;"
  - id: stop-order
    topic: stopping
    kind: flow
    title: 정지할 때 대기 요청을 처리하는 순서
    question: 정상 정지 경로의 순서를 표시합니다. 연결 해제 알림의 미완료 요청 TODO를 이 정지 보장과 혼동하지 마세요.
    nodes:
    - id: detach
      label: 대기열을 별도로 분리
      label_en: Detach waiting queue
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: waitingRequests.swap(data->waitingRequests_);
    - id: stop
      label: stopDevice()
      label_en: stopDevice()
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: stopDevice(camera);
    - id: cancel
      label: 대기 요청 취소·완료
      label_en: Cancel and complete waiting requests
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "request->_d()->cancel();\n\t\tdoQueueRequest(request);"
    - id: configured
      label: Configured로 복귀
      label_en: Return to Configured
      evidence:
      - source: stopping/stop
        sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
        quote: d->setState(Private::CameraConfigured);
    edges:
    - from: detach
      to: stop
      label: 분리 후 장치 정지
      label_en: Stop device after detaching
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "waitingRequests.swap(data->waitingRequests_);\n\n\t/* Stop the pipeline handler and let the queued requests complete. */\n\tstopDevice(camera);"
    - from: stop
      to: cancel
      label: 장치 요청 뒤 대기 요청 취소
      label_en: Cancel waiting requests after device requests
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: after the device to keep them in order.
    - from: cancel
      to: configured
      label: 핸들러 정지 호출이 반환한 뒤
      label_en: After handler stop returns
      evidence:
      - source: stopping/stop
        sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
        quote: "ASSERT(!d->pipe_->hasPendingRequests(this));\n\n\td->setState(Private::CameraConfigured);"
  overview:
  - id: discovery-map
    topic: discovery
    kind: flow
    title: 장치 탐색에서 Camera 접근까지
    question: 장치 매칭과 등록의 책임을 따라가세요. 그림은 책임 연결이며 전체 호출 순서나 실행 시간을 나타내지 않습니다.
    nodes:
    - id: manager
      label: CameraManager 진입점
      label_en: CameraManager entry
      evidence:
      - source: discovery/manager
        sha256: 6c52c603a60f0faf8c931e6c1691d951484c4915ef9ab8ac67cc65d89acbb550
        quote: The camera manager is the entry point to libcamera.
    - id: enumerate
      label: 장치 열거
      label_en: Enumerate devices
      evidence:
      - source: discovery/start
        sha256: 5c647185035857e55de76a49cffad27bfac087260af8577a43cc2611196e3c17
        quote: Start the camera manager and enumerate all devices in the system.
    - id: handler
      label: PipelineHandler::match()
      label_en: PipelineHandler::match()
      evidence:
      - source: discovery/match
        sha256: 7dde6563cf6bda32f38f4c1fb3ef0443502432236a0222d4f811b3fa71f3fc05
        quote: This function is the main entry point of the pipeline handler.
    - id: camera
      label: Camera 생성·등록
      label_en: Create and register Camera
      evidence:
      - source: discovery/match
        sha256: 7dde6563cf6bda32f38f4c1fb3ef0443502432236a0222d4f811b3fa71f3fc05
        quote: "create one or multiple Camera instances and register them with the\n * camera manager."
    edges:
    - from: manager
      to: enumerate
      label: start()
      label_en: start()
      evidence:
      - source: discovery/start
        sha256: 5c647185035857e55de76a49cffad27bfac087260af8577a43cc2611196e3c17
        quote: Start the camera manager and enumerate all devices in the system.
    - from: enumerate
      to: handler
      label: 열거자를 전달해 장치를 매칭
      label_en: Pass enumerator to match devices
      evidence:
      - source: discovery/match
        sha256: 7dde6563cf6bda32f38f4c1fb3ef0443502432236a0222d4f811b3fa71f3fc05
        quote: by the camera manager with the \a enumerator passed as an argument.
    - from: handler
      to: camera
      label: 필요한 장치를 확보한 경우
      label_en: When required devices are acquired
      evidence:
      - source: discovery/match
        sha256: 7dde6563cf6bda32f38f4c1fb3ef0443502432236a0222d4f811b3fa71f3fc05
        quote: "create the corresponding Camera instances, store them internally, and return\n * true."
  - id: submission-completion
    topic: request
    kind: flow
    title: 접수 성공과 촬영 완료는 다른 시점
    question: queueRequest()의 0 반환은 접수 결과입니다. 요청 완료는 별도의 requestCompleted 신호로 확인합니다.
    nodes:
    - id: request
      label: 버퍼를 연결한 Request
      label_en: Request with capture buffers
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: fill it with at least one capture buffer before queuing it.
    - id: queue
      label: queueRequest()
      label_en: queueRequest()
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: int Camera::queueRequest
    - id: accepted
      label: '0 반환: 접수 성공'
      label_en: 'Return 0: submission accepted'
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: 0 on success or a negative error code otherwise
    - id: signal
      label: requestCompleted 신호
      label_en: requestCompleted signal
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: through the \ref requestCompleted signal.
    edges:
    - from: request
      to: queue
      label: Running 상태에서 제출
      label_en: Submit in Running state
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: is in the Running state as defined in \ref camera_operation.
    - from: queue
      to: accepted
      label: 접수 결과를 반환
      label_en: Return submission result
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: 0 on success or a negative error code otherwise
    - from: queue
      to: signal
      label: 촬영 완료는 별도로 통지
      label_en: Notify completion separately
      evidence:
      - source: request/queue
        sha256: b24af43d2f808f81b527cf4ee8915451be675f43f877bac5e6edfe69ff3739d6
        quote: "Once the request has been queued, the camera will notify its completion\n * through the \\ref requestCompleted\
          \ signal."
  pipeline-handler: []
  vendor-assurance:
  - id: validation-results
    topic: constraints
    kind: decision
    title: validate() 결과별 호출자의 책임
    question: validate()의 Invalid·Adjusted·Valid는 무엇을 뜻하며, Adjusted이면 호출자는 무엇을 다시 확인해야 합니까?
    prompt: 네 노드는 CameraConfiguration::validate·Invalid·Adjusted·Valid입니다. 함수에서 세 반환 상태로 향하는 선 세 개를 그리세요. 각 노드의 label은 한국어
      설명, label_en은 같은 의미의 영어 설명이며 모두 한 줄입니다. Invalid에서 빈 구성은 극단적인 예시이며 유일한 발생 조건으로 쓰지 마세요. Adjusted 노드에는 파라미터 변경·스트림 삭제 가능성과
      호출자의 확인 의무를 함께 설명하세요. label에 호출자·확인·가능을, label_en에 caller·check·may를 포함하세요. 반환 관계는 함수 머리와 해당 상태가 함께 있는 원문을 인용하세요. 제공한
