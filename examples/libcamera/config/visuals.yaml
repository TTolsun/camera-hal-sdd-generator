  framebuffer-allocator-boundary:
  - id: item-allocation-preconditions
    topic: allocation-preconditions
    kind: ownership
    title: 할당 전에 확인할 카메라 상태와 스트림의 관계와 경계
    question: allocate() 호출 전에 카메라와 스트림은 어떤 조건을 충족해야 하며, 어떤 조건에서 -EACCES와 -EINVAL이 반환되는가?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: evidence
    require_connected: true
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
    sources:
    - allocate-preconditions
    - allocate-state-stream-errors
    prompt: '독립 항목 조사에서 다음 미충족 관계를 찾았습니다: 할당 전 조건과 두 오류 분기를 함께 보여 주는 결정도가 유용합니다. 해당
      절에 제공된 그림은 없습니다. 이 질문에만 답하는 그림을 만드세요. 다른 질문의 일반 구조도를 반복하거나 소스에 없는 실행·인과 관계를 만들지
      마세요. 구조와 책임은 구성 관계로, 순서는 순서도로, 상태·실패는 결정과 양쪽 결과로, 소유권은 보유·반환 관계로 표현합니다. 실제 if/while의
      참·거짓 양쪽과 종료를 보존하되 전체 함수가 아닌 일부 계약 관계이면 그 범위를 라벨에서 밝힙니다. 각 화살표가 인용한 구절 묶음에는 양 끝
