      label: 핸들러는 완료된 요청에 순서 제약 없이 호출합니다. completeRequest()는 전달받은 요청 상태를 갱신합니다.
      label_en: Handlers may call completeRequest() on any completed request in any
        order. It updates the supplied request status.
