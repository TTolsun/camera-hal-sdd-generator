  - id: queue-access-helper
    topic: acceptance
    kind: flow
    title: 요청 제출의 접근 검사
    question: queueRequest의 첫 접근 검사는 어떤 순서로 연결 해제와 Running 상태를 검사하며, 이 검사에서 반환한 0은 무엇을
      뜻합니까?
    condition_display: evidence
    nodes:
    - id: entry
      label: Camera::queueRequest는 Private::CameraRunning을 인자로 접근 검사를 호출합니다.
      label_en: Camera::queueRequest calls the access check with Private::CameraRunning.
      shape: box
      evidence:
      - source: acceptance/queue
        sha256: 7f775e92fe4ad43798ec85c6dba7e2b8bba7d189e554cb9300d2475891a1764a
        quote: "\\brief Queue a request to the camera\n * \\param[in] request The request\
          \ to queue to the camera\n *\n * This function queues a \\a request to the\
          \ camera for capture.\n *\n * After allocating the request with createRequest(),\
          \ the application shall\n * fill it with at least one capture buffer before\
          \ queuing it. Requests that\n * contain no buffers are invalid and are rejected\
          \ without being queued.\n *\n * Once the request has been queued, the camera\
          \ will notify its completion\n * through the \\ref requestCompleted signal.\n\
          \ *\n * \\context This function is \\threadsafe. It may only be called when\
          \ the camera\n * is in the Running state as defined in \\ref camera_operation.\n\
          \ *\n * \\return 0 on success or a negative error code otherwise\n * \\retval\
          \ -ENODEV The camera has been disconnected from the system\n * \\retval -EACCES\
          \ The camera is not running so requests can't be queued\n * \\retval -EXDEV\
          \ The request does not belong to this camera\n * \\retval -EINVAL The request\
          \ is invalid\n * \\retval -ENOMEM No buffer memory was available to handle\
          \ the request\n */\nint Camera::queueRequest(Request *request)\n{\n\tPrivate\
          \ *const d = _d();\n\n\tint ret = d->isAccessAllowed(Private::CameraRunning);\n\
          \tif (ret < 0)\n\t\treturn ret;\n\n\t/* Requests can only be queued to the\
          \ camera that created them. */\n\tif (request->_d()->camera() != this) {\n\
          \t\tLOG(Camera, Error) << \"Request was not created by this camera\";\n\t\t\
          return -EXDEV;\n\t}\n\n\tif (request->status() != Request::RequestPending)\
          \ {\n\t\tLOG(Camera, Error) << request->toString() << \" is not valid\";\n\
          \t\treturn -EINVAL;\n\t}\n\n\t/* Make sure the Request has a valid control\
          \ list. */\n\tif (request->controls().infoMap() != &controls()) {\n\t\tLOG(Camera,\
          \ Error) << \"Overwriting Request::controls() is not allowed\";\n\t\treturn\
          \ -EINVAL;\n\t}\n\n\t/*\n\t * The camera state may change until the end of\
          \ the function. No locking\n\t * is however needed as PipelineHandler::queueRequest()\
          \ will handle\n\t * this.\n\t */\n\n\tif (request->buffers().empty()) {\n\t\
          \tLOG(Camera, Error) << \"Request contains no buffers\";\n\t\treturn -EINVAL;\n\
          \t}\n\n\tfor (const auto &[stream, buffer] : request->buffers()) {\n\t\tif\
          \ (d->activeStreams_.find(stream) == d->activeStreams_.end()) {\n\t\t\tLOG(Camera,\
          \ Error) << \"Invalid request\";\n\t\t\treturn -EINVAL;\n\t\t}\n\t}\n\n\t\
          /* Pre-process AeEnable. */\n\tpatchControlList(request->controls());\n\n\t\
          d->pipe_->invokeMethod(&PipelineHandler::queueRequest,\n\t\t\t       ConnectionTypeQueued,\
          \ request);\n\n\treturn 0;\n}"
    - id: disconnect
      label: 연결 해제를 허용하지 않고 카메라가 연결 해제되었나요?
      label_en: Is disconnection disallowed and the camera disconnected?
      shape: decision
      evidence:
