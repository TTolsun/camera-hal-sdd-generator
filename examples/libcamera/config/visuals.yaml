schema: 1
sections:
  camera-model:
  - id: camera-states
    topic: state
    kind: state
    title: 카메라 상태와 허용 호출
    question: 성공한 상태 전이와 상태를 유지하는 호출을 구분하세요. 상태 변경 함수의 동기화는 호출자가 책임집니다.
    nodes:
    - id: available
      label: Available
      label_en: Available
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Available;'
    - id: acquired
      label: Acquired
      label_en: Acquired
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Acquired;'
    - id: configured
      label: Configured
      label_en: Configured
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Configured;'
    - id: running
      label: Running
      label_en: Running
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Running;'
    - id: stopping
      label: Stopping
      label_en: Stopping
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: ']; Stopping;'
    edges:
    - from: available
      to: available
      label: release()
      label_en: release()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Available -> Available [label = "release()"]
    - from: available
      to: acquired
      label: acquire()
      label_en: acquire()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Available -> Acquired [label = "acquire()"]
    - from: acquired
      to: available
      label: release()
      label_en: release()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Acquired -> Available [label = "release()"]
    - from: acquired
      to: configured
      label: configure()
      label_en: configure()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Acquired -> Configured [label = "configure()"]
    - from: configured
      to: available
      label: release()
      label_en: release()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Configured -> Available [label = "release()"]
    - from: configured
      to: configured
      label: configure(), createRequest()
      label_en: configure(), createRequest()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Configured -> Configured [label = "configure(), createRequest()"]
    - from: configured
      to: running
      label: start()
      label_en: start()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Configured -> Running [label = "start()"]
    - from: running
      to: stopping
      label: stop()
      label_en: stop()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Running -> Stopping [label = "stop()"]
    - from: stopping
      to: configured
      label: 정지 처리 종료
      label_en: stop finished
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Stopping -> Configured;
    - from: running
      to: running
      label: createRequest(), queueRequest()
      label_en: createRequest(), queueRequest()
      evidence:
      - source: state/states
        sha256: e85796df194551ecbd587ba1a7bb356a1409fa1d606762865e7eb989c92d2f72
        quote: Running -> Running [label = "createRequest(), queueRequest()"]
  request-lifecycle:
  - id: request-stages
    topic: journey
    kind: flow
    title: 제출·준비·장치 처리·완료의 연결
    question: 접수 성공 뒤에도 준비 대기와 장치 처리가 남습니다. 정상 촬영 경로의 계약을 연결한 그림이며 실제 실행 시간이나 전체 실패 경로를 나타내지 않습니다.
    nodes:
    - id: queue
      label: Camera::queueRequest()
      label_en: Camera::queueRequest()
      evidence:
      - source: journey/queue
        sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
        quote: int Camera::queueRequest(Request *request)
    - id: waiting
      label: 대기열과 준비 단계
      label_en: Waiting queue and preparation
      evidence:
      - source: journey/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: data->waitingRequests_.push(request);
    - id: device
      label: queueRequestDevice()
      label_en: queueRequestDevice()
      evidence:
      - source: journey/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: int ret = queueRequestDevice(camera, request);
    - id: buffer
      label: 'completeBuffer(): 모든 버퍼 완료인가?'
      label_en: 'completeBuffer(): have all buffers completed?'
      evidence:
      - source: journey/buffer-notice
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "True if all buffers contained in the request have completed, false\n * otherwise"
      shape: decision
    - id: remaining
      label: 핸들러에 필요한 추가 작업 기회
      label_en: Opportunity for any additional required work
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: completion and updates the request's internal buffer tracking.
    - id: request
      label: completeRequest()
      label_en: completeRequest()
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: void PipelineHandler::completeRequest(Request *request)
    - id: application
      label: 제출 순서로 애플리케이션 반환
      label_en: Return to application in submission order
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: "This function ensures that requests will be returned to the application in\n * submission order"
    - id: pending
      label: 'false: 아직 완료되지 않은 버퍼가 있음'
      label_en: 'false: buffers have not all completed'
      evidence:
      - source: journey/buffer-notice
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "false\n * otherwise"
    edges:
    - from: queue
      to: waiting
      label: 핸들러 호출을 큐에 예약
      label_en: Queue the handler invocation
      evidence:
      - source: journey/queue
        sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
        quote: ConnectionTypeQueued, request);
    - from: waiting
      to: device
      label: 준비·큐 한도 만족·비취소; 유효 fence가 있으면 모두 신호된 뒤
      label_en: Prepared, within queue limit, not cancelled; all valid fences signalled if present
      evidence:
      - source: journey/device-queue
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "if (request->_d()->cancelled_) {\n\t\tcompleteRequest(request);\n\t\treturn;\n\t}\n\n\tint ret = queueRequestDevice(camera, request);"
      - source: journey/buffer
        sha256: 65cd8b0501b7f6545dd10eaaec4a4fe46c52a096a3bbd94ea6b4813e4a670876
        quote: "When a valid Fence is provided to this function, \\a fence is moved to \\a\n * buffer and this Request will only be queued to the device once the\n * fences of all its buffers have been correctly signalled."
    - from: device
      to: buffer
      label: '장치 제출 성공(0) 경로: 파이프라인 핸들러의 버퍼 완료 통지'
      label_en: 'Device submission success (0): pipeline handler signals buffer completion'
      evidence:
      - source: journey/buffer-notice
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: This function shall be called by pipeline handlers to signal completion of
      - source: journey/device-contract
        sha256: 18f697dba5bc979e14125471abadb8a7ecccef4de79e75e1f385e2c6ee044df2
        quote: 0 on success or a negative error code otherwise
    - from: buffer
      to: remaining
      label: 'true: 버퍼는 모두 완료, 요청은 자동 완료되지 않음'
      label_en: 'true: all buffers completed; request is not automatically completed'
      evidence:
      - source: journey/request-duty
        sha256: 957ec8f5090b25e8e97e61a6390c77c799eb5e696028a5674ca4717473b6d42d
        quote: is not completed automatically when the last buffer completes
    - from: remaining
      to: request
      label: 핸들러가 명시적으로 완료 호출
      label_en: Handler explicitly calls completion
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: They shall complete requests explicitly with completeRequest().
    - from: request
      to: application
      label: 선두 미완료 요청 뒤의 반환은 대기
      label_en: Wait behind an incomplete head request
      evidence:
      - source: journey/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: "if (req->status() == Request::RequestPending)\n\t\t\tbreak;"
    - from: buffer
      to: pending
      label: 'false'
      label_en: 'false'
      evidence:
      - source: journey/buffer-notice
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "false\n * otherwise"
  - id: stop-order
    topic: stopping
    kind: flow
    title: 정지할 때 대기 요청을 처리하는 순서
    question: 정상 정지 경로의 순서를 표시합니다. 연결 해제 알림의 미완료 요청 TODO를 이 정지 보장과 혼동하지 마세요.
    nodes:
    - id: detach
      label: 대기열을 별도로 분리
      label_en: Detach waiting queue
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: waitingRequests.swap(data->waitingRequests_);
    - id: stop
      label: stopDevice()
      label_en: stopDevice()
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: stopDevice(camera);
    - id: cancel
      label: 대기 항목 하나를 cancel 후 doQueueRequest
      label_en: Cancel one waiting item, then doQueueRequest
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "request->_d()->cancel();\n\t\tdoQueueRequest(request);"
    - id: configured
      label: Configured로 복귀
      label_en: Return to Configured
      evidence:
      - source: stopping/stop
        sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
        quote: d->setState(Private::CameraConfigured);
    - id: waiting
      label: waitingRequests에 항목이 남았는가?
      label_en: Does waitingRequests contain an item?
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: while (!waitingRequests.empty())
      shape: decision
    - id: handlerchecks
      label: 핸들러의 두 ASSERT 소스 위치
      label_en: Source locations of the two handler ASSERTs
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "ASSERT(data->queuedRequests_.empty());\n\tASSERT(data->waitingRequests_.empty());"
    - id: sequence
      label: requestSequence_ = 0
      label_en: requestSequence_ = 0
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: data->requestSequence_ = 0;
    - id: handlerreturn
      label: 핸들러의 정상 반환 경계
      label_en: Handler normal-return boundary
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: 'data->requestSequence_ = 0;
  
          }'
    - id: cameraassert
      label: Camera::stop의 ASSERT 소스 위치
      label_en: Source location of Camera::stop ASSERT
      evidence:
      - source: stopping/stop
        sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
        quote: ASSERT(!d->pipe_->hasPendingRequests(this));
    edges:
    - from: detach
      to: stop
      label: 분리 후 장치 정지
      label_en: Stop device after detaching
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "waitingRequests.swap(data->waitingRequests_);\n\n\t/* Stop the pipeline handler and let the queued requests complete. */\n\tstopDevice(camera);"
    - from: cancel
      to: waiting
      label: 다음 대기 항목 검사
      label_en: Inspect next waiting item
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "request->_d()->cancel();\n\t\tdoQueueRequest(request);\n\t}"
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: while (!waitingRequests.empty())
    - from: stop
      to: waiting
      label: 기기 정지 뒤 대기 큐 확인
      label_en: Inspect waiting queue after device stop
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: while (!waitingRequests.empty())
    - from: waiting
      to: cancel
      label: '예: 각 대기 요청'
      label_en: 'Yes: each waiting request'
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: "request->_d()->cancel();\n\t\tdoQueueRequest(request);"
    - from: waiting
      to: handlerchecks
      label: 비어 있으면 반복 종료
      label_en: 'If empty: leave loop'
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: while (!waitingRequests.empty())
    - from: handlerchecks
      to: sequence
      label: 이어지는 소스 순서
      label_en: Following source order
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: data->requestSequence_ = 0;
    - from: sequence
      to: handlerreturn
      label: 이 정상 경로의 함수 끝
      label_en: End of this normal function path
      evidence:
      - source: stopping/device-stop
        sha256: 108b1bea5a8314ba57213d15c1e3ba01abe2b3f8a9e0e1e1281864b5492c7304
        quote: 'data->requestSequence_ = 0;
  
          }'
    - from: handlerreturn
      to: cameraassert
      label: Blocking 호출이 반환한 뒤
      label_en: After the blocking invocation returns
      evidence:
      - source: stopping/stop
        sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
        quote: '&PipelineHandler::stop, ConnectionTypeBlocking,'
    - from: cameraassert
      to: configured
      label: 이어지는 정상 소스 경로
      label_en: Following normal source path
      evidence:
      - source: stopping/stop
        sha256: 0009c665993b995489738e48affc81643a7159d82b5326e5f182e30fe11e4901
        quote: d->setState(Private::CameraConfigured);
  - id: observed-stop-callback-timing
    topic: observed-callbacks
    kind: flow
    title: 가상 CPU 프로브의 연결별 취소 콜백 표시
    question: 이 공개 가상 CPU 프로브에서 취소 요청의 콜백 표시와 애플리케이션 stop 표시는 어떻게 배치됐습니까? 서로 다른 연결 사이의 순서나 실제 C++ 반환 완료는 측정하지 않았습니다.
    nodes:
    - id: autoqueued
      label: 'Auto·Queued: receiver/main 스레드'
      label_en: 'Auto/Queued: receiver/main thread'
      evidence:
      - source: observed-callbacks/product-callback-run
        sha256: f78e369710f01e2740a79e5b32a9035d66792ac52f51bdbea9050bb5ebafca8c
        quote: "    {\n      \"connection\": \"auto\",\n      \"receiver_affinity\": \"main application thread; Object never moved\",\n      \"callback_thread\": \"receiver/main thread\",\n      \"all_runs_consistent\": true,\n      \"callbacks_per_run\": 8,\n      \"stop_callback_entry_and_near_return_markers_after_stop_return\": true,\n      \"stop_cancelled_markers_between_application_stop_enter_and_return_markers\": false\n    }"
      - source: observed-callbacks/product-callback-run
        sha256: f78e369710f01e2740a79e5b32a9035d66792ac52f51bdbea9050bb5ebafca8c
        quote: "    {\n      \"connection\": \"queued\",\n      \"receiver_affinity\": \"main application thread; Object never moved\",\n      \"callback_thread\": \"receiver/main thread\",\n      \"all_runs_consistent\": true,\n      \"callbacks_per_run\": 8,\n      \"stop_callback_entry_and_near_return_markers_after_stop_return\": true,\n      \"stop_cancelled_markers_between_application_stop_enter_and_return_markers\": false\n    }"
    - id: direct
      label: 'Direct: receiver/main과 다른 스레드'
      label_en: 'Direct: different from receiver/main thread'
      evidence:
      - source: observed-callbacks/product-callback-run
        sha256: f78e369710f01e2740a79e5b32a9035d66792ac52f51bdbea9050bb5ebafca8c
        quote: "    {\n      \"connection\": \"direct\",\n      \"receiver_affinity\": \"main application thread; Object never moved\",\n      \"callback_thread\": \"different thread from the receiver/main thread; no thread-name identification is claimed\",\n      \"all_runs_consistent\": true,\n      \"callbacks_per_run\": 8,\n      \"stop_callback_entry_and_near_return_markers_after_stop_return\": false,\n      \"stop_cancelled_markers_between_application_stop_enter_and_return_markers\": true\n    }"
    - id: after
      label: '취소 콜백 표시: 애플리케이션 stop-return 뒤'
      label_en: 'Cancelled callback markers: after application stop-return'
      evidence:
      - source: observed-callbacks/product-callback-run
        sha256: f78e369710f01e2740a79e5b32a9035d66792ac52f51bdbea9050bb5ebafca8c
        quote: "    {\n      \"connection\": \"queued\",\n      \"receiver_affinity\": \"main application thread; Object never moved\",\n      \"callback_thread\": \"receiver/main thread\",\n      \"all_runs_consistent\": true,\n      \"callbacks_per_run\": 8,\n      \"stop_callback_entry_and_near_return_markers_after_stop_return\": true,\n      \"stop_cancelled_markers_between_application_stop_enter_and_return_markers\": false\n    }"
      - source: observed-callbacks/product-callback-run
        sha256: f78e369710f01e2740a79e5b32a9035d66792ac52f51bdbea9050bb5ebafca8c
        quote: The application emits stop-enter immediately before camera->stop() and stop-return immediately after it.
    - id: between
      label: '취소 콜백 표시: stop 호출 앞뒤의 애플리케이션 표식 사이'
      label_en: 'Cancelled callback markers: between application markers around stop()'
      evidence:
      - source: observed-callbacks/product-callback-run
        sha256: f78e369710f01e2740a79e5b32a9035d66792ac52f51bdbea9050bb5ebafca8c
        quote: "    {\n      \"connection\": \"direct\",\n      \"receiver_affinity\": \"main application thread; Object never moved\",\n      \"callback_thread\": \"different thread from the receiver/main thread; no thread-name identification is claimed\",\n      \"all_runs_consistent\": true,\n      \"callbacks_per_run\": 8,\n      \"stop_callback_entry_and_near_return_markers_after_stop_return\": false,\n      \"stop_cancelled_markers_between_application_stop_enter_and_return_markers\": true\n    }"
      - source: observed-callbacks/product-callback-run
