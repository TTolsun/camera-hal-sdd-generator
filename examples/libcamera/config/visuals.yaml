      ASSERT에실패하지않는고정상수인자검사를새오류경로로확대하지마세요. 원문인용은정확히보존하고설명은메서드이름과주체를단어로써서가짜포인터점접근을만들지마세요.
      한영조건·반환·must/may·카운터갱신·오류우선순위가같아야합니다. 영어는120자이하의완전한짧은문장으로끝내고같은한국어는같은영어만사용하세요.
      모든quote_ids는노드·간선양끝symbol을실제인용에포함해야합니다. 연결된하나의그림을만들되설명참조를가짜CFG분기로만들지마세요. 고정 소스만
      근거로 새 한영 그림을 생성하세요. 모든노드·간선quote_ids는실제양끝symbol의구절을포함해야합니다. 한영의부정·조건·must/may·반환·정상복귀·카운터·소유권이같아야합니다.
      영어는120자이하의완전한짧은문장으로끝내고같은한국어는같은영어만사용하세요. 설명의할당·증감은대입기호대신단어로쓰세요. 예: sequence_에현재requestSequence_값을저장한뒤카운터를증가시킵니다.
      소스guard에있는식외에는라벨에<>=!비교·대입기호를쓰지말고원문은근거인용에보존하세요. ASSERT활성실패는중단하며통과하거나코드에없을때에만후속진행입니다.
      NDEBUG를그냥어디서든정의하면없어진다고일반화하지마세요. 다른함수호출뒤의정상복귀전제를지키고주석을가짜실행분기로만들지마세요. 최대12노드안에서조건과종료를숨겨통과시키지마세요.'
