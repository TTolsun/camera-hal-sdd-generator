        quote: ret = dewarper_->configure(ispCfg, { cfg }, data->dewarpParams_);
  - id: dewarp-input-branches
    topic: parameters
    kind: decision
    title: 보정 파라미터의 기본값과 입력 오류
    question: 입력이 없는 경우와 일부만 잘못 제공한 경우를 구분하세요. 성공 반환만으로 보정값이 저장됐다고 판단하면 안 됩니다.
    nodes:
    - id: empty
      label: cm·coefficients·cmNew가 모두 없는가?
      label_en: Are cm, coefficients and cmNew all absent?
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: if (!cm && !coefficients && !cmNew)
      shape: decision
    - id: default
      label: 0 반환, optional은 비어 있음
      label_en: Return 0 with empty optional
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: dewarpParams.reset();
    - id: valid
      label: 필수 행렬·계수가 유효한가?
      label_en: Required matrix and coefficients valid?
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: auto matrix = cm.get<Matrix<double, 3, 3>>();
      shape: decision
    - id: error
      label: -EINVAL 반환
      label_en: Return -EINVAL
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: Dewarp parameters are missing 'cm' value
    - id: store
      label: cmNew 기본값 적용 후 저장
      label_en: Apply cmNew default and store
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: dp.cmNew = dp.cm;
    edges:
    - from: empty
      to: default
      label: '예: 별도 보정값 없음'
      label_en: 'Yes: no explicit parameters'
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: "if (!cm && !coefficients && !cmNew)\n\t\treturn 0;"
    - from: empty
      to: valid
      label: '아니오: 필수 입력 검사'
      label_en: 'No: validate required input'
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: if (!cm) {
    - from: valid
      to: error
      label: 필수 입력 누락·잘못된 형식
      label_en: Missing or malformed required input
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: if (!coefficients) {
    - from: valid
      to: store
      label: 유효, cmNew가 있으면 별도 검증
      label_en: Valid; also validate cmNew when provided
      evidence:
      - source: parameters/parameters
        sha256: 5e4f1317cd9611173e6e5b1fa350ab26f28500656037c812909008604ebfb091
        quote: dewarpParams = dp;
