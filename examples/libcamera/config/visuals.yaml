  - id: handler-device-ownership
    topic: responsibility
    kind: ownership
    title: 핸들러 생성과 장치 획득·반납의 책임
    question: 팩토리 생성·참조 수명과 match 계약은 어떻게 이어지며, acquireMediaDevice로 확보한 장치는 어디에 보관하고 핸들러 소멸 시 어떻게 해제합니까? acquire·release의 잠금 조건은 별도 그림에서 확인하세요.
    prompt: 노드 레이블에 PipelineHandlerFactoryBase::create()와 acquireMediaDevice()를 실제 이름으로 쓰고 이 팩토리 함수 같은 대명사로 대체하지 마세요. acquireMediaDevice가 장치를 mediaDevices_에 보관하고 핸들러 소멸자가 MediaDevice::release()로 해제함을 구분하세요. match의 생성·등록·해제는 구현 의무입니다. 카메라 매니저의 match 호출과 참 반환 뒤 새 인스턴스가 생성된다는 계약을 구분하고, 다음 인스턴스의 생성 주체는 확정하지 마세요. match가 acquireMediaDevice를 반드시 호출한다고 그리지 마세요. 핸들러의 장치 보관·소유 관계로 헬퍼와 소멸자 해제를 연결하되, 실패한 match 뒤의 파괴 시각은 확정하지 마세요. 함수들을 하나의 실제 실행 순서로 직렬 연결하지 마세요. 잠금 분기는 이 그림에 넣지 마세요.
    generation: llm
    sources: [handler, acquisition]
    max_nodes: 8
  - id: acquire-release-locks
    topic: responsibility
    kind: flow
    title: 획득·반납의 잠금 조건과 해제 순서
    question: acquire와 release를 별도 진입 경로로 두고 useCount_ 조건, 실패 반환, releaseDevice·조건부 잠금 해제·감소의 순서를 구분하세요.
    prompt: acquire와 release 사이에 직접 화살표를 만들지 마세요. acquire의 useCount_ == 0에서만 잠그는 조건과 실패 시 false 반환을 보존하세요. 잠금 노드는 mediaDevices_ 전체 반복을 추상화하고 acquireDevice로 진행하는 간선은 전체 반복 완료를 뜻해야 합니다. 한 장치의 !media->lock() 거짓 분기를 전체 반복 완료로 쓰지 마세요. 빈 목록도 반복을 완료하며 useCount_ != 0이면 잠금을 건너뜁니다. release 경로는 releaseDevice(camera) 호출 노드, useCount_ == 1 조건 노드, unlockMediaDevices() 노드, useCount_ 감소 노드를 따로 둡니다. releaseDevice는 무조건 먼저 호출하며 참이면 unlock 뒤 감소하고 거짓이어도 감소합니다. 조건 검사 노드와 감소 노드를 합치지 말고 감소에서 unlock으로 향하는 역순 화살표를 만들지 마세요. 한국어·영어 모두 같은 순서와 조건을 보존하세요.
    generation: llm
    sources: [acquisition]
    max_nodes: 12
