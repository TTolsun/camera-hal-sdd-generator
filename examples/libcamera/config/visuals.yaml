  - id: lsc-build-state-integration
    topic: integration
    kind: ownership
    title: LSC 빌드와 메서드 상태 입력
    question: 빌드 목록의 lsc.cpp와 Lsc 메서드의 IPAContext·IPAFrameContext 입력, 공유 lsc 상태·프레임
      lsc 상태 선언은 어떻게 연결됩니까?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: evidence
    require_connected: true
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
      - pattern: \b(?:frameContexts|FCQueue)\b
        message: This graph covers method-state inputs; the complete queue type remains
          in its adjacent body sentence and must not be reintroduced as a partial declaration.
      required_terms:
      - - ipu3_ipa_algorithms
      - - lsc.cpp
      - - Lsc
      - - activeState
      - - IPAFrameContext
      - - Lsc::queueRequest
    sources:
    - build
    - context
    - lsc-identity
    - lsc-api
    - lsc-queue
    prompt: 질문의 빌드·메서드 입력·lsc 상태 선언 관계만 구성도로 설명합니다. ipu3_ipa_algorithms에 lsc.cpp가 빌드
      입력으로 있고 해당 파일에서 Lsc::queueRequest를 정의한다는 연결을 보여 주세요. 두 파일 사이 간선의 구현 근거에는 lsc-queue에서
      실제 Lsc::queueRequest 함수 정의를 인용하세요. 빌드 포함만으로 요청의 LSC 활성화를 증명하지 않는다고 한영에 명시합니다.
      Lsc::queueRequest가 IPAContext와 IPAFrameContext를 인자로 받으며 실제 상태 전달 두 영어 관계 라벨에도
      이 함수 이름을 명명합니다. IPAContext의 activeState에 속한 IPAActiveState.lsc와 인자 IPAFrameContext.lsc의
      선언을 구별하고 원문의 전체 타입 이름을 임의로 분해하지 마세요. 이 메서드 상태 입력 질문에서 사용하지 않는 frameContexts 큐와
      FCQueue 노드/템플릿 인자 간선은 넣지 않습니다. 큐의 정확한 전체 타입은 바로 앞 본문의 독립적인 한 문장에 이미 온전하게 있어 본문을
      유지합니다. 그 간단한 타입 선언을 불완전하게 다시 그려 혼동시키지 말고 이 그림은 복잡한 빌드/메서드 입력/상태 책임의 연결에 집중합니다.
      프레임 생성·큐에서 함수 인자를 꺼내는 실행·장치 결과는 소스로 증명하지 않으므로 추정하지 않습니다. 실제 인용이 양 끝 심볼과 관계를 뒷받침해야
      하며 한영의 조건과 부정을 같게 쓰세요. 노드 160자/간선96자, 최대12노드에서 완결된 짧은 문장을 사용하고 끝을 자르지 마세요. 이전
      계획에 남아 있던 frameContexts 필수 용어 검사는 제거되었습니다. 그 큐를 IPAContext 라벨에서 다시 언급하지 마세요. IPAContext의
      activeState와 Lsc 메서드의 실제 IPAFrameContext 인자, 두 lsc 상태 선언을 설명하며 큐 타입 설명 본문은 그대로
      유지합니다.
    required_symbols:
    - ipu3_ipa_algorithms
    - Lsc
    - IPAContext
    - IPAActiveState
    - IPAFrameContext
    answer_contract:
      basis: description
      required_terms:
      - - ipu3_ipa_algorithms
      - - lsc.cpp
      - - Lsc
      - - activeState
      - - IPAFrameContext
      reject_patterns:
      - pattern: \b(?:frameContexts|FCQueue)\b
        message: This graph covers method-state inputs; the complete queue type remains
          in its adjacent body sentence and must not be reintroduced as a partial declaration.
