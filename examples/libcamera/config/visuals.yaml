    prompt: 'call함수자체의송신·대기·정리CFG입니다. 첫실제문장은callData_.insert로cookie를key,{response,false}를value로삽입시도하는노드입니다.
      다음실제문장은const auto &iter=result.first로반복자를선택하는별도직렬노드이며result.second를검사하지않고기존cookie일때iter가기존entry를가리킬수있음을한영모두이노드의설명에넣으세요.
      영어예: Use result.first as iter; do not test result.second. An existing cookie can
      make iter reference an existing entry. 이두노드뒤send로연결하며기존쿠키설명을실행분기나검사로만들지마세요. send
      ret비0은erase(iter)후그ret반환. 0이면2000ms타이머시작후while !done→타이머끝났으면erase후-ETIMEDOUT,아니면현재스레드processEvents후done조건반복.
      done이면erase후0반환. 수신은다른함수그림이며전달을보장하지않습니다. 고정 소스만 근거로 새 한영 그림을 만드세요. 모든 노드·간선 quote_ids에는
      실제 양 끝 symbol이 포함된 구절이 있어야 합니다. 한영의 선행조건·부정·must/may·카운터·소유권·정상복귀가 같아야 합니다. 영어는120자이하의완전한짧은문장으로끝내고동일한국어라벨은동일영어로만번역하세요.
      설명에잘못된포인터점접근을만들지말고메서드이름과주체를단어로쓰되원문인용은그대로보존하세요. ASSERT실패중단이나컴파일제외를말할때는제공된매크로계약을근거로쓰고NDEBUG정의시점을일반화하지마세요.
      최대12노드내에조건·예외·종료를보존하고실패시기존원고를바꾸지마세요.'
