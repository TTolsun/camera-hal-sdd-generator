    prompt: 앞 센서와 ISP 구성이 성공하고 cfg가 메인 경로인 구간을 그리세요. 앞선 코드가 canUseDewarper_와 isRaw_로
      usesDewarper_를 이미 설정했습니다. 이 정의는 전제로 설명하세요. 현재 구간은 ispCfg에 cfg를 복사하고 기존 usesDewarper_
      값을 검사합니다. 이 검사 노드를 새 값 대입처럼 그리지 마세요. 사용하지 않으면 복사본을 mainPath.configure에 그대로 전달합니다.
      사용하면 복사본에 최소 버퍼 수, format.size와 다시 계산한 stride를 설정하고 dewarper.configure에 ispCfg,
      {cfg}, 현재 카메라의 dewarpParams_를 전달합니다. 비0 ret는 그대로 반환합니다. 성공하면 setTransform에 combinedTransform을
      전달하고 cfg.size의 로컬 복사본을 만듭니다. dewarper를 쓰면서 combinedTransform에 Transpose 비트가 있으면
      로컬 size를 한 번 전치합니다. sensorCrop의 크기를 로컬 size의 종횡비에 맞게 제한하고 sensorCrop.center()에
