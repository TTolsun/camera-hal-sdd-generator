    - id: contract
      label: completeRequest는 요청을 제출 순서로 애플리케이션에 반환하며, 완료된 요청에 대한 호출 순서에는 제약이 없습니다.
      label_en: completeRequest returns requests to the application in submission order;
        calls on complete requests have no ordering constraint.
      shape: box
      evidence:
      - source: cancellation/ordered-completion
        sha256: b250ffb8ca77d7fd55df385a63f73ffa5b5fba5bbff4c79f5bd5edd8278fb6ee
        quote: "\\brief Signal request completion\n * \\param[in] request The request\
          \ that has completed\n *\n * The pipeline handler shall call this function\
          \ to notify the \\a camera that\n * the request has completed. The request\
          \ is no longer managed by the pipeline\n * handler and shall not be accessed\
          \ once this function returns.\n *\n * This function ensures that requests\
          \ will be returned to the application in\n * submission order, the pipeline\
          \ handler may call it on any complete request\n * without any ordering constraint.\n\
          \ *\n * \\context This function shall be called from the CameraManager thread.\n\
          \ */\nvoid PipelineHandler::completeRequest(Request *request)\n{\n\tCamera\
          \ *camera = request->_d()->camera();\n\n\trequest->_d()->complete();\n\n\t\
          Camera::Private *data = camera->_d();\n\n\twhile (!data->queuedRequests_.empty())\
          \ {\n\t\tRequest *req = data->queuedRequests_.front();\n\t\tif (req->status()\
          \ == Request::RequestPending)\n\t\t\tbreak;\n\n\t\tASSERT(!req->hasPendingBuffers());\n\
          \t\tdata->queuedRequests_.pop_front();\n\t\tcamera->requestComplete(req);\n\
          \t}\n\n\t/* Allow any waiting requests to be queued to the pipeline. */\n\t\
          doQueueRequests(camera);\n}"
