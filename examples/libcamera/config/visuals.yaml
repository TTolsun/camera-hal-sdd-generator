    sources:
    - device
    prompt: 정확한 구현 if(ret)는 음수에만 한정하지 않고 0이 아닌 모든 값입니다. queuedRequests_.push_back, sequence_
      부여, cancelled_ 검사, 취소된 경우 completeRequest 후 즉시 return, 그렇지 않을 때만 queueRequestDevice
      호출, ret 참일 때 cancelRequest 호출, 거짓일 때의 종료를 보존하세요. completeRequest/cancelRequest
      뒤에 공급하지 않은 앱 알림을 추가하지 마세요.  다른 질문의 일반 구조도를 반복하거나 소스에 없는 실행·인과 관계를 만들지 마세요. 구조와
