    - from: pending
      to: application
      label: 대기 상태를 벗어난 선두 요청을 반환합니다.
      label_en: Return the non-pending head request.
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
