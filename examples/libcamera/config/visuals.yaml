      evidence:
      - source: benefits/queue-code
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: while (!data->waitingRequests_.empty())
    - from: limit
      to: end
      label: '예: break'
      label_en: 'Yes: break'
      evidence:
      - source: benefits/queue-code
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "if (data->queuedRequests_.size() == maxQueuedRequestsDevice_)\n\t\t\tbreak;"
    - from: limit
      to: ready
      label: '아니요: 선두 확인'
      label_en: 'No: inspect front'
      evidence:
      - source: benefits/queue-code
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: Request *request = data->waitingRequests_.front();
    - from: ready
      to: end
      label: '아니요: break'
      label_en: 'No: break'
      evidence:
      - source: benefits/queue-code
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "if (!request->_d()->prepared_)\n\t\t\tbreak;"
    - from: ready
      to: forward
      label: 예
      label_en: 'Yes'
      evidence:
      - source: benefits/queue-code
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "data->waitingRequests_.pop();\n\t\tdoQueueRequest(request);"
    - from: forward
      to: waiting
      label: 반복 조건 재검사
      label_en: Recheck loop condition
      evidence:
      - source: benefits/queue-code
        sha256: 5a7a3397a6034a73fe348ae44eb1e2568d2823e95542fe43386e16359d627180
        quote: "doQueueRequest(request);\n\t}"
  - id: vendor-buffer-and-request-completion
    topic: benefits
    kind: flow
    title: 버퍼 완료와 명시적 요청 완료의 경계
    question: 마지막 버퍼가 끝났을 때 completeBuffer의 반환과 핸들러의 요청 완료 의무는 어떻게 구분됩니까?
    nodes:
    - id: call
      label: CameraManager 스레드에서 completeBuffer
      label_en: completeBuffer in CameraManager thread
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: This function shall be called from the CameraManager thread.
    - id: all
      label: 모든 버퍼가 완료됐는가?
      label_en: Have all buffers completed?
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "True if all buffers contained in the request have completed, false\n * otherwise"
      shape: decision
    - id: 'false'
      label: 'false: 남은 버퍼가 있음'
      label_en: 'false: buffers remain'
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "True if all buffers contained in the request have completed, false\n * otherwise"
    - id: 'true'
      label: 'true: 마지막 버퍼 완료, 요청 자동 완료 아님'
      label_en: 'true: last buffer completed, request not automatically completed'
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: is not completed automatically when the last buffer completes
    - id: explicit
      label: 핸들러가 completeRequest를 명시적으로 호출
      label_en: Handler explicitly calls completeRequest
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: They shall complete requests explicitly with completeRequest().
    edges:
    - from: call
      to: all
      label: 버퍼 완료 통지·내부 추적 갱신
      label_en: Notify buffer completion and update tracking
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "It notifies applications of buffer\n * completion and updates the request's internal buffer tracking."
    - from: all
      to: 'false'
      label: 아니요
      label_en: 'No'
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "false\n * otherwise"
    - from: all
      to: 'true'
      label: 예
      label_en: 'Yes'
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: True if all buffers contained in the request have completed
    - from: 'true'
      to: explicit
      label: 필요한 작업이 있다면 그 작업 기회 후
      label_en: After an opportunity for any remaining required work
      evidence:
      - source: benefits/last-buffer-contract
        sha256: 096784b4798b3156e88e3acf84577f60a27f0bf0e2422ae7850e44b081eb9d3a
        quote: "The request\n * is not completed automatically when the last buffer completes to give\n * pipeline handlers a chance to perform any operation that may still be\n * needed. They shall complete requests explicitly with completeRequest()."
