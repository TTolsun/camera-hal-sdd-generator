    kind: flow
    title: 두 탐색의 중첩 구조와 별도 높이 차감식
    question: 두 탐색에서 바깥·안쪽 반복 변수가 각각 어디서 감소하며, 두 번째 탐색 전의 재초기화와 unsigned 높이 차감 식은 어떻게 구분됩니까?
    prompt: 실행 호출 순서를 추정하지 말고 중첩 구조와 식의 관계를 그리세요. 첫 탐색의 바깥 폭·안쪽 높이와 두 번째 탐색의 바깥 높이·안쪽 폭을 포함 관계 간선으로 구분하고 각 변수의 조건·감소 위치를 표시하세요. 두 값은 첫 탐색이 모두 끝난 뒤 두 번째 탐색 전에만 재초기화됩니다. 안쪽 감소에서 즉시 재초기화로 이어지는 실행 화살표를 만들지 마세요. calculateBDSHeight의 iif.height 차감식은 별도 계산 관계이며 calculateBDS에서 호출된다는 간선을 만들지 마세요. 소스에 없는 재초기화·입력 가드·실행 안전 보장은 추가하지 마세요. 높이 계산 노드의 한국어는 입력 포매터의 최소 높이, 영어는 minimum input formatter height로 풀어 쓰고 IF height 약어는 쓰지 마세요. 첫 탐색의 폭·높이 중첩 반복 전체가 종료된 뒤 두 번째 탐색 전의 두 변수 재초기화로 향하는 순서 간선을 반드시 표시하세요. 간선에는 첫 탐색 전체 종료 조건을 한국어와 영어로 명시하세요. 안쪽 높이 감소가 곧 전체 탐색 종료인 것처럼 연결하지 마세요.
