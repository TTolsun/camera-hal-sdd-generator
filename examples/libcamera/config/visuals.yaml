      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: "data->queuedRequests_.pop_front();\n\t\tcamera->requestComplete(req);"
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: while (!data->queuedRequests_.empty()) {
    - from: dispatch
      to: access-ends
      label: completeRequest()가 반환하면 적용합니다.
      label_en: This applies when completeRequest() returns.
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
