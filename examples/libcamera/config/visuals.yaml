  - id: preparation-depth-flow
    topic: preparation-depth
    kind: flow
    title: 준비 대기와 재진입을 좁히기 그림
    question: fence 신호 또는 타임아웃에서 prepared_가 설정된 뒤 선두 준비·큐 한도를 검사하고, 재진입 전 pop하여 전달하는 흐름은 무엇입니까?
    generation: llm
    max_nodes: 9
    prompt: 조건·실패·반환 경계를 지지하는 작은 그림으로 답하세요. 본문 전체를 노드로 옮기지 마세요. 실제 queuedRequests_.size() == maxQueuedRequestsDevice_
      비교만 한도 분기로 표시합니다. true면 break이고 false면 그 동등 조건으로는 중단하지 않습니다. false를 size < max 또는 미만이라고 바꾸지 마세요. 크기가 한도를
      넘는 상태를 이 비교가 막는다고 보장하지 말고 불변조건 별도 검증과 구분하세요.
      timeout()은 notifiers_가 비어 있지 않음을 단언하고 항목을 지운 뒤 cancel()과 emitPrepareCompleted()를 호출합니다.
      한영 레이블에는 처리되지 않은 notifier가 남았다고 쓰세요. 실제 fence 신호 상태를 조회하거나 미신호임을 확정한다고 쓰지 마세요.
      큐 크기는 Camera::Private::queuedRequests_에 등록된 소프트웨어 요청의 수입니다. 한영 모두 이 식별자를 사용하세요.
      doQueueRequest는 이 소프트웨어 큐에 먼저 등록합니다. 이미 취소된 요청은 completeRequest 후 반환하여 queueRequestDevice를 건너뜁니다.
      그 외에는 queueRequestDevice로 실제 장치 제출을 시도합니다. 등록을 장치 제출로 표현하지 마세요.
    sources:
    - dispatch
    - prepare
    - completion
    whole_sources:
    - dispatch
    - prepare
    - completion
