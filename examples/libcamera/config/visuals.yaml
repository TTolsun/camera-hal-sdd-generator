  - id: pre-qbuf-failure-flow
    topic: uvc-depth
    kind: flow
    generation: llm
    max_nodes: 9
    max_label_chars: 240
    max_edge_label_chars: 240
    title: QBUF 호출 전 실패와 cache 반환
    question: cache 인덱스 확보와 공통 plane 검증의 실패는 ioctl·cache 반환·공통 취소에서 어떻게 갈립니까?
    prompt: cache_가 존재하고 Stopping이 아닌 queueBuffer 진입에서 QBUF 이전 두 오류를 비교합니다. 9개 고정 심볼은 함수·검증·호출자 반환 역할입니다. queueBuffer
      진입→get을 연결하고 get의 음수 반환은 queueBuffer 진입으로 되돌리지 말고 UVC queueRequestDevice의 원래 ret 전달→doQueueRequest의 비0
      검사→cancelRequest로 이어집니다. get 성공은 planes와 isContiguous 공통 검사로 진행하고 실패하면 scope_exit의 put→UVC 원래 ret 전달→doQueueRequest→cancelRequest로
      이어집니다. put 오류 경로를 고립된 노드로 남기지 마세요. 검증 성공만 VIDIOC_QBUF 진입으로 연결하며 ioctl 이후 상세는 별도 본문 범위입니다. get 실패는 아직 guard·예약
      index가 없고 plane 실패는 확보 index를 put합니다. 두 오류에서 이번 버퍼의 신규 queuedBuffers_ 등록은 없으며 다른 요청까지 큐가 비었다고 그리지 마세요.
      제어 처리는 선행하지만 모두 적용됐다는 보장이나 롤백은 없습니다. 오류 반환을 함수 진입으로 되돌리는 순환이나 복구 화살표를 만들지 마세요. 실제 주입 실행 결과가 아닌 소스의 정적 분기이며
      한영 같은 ret·정리·취소 경계를 유지합니다.
    sources:
    - cache-get
    - cache-put
    - qbuf
    - submit
    - controls
    - dispatch
    - complete
    - scope-exit
    whole_sources:
    - cache-get
    - cache-put
    - qbuf
    - submit
    - controls
    - dispatch
    - complete
    - scope-exit
    required_symbols:
    - queueBuffer
    - get
    - planes
    - isContiguous
    - put
    - VIDIOC_QBUF
    - queueRequestDevice
    - doQueueRequest
    - cancelRequest
    require_connected: true
