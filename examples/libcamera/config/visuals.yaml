  - id: handler-configuration-contracts
    topic: configuration
    kind: ownership
    title: 설정 인터페이스별 입력과 결과
    question: generateConfiguration과 configure의 입력·반환 및 성공 시 Stream 연결 의무는 무엇입니까?
    generation: llm
    max_nodes: 12
    max_label_chars: 160
    max_edge_label_chars: 96
    while_conditions: true
    condition_display: inline
    require_connected: true
    answer_contract_en:
      basis: description
      reject_patterns:
      - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f가-힣]'
        message: English labels must not contain control characters or untranslated
          Korean.
      - pattern: (?m)^[^\n]*[^\s.!?\]][ \t\u00a0]*$
        message: English labels must be complete short sentences; source guard suffixes
          are retained separately.
      required_terms:
      - - selected streams
        - chosen streams
      - - default parameters
      - - non-null
        - not null
    sources:
    - generate-api
    - configure-api
    prompt: 두 PipelineHandler API의 입력·결과 계약 관계도입니다. generateConfiguration은 camera 및
      caller가 기본 구성을 원하는 use cases의 roles를 받고, 이를 만족할 수 없으면 null을 반환합니다. non-null CameraConfiguration을
      반환했을 때만 caller가 selected streams와 default parameters를 inspect할 수 있다는 조건을 inspection
      노드와 관계 라벨의 한영에 명시하세요. 반환 객체를 configure에 자동 전달하는 실행 흐름은 아닙니다. configure 입력은 이미
      검증되었고 구현은 must not perform further validation이어야 합니다. 성공에는 각 StreamConfiguration에
      setStream으로 Stream 연결 및 0 반환, 실패에는 음수 반환이라는 구현 계약을 표시합니다. 실패가 반드시 setStream 이후에만
      가능하다고 연결하지 마세요. 최대12노드입니다. 고정 소스만 근거로 노드와 간선을 만들고 각 인용은 실제 양 끝 심볼을 포함해야 합니다. 한영의
      조건·부정·정상복귀·필수/가능 의미를 일치시키세요. 라벨은 단일 행이고 완결된 짧은 문장이며 설명에 새 비교·대입 기호를 넣지 않습니다. 원문
      guard는 condition_ref와 접근 가능한 인용으로 보존합니다. 노드 160자, 간선 96자 상한에서 조건이 길면 적절한 노드로 나누고
      문장을 자르거나 제어 문자를 넣지 마세요. 이 검사의 성공은 별도 근거 검토나 사람 승인이 아닙니다.
    whole_sources:
    - generate-api
    - configure-api
    required_symbols:
    - generateConfiguration
    - configure
    - setStream
  - id: device-queue-and-completion
    topic: request
    kind: flow
    title: 장치 큐잉과 버퍼·요청 완료의 책임
    question: 누가 요청의 파라미터를 장치에 적용하고 버퍼와 요청을 각각 완료합니까?
