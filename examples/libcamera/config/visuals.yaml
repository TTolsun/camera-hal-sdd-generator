      - source: cancellation/logging
        sha256: 52e64d292f59786541e66fe48f5bae65256bdced60c803aa76bf3637083b47b0
        quote: "\\def LOG(category, severity)\n * \\hideinitializer\n * \\brief Log\
          \ a message\n * \\param[in] category Category (optional)\n * \\param[in] severity\
          \ Severity\n *\n * Return an std::ostream reference to which a message can\
          \ be logged using the\n * iostream API. The \\a category, if specified, sets\
          \ the message category. When\n * absent the default category is used. The\
          \  \\a severity controls whether the\n * message is printed or discarded,\
          \ depending on the log level for the category.\n *\n * If the severity is\
          \ set to Fatal, execution is aborted and the program\n * terminates immediately\
          \ after printing the message.\n *\n * \\warning Logging from the destructor\
          \ of a global object, either directly or\n * indirectly, results in undefined\
          \ behaviour.\n *\n * \\todo Allow logging from destructors of global objects\
          \ to the largest\n * possible extent\n */\n\n/**\n * \\def ASSERT(condition)\n\
          \ * \\hideinitializer\n * \\brief Abort program execution if assertion fails\n\
          \ *\n * If \\a condition is false, ASSERT() logs an error message with the\
          \ Fatal log\n * level and aborts program execution.\n *\n * If the macro NDEBUG\
          \ is defined before including log.h, ASSERT() generates no\n * code.\n *\n\
          \ * Using conditions that have side effects with ASSERT() is not recommended,\
          \ as\n * these effects would depend on whether NDEBUG is defined or not. Similarly,\n\
          \ * ASSERT() should not be used to check for errors that can occur under normal\n\
          \ * conditions as those checks would then be removed when compiling with NDEBUG.\n\
          \ */\n\n} /* namespace libcamera */"
    - id: reset
