      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: "This function ensures that requests will be returned to the application\
          \ in\n * submission order, the pipeline handler may call it on any complete\
          \ request\n * without any ordering constraint."
    - id: access-ends
      label: 반환 뒤에는 completeRequest()에 전달한 요청에 접근할 수 없습니다.
      label_en: After return, the handler must no longer access the request passed to
        completeRequest().
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: "The request is no longer managed by the pipeline\n * handler and shall\
          \ not be accessed once this function returns."
    - id: head
      label: 완료 순서 큐에 선두 요청이 있습니까?
      label_en: Is there a request at the queue head?
      shape: decision
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: while (!data->queuedRequests_.empty()) {
    - id: pending
      label: 선두 요청의 상태가 RequestPending입니까?
      label_en: Is the head request still RequestPending?
      shape: decision
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: "if (req->status() == Request::RequestPending)\n\t\t\tbreak;"
    - id: dispatch
      label: 반환 순회를 끝내고 doQueueRequests(camera)를 호출합니다.
      label_en: End the return loop and call doQueueRequests(camera).
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: doQueueRequests(camera);
    edges:
    - from: buffer
      to: remaining
      label: 버퍼 완료 알림
      label_en: Notify buffer completion
      evidence:
      - source: completion/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: camera->bufferCompleted.emit(request, buffer);
    - from: remaining
      to: request
      label: 모든 버퍼 완료 → 필요한 작업이 있으면 수행 후 핸들러가 명시적으로 호출
      label_en: All buffers complete → handler performs any remaining work if needed,
        then explicitly calls
      evidence:
      - source: completion/completion
        sha256: 514288cc958de9ff5fd19d46393cec3bb3088f4f08486528d4559071138638c9
        quote: "is not completed automatically when the last buffer completes to give\n\
          \ * pipeline handlers a chance to perform any operation that may still be\n\
          \ * needed. They shall complete requests explicitly with completeRequest()."
    - from: request
      to: head
      label: 상태 갱신 뒤 큐를 확인합니다.
      label_en: Check the queue after the status update.
      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: request->_d()->complete();
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: while (!data->queuedRequests_.empty()) {
    - from: head
      to: pending
