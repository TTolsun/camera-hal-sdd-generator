        sha256: eda58d39ca207e5943afd21f4d2439316a5afdb0d3d19c7a40800658db295899
        quote: "int Camera::Private::isAccessAllowed(State state, bool allowDisconnected,\n\
          \t\t\t\t     const char *from) const\n{\n\tif (!allowDisconnected && disconnected_)\n\
          \t\treturn -ENODEV;\n\n\tState currentState = state_.load(std::memory_order_acquire);\n\
          \tif (currentState == state)\n\t\treturn 0;\n\n\tASSERT(static_cast<unsigned\
          \ int>(state) < std::size(camera_state_names));\n\n\tLOG(Camera, Error) <<\
          \ \"Camera in \" << camera_state_names[currentState]\n\t\t\t   << \" state\
          \ trying \" << from << \"() requiring state \"\n\t\t\t   << camera_state_names[state];\n\
          \n\treturn -EACCES;\n}"
