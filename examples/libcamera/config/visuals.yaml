    edges:
    - from: invoke
      to: zero
      label: 호출 뒤 반환
      label_en: Return after invoking
      evidence:
      - source: request/queue-code
        sha256: b375a7828af46db11a4e6308cc634ebb265619e76e9f173907d16d9009fe2c51
        quote: "ConnectionTypeQueued, request);\n\n\treturn 0;"
    - from: queued
      to: complete
      label: API의 완료 알림 계약
      label_en: API completion-notification contract
      evidence:
      - source: request/queue
        sha256: 96db61baeb32065c966b20942f97518ddbd3a43b36b64e8083eb29a90ecb7f4b
        quote: "Once the request has been queued, the camera will notify its completion\n * through the \\ref requestCompleted signal."
  - id: timeout-fence-recovery
    topic: lifetime
    kind: flow
    title: 타임아웃 뒤 펜스 회수
    question: 신호되지 않은 펜스로 타임아웃이 나면 다른 요청에 재사용하기 전에 무엇을 해야 합니까?
    nodes:
    - id: timeout
      label: '펜스 미신호: 요청 타임아웃'
      label_en: 'Unsignalled fence: request times out'
      evidence:
      - source: lifetime/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: isn't signalled
    - id: retained
      label: 버퍼에 펜스가 남음
      label_en: Buffer still contains its fence
      evidence:
      - source: lifetime/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: The buffer will still contain the fence
    - id: retrieve
      label: 애플리케이션이 releaseFence()로 회수
      label_en: Application retrieves with releaseFence()
      evidence:
      - source: lifetime/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: applications must retrieve with FrameBuffer::releaseFence()
    - id: reuse
      label: 그 뒤 다른 요청에서 버퍼 재사용
      label_en: Then reuse the buffer in another request
      evidence:
      - source: lifetime/fence-expiry
        sha256: ebb24de716cdebb7c0c82cfddf05e91d7d2fb938eda24fe5027d3e9efcf62104
        quote: can be reused in another request.
    edges:
