          upstream by device vendors. IPA modules included in libcamera are covered
          by a

          free software license, however third-parties may develop IPA modules outside
          of

          libcamera and distribute them under a closed-source license, provided they
          do

          not include source code from the libcamera project.'
    - from: vendors
      to: handlers
      label: 장치 제조사는 Handlers를 upstream에 기여해야 합니다.
      label_en: Device vendors must contribute Handlers upstream.
      evidence:
      - source: boundaries/licensing
        sha256: ef0482e955d8c625e622517f8a1bd58e9fcc321770a02c19aa241cdc485bb623
        quote: 'Handlers are a part of the libcamera code base and need to be contributed

          upstream by device vendors. IPA modules included in libcamera are covered
          by a

          free software license, however third-parties may develop IPA modules outside
          of

          libcamera and distribute them under a closed-source license, provided they
          do

          not include source code from the libcamera project.'
    - from: handlers
      to: pipeline
      label: 장치별 Handlers는 Pipeline Handler 기본 클래스를 상속합니다.
      label_en: Device-specific Handlers derive from the Pipeline Handler base class.
      evidence:
      - source: boundaries/handler
        sha256: 868d392c7f94391d196168c05db330a1f07da72687d94f7b5a6ffaf1d6dee988
        quote: "Hardware abstraction is handled by device specific Pipeline Handlers\
          \ which are\n  derived from the Pipeline Handler base class allowing commonality\
          \ to be shared\n  among the implementations."
    - from: algorithms
      to: modules
      label: IPA 알고리즘은 IPA Modules라는 외부 플러그인으로 로드됩니다.
      label_en: IPA algorithms are loaded as external plugins named IPA Modules.
      evidence:
      - source: boundaries/ipa
        sha256: f0858f8576140aaf8b57ac5d757e8be0910218fb68d85b4704fe9275e2683a28
        quote: "IPAs are loaded as external plugins named IPA Modules. IPA Modules can\
          \ be\n  part of the libcamera code base or provided externally by camera vendors.\n\
          \  In-tree IPA modules are covered by the same license as the rest of libcamera,\n\
          \  external IPA modules can be open-source or closed-source."
    - from: third
      to: modules
      label: third parties는 외부 IPA Modules를 개발하고 배포할 수 있습니다.
      label_en: Third parties may develop and distribute external IPA Modules.
      evidence:
      - source: boundaries/licensing
        sha256: ef0482e955d8c625e622517f8a1bd58e9fcc321770a02c19aa241cdc485bb623
        quote: 'Handlers are a part of the libcamera code base and need to be contributed

          upstream by device vendors. IPA modules included in libcamera are covered
          by a

          free software license, however third-parties may develop IPA modules outside
          of

          libcamera and distribute them under a closed-source license, provided they
          do

          not include source code from the libcamera project.'
    - from: modules
      to: pipeline
      label: IPA Modules는 Pipeline Handler API로만 libcamera와 상호작용하며 kernel camera devices에
        직접 접근할 수 없습니다.
      label_en: IPA Modules use only the Pipeline Handler API to interact with libcamera
        and cannot directly access kernel camera devices.
      evidence:
      - source: boundaries/ipa-access
        sha256: d877bb3fd4bb3023c4b18924fc81b0d964997c3ddf7263ba68b4c05d91f883c9
        quote: "IPA Modules built with libcamera are run in the same process space as\
          \ the\n  library. External IPA Modules are run in a separate sandboxed process.\
          \ In\n  either case, they can only interact with libcamera through the API\
          \ provided\n  by the Pipeline Handler. They have a restricted view of the\
          \ system, with no\n  direct access to kernel camera devices, no access to\
          \ networking APIs, and\n  limited access to file systems. All their accesses\
          \ to image and metadata are\n  mediated by dmabuf instances explicitly passed\
          \ by the Pipeline Handler to the\n  IPA Module."
      - source: boundaries/ipa
        sha256: f0858f8576140aaf8b57ac5d757e8be0910218fb68d85b4704fe9275e2683a28
        quote: "IPAs are loaded as external plugins named IPA Modules. IPA Modules can\
          \ be\n  part of the libcamera code base or provided externally by camera vendors.\n\
          \  In-tree IPA modules are covered by the same license as the rest of libcamera,\n\
          \  external IPA modules can be open-source or closed-source."
  - id: item-inputs
    topic: inputs
    kind: ownership
    title: 커널 입력과 카메라 제어 책임
    question: 커널 인터페이스, Camera Manager, Pipeline Handler와 애플리케이션은 어떻게 관계를 맺으며 한 번에 누가
      카메라를 제어할 수 있습니까?
    condition_display: evidence
    nodes:
    - id: kernel
      label: Linux kernel의 drivers가 카메라 하드웨어를 제어합니다.
      label_en: Linux kernel drivers control the camera hardware.
      shape: box
      evidence:
      - source: inputs/kernel
        sha256: 33d991f6b824d355da564d0c328fb633374964b7dfee2b8e68b450cb29a80efa
        quote: "* The kernel drivers control the camera hardware and expose a\n  low-level\
          \ interface to userspace through the Linux kernel V4L2\n  family of APIs (Media\
          \ Controller API, V4L2 Video Device API and\n  V4L2 Subdev API)."
    - id: interface
      label: 저수준 interface는 Linux 커널의 V4L2 API 계열을 사용합니다.
      label_en: The low-level interface uses the Linux kernel V4L2 family of APIs.
      shape: box
      evidence:
      - source: inputs/kernel
        sha256: 33d991f6b824d355da564d0c328fb633374964b7dfee2b8e68b450cb29a80efa
        quote: "* The kernel drivers control the camera hardware and expose a\n  low-level\
          \ interface to userspace through the Linux kernel V4L2\n  family of APIs (Media\
          \ Controller API, V4L2 Video Device API and\n  V4L2 Subdev API)."
    - id: userspace
      label: userspace에는 저수준 interface가 노출됩니다.
      label_en: The low-level interface is exposed to userspace.
      shape: box
      evidence:
      - source: inputs/kernel
        sha256: 33d991f6b824d355da564d0c328fb633374964b7dfee2b8e68b450cb29a80efa
        quote: "* The kernel drivers control the camera hardware and expose a\n  low-level\
          \ interface to userspace through the Linux kernel V4L2\n  family of APIs (Media\
          \ Controller API, V4L2 Video Device API and\n  V4L2 Subdev API)."
    - id: manager
      label: Camera Manager는 카메라를 열거하고 Pipeline Handlers를 생성합니다.
      label_en: Camera Manager enumerates cameras and instantiates Pipeline Handlers.
      shape: box
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "The Camera Manager enumerates cameras and instantiates Pipeline Handlers\
          \ to\n  manage each Camera that libcamera supports. The Camera Manager supports\n\
          \  hotplug detection and notification events when supported by the underlying\n\
          \  kernel devices."
    - id: handlers
      label: Pipeline Handlers는 libcamera가 지원하는 각 Camera를 관리합니다.
      label_en: Pipeline Handlers manage each Camera that libcamera supports.
      shape: box
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "The Camera Manager enumerates cameras and instantiates Pipeline Handlers\
          \ to\n  manage each Camera that libcamera supports. The Camera Manager supports\n\
          \  hotplug detection and notification events when supported by the underlying\n\
          \  kernel devices."
    - id: application
      label: 각 application에서는 Camera Manager 인스턴스가 하나만 실행됩니다.
      label_en: Only one Camera Manager instance runs per application.
      shape: box
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "There is only ever one instance of the Camera Manager running per application.\n\
          \  Each application's instance of the Camera Manager ensures that only a single\n\
          \  application can take control of a camera device at once."
    - id: device
      label: 한 번에 하나의 application만 camera device를 제어할 수 있습니다.
      label_en: Only one application can control a camera device at once.
      shape: box
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "There is only ever one instance of the Camera Manager running per application.\n\
          \  Each application's instance of the Camera Manager ensures that only a single\n\
          \  application can take control of a camera device at once."
    edges:
    - from: kernel
      to: interface
      label: kernel drivers가 저수준 interface를 노출합니다.
      label_en: Kernel drivers expose the low-level interface.
      evidence:
      - source: inputs/kernel
        sha256: 33d991f6b824d355da564d0c328fb633374964b7dfee2b8e68b450cb29a80efa
        quote: "* The kernel drivers control the camera hardware and expose a\n  low-level\
          \ interface to userspace through the Linux kernel V4L2\n  family of APIs (Media\
          \ Controller API, V4L2 Video Device API and\n  V4L2 Subdev API)."
    - from: interface
      to: userspace
      label: interface는 Linux 커널 V4L2 API 계열을 통해 userspace에 노출됩니다.
      label_en: The interface is exposed to userspace through Linux V4L2 APIs.
      evidence:
      - source: inputs/kernel
        sha256: 33d991f6b824d355da564d0c328fb633374964b7dfee2b8e68b450cb29a80efa
        quote: "* The kernel drivers control the camera hardware and expose a\n  low-level\
          \ interface to userspace through the Linux kernel V4L2\n  family of APIs (Media\
          \ Controller API, V4L2 Video Device API and\n  V4L2 Subdev API)."
    - from: manager
      to: kernel
      label: 기반 kernel 기기가 지원하면 Camera Manager도 핫플러그 감지와 알림 이벤트를 지원합니다.
      label_en: Camera Manager supports hotplug events when kernel devices do.
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "The Camera Manager enumerates cameras and instantiates Pipeline Handlers\
          \ to\n  manage each Camera that libcamera supports. The Camera Manager supports\n\
          \  hotplug detection and notification events when supported by the underlying\n\
          \  kernel devices."
    - from: manager
      to: handlers
      label: Camera Manager가 Pipeline Handlers를 생성합니다.
      label_en: Camera Manager instantiates Pipeline Handlers.
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "The Camera Manager enumerates cameras and instantiates Pipeline Handlers\
          \ to\n  manage each Camera that libcamera supports. The Camera Manager supports\n\
          \  hotplug detection and notification events when supported by the underlying\n\
          \  kernel devices."
    - from: application
      to: manager
      label: 각 application에서는 Camera Manager 인스턴스가 하나만 실행됩니다.
      label_en: Only one Camera Manager instance runs per application.
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "There is only ever one instance of the Camera Manager running per application.\n\
          \  Each application's instance of the Camera Manager ensures that only a single\n\
          \  application can take control of a camera device at once."
    - from: manager
      to: device
      label: 각 application의 Camera Manager는 한 번에 하나의 application만 camera device를 제어할
        수 있게 보장합니다.
      label_en: Camera Manager ensures only one application controls a device at once.
      evidence:
      - source: inputs/manager
        sha256: bd036b31d192ef7504f07202ebcbc475e23b8b4387bf322ddf529accbbb786a7
        quote: "There is only ever one instance of the Camera Manager running per application.\n\
          \  Each application's instance of the Camera Manager ensures that only a single\n\
          \  application can take control of a camera device at once."
    - from: userspace
      to: handlers
      label: Pipeline Handler는 커널이 Media Controller와 V4L2로 노출한 파이프라인을 관리합니다.
      label_en: Pipeline Handler manages the pipelines exposed through Media Controller
        and V4L2.
      evidence:
      - source: inputs/kernel-handler
        sha256: 868d392c7f94391d196168c05db330a1f07da72687d94f7b5a6ffaf1d6dee988
        quote: "The Pipeline Handler manages the complex pipelines exposed by the kernel\n\
          \  drivers through the Media Controller and V4L2 APIs."
  - id: interfaces-to-upper-layers
