        sha256: d64fa7a71ca69a53433d250a2fd8f59a0beed2578980eee658d8dfb44a7513ee
        quote: "The API exposes full control of the device to upper layers of libcamera\
          \ through\n  the public API"
    edges:
    - from: upper
      to: core
      label: 네이티브 C++ API
      label_en: Native C++ API
      evidence:
