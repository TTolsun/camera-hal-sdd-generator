      - source: outputs/camera
        sha256: d64fa7a71ca69a53433d250a2fd8f59a0beed2578980eee658d8dfb44a7513ee
        quote: "The API exposes full control of the device to upper layers of libcamera\
          \ through\n  the public API"
    - from: other_language
      to: core
      label: 선택적 바인딩
      label_en: Optional bindings
      evidence:
      - source: outputs/framework
        sha256: 69bc145221729420c980f5fe5887a43497e96b41eb16fa12ed7fdef01ccfdb97
        quote: "Optional\n  language bindings allow interfacing to libcamera from other\n\
          \  programming languages."
      - source: outputs/framework
        sha256: 69bc145221729420c980f5fe5887a43497e96b41eb16fa12ed7fdef01ccfdb97
        quote: libcamera, and exposes a native C++ API to upper layers.
    - from: adaptation
      to: core
      label: libcamera에 연결
      label_en: Connects to libcamera
      evidence:
      - source: outputs/adaptation
        sha256: 684ccb39cfc9bebf3125bd79b4b2f847de806a34261a9bcac9216bda52f1f99d
