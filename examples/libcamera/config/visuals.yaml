    title: 기본 구성 요청과 실제 구성의 호출 계약
    question: roles로 기본 구성을 요청하는 호출자와 Camera가 전달하는 검증된 구성을 구분하고, 각 함수의 호출 문맥·검증·Stream 연결 의무를 보여 주세요.
    prompt: 주석의 API 계약을 실행 결과로 바꾸지 마세요. roles는 기본 구성을 원하는 사용 사례에 필요한 스트림 역할 목록입니다. generateConfiguration의 임의 스레드와 configure의 CameraManager 스레드를 구분하세요. configure는 이미 검증된 구성을 받는 전제이므로 검증 상태 노드에서 configure로 화살표가 향해야 합니다. configure에서 검증으로 향하는 화살표는 만들지 마세요. 추가 검증 금지·setStream 의무·자체 파생 클래스의 사용자 정의 필드를 신뢰할 수 있다는 허용을 한국어와 영어 모두 보존하세요.
