      label_en: Invoke with ConnectionTypeQueued
      evidence:
      - source: request/queue-code
        sha256: b375a7828af46db11a4e6308cc634ebb265619e76e9f173907d16d9009fe2c51
        quote: ConnectionTypeQueued, request);
    - id: zero
      label: 'queueRequest: 0 반환'
      label_en: queueRequest returns 0
      evidence:
      - source: request/queue-code
        sha256: b375a7828af46db11a4e6308cc634ebb265619e76e9f173907d16d9009fe2c51
        quote: return 0;
    - id: queued
