  - id: configuration-access-branches
    topic: configuration-failure
    kind: decision
    title: 구성 접근 검사에서 관찰할 분기
    question: 연결 해제를 먼저 확인한 뒤 상태 범위를 검사합니다. 단언과 로그 뒤의 코드는 실제 실행 결과로 단정하지 않습니다.
    nodes:
    - id: disconnected
      label: 연결 해제 금지이며 disconnected_인가?
      label_en: Disconnection disallowed and disconnected_?
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: if (!allowDisconnected && disconnected_)
      shape: decision
    - id: removed
      label: -ENODEV 반환
      label_en: Return -ENODEV
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: return -ENODEV;
    - id: range
      label: low ≤ currentState ≤ high인가?
      label_en: low ≤ currentState ≤ high?
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: if (currentState >= low && currentState <= high)
      shape: decision
    - id: allowed
      label: 0 반환
      label_en: Return 0
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: return 0;
    - id: denied
      label: ASSERT·로그·-EACCES 코드 위치
      label_en: ASSERT, log and -EACCES code locations
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: return -EACCES;
    edges:
    - from: disconnected
      to: removed
      label: 예
      label_en: 'Yes'
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: "if (!allowDisconnected && disconnected_)\n\t\treturn -ENODEV;"
    - from: disconnected
      to: range
      label: 아니요
      label_en: 'No'
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: State currentState = state_.load(std::memory_order_acquire);
    - from: range
      to: allowed
      label: 예
      label_en: 'Yes'
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: "if (currentState >= low && currentState <= high)\n\t\treturn 0;"
    - from: range
      to: denied
      label: '아니요: 후속 코드 관찰'
      label_en: 'No: observe following code'
      evidence:
      - source: configuration-failure/access
        sha256: 4652821b0f8cfd78a0a4b8ec372fe45eb5ed2fc9b2280a765c3dc47bcc13767b
        quote: "ASSERT(static_cast<unsigned int>(low) < std::size(camera_state_names)\
          \ &&\n\t       static_cast<unsigned int>(high) < std::size(camera_state_names));"
  - id: configuration-implementation-observation
    topic: configuration-failure
    kind: flow
    title: 구성 호출의 실제 구현을 확인하는 조사 계획
    question: 상태 검사를 통과한 기존 호출에서 타입·구현·반환값을 관찰하는 계획입니다. 검증이나 구성을 다시 호출하지 않습니다.
    nodes:
    - id: validate
      label: '계획: config 동적 타입·validate 구현 기록'
      label_en: 'Plan: record config type and validate implementation'
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: if (config->validate() != CameraConfiguration::Valid)
    - id: result
      label: 기존 validate 결과와 Valid 비교
      label_en: Compare existing validate result with Valid
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: if (config->validate() != CameraConfiguration::Valid)
      shape: decision
    - id: invalid
      label: -EINVAL 코드 위치
      label_en: -EINVAL code location
      evidence:
      - source: configuration-failure/validation-check
        sha256: 5ee265dc6e41d87b5c011c9621dca0bbee5126a9fdc4633d198adaa12a4f910e
        quote: return -EINVAL;
    - id: handler
      label: '계획: 실제 configure 구현 기록'
      label_en: 'Plan: record actual configure implementation'
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: "ret = d->pipe_->invokeMethod(&PipelineHandler::configure,\n\t\t\t\t\
          \     ConnectionTypeBlocking, this, config);"
    - id: return
      label: 'ret 관찰: 비영이면 그대로 반환'
      label_en: 'Observe ret: return unchanged if nonzero'
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: "if (ret)\n\t\treturn ret;"
    edges:
    - from: validate
      to: result
      label: 기존 호출 결과 관찰
      label_en: Observe existing call result
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: if (config->validate() != CameraConfiguration::Valid)
    - from: result
      to: invalid
      label: Valid 아님
      label_en: Not Valid
      evidence:
      - source: configuration-failure/validation-check
        sha256: 5ee265dc6e41d87b5c011c9621dca0bbee5126a9fdc4633d198adaa12a4f910e
        quote: if (config->validate() != CameraConfiguration::Valid)
    - from: result
      to: handler
      label: 'Valid: 원래 configure 호출에서 관찰'
      label_en: 'Valid: observe original configure call'
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: "ret = d->pipe_->invokeMethod(&PipelineHandler::configure,\n\t\t\t\t\
          \     ConnectionTypeBlocking, this, config);"
    - from: handler
      to: return
      label: 원래 호출의 ret 기록
      label_en: Record original call ret
      evidence:
      - source: configuration-failure/configure-code
        sha256: e6185ee35674c441653590c65d2de1bc40d13b5a9d8ef8dc083936c54cb7f470
        quote: "if (ret)\n\t\treturn ret;"
