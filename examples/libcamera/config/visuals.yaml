      evidence:
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
        quote: "if (req->status() == Request::RequestPending)\n\t\t\tbreak;"
      - source: completion/request-contract
        sha256: 6ad80c6800e8b980c2a6146d7dcc5648de9db2b0ca408711a896c4e46a624684
