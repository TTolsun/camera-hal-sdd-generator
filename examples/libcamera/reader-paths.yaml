schema: 1
ready: true
scope: 공개 libcamera 사례에서 요청 제출 성공과 완료를 구분하고, 다음 조사 작업 또는 제한된 검증 착수 여부를 판단하세요.
limitations: 이 경로의 사실은 분석 커밋에 고정된 정적 소스 설명입니다. 기기에서 완료 누락을 재현하거나 개발 기간·품질·ROI를 측정한 결과가 아닙니다. 사내 HAL 적용과 실제 임원 평가는 미검증입니다.
required_inputs:
  - 실제 비작성자 파트원과 기술 의사결정자 각 1명 이상의 문서만 읽은 답변·방문 경로·오해·주관적 관련성 평가가 필요합니다.
  - 실제 임원 참여 여부와 사내 문제·목표·허용 위험·의사결정 권한은 승인된 사내 자료로 별도 확인해야 합니다.
  - 사내 적용에는 대상 소스 커밋·빌드 구성·재현 조건·계측 결과·검토 책임·게시 경계·승인된 명령줄 도구 설정이 필요합니다.
claims:
  - id: submission
    title: 제출 성공과 완료의 구분
    kind: fact
    condition: 분석 커밋의 공통 요청 경로에 대한 설명입니다. 특정 장치의 정상 촬영·완료 시간·오류 복구를 보증하지 않습니다.
    sources:
      - {section: request-lifecycle, topic: journey, part: summary}
  - id: ownership
    title: 요청과 버퍼의 구현 책임
    kind: fact
    condition: 구현 책임은 코드 객체와 호출자의 계약입니다. 특정 사내 부서·담당자에게 수정 책임을 배정한 것이 아닙니다.
    sources:
      - {section: request-lifecycle, topic: resources, part: summary}
  - id: stopping
    title: 정지와 연결 해제의 차이
    kind: fact
    condition: 정지와 연결 해제는 서로 다른 경로입니다. 구체적 구현의 동작과 기기 결과는 상세 설명과 실행 기록을 별도로 대조해야 합니다.
    sources:
      - {section: request-lifecycle, topic: stopping, part: summary}
  - id: value
    title: 독자의 조사에 도움이 될 것이라는 가설
    kind: hypothesis
    text: 제출·완료·자원 수명을 구분하는 공통 설명과 진단 경로가 있으면 조사자가 확인할 위치를 찾는 데 도움이 될 수 있습니다. 실제 독자의 작업 성공이나 시간 개선은 아직 확인하지 않았습니다.
    condition: 코드에서 구분할 수 있는 계약이 있다는 사실과 그 설명이 독자에게 유용하다는 가설을 구분합니다.
    sources:
      - {section: request-diagnosis, topic: diagnosis}
    needed_inputs:
      - 동일한 문서 기준본에서 수행한 두 역할의 실제 비작성자 평가가 필요합니다.
  - id: measurement
    title: 아직 측정하지 않은 효과
    kind: unmeasured
    text: 개발 기간 단축률·품질 개선률·ROI·사내 적용 비용은 측정하지 않았습니다. 문서의 구조 검사나 공개 가상 카메라의 관찰 기록을 이러한 효과로 환산할 수 없습니다.
    condition: 기술 근거가 연결되어 있다는 점만 확인할 수 있습니다. 사업 효과나 제품 지원 범위를 승인할 수 없습니다.
    sources:
      - {section: vendor-assurance, topic: measurement}
    needed_inputs:
      - 비교 과업·기준본·측정 방법·대상 환경·평가자의 기록과 실제 투입 비용이 필요합니다.
  - id: trial
    title: 완료 누락의 조사와 수정 후 확인 계획
    kind: decision_request
    text: 완료가 오지 않는 증상을 실제 대상에서 조사할지 결정하세요. 진행한다면 제출 반환값과 요청 상태, 준비 대기·장치 큐·완료 콜백을 구분하는 계측 계획부터 정합니다. 현재 문서만으로 원인을 확정하거나 관측 함수를 재호출해서 상태를 바꾸지 마세요.
    condition: 조사 계획이며 실제 재현 결과가 아닙니다. 조사 위치·관측값·다음 분기는 공통 진단 문서에서 확인합니다.
    sources:
      - {section: request-diagnosis, topic: submission-checks}
      - {section: request-diagnosis, topic: diagnosis}
    needed_inputs:
      - 소스·빌드·장치·입력 구성·재현 순서·제출 반환값·요청 상태·콜백 기록이 필요합니다.
      - 수정할 구현의 소유자와 호출자·스레드·자원 수명 영향, 성공·실패·정지 후 확인 조건을 실제 코드에서 정해야 합니다.
    options:
      - 필요한 입력이 확보되면 범위를 제한해 재현·계측하고, 수정 전후 같은 조건에서 제출과 완료를 각각 확인합니다.
      - 입력이나 검토 담당자가 없으면 착수를 보류하고 빠진 자료를 확보합니다.
  - id: adoption
    title: 제한된 독자 평가의 착수 또는 보류
    kind: decision_request
    text: 공개 사례의 다음 결정은 근거 탐색 과업의 제한된 평가에 착수할지 여부입니다. 공개 정적 근거를 사내 도입·제품 지원·효과 수치의 승인 근거로 사용하지 마세요.
    condition: 문서로 조사 지점을 찾을 수 있는지 먼저 검증합니다. 사내 도입은 사내 기술·운영·위험 입력을 받은 뒤 별도 판단합니다.
    sources:
      - {section: vendor-overview, topic: benefits}
      - {section: vendor-assurance, topic: constraints}
    needed_inputs:
      - 검증할 문제·대안·과업·중단 조건·허용 위험과 결정 권한을 실제 자료로 정해야 합니다.
      - 실제 비작성자 각 역할의 결과와 실제 임원 참여 여부를 확인해야 합니다.
    options:
      - 공개 사례에서 두 역할의 근거 탐색 평가를 제한된 범위로 진행하고 오해와 미발견 항목을 보완합니다.
      - 관련성이 불명확하거나 필요한 참여자가 없으면 도입 판단을 보류하고 문제·평가 입력을 확보합니다.
roles:
  - id: work
    title: 파트원 · 다음 구현·디버깅 작업 찾기
    questions:
      - aspect: reproduction
        question: 무엇이 문제이며 어떤 조건과 기록부터 확보할까요?
        claims: [submission, trial]
      - aspect: investigation
        question: 제출 이후 어디에서 멈췄는지 어떻게 조사할까요?
        claims: [submission, trial]
      - aspect: responsibility
        question: 수정할 구현과 함께 확인할 책임·자원 경계는 무엇인가요?
        claims: [ownership, stopping]
      - aspect: verification
        question: 무엇을 확인해야 수정 결과를 판단할 수 있나요?
        claims: [trial, measurement]
  - id: decision
    title: 기술 의사결정자 · 문제·가치·위험·결정 찾기
    questions:
      - aspect: problem
        question: 해결하려는 문제와 현재 확인한 사실은 무엇인가요?
        claims: [submission]
      - aspect: value
        question: 확인된 기술적 가치와 아직 검증하지 않은 효용은 무엇인가요?
        claims: [value, measurement]
      - aspect: risk
        question: 어떤 조건·위험·미검증 범위가 남아 있나요?
        claims: [stopping]
      - aspect: options
        question: 지금 선택할 수 있는 검증 범위와 보류 조건은 무엇인가요?
        claims: [trial]
      - aspect: decision
        question: 무엇을 더 확인하거나 결정해야 하나요?
        claims: [adoption]
