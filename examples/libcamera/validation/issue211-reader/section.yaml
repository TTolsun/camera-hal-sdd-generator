    question: 완료 알림은 프레임 후속 처리와 다른 단계임을 먼저 설명하고, requestComplete가 RequestCancelled이면
      반환하며 그 밖에는 callLater로 processRequest를 이벤트 루프에 미루는 순서와 카메라 매니저 스레드를 막지 않으려는 명시된
