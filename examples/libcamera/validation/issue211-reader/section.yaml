    별도 프로브의 CPU 접근 확인과 공식 cam 자체의 실제 udmabuf 할당 관찰을 구분하되 핵심 의미만 적으세요. 기본 커널로 원복했으므로
    현재 그대로 재실행할 수 없다는 결론을 마지막에 분명히 하세요.
