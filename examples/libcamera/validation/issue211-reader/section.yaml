- id: flow
  title: cam이 완료 알림을 받아 이벤트 루프에서 프레임을 처리합니다.
  question: 먼저 완료 알림과 프레임 후속 처리가 다른 단계라는 뜻을 쉬운 말로 설명하세요. requestComplete의 취소 요청 분기,
    정상 완료 요청을 callLater로 processRequest에 미루는 순서, 카메라 매니저 스레드를 막지 않으려는 코드의 명시적 의도를
    연결하세요. processRequest가 캡처 한도를 확인하고 프레임을 처리한 뒤 captureCount_를 늘리는 흐름을 설명하세요. 이번
    실행에서 콜백 스레드와 처리 스레드가 달랐다는 관찰을 코드의 모든 실행에 대한 보장과 구분하세요.
