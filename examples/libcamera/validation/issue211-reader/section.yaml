    max_statements: 1
    prompt: 질문에 필요한 짧고 쉬운 한국어 두세 문장으로만 답하고, 함수·변수 이름은 backtick으로 표시하세요. PID·TID 숫자,
      enum 숫자, JSON 필드·해시·도구 버전과 다른 절의 경고를 반복하지 마세요.
    answer_contract:
      basis: implementation
      reject_patterns:
      - pattern: 성공 여부
        message: 조건은 재제출 시도 여부·시점을 정하며 성공 여부를 정한다는 요약은 쓰지 마세요.
    subquestions:
    - 처리한 프레임 수 captureCount_와 설정된 captureLimit_를 비교한다는 관계를 먼저 설명하세요. 한도가 설정되어 있고
      이미 도달했으면 processRequest가 종료 신호를 다시 내지 않고 반환한다고 짧은 두 문장으로 쓰세요. 다른 단락의 동작은 반복하지
      마세요.
    - 싱크는 완료된 프레임을 소비하는 선택적 출력 처리기라고 먼저 정의하세요. 싱크가 있으면 싱크 처리도 하지만 프레임 정보 출력과 처리 개수
      증가는 싱크 유무와 관계없이 수행된다고 설명하세요. 증가 뒤 처리 한도에 도달하면 캡처 종료 신호 captureDone을 내고 반환하며
      요청 완료 신호와 다르다고 세 짧은 문장으로 쓰세요. 이미 소개한 카운터 식별자를 반복하지 마세요.
    - 처리 종료 조건이 아닐 때 싱크가 요청을 보유하면 processRequest는 반환하고 재제출을 미룬다고 설명하세요. 이후 싱크의 requestProcessed
      신호에 연결된 sinkRelease가 버퍼를 유지해 요청을 재사용하고 재제출을 시도합니다. 보유하지 않으면 processRequest가
      재사용과 재제출 시도를 수행한다고 세 짧은 문장으로 쓰세요. 여기서 제출 성공을 보장하지 마세요.
    - CameraSession::queueRequest는 처리 개수와 다른 제출 개수 queueCount_를 같은 설정 한도와 비교한다고 명시하세요.
      제출 개수가 이미 한도에 도달했으면 실제 큐잉 없이 반환한다고 두 짧은 문장으로 쓰세요. 다른 단락의 식별자·조건은 반복하지 마세요.
