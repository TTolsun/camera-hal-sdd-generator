- id: reproduce
  title: 지원 커널과 장치 접근을 확인한 뒤 재현합니다
  question: 재현 전 현재 커널의 Kconfig·의존 심볼·실제 모듈·DMA-BUF 할당기 후보와 장치 접근 권한부터 확인하는 순서를 설명하세요.
    기존 WSL·Docker에 영향 없는 준비를 우선하고 공유 커널·모듈·.wslconfig 변경이나 배포판·VM 종료가 필요할 때는 영향·백업·복구
    계획을 준비하여 실행 직전 별도 승인을 받는 전제를 유지하세요. 승인된 지원 커널을 부팅하고 장치 접근을 확인한 다음 기준 소스의 수정하지
    않은 디버그 빌드와 전용 관찰 도구로 재현 절차를 따라간다고 설명하세요. root 전용 udmabuf 접근은 이번 시험의 조건이며 권한을 임의로
    바꾸라는 일반 지침으로 쓰지 마세요. 마지막에 가상 캡처에서 확인한 범위와 물리 DMA·카메라·제품 앱·사내 HAL 및 성능의 미검증 범위를
    한 번만 설명하세요.
  prompt: 현재 part의 질문만 짧게 답하세요. 다른 part가 설명할 환경·범위·경고를 반복해서 덧붙이지 마세요. 실제 수행한 가상 카메라
    시험이며 가짜 실행이 아닙니다. PID·TID 숫자, JSON 키·해시와 내부 출력 필드를 본문에 열거하지 마세요. 함수와 변수 이름은 backtick으로
    표시하세요. 제품 소개가 아닌 개발자용 동작 설명이며, 전체 페이지의 시험 범위를 매 문장에 되풀이하지 마세요.
