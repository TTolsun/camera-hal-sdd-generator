  parts:
  - id: dispatch
    question: requestComplete가 RequestCancelled이면 바로 돌아가고, 그 밖의 요청은 CameraManager 스레드를 막지 않도록 callLater로 processRequest 처리를 미루는 코드 동작을 한 문단으로 설명하세요. 관찰점은 함수명과 captureCount_ 증가 직전이라는 지점으로만 설명하고 파일명·줄번호를 본문에 쓰지 마세요.
    sources: [callback-and-processing]
    max_statements: 1
    answer_contract:
