- id: outcome
  title: 공식 cam과 실제 DMA-BUF 확인 결과
  question: 기준 소스 SHA, 수정하지 않은 공식 cam, WSL 시험 커널과 Virtual2 400×300 NV12 조건, 세 독립 프로세스의 각 3프레임 정상 종료를 설명하세요. 별도 프로브의 memfd와 드라이버 DMA-BUF fd 차이 및 mmap, RW SYNC_START, 실제 CPU 읽기·쓰기, SYNC_END와 정리 성공을 설명하세요. 과거 CPU memfd 프로브의 DMA 오류 기록은 당시 결과로 보존되며 이번 공식 cam 결과와 다르다고 설명하세요. 결과와 재현 조건부터 짧게 쓰고 성능·물리 DMA 검증으로 확장하지 마세요.
  covers: [outcome]
  product: {id: libcamera-official-cam-trial, feature: wsl-virtual-capture}
  sources: []
  max_statements: 4
  answer_contract:
    basis: measurement
    required_terms: [[Virtual2], [NV12], [DMA-BUF], [SYNC_START], [SYNC_END]]
- id: completion
  title: 콜백과 후속 처리에서 확인한 세 프레임
  design_prompt: focused
  question: CameraSession::requestComplete의 진입과 processRequest의 captureCount_ 증가 직전 관찰점을 구분하세요. 요청 주소·sequence·RequestComplete 상태와 실제 OS 스레드를 연결해 같은 요청을 두 번 세지 않았다고 설명하세요. 세 실행의 실제 callback 스레드와 주 스레드를 제시하고, 취소 콜백 0은 이번 관찰값이며 취소 경로 시험이나 반환 명령·성능 측정이 아니라고 설명하세요. 코드가 취소 요청을 제외하고 이벤트 루프로 처리를 미루는 동작과 이번 실행 관찰을 구분하세요.
  covers: [completion]
  product: {id: libcamera-official-cam-trial, feature: wsl-virtual-capture}
  sources:
