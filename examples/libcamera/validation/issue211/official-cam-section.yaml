      required_terms: [[requestComplete], [processRequest], [RequestCancelled]]
  - id: observed
    question: 측정 자료 request_events의 callback-entry와 frame-processed를 같은 request 주소와 sequence로 연결해 각 독립 프로세스의 세 프레임을 한 번씩 셌음을 설명하세요. Request 상태 enum과 실제 status 1을 대조해 RequestComplete임을 설명하고, callbacks 스레드와 main_tid/processed 스레드의 실제 TID를 모두 제시하세요. 취소 0건은 이번 관찰값이며 취소 경로·반환 명령·성능 검증이 아님을 유지하세요. 버퍼 성공 상태와 sequence의 일치도 보존하되 파일명·줄번호·본문 인용을 직접 쓰지 마세요. 두 문단 이내로 설명하세요.
    sources: [request-status]
    max_statements: 2
    answer_contract:
      basis: measurement
      required_terms: [[sequence], [RequestComplete], [취소], [스레드]]
- id: boundary
  title: 재현 조건과 검증 경계
  design_prompt: focused
  question: 기존 기본 WSL 커널에는 할당기가 없었고 정확한 Microsoft 태그의 UDMABUF 내장 시험 커널을 승인 후 잠시 사용했음을 설명하세요. 커널 설정과 컴파일러 capability 차이 및 새 release용 모듈 미설치 때문에 Docker를 중지 상태로 두었다고 명시하세요. 장치가 root 전용이어서 권한을 바꾸지 않고 root 자식으로 시험했으며 일반 사용자 오류를 보존했다고 설명하세요. 독립 프로브의 잘못된 제공자·ioctl과 0.5초 시간 초과는 실패이고 SYNC_END·munmap·close와 자식 정리를 관찰했으며, 공식 cam 추가 strace는 콜백 관찰과 별도라고 설명하세요. 시험 후 .wslconfig 부재와 원래 커널 복구를 확인했고 물리 DMA·카메라·다른 제품 앱·사내 HAL·사람 승인은 미검증임을 유지하세요. 재현 코드는 생성기 examples/libcamera/runtime/run_cam.py에 연결하세요.
  covers: [boundary]
  product: {id: libcamera-official-cam-trial, feature: wsl-virtual-capture}
  sources: []
  parts:
  - id: prerequisites
    question: 기존 기본 WSL2 커널에서 DMA 할당기가 없어서 정확한 Microsoft 태그의 UDMABUF 내장 시험 커널을 승인 후 임시 적용했다는 조건을 설명하세요. compiler capability 차이와 새 release용 모듈을 설치하지 않아 시험 중 Docker를 중지 상태로 두었다는 조건도 유지하세요. root 전용 장치여서 권한을 바꾸지 않고 root 자식으로 실행했으며 일반 사용자 errno 13 실패도 보존했다고 두 문단 이내로 설명하세요. allocator 함수 내부의 실패 분기는 이 과업에 필요하지 않으므로 늘리지 마세요.
    sources: []
    max_statements: 2
    answer_contract:
      basis: measurement
      required_terms: [[UDMABUF], [root], [WSL, WSL2], [Docker]]
  - id: failures
    question: 전용 프로브에서 부재 제공자와 미지원 ioctl은 각각 errno 2와 25, 종료 코드 1로 실패했고, 0.5초 시간 초과도 실패로 보존했음을 설명하세요. 이 시간 초과에서 SYNC_END·munmap·fd 닫기와 프로세스 그룹 정리가 성공했고 추가 공식 cam strace는 정상 종료했지만 콜백 관찰과 별도라는 결과만 두 문단 이내로 설명하세요.
    sources: []
    max_statements: 2
    answer_contract:
      basis: measurement
      required_terms: [[시간], [SYNC_END], [strace]]
  - id: restored-scope
    question: 임시 .wslconfig를 제거하고 원래 커널로 원복한 결과를 설명하세요. 물리 DMA·카메라·다른 제품 앱·사내 HAL·사람 승인은 미검증 상태임을 두 문단 이내로 유지하세요. GDB는 타이밍에 영향을 주며 콜백 반환 명령은 관찰하지 않았다는 한계도 적으세요.
    sources: []
    max_statements: 2
    answer_contract:
      basis: measurement
      required_terms: [[물리], [사내], [GDB], [원복, 복구]]
