    - id: failure
      label: 가상 파이프라인은 -ENOBUFS를 반환하고 cam은 할당 실패로 -ENOMEM을 반환합니다.
      label_en: The virtual pipeline returns -ENOBUFS and cam returns -ENOMEM for
