onboarding:
- id: request-completion-contract
  topic: why
  kind: flow
  title: 요청 제출과 버퍼·요청 완료의 책임
  question: 요청의 제출 조건, 버퍼 완료와 명시적 요청 완료, 앱에 전달하는 순서는 어떻게 연결됩니까?
  generation: llm
  max_nodes: 12
  max_label_chars: 160
  max_edge_label_chars: 80
  require_connected: true
  sources: [accept, buffer, order]
  answer_contract_en:
    basis: description
    reject_patterns:
    - pattern: '[\x00-\x08\x0b\x0c\x0e-\x1f]'
      message: English labels must not contain control characters.
    - pattern: '(?mi)\b(?:a|an|the|to|of|from|with|without|after|before|and|or|is|are|be)$'
      message: English labels must end in a complete phrase.
    - pattern: '(?m)^[^\n]*[^\s.!?][ \t\u00a0]*$'
      message: Every English label must be a complete short sentence ending in punctuation.
    required_terms:
    - [completeRequest]
    - [submission order]
  prompt: >-
    이 그림은 소스 주석의 계약 관계를 설명하며 구현 전체의 제어 흐름이나 실측 실행을 주장하지 않습니다.
    queueRequest 전에 요청에 버퍼가 있어야 한다는 조건과 제출 성공 후 requestCompleted로 완료를 알린다는 계약을 연결합니다.
    completeBuffer는 버퍼 완료를 알리지만 모든 버퍼가 완료되어도 요청이 자동 완료되지 않는다는 사실을 분명히 표시합니다.
    핸들러가 후속 작업을 할 기회를 갖고 completeRequest를 명시적으로 호출해야 한다는 책임을 별도 노드로 표시합니다.
    핸들러의 completeRequest 호출 순서에는 제약이 없지만 앱에는 원래 제출 순서로 요청이 돌아간다는 두 순서를 구분합니다.
    버퍼 없는 요청의 구체적 오류 코드나 보지 않은 내부 분기, 버퍼 소유권 이전, 기기 동작을 추가하지 않습니다.
    계약 간의 관계는 always를 쓰되 라벨에 책임·조건·알림을 명시하고 실제 if/while 분기처럼 꾸미지 않습니다.
    한영 라벨은 같은 질문을 설명하는 짧고 완전한 문장으로 쓰고 부정·순서 조건을 생략하거나 문장 끝을 자르지 않습니다.
    노드는 가능한 한 짧은 계약 요약으로 쓰며 발췌의 모든 문장을 옮기지 않습니다. 영어에는 제어 문자를 넣지 않습니다.
    모든 간선은 양 끝 노드의 symbol이 모두 들어 있는 인용 묶음을 사용해야 합니다. completeRequest와 application을 잇는
    간선은 completeRequest가 실제로 있는 buffer 발췌와 application이 있는 order 발췌를 함께 인용합니다.
    반환 후 접근 금지 관계도 같은 원칙으로 양 끝의 symbol이 근거 묶음에 실제 존재하는지 먼저 확인합니다.
    독립 검토에서 이전 그림은 제출 노드에서 requestCompleted 알림으로 바로 갈라져 명시적 완료와 알림의 관계를 가렸습니다.
    제출→버퍼 완료→핸들러의 후속 작업 기회와 명시적 completeRequest→카메라의 제출 순서 반환·requestCompleted 알림을 연결합니다.
    제출에서 알림으로 건너뛰는 간선은 넣지 않습니다. completeRequest와 requestCompleted를 연결하는 근거는 buffer와 accept 및
    order 발췌를 함께 인용하여 양 끝의 이름과 계약을 보존합니다. 이는 전체 구현의 동기 호출 순서라고 주장하지 않습니다.
    이전 영문은 160자와 80자 상한에 걸려 문장 끝이 잘렸으므로, 노드 영문을 90자 이내, 화살표 영문을 60자 이내로 직접 요약합니다.
    버퍼 노드에서는 마지막 버퍼도 요청을 자동 완료하지 않는다는 한 가지 사실에 집중하고 추적 정보 갱신은 본문·근거에 남깁니다.
    의미를 줄이려고 부정이나 명시적 호출 의무를 생략하지 않으며 모든 영문 라벨은 마침표로 끝내 완전한 문장인지 검사합니다.
