- id: stop-waiting-requests
  topic: shutdown
  kind: ownership
  title: 정지할 때 대기 요청을 분리하고 완료하는 순서
  question: 대기 요청을 먼저 지역 큐로 옮기는 이유와 장치 정지·취소·완료·재진입의 관계는 무엇입니까?
  generation: llm
  max_nodes: 12
  max_label_chars: 96
  max_edge_label_chars: 64
  while_conditions: true
  condition_display: evidence
  require_connected: true
  sources: [stop, completion, waiting-dispatch, cancelled-dispatch]
  prompt: >-
    이 그림은 stop의 순차 처리와 지역 큐 반복에 집중합니다. completeRequest의 재진입은 별도 그림이 설명하므로 swap으로
    돌아가는 간선을 그리지 않습니다. waitingRequests_를 지역 waitingRequests로 swap하여 분리한 뒤 stopDevice를 호출합니다.
    이미 장치에 제출된 요청을 끝내는 stopDevice의 의무와, 지역 큐에 분리한 대기 요청은 구분합니다. 반환 후 지역 큐가 비었는지
    검사하여 참/거짓 양쪽과 종료를 보이고, 남은 요청은 앞에서 꺼내 cancel 후 doQueueRequest로 처리한 다음 다음 지역 요청을 검사합니다.
    doQueueRequest는 queuedRequests_에 추가한 뒤 순번을 부여합니다. 취소된 요청은 completeRequest로 완료하고 장치 제출을 하지 않습니다.
    completeRequest 반환 후 파이프라인이 그 요청에 접근하지 않는 소유권 경계와 앱에 제출 순서로 알린다는 사실은 짧은 완전한 문구로 보존합니다.
    한국어·영어 라벨은 짧은 행동구이며 영문에 한글을 섞거나 문장 끝을 자르지 않습니다. 재진입이 swap이나 stopDevice를 반복한다고 그리지 않습니다.
- id: stop-completion-reentry
  topic: shutdown
  kind: decision
  title: 완료 처리의 재진입은 분리한 대기 요청을 다시 제출하지 않습니다
  question: stopDevice 안에서 완료 처리가 재진입해도 지역 큐로 분리한 대기 요청은 왜 다시 장치에 제출되지 않습니까?
  generation: llm
  max_nodes: 10
  max_label_chars: 96
  max_edge_label_chars: 64
  while_conditions: true
  condition_display: evidence
  require_connected: true
  sources: [stop, completion, waiting-dispatch]
  prompt: >-
    정지 시 공유 waitingRequests_를 지역 waitingRequests로 분리한 상황을 명시합니다. stopDevice 안에서 completeRequest가
    호출될 수 있는 관계는 가능성을 보존하고, 그 완료 함수 끝의 doQueueRequests 호출과 공유 대기 큐 검사를 보여 줍니다.
    분리된 요청은 지역 큐에 남고 공유 큐는 비어 있으므로 그 요청들을 장치에 다시 넘기지 않습니다. 정상 실행에서 공유 큐가
    남으면 장치 한도와 준비 완료 조건에 따라 앞 요청을 pop 후 doQueueRequest로 넘기는 조건도 짧게 구분합니다. 조건을 쓰면
    결정 노드와 양쪽 결과를 유지합니다. completeRequest에서 swap이나 stopDevice로 되돌아가는 잘못된 반복을 만들지 않습니다.
    한영 의미와 가능성·조건을 모두 보존하고 불완전한 영어 문장이나 한글이 섞인 영문 라벨은 쓰지 않습니다.
