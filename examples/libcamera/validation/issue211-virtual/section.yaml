        message: 현재 항목이 설명하는 단계만 쓰고 다른 단계나 전체 호출식을 반복하지 마세요.
      - pattern: 확인되지\s*않|미확인|확인할\s*수\s*없
        message: 선택한 두 소스가 재사용과 한도 조건을 직접 보여 줍니다.
