  design_prompt: focused
  parts:
  - id: dispatch
    question: CameraSession::requestComplete는 취소 상태 RequestCancelled면 반환하고 그 밖에는 callLater로 CameraSession::processRequest를
      이벤트 루프에 미룬다고 먼저 설명하세요. 카메라 매니저 스레드를 막지 않으려는 소스의 이유를 이어서 두 짧은 문장으로 씁니다. 다른 처리 한도·범위 설명은 이 항목에 반복하지
