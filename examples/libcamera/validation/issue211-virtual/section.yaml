      - pattern: 큐에|다시 제출|재제출|requeue|성공
        message: The helper is called; actual submission is conditional and belongs to the next item.
      - pattern: 아니라|뜻이 아니|의미가 아니
        message: State the actual source condition directly instead of repeating a contrast with an earlier
