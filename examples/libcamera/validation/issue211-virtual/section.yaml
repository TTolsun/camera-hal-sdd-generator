    errno 값, 컴파일러 버전, 원시 이벤트 이름은 이미 연결된 근거에서 확인하므로 본문에 열거하지 마세요. 각 문장의 주체와 조건을 유지하고 측정값을 제품 성능으로 확장하지
    마세요.
