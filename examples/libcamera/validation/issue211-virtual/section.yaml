      required_terms:
      - - captureDone
      - - processRequest
      - - captureDone
  - id: reuse-request
    question: 문장 맨 앞의 짧은 구절로 기록된 출력 싱크 미요청 경로임을 명시하세요. 이 경로에서 처리 한도가 설정되지 않았거나 처리 수가 아직 한도에 도달하지 않았으면
      버퍼를 유지해 요청을 재사용하고 제출 도우미를 호출한다는 한 문장을 씁니다. 실제 제출은 도우미의 한도 검사에 따라 생략될 수 있다는 둘째 짧은 문장으로 마칩니다. 출력 싱크가
      요청을 보유하는 일반 경로까지 무조건 재사용한다고 쓰지 않습니다. 반환값과 카운터 증가 설명은 넣지 않습니다.
    sources:
    - callback-and-processing
    - reuse-call
    max_statements: 1
    prompt: 핵심 행동과 조건을 쉬운 동사와 구체적 주어로 먼저 설명하세요. 내부 카운터 식별자나 전체 호출식을 나열하지 않습니다. 다른 항목의 조건·경고를 반복하지 않습니다.
