design_topics:
- id: conclusion
  title: 할당기를 준비하자 공식 cam 캡처가 완료됐습니다
  question: 기본 WSL 커널에는 DMA-BUF 할당기가 없어 공식 cam이 버퍼를 만들지 못했다는 문제와, 승인된 UDMABUF 시험 커널에서 수정하지 않은 공식 cam으로
    Virtual2 400×300 NV12를 세 독립 프로세스에서 각각 3프레임 정상 완료한 결론을 짧게 설명하세요. 별도 프로브의 CPU 접근 확인과 공식 cam 자체의 실제 udmabuf
    할당 관찰을 구분하되 핵심 의미만 적으세요. 기본 커널로 원복했으므로 현재 그대로 재실행할 수 없다는 결론을 마지막에 분명히 하세요.
  prompt: 개발자의 이해를 위한 두세 문장씩 두 문단 이내로 쓰세요. 실제 가상 카메라 시험이며 가짜 실행이 아닙니다. PID, TID 숫자, fd 번호, JSON 키, 해시,
    errno 값, 컴파일러 버전, 원시 이벤트 이름은 이미 연결된 근거에서 확인하므로 본문에 열거하지 마세요. 각 문장의 주체와 조건을 유지하고 측정값을 제품 성능으로 확장하지
    마세요.
  covers:
  - conclusion
  product:
    id: libcamera-official-cam-trial
    feature: wsl-virtual-capture
  sources: []
  answer_contract:
    basis: measurement
    required_terms:
    - - Virtual2
    - - NV12
    - - DMA-BUF
    - - 원복
      - 복구
  design_prompt: focused
  parts:
  - id: problem
    role: summary
    question: 이번 기준 재현의 기본 WSL 커널에는 DMA-BUF 할당기가 노출되지 않아 공식 cam이 버퍼를 만들지 못했다는 실제 관측 문제를 한 짧은 문장으로 쓰세요.
      이미 관측한 실패이며 실행 계획이나 미검증 항목이 아닙니다.
    sources: []
    max_statements: 1
    prompt: 개발자의 이해를 위한 두세 문장씩 두 문단 이내로 쓰세요. 실제 가상 카메라 시험이며 가짜 실행이 아닙니다. PID, TID 숫자, fd 번호, JSON 키, 해시,
      errno 값, 컴파일러 버전, 원시 이벤트 이름은 이미 연결된 근거에서 확인하므로 본문에 열거하지 마세요. 각 문장의 주체와 조건을 유지하고 측정값을 제품 성능으로 확장하지
      마세요.
    answer_contract:
      basis: measurement
  - id: outcome
    question: 승인된 UDMABUF 시험 커널에서 수정하지 않은 공식 cam이 Virtual2 400x300 NV12로 세 독립 프로세스에서 각각 실행되어, 각 실행의 3프레임
      정상 완료와 udmabuf 할당 성공이 관측된 결과를 설명하세요. 별도 DMA-BUF 프로브의 CPU 접근 성공은 cam 할당 관찰과 구분하세요. 시험 후 기본 커널로 원복되어
      현재 그대로 재실행할 수 없는 상태로 마치세요. 익명 담당자나 관찰자 역할을 도입하지 말고 실행된 대상과 관측된 결과 중심의 수동태로 세 짧은 문장을 쓰세요.
    sources: []
    max_statements: 1
    prompt: 개발자의 이해를 위한 두세 문장씩 두 문단 이내로 쓰세요. 실제 가상 카메라 시험이며 가짜 실행이 아닙니다. PID, TID 숫자, fd 번호, JSON 키, 해시,
      errno 값, 컴파일러 버전, 원시 이벤트 이름은 이미 연결된 근거에서 확인하므로 본문에 열거하지 마세요. 각 문장의 주체와 조건을 유지하고 측정값을 제품 성능으로 확장하지
      마세요.
    answer_contract:
      basis: measurement
- id: flow
  title: cam이 완료 알림을 받아 이벤트 루프에서 프레임을 처리합니다.
  question: 기록된 출력 싱크 미요청 cam 명령의 콜백, 이벤트 루프 전달, 처리 한도와 제출 도우미를 설명하세요. 파일·화면 출력 옵션의 일반 경로는 이번 재현 설명의 범위
    밖이며 소스 근거로 연결합니다.
  prompt: 현재 part의 질문만 짧게 답하세요. 다른 part가 설명할 환경·범위·경고를 반복해서 덧붙이지 마세요. 실제 수행한 가상 카메라 시험이며 가짜 실행이 아닙니다.
    PID·TID 숫자, JSON 키·해시와 내부 출력 필드를 본문에 열거하지 마세요. 함수와 변수 이름은 backtick으로 표시하세요. 제품 소개가 아닌 개발자용 동작 설명이며,
    전체 페이지의 시험 범위를 매 문장에 되풀이하지 마세요.
  covers:
  - flow
