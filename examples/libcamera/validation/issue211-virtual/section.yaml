    role: summary
  - id: invocation-scope
    question: 세 실제 실행 명령은 화면·파일 출력 옵션을 요청하지 않았다는 사실을 한 문장으로 쓰세요. 다른 출력 옵션을 선택한 동작은 이번 실행으로 검증하지 않았다고 한
      문장만 덧붙이세요. 모든 출력 옵션이 요청을 비동기로 보유한다고 주장하거나 비동기 보유 경로를 일반화하지 마세요.
    sources:
    - app-start
    - session-state
    max_statements: 1
    answer_contract:
      basis: measurement
      reject_patterns:
      - pattern: SDL|sink_|CameraSession::start
        message: Keep this invocation boundary short; optional implementation details remain in source
          evidence.
    prompt: ' 이 항목의 질문에만 한두 짧은 문장으로 답하세요. 출력 싱크 미요청 전제는 invocation-scope에서 한 번만 설명하므로 다른 항목에는 반복하지 마세요.
      앞 항목의 조건을 다시 설명하지 마세요.'
  - id: processing
    question: processRequest에 들어올 때 처리 한도가 설정되어 있고 처리 수가 이미 그 한도에 도달했다면, 완료 신호를 다시 내지 않고 즉시 반환하여 후속 프레임
      처리를 건너뛴다는 한 가지 조건·동작만 짧은 평서문 하나로 씁니다. 요청마다 다시 호출된다는 일반화, 남은 요청 모두에 대한 설명, 이유·효과·뒷 단계 해설을 덧붙이지 않습니다.
      취소 분기는 앞 콜백 설명이 맡습니다. 여기서 다시 내지 않는 신호는 captureDone이므로 일반적인 완료 신호라고 쓰지 말고 `captureDone`을 명시하세요.
    sources:
    - callback-and-processing
    max_statements: 1
    prompt: 핵심 행동과 조건을 쉬운 동사와 구체적 주어로 먼저 설명하세요. 내부 카운터 식별자나 전체 호출식을 나열하지 않습니다. 다른 항목의 조건·경고를 반복하지 않습니다.
    answer_contract:
      basis: implementation
      reject_patterns:
      - pattern: 증가|늘리|\+\+|처리할 때
        message: 현재 항목이 설명하는 단계만 쓰고 다른 단계나 전체 호출식을 반복하지 마세요.
      - pattern: captureCount_|captureLimit_|queueCount_|camera_->|CameraSession::queueRequest|Request::ReuseBuffers
        message: Preserve the processing/submission-limit conditions using plain Korean concepts. Keep
          internal counter identifiers and full calls in the diagram/source evidence.
      - pattern: 남아|남은|요청마다|호출되므로|따라서|때문|그 후속|이 분기가
        message: State only the entry-limit conditional and immediate return that skips frame processing.
          Do not generalize calls to all remaining requests or append rationale.
      required_terms:
      - - captureCount_
        - 처리 수
      - - captureLimit_
        - 처리 한도
      - - 건너
      - - captureDone
  - id: frame-work
    question: processRequest를 명확한 주어로 삼아 프레임 정보를 출력하고 처리 수를 하나 늘린다는 첫 짧은 문장을 씁니다. 두 번째 짧은 문장도 processRequest를
      주어로 명시하여, 설정된 한도에 도달하면 captureDone 신호를 내고 반환한다는 순서를 설명합니다. captureDone이 함수의 주어가 되거나 captureDone이
      반환한다고 쓰지 마세요. 두 식별자는 backtick으로 표시하고 내부 카운터 필드 이름은 근거로 남깁니다.
    sources:
