    sources:
    - callback-and-processing
    max_statements: 1
    prompt: 질문에 필요한 짧고 쉬운 한국어 두세 문장으로만 답하고, 함수·변수 이름은 backtick으로 표시하세요. PID·TID 숫자, enum 숫자, JSON 필드·해시·도구
      버전과 다른 절의 경고를 반복하지 마세요. 이 항목의 질문에만 한두 짧은 문장으로 답하세요. 출력 싱크 미요청 전제는 invocation-scope에서 한 번만 설명하므로
      다른 항목에는 반복하지 마세요. 앞 항목의 조건을 다시 설명하지 마세요.
    answer_contract:
