parts:
- id: purpose
  role: summary
  question: 기준 소스에서 확인한 공식 libcamera의 virtual 기능과 제공된 Virtual2 설정만 두 짧은 문장으로 소개하세요. 소스 분석 결과임을 첫 문장에 밝히고, 센서 영상 대신 소프트웨어 테스트
    패턴 또는 설정한 .jpg 이미지 파일을 공급한다고 설명하세요. 둘째 문장은 Virtual2의 400x300 lines(대각선 줄무늬) 설정을 설명합니다. 220자 이내입니다.
  sources:
  - virtual-purpose
  - virtual2-config
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 소스
    reject_patterns:
    - pattern: 그림.{0,12}없
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 확인되지
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 미확인
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
  prompt: 이 part의 제공 근거는 기능 소개와 Virtual2 설정입니다. 버퍼 준비·처리·완료 경로는 뒤의 다른 part가 별도 소스로 설명하므로 여기서 그 경로를 검증하거나 부정하지 마세요. 그림의 존재·생성
    시점·미확인 상태를 추정하지 말고 소스에 적힌 기능만 설명하세요. JPEG 약어 대신 .jpg 이미지 파일이라고 쓰세요.
- id: buffer
  question: 가상 영상도 실제 버퍼가 필요함을 설명하세요. virtual의 exportFrameBuffers가 DMA-BUF를 할당하고 cam이 버퍼를 Request에 붙인다는 관계를 먼저 쓰세요. 선택한 NV12
    경로에서 generateFrame이 쓰기 방향 DmaSyncer와 매핑을 사용하고 CPU에서 패턴을 NV12로 변환해 버퍼에 쓴다는 핵심을 설명하세요. 물리 장치의 DMA 전송이라는 뜻으로 쓰지 마세요. 세 짧은
    문장 이내입니다. 제공된 FrameBufferAllocator::allocate → Camera::exportFrameBuffers → PipelineHandler::exportFrameBuffers 호출 연결을
    근거로 사용하되 본문에는 모두 열거하지 마세요. 이 연결을 미확인이라고 쓰지 마세요. 명시된 연결 설명과 CPU 쓰기만 세 짧은 문장 280자 이내로 쓰고 별도 범위 경고를 덧붙이지 마세요.
  sources:
  - virtual-buffer-allocation
  - cam-request-buffers
  - pattern-frame
  - allocator-to-camera
  - camera-export
  max_statements: 1
  answer_contract:
    basis: implementation
- id: completion
  question: 요청이 virtual의 queueRequestDevice에서 VirtualCameraData::processRequest로 비동기 전달되고 패턴 작성 뒤 버퍼 완료를 알리는 흐름을 설명하세요. 생성
    실패는 FrameError로 표시되므로 완료 알림만으로 성공을 단정하지 않습니다. virtual은 completeBuffer가 모든 버퍼 완료를 반환한 경우에만 completeRequest를 호출하고, libcamera의
    requestCompleted에 연결된 cam의 requestComplete로 돌아옵니다. 그 뒤의 callLater·processRequest는 다음 절로 이어지므로 여기서 반복하지 마세요. 네 짧은 문장 이내입니다.
    수신 연결과 일반 파이프라인 큐 연결 소스도 함께 제공됩니다. 제어 목록·타임스탬프·FrameSuccess 기본값·가상 범위 경고는 이 요약에서 생략하고, 핵심 전달·실패 상태·모든 버퍼 완료 조건·앱 신호 연결만
    네 짧은 문장 360자 이내로 쓰세요. 첫 문장에서 가상 쪽 처리 함수는 VirtualCameraData::processRequest라고 반드시 클래스 이름을 명시하세요. cam의 CameraSession::processRequest와
    다른 함수입니다. 완료 신호는 제출 순서로 전달하며 앞 요청이 RequestPending이면 신호 전달이 보류된다는 조건도 설명하세요. 네 짧은 문장 440자 이내로 쓰세요. 목표 시각에 정확히 실행됨을 보장하지
    마세요. 소스는 VirtualCameraData::processRequest가 목표 시각까지 sleep_until로 기다린 뒤 처리합니다. 첫 문장은 이 조건으로 한정하고 정확한 실행 시간·성능 보장을 쓰지 마세요.
  sources:
  - virtual-queue
  - virtual-frame
  - virtual-completion
  - pipeline-completion
  - camera-notification
  - cam-signal-connection
  - pipeline-dispatch
  - camera-queue
  - virtual-start
  - pipeline-register
  max_statements: 1
  answer_contract:
    basis: implementation
