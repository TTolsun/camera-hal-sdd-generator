parts:
- id: purpose
  role: summary
  question: 그림 바로 앞에 놓이는 이 첫 문단에서, 고정한 libcamera 소스를 분석해 설명하는 구현 흐름임을 분명히 하세요. 선택된
    Virtual2가 센서 대신 400x300 lines 줄무늬 패턴을 공급한다는 개요와, cam의 실제 DMA-BUF 확보·버퍼가 붙은 요청
    제출 → CPU의 NV12 패턴 쓰기 시도 → 버퍼·요청 완료 조건을 거친 cam 통지라는 핵심 흐름을 쉬운 말로 세 짧은 문장 이내로 설명하세요.
    상세 분기와 예외는 그림 뒤 항목이 설명하므로 이 문단에는 함수·클래스 이름, 관측한 내부 실행이라는 단정, 다른 영상 입력 옵션이나 경고
    목록을 추가하지 않습니다.
  sources:
  - virtual-purpose
  - virtual2-config
  - virtual-buffer-allocation
  - virtual-queue
  - virtual-frame
  - pattern-frame
  - virtual-completion
  - pipeline-dispatch
  - pipeline-completion
  - camera-notification
  - cam-request-buffers
  - cam-signal-connection
  - allocator-to-camera
  - camera-export
  - camera-queue
  - virtual-start
  - pipeline-register
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 소스
    reject_patterns:
    - pattern: 그림.{0,12}없
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 확인되지
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 미확인
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
  prompt: 질문에 필요한 핵심 소스 흐름을 먼저 짧게 설명하세요. 해시·PID·TID·JSON 키와 긴 코드 식별자는 근거에 둡니다. 소스의
    처리 조건을 성공 보장으로 바꾸지 않습니다.
- id: buffer
  question: 그림 뒤의 이 항목은 CPU 접근 조건만 설명하세요. 소스의 패턴 생성기는 쓰기 방향 동기화 범위 안에서 버퍼를 쓰기용으로 매핑하고,
    CPU가 패턴을 NV12로 변환하여 매핑된 버퍼에 쓰기를 시도한다는 두 동작을 두 짧은 문장 이내로 씁니다. 앞 요약의 전체 흐름을 반복하거나
    함수·클래스 이름과 범위 경고를 나열하지 않습니다.
  sources:
  - virtual-buffer-allocation
  - cam-request-buffers
  - pattern-frame
  - allocator-to-camera
  - camera-export
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 시도
    reject_patterns:
    - pattern: 물리|하드웨어|ISP|성능|검증 범위
      message: Keep the execution limits at the end of the page, without repeating
        them in this implementation explanation.
  prompt: ' 이 항목에는 물리 센서·ISP·하드웨어 DMA·성능의 범위 경고를 덧붙이지 마세요. 페이지 끝의 검증 범위가 이미 설명합니다.
    질문에 명시된 버퍼·변환·완료 조건만 유지하세요.'
- id: completion
  question: 기준 소스에서 확인한 가상 요청 처리를 네 짧은 문장 400자 이내로 설명하세요. 가상 요청은 비동기 전달되고 VirtualCameraData::processRequest가
    목표 시각까지 기다린 뒤 패턴 작성을 시도합니다. 생성 실패는 FrameError로 표시되며 버퍼 완료 신호만으로 성공을 단정하지 않습니다.
    completeBuffer가 모든 버퍼 완료를 반환할 때만 completeRequest로 이어지고, 통지할 순서가 된 완료 요청은 requestCompleted
    신호에 연결된 cam 콜백으로 전달됩니다. 앞선 요청이 아직 미완료이면 뒤 요청의 통지는 보류됩니다. sleep_until·RequestPending·supported_formats
    같은 내부 식별자와 cam 후속 처리의 반복 설명은 쓰지 마세요. VirtualCameraData::processRequest는 cam의 처리
    함수와 구분할 수 있도록 클래스 이름을 유지하되 다른 긴 함수 이름은 나열하지 마세요. 정확한 실행 시각이나 성능을 보장하지 마세요. 생성
    실패의 FrameError는 요청 상태가 아니라 버퍼의 프레임 메타데이터 상태에 기록됩니다. 반드시 버퍼 메타데이터를 주어로 명시하고 요청이
    FrameError 상태가 된다고 쓰지 마세요. completeBuffer의 반환값은 요청의 모든 버퍼가 완료됐는지를 나타내는 불리언입니다.
    값이 true일 때만 completeRequest를 호출한다고 명시하고, 버퍼 완료들을 반환한다는 표현은 쓰지 마세요. 버퍼 완료 신호 자체를
    성공을 가정하거나 판단하는 주어로 삼지 마세요. 신호를 받았다는 사실만으로 프레임 생성이 성공했다고 판단할 수 없다는 관계를 명확히 하세요.
    이 관계는 영어 번역에서도 보존되어야 합니다.
  sources:
  - virtual-queue
  - virtual-frame
  - virtual-completion
  - pipeline-completion
  - camera-notification
  - cam-signal-connection
  - pipeline-dispatch
  - camera-queue
  - virtual-start
  - pipeline-register
  max_statements: 1
  answer_contract:
    basis: implementation
    reject_patterns:
    - pattern: 물리|하드웨어|ISP|성능|검증 범위
      message: Keep the execution limits at the end of the page, without repeating
        them in this implementation explanation.
  prompt: ' 이 항목에는 물리 센서·ISP·하드웨어 DMA·성능의 범위 경고를 덧붙이지 마세요. 페이지 끝의 검증 범위가 이미 설명합니다.
    질문에 명시된 버퍼·변환·완료 조건만 유지하세요.'
