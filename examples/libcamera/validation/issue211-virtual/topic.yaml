parts:
- id: purpose
  role: summary
  question: 고정 libcamera 소스에서 분석한 virtual 파이프라인의 개요를 세 짧은 문장으로 설명합니다. 첫 문장은 고정 소스 분석이라는 범위와, 실제 센서 대신
    Virtual2 400x300 lines 패턴을 공급하는 virtual 기능입니다. 둘째 문장은 할당이 성공한 뒤 cam이 실제 DMA-BUF 버퍼를 붙인 요청의 전달을 준비하는
    관계입니다. 셋째 문장은 CPU가 NV12 변환과 매핑된 버퍼 쓰기를 모두 시도한다는 뜻입니다. 변환 성공을 단정한 뒤 쓰기만 시도한다고 나누지 않습니다. 완료 조건은 뒤 항목이
    맡으므로 반복하지 않습니다. 구현 클래스·함수·enum 이름은 근거에 남기고 이 개요에서는 쓰지 않습니다.
  sources:
  - virtual-purpose
  - virtual2-config
  - virtual-buffer-allocation
  - virtual-queue
  - virtual-frame
  - pattern-frame
  - virtual-completion
  - pipeline-dispatch
  - pipeline-completion
  - camera-notification
  - cam-request-buffers
  - cam-signal-connection
  - allocator-to-camera
  - camera-export
  - camera-queue
  - virtual-start
  - pipeline-register
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 소스
    - - virtual
    - - CPU
    - - NV12
    - - 매핑
    - - 시도
    - - Virtual2
    reject_patterns:
    - pattern: 그림.{0,12}없
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 확인되지
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 미확인
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: ::|CameraSession|TestPatternGenerator|변환하고|변환하여|변환한
      message: Use plain overview prose. Both NV12 conversion and the mapped-buffer write are attempts;
        do not assert conversion success before an attempted write.
  prompt: 직접적인 주어와 짧은 동사로 설명하세요. CPU의 변환과 쓰기는 함께 시도되는 경로입니다. 구체적 구현 식별자와 다른 항목의 동작을 반복하지 마세요.
- id: buffer
  question: '패턴 생성기가 쓰기 방향 동기화 범위 안에서 버퍼를 쓰기용으로 매핑한다는 조건 한 가지만 한 짧은 문장으로 설명하세요. CPU의 NV12 변환·매핑 버퍼 쓰기
    시도는 개요가 이미 설명했으므로 이 단위에서는 반복하지 않습니다. 구현 클래스·함수·enum 이름은 쓰지 않습니다. DmaSyncer, MappedFrameBuffer, SyncType,
    MapFlag, fd, 평면 번호와 :: 식별자는 모두 근거에 남기고 이 문장에는 넣지 마세요. 패턴 생성기, 쓰기 동기화 범위, 쓰기용 버퍼 매핑이라는 개념만 쉬운 한국어로
    표현합니다.'
  sources:
  - virtual-buffer-allocation
  - cam-request-buffers
  - pattern-frame
  - allocator-to-camera
  - camera-export
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 시도
    reject_patterns:
    - pattern: 물리|하드웨어|ISP|성능|검증 범위
      message: Keep the execution limits at the end of the page, without repeating them in this implementation
        explanation.
    - pattern: ::|exportFrameBuffers|startCapture|addBuffer|ARGBToNV12|MappedFrameBuffer|DmaSyncer|generateFrame
      message: 'Do not name DmaSyncer, MappedFrameBuffer, enums, functions, :: identifiers or file descriptors
        in this sentence. Describe the pattern generator mapping for writing inside the write synchronization
        scope in plain Korean only.'
  prompt: 패턴 생성기를 주어로 쓰기 동기화 범위와 쓰기용 매핑 조건만 한 문장으로 설명합니다.
- id: completion
  question: 기준 소스에서 확인한 가상 요청 처리를 네 짧은 문장 400자 이내로 설명하세요. 가상 요청은 비동기 전달되고 VirtualCameraData::processRequest가
    목표 시각까지 기다린 뒤 패턴 작성을 시도합니다. 생성 실패는 FrameError로 표시되며 버퍼 완료 신호만으로 성공을 단정하지 않습니다. completeBuffer가 모든
    버퍼 완료를 반환할 때만 completeRequest로 이어지고, 통지할 순서가 된 완료 요청은 requestCompleted 신호에 연결된 cam 콜백으로 전달됩니다. 앞선
    요청이 아직 미완료이면 뒤 요청의 통지는 보류됩니다. sleep_until·RequestPending·supported_formats 같은 내부 식별자와 cam 후속 처리의 반복
    설명은 쓰지 마세요. VirtualCameraData::processRequest는 cam의 처리 함수와 구분할 수 있도록 클래스 이름을 유지하되 다른 긴 함수 이름은 나열하지
    마세요. 정확한 실행 시각이나 성능을 보장하지 마세요. 생성 실패의 FrameError는 요청 상태가 아니라 버퍼의 프레임 메타데이터 상태에 기록됩니다. 반드시 버퍼 메타데이터를
    주어로 명시하고 요청이 FrameError 상태가 된다고 쓰지 마세요. completeBuffer의 반환값은 요청의 모든 버퍼가 완료됐는지를 나타내는 불리언입니다. 값이 true일
    때만 completeRequest를 호출한다고 명시하고, 버퍼 완료들을 반환한다는 표현은 쓰지 마세요. 버퍼 완료 신호 자체를 성공을 가정하거나 판단하는 주어로 삼지 마세요.
    신호를 받았다는 사실만으로 프레임 생성이 성공했다고 판단할 수 없다는 관계를 명확히 하세요. 이 관계는 영어 번역에서도 보존되어야 합니다.
  sources:
  - virtual-queue
  - virtual-frame
  - virtual-completion
  - pipeline-completion
  - camera-notification
  - cam-signal-connection
  - pipeline-dispatch
  - camera-queue
  - virtual-start
  - pipeline-register
  max_statements: 1
  answer_contract:
    basis: implementation
    reject_patterns:
    - pattern: 물리|하드웨어|ISP|성능|검증 범위
      message: Keep the execution limits at the end of the page, without repeating them in this implementation
        explanation.
  prompt: ' 이 항목에는 물리 센서·ISP·하드웨어 DMA·성능의 범위 경고를 덧붙이지 마세요. 페이지 끝의 검증 범위가 이미 설명합니다. 질문에 명시된 버퍼·변환·완료 조건만
    유지하세요.'
