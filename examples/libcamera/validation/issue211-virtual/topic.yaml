parts:
- id: purpose
  role: summary
  question: 기준 소스에서 확인한 공식 libcamera의 virtual 기능과 제공된 Virtual2 설정만 두 짧은 문장으로 소개하세요.
    소스 분석 결과임을 첫 문장에 밝히고, 센서 영상 대신 소프트웨어 테스트 패턴 또는 설정한 .jpg 이미지 파일을 공급한다고 설명하세요. 둘째
    문장은 Virtual2의 400x300 lines(대각선 줄무늬) 설정을 설명합니다. 220자 이내입니다. supported_formats
    같은 설정 키를 본문에 나열하지 말고 해상도·대각선 줄무늬의 설정 의미만 쉬운 말로 쓰세요.
  sources:
  - virtual-purpose
  - virtual2-config
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 소스
    reject_patterns:
    - pattern: 그림.{0,12}없
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 확인되지
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
    - pattern: 미확인
      message: 소개 단위에서 다른 단위의 근거나 그림 상태를 부정하지 말고 제공된 기능·설정만 설명하세요.
  prompt: 이 part의 제공 근거는 기능 소개와 Virtual2 설정입니다. 버퍼 준비·처리·완료 경로는 뒤의 다른 part가 별도 소스로
    설명하므로 여기서 그 경로를 검증하거나 부정하지 마세요. 그림의 존재·생성 시점·미확인 상태를 추정하지 말고 소스에 적힌 기능만 설명하세요.
    JPEG 약어 대신 .jpg 이미지 파일이라고 쓰세요.
- id: buffer
  question: 가상 영상도 실제 버퍼가 필요하며, virtual 파이프라인이 DMA-BUF를 할당하고 cam이 Request에 붙인다고 설명하세요.
    선택한 NV12 경로는 쓰기 방향 DmaSyncer 범위에서 버퍼를 매핑하고 CPU가 패턴을 NV12로 변환해 매핑된 버퍼에 쓰기를 시도한다고
    설명하세요. 변환·쓰기 성공을 무조건 보장하지 마세요. 두세 짧은 문장만 쓰고 모든 호출 계층이나 다른 항목의 경고는 반복하지 마세요.
  sources:
  - virtual-buffer-allocation
  - cam-request-buffers
  - pattern-frame
  - allocator-to-camera
  - camera-export
  max_statements: 1
  answer_contract:
    basis: implementation
    required_terms:
    - - 시도
    reject_patterns:
    - pattern: 물리|하드웨어|ISP|성능|검증 범위
      message: Keep the execution limits at the end of the page, without repeating
        them in this implementation explanation.
  prompt: ' 이 항목에는 물리 센서·ISP·하드웨어 DMA·성능의 범위 경고를 덧붙이지 마세요. 페이지 끝의 검증 범위가 이미 설명합니다.
    질문에 명시된 버퍼·변환·완료 조건만 유지하세요.'
- id: completion
  question: 기준 소스에서 확인한 가상 요청 처리를 네 짧은 문장 400자 이내로 설명하세요. 가상 요청은 비동기 전달되고 VirtualCameraData::processRequest가
    목표 시각까지 기다린 뒤 패턴 작성을 시도합니다. 생성 실패는 FrameError로 표시되며 버퍼 완료 신호만으로 성공을 단정하지 않습니다.
    completeBuffer가 모든 버퍼 완료를 반환할 때만 completeRequest로 이어지고, 통지할 순서가 된 완료 요청은 requestCompleted
    신호에 연결된 cam 콜백으로 전달됩니다. 앞선 요청이 아직 미완료이면 뒤 요청의 통지는 보류됩니다. sleep_until·RequestPending·supported_formats
    같은 내부 식별자와 cam 후속 처리의 반복 설명은 쓰지 마세요. VirtualCameraData::processRequest는 cam의 처리
    함수와 구분할 수 있도록 클래스 이름을 유지하되 다른 긴 함수 이름은 나열하지 마세요. 정확한 실행 시각이나 성능을 보장하지 마세요. 생성
    실패의 FrameError는 요청 상태가 아니라 버퍼의 프레임 메타데이터 상태에 기록됩니다. 반드시 버퍼 메타데이터를 주어로 명시하고 요청이
    FrameError 상태가 된다고 쓰지 마세요. completeBuffer의 반환값은 요청의 모든 버퍼가 완료됐는지를 나타내는 불리언입니다.
    값이 true일 때만 completeRequest를 호출한다고 명시하고, 버퍼 완료들을 반환한다는 표현은 쓰지 마세요.
  sources:
  - virtual-queue
  - virtual-frame
  - virtual-completion
  - pipeline-completion
  - camera-notification
  - cam-signal-connection
  - pipeline-dispatch
  - camera-queue
  - virtual-start
  - pipeline-register
  max_statements: 1
  answer_contract:
    basis: implementation
    reject_patterns:
    - pattern: 물리|하드웨어|ISP|성능|검증 범위
      message: Keep the execution limits at the end of the page, without repeating
        them in this implementation explanation.
  prompt: ' 이 항목에는 물리 센서·ISP·하드웨어 DMA·성능의 범위 경고를 덧붙이지 마세요. 페이지 끝의 검증 범위가 이미 설명합니다.
    질문에 명시된 버퍼·변환·완료 조건만 유지하세요.'
