id: virtual-principle
title: 가상 파이프라인이 영상을 만들고 요청 완료를 알립니다
question: 센서 없이 가상 캡처가 가능한 이유와, Virtual2의 줄무늬 영상이 실제 DMA-BUF·요청·완료 알림 경로를 거쳐 cam에
  전달되는 원리는 무엇입니까?
prompt: 기존 결론·콜백 후속 처리·재현 조건은 다른 절에 있으므로 반복하지 마세요. 소스에서 확인한 구현 원리를 새 실행 관찰로 표현하지 마세요.
  먼저 쉬운 말로 설명하고 필요한 함수 이름만 backtick으로 연결하세요. PID·JSON·해시·40자리 SHA·중복 경고는 본문에 쓰지 마세요.
  가상 영상과 실제 소프트웨어 요청 처리를 구분하며 물리 센서·ISP·하드웨어 DMA 검증을 주장하지 마세요.
