- id: request-completion-order
  topic: virtual-principle
  kind: flow
  title: 버퍼 완료와 요청 완료·순서 통지는 별개입니다
  generation: llm
  max_nodes: 8
  max_label_chars: 72
  max_edge_label_chars: 20
  condition_display: evidence
  while_conditions: true
  require_connected: true
  required_symbols:
  - PipelineHandlerVirtual::bufferCompleted
  - completeBuffer
  - FrameBuffer
  - completeRequest
  - queuedRequests_
  - RequestPending
  - requestCompleted
  - doQueueRequests
  sources:
  - virtual-completion
  - pipeline-completion
  - camera-notification
  - cam-signal-connection
  - virtual-start
  question: 버퍼 완료 뒤 요청 완료와 제출 순서 통지는 어떻게 구분되며 Pending을 만나면 어떤 작업이 이어집니까?
  prompt: n0,n3,n6의 한영 라벨만 바꿉니다. n0는 앞 가상 프레임 그림에서 나온 버퍼 완료 신호를 핸들러가 받는다는 연결입니다. n3는 현재 요청의 상태를 완료로 변경하는
    한 단계입니다. 이는 함수 전체 동작이 이 단계뿐이라는 뜻이 아니므로 only/만이라는 제한이나 호출 순서 제약 설명을 쓰지 않습니다. n3 뒤의 큐 검사·앞 Pending 검사·통지·대기
    요청 처리는 기존 개별 노드가 나타냅니다. n6는 큐 맨 앞 요청을 제출 순서대로 꺼내 requestCompleted 신호로 cam의 requestComplete 콜백에 통지한다는
    동작이며 다음 콜백 그림으로 연결됨을 짧게 표시합니다. critical requestCompleted와 requestComplete 이름은 보존하여 cam의 실제 콜백 연결을
    명확히 합니다. 다른 모든 올바른 라벨·인용·노드·실제 조건·큐 반복은 유지합니다. 간선 authored 라벨은 한영 20자 이내로 짧게 쓰고 필수 실제 source guards는
    보존합니다. 처음부터 생성할 때 n0는 버퍼 완료 수신, n1은 이 요청의 모든 버퍼 완료 여부, n2는 이 요청의 나머지 FrameBuffer 완료 대기, n3는 현재 요청
    상태를 완료로 변경하는 단계, n4는 제출 큐에 요청이 남았는지 반복 검사, n5는 큐 맨 앞 Pending 검사, n6는 완료된 맨 앞을 꺼내 cam에 순서 통지하고 n4로
    반복, n7은 후속 대기 요청 처리입니다. n1 false→n2, true→n3→n4, n4 true→n5, false→n7, n5 true→n7, false→n6→n4입니다.
    실제 분기 조건과 source symbol은 보존하고 내부 변수·호출 이름은 화면 라벨에 쓰지 않습니다.
  answer_contract:
    basis: implementation
    reject_patterns:
    - pattern: (?m)^[^·\n]*(?:::|queuedRequests_|doQueueRequests|complete\(\)|call order|호출 순서)
      message: Only authored visible labels must omit qualified functions, queuedRequests_, doQueueRequests,
        complete() and internal call-order detail. Preserve the source guards in evidence; their automatic
        suffix is intentionally excluded from this readability rule.
    - pattern: must notify|알려야|통지해야
      message: n3 only marks the request complete; notifications occur later at the ordered queue-head
        notification node, not as an obligation or immediate action at n3.
    - pattern: (?i)\bonly\b|표시만|표시만\s*함|순서 제약|call order
      message: A node describes a completion-marking step, not the entirety of completeRequest. Do not
        claim only/sole behavior or add an internal call-order aside; later nodes show ordered notification
        and waiting work.
  answer_contract_en:
    basis: implementation
    reject_patterns:
    - pattern: (?m)^[^·\n]*(?:::|queuedRequests_|doQueueRequests|complete\(\)|call order|호출 순서)
      message: Only authored visible labels must omit qualified functions, queuedRequests_, doQueueRequests,
        complete() and internal call-order detail. Preserve the source guards in evidence; their automatic
