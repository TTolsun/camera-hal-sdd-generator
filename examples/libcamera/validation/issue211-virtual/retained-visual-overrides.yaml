    callLater, processRequest 진입 처리 한도, 선택 싱크 처리와 requeue 저장 및 개수 증가, 증가 후 처리 한도,
    captureDone, 저장된 requeue의 싱크 보유 판정입니다. n9는 queueCount_ 제출 개수가 설정 한도에 도달했는가를 묻는
    결정 노드, n10은 sinkRelease에서 버퍼를 유지해 요청을 재사용하는 노드, n11은 queueCount_를 늘리고 카메라에 실제
    제출을 시도하는 queueRequest 노드입니다. n8의 !requeue true는 보유이므로 processRequest에서 반환하고, 이후
    싱크가 requestProcessed를 낼 때 연결된 sinkRelease(n10)로 이어짐을 짧은 간선에 명시하세요. n10에서 제출 한도
    도우미 n9로 갑니다. n8의 false는 processRequest에서 버퍼 유지 재사용 뒤 n9로 갑니다. n9에서 captureLimit_
    && queueCount_ >= captureLimit_가 true이면 실제 제출 없이 해당 함수가 반환(n2)하며, false이면 n11의
    제출 시도로 갑니다. 처리 개수 한도와 제출 개수 한도는 서로 다른 카운터입니다. 모든 결정은 현재 source condition_ref를
    고르고 인용 근거를 붙이세요. 싱크 보유 이후 경로를 현재 함수의 동기 실행처럼 표현하지 말고, requestProcessed가 발생한 뒤의
    콜백이라는 시점을 드러내세요. 재제출은 이전 실패를 전제한 retry가 아닙니다. 한영 라벨은 행동·판정·조건만 짧게, 코드 식별자는 필요한
    경우 한 번만 쓰세요. 긴 원시 식은 근거 영역에 두고 한글 노드 30자·영문 60자 안팎, 간선은 가능한 더 짧게 씁니다. 노드12개 한도를
    넘기지 마세요. 최신 대조 지적: n4 첫 등장에는 CameraSession::processRequest를 표시합니다. n9 질문과 참 간선은
