    요청을 꺼내 Camera의 requestCompleted 신호로 cam에 통지한 뒤 n4로 돌아가 다음 맨 앞을 검사합니다. 이 반복은 제출
    순서를 보장합니다. 큐 선두는 현재 완료 표시한 요청과 같을 수도 다를 수도 있습니다. 앞의 완료 요청들을 이미 통지한 뒤 Pending에서
    멈출 수도 있으므로 Pending 분기를 이번 호출의 통지 0건으로 표현하지 않습니다. n2와 n7은 서로 다른 결과이며 합치지 않습니다.
    n7은 함수 종료나 반환이 아니라 통지 반복 뒤에도 계속되는 doQueueRequests 작업입니다. 실제 while 및 Pending guard의
