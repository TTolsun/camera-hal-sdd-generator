    모두 끝나면 초기 제출 종료임을 표시합니다. 내부 sink_ 식별자와 군더더기 긴 문장을 표시에서 빼세요. 준비 중 오류와 카메라 시작·제출 한도·증가·큐 반환 오류의 실제 기존
