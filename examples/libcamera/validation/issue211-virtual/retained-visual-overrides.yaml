- id: completion-flow
  topic: flow
  kind: decision
  title: 기록된 출력 싱크 미요청 콜백 경로
  generation: llm
  max_nodes: 10
  required_symbols:
  - CameraSession::requestComplete
  - RequestCancelled
  - requestComplete
  - callLater
  - CameraSession::processRequest
  - processRequest
  - captureCount_
  - captureLimit_
  - captureDone
  - Request::ReuseBuffers
  question: 기록된 출력 싱크 미요청 경로에서 완료 콜백은 어떤 처리와 종료로 이어집니까?
  prompt: '이 그림의 범위는 명령과 app-start 소스로 확인한 출력 싱크 미요청 경로입니다. 열 노드: n0 CameraSession::requestComplete,
    n1 RequestCancelled 판정, n2 requestComplete 반환, n3 callLater, n4 CameraSession::processRequest
    진입 한도 설정 AND 도달 판정, n5 processRequest 반환(종료 신호 없음), n6 프레임 정보 출력·captureCount_
    증가, n7 증가 후 한도 설정 AND 도달 판정, n8 captureDone 후 processRequest 반환, n9 버퍼 유지 재사용
    후 제출 도우미 호출. n0→n1, 취소면 n2, 아니면 n3→n4, 진입 한도면 n5, 그 밖에는 n6→n7, 증가 후 한도면 n8, 그
    밖에는 n9입니다. 처리·제출 도우미는 다음 별도 그림에서 상세히 설명합니다. 반환 노드 이름에는 각각 requestComplete 또는 processRequest를
    명시해 합치지 마세요. 취소 분기는 소스에 있으나 이번 실행에서 동적으로 시험한 분기가 아닙니다. 출력 옵션을 선택한 FrameSink 비동기
    보유 경로를 이 선택된 명령의 그림에 섞지 마세요. 거짓 한도 분기는 미설정 OR 미도달을 뜻합니다. 실제 source condition_ref를
    쓰고, authored 라벨에는 true/false를 반복하지 마세요. 간선은 핵심 조건, 노드는 핵심 동작만 짧게 씁니다. 화살표는 짧은
    조건·이벤트만 씁니다. 노드에 있는 동작을 문장으로 반복하지 말고 무조건 간선은 두세 단어의 짧은 연결어만 씁니다. 상세 조건은 본문과 근거에서
    확인합니다.'
  sources:
  - callback-and-processing
  - app-start
  - session-state
  max_label_chars: 72
  condition_display: evidence
  answer_contract_en:
    basis: implementation
    reject_patterns:
    - pattern: \bretry\b
      message: Resubmission is not retry after failure.
    - pattern: \btrue\b[^\n]*\btrue\b|\bfalse\b[^\n]*\bfalse\b
      message: Avoid duplicate automatic branch markers.
  require_connected: true
  answer_contract:
    basis: implementation
  max_edge_label_chars: 40
- id: submission-gate
  topic: flow
  kind: decision
  title: 재사용 뒤 제출 도우미가 실제 제출 여부를 정합니다
  generation: llm
  max_nodes: 5
  required_symbols:
  - Request::ReuseBuffers
  - CameraSession::queueRequest
  - queueCount_
  - return
  - camera_
  question: 재사용한 요청이 제출 도우미에서 반환되거나 카메라에 제출되는 조건은 무엇입니까?
  sources:
  - reuse-call
  - submission-limit
  max_label_chars: 72
  condition_display: evidence
  require_connected: true
  prompt: '다섯 노드: n0 버퍼 유지 재사용, n1 CameraSession::queueRequest 도우미 호출, n2 제출 한도 설정
    AND queueCount_ 도달 판정, n3 queueRequest 도우미의 실제 제출 없는 반환, n4 카메라 제출 시도입니다. n0→n1→n2,
    실제 소스 한도 조건이 참이면 n3, 거짓(미설정 OR 미도달)이면 n4입니다. 이 도우미는 호출 자체가 제출 보장이 아니며 처리 개수와 제출
    개수는 다릅니다. n3 반환 주체는 CameraSession::queueRequest라고 분명히 쓰고, n4는 성공 보장이 아닌 시도라고 씁니다.
    전체 C++ 호출식·부등식은 근거에 두고 필요한 함수 이름과 짧은 조건만 라벨에 씁니다. true/false는 시스템이 붙이므로 authored
    라벨에 쓰지 마세요. 화살표는 짧은 조건·이벤트만 씁니다. 노드에 있는 동작을 문장으로 반복하지 말고 무조건 간선은 두세 단어의 짧은 연결어만
    씁니다. 상세 조건은 본문과 근거에서 확인합니다. 그림의 시작점은 앞선 소스 경로에서 이미 버퍼를 유지해 재사용한 상태입니다. n0→n1과
    n1→n2는 condition_ref always이며 requeue를 새로 판정하는 간선을 넣지 마세요. requeue 판정은 재사용 전의
    본래 소스 위치에 있으며 출력 싱크 미요청이라는 전제에서 이미 통과한 조건입니다. 노드나 간선 라벨과 condition_ref에 requeue를
    넣지 마세요. reuse-call 근거는 이전 조건 검사를 이미 지난 뒤의 두 호출만 선택합니다. 앞선 콜백·requeue 조건을 이 그림으로
    옮기지 마세요.'
  answer_contract_en:
    basis: implementation
    reject_patterns:
    - pattern: \bretry\b
      message: Resubmission is not retry after a failure.
    - pattern: requeue
      message: This figure starts after reuse; do not move its earlier requeue guard
        after reuse.
  max_edge_label_chars: 40
  answer_contract:
    basis: implementation
    reject_patterns:
    - pattern: requeue
      message: This figure starts after reuse; do not move its earlier requeue guard
        after reuse.
- id: reproduction-flow
  topic: reproduce
  kind: flow
  title: 환경 확인에서 재현 실행까지
  generation: llm
  max_nodes: 10
  required_symbols:
  - Kconfig
  - WSL
  - Docker
  - udmabuf
  - run_cam
  - completed_frames
  question: 기록된 재현 절차에서 현재 환경 조사, 필요한 공유 호스트 변경의 별도 승인, 지원 커널 부팅과 장치 접근 확인, 공식 cam
    재현 실행은 어떤 준비 순서로 이어집니까?
  prompt: 이 그림은 기본 커널로 원복한 후 기록된 특정 시험 조건을 다시 준비하는 경로입니다. 조사·무영향 준비 → 호스트 변경 계획·별도
    승인 → Docker 중지 필요 여부 결정 → 필요시 중지 → 승인된 시험 커널 설치·부팅 → 조건 일치 결정 → cam 실행 순서입니다.
    이 기록된 재현 경로에서는 실제 호스트 변경인 커널 설치·부팅 전에 별도 호스트 승인이 필수입니다. 무영향 준비는 승인 전에도 합니다. Docker
    중지 여부만 승인 계획에 따른 조건부 분기입니다. 조건 일치 결정은 기록된 커널·장치 접근·Virtual2 400 x 300 NV12 모두를
    포함하며, 불일치하면 캡처 중단하는 별도 노드로 연결하세요. 접근 하나만 맞으면 실행하는 것으로 그리지 마세요. Docker 결정과 중지는
    별도 노드이며 같은 Docker 식별자를 쓸 수 있습니다. 시험 커널 설치·부팅과 조건 확인은 중지 여부와 별개로 필요합니다. 노드 한국어
    24자·영어 48자, 간선 한국어 12자·영어 28자 이내의 짧은 구절을 쓰세요. 전체 문장과 중복 조건을 쓰지 마세요. 이 시험의 root
    접근 조건은 근거에 남기고 일반 권한 변경 지침을 쓰지 마세요. 이전 네이티브 초안이 있으면 나머지 올바른 부분을 보존하고 조건 일치 노드의
    udmabuf를 root의 /dev/udmabuf 접근 가능으로 한영 모두 명확히 하세요. 커널과 Virtual2 400 x 300 NV12
    일치 조건도 유지하세요. 이번 수정에서는 이전 초안의 나머지 구조를 보존하세요. 영향 없는 커널 준비는 조사와 함께 승인 전에 가능하며, 승인
    후 커널 노드는 실제 호스트 변경인 설치·부팅으로 표시하세요. 승인 간선은 한영 모두 호스트 변경 실행 직전이라는 시점을 분명히 하며, cam
    실행 직전이라는 의미의 run을 쓰지 마세요. 같은 한국어 레이블에는 같은 영어 레이블을 쓰세요. 조건 일치 결정 노드는 반드시 한영 모두
    '기록된 시험 커널'이라는 대상과 root의 /dev/udmabuf 접근 가능, Virtual2 400 x 300 NV12를 함께 명시하세요.
    이전 초안의 다른 올바른 구조는 보존하세요. 이번 수정은 올바른 기존 흐름·분기·조건을 보존하며 한영 라벨만 짧게 정리합니다. 라벨에 전체
    문장·중복 해명·번호를 쓰지 말고 행동이나 판정만 씁니다. 한글 노드 24자·영문 48자 안팎, 간선은 더 짧게 쓰되 재현 조건 판정 노드에
    필요한 기록된 시험 커널·root의 /dev/udmabuf 접근·Virtual2 400 x 300 NV12 조건은 한영 모두 유지합니다. 긴
    식별자 중간 줄바꿈을 피하고 개별 영문 토큰은 28자 이내로 씁니다. 해상도는 한영 모두 반드시 숫자를 공백으로 분리한 400 x 300으로
    표기하세요. 400x300처럼 붙이면 기존 필수 용어 검사에서 400과 300의 개별 토큰이 없어 거부됩니다. 숫자 자체를 생략하지 마세요.
    공식 cam 실행 노드는 세 번의 독립 실행과 각 새 증거 생성을 뜻한다고 한영 라벨에 표시하세요. 기존 마지막 실행 노드 뒤에 새 증거의
    카메라·적용 구성·3프레임·정상 종료를 확인하는 결과 검증 노드를 하나 추가하세요. 이 노드는 completed_frames 원문이 포함된
    측정 근거와 재현 절차를 인용합니다. 현재 9개 노드를 10개로 늘리되 기존 max_nodes 10을 넘기지 않습니다. 결과 노드의 상세 필드명과
    수치는 근거에서 확인하며 짧고 분명한 검증 동작만 표시하세요. 화살표는 짧은 조건·이벤트만 씁니다. 노드에 있는 동작을 문장으로 반복하지 말고
    무조건 간선은 두세 단어의 짧은 연결어만 씁니다. 상세 조건은 본문과 근거에서 확인합니다.
