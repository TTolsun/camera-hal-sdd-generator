      message: Express queuing/dispatching request work asynchronously inside the validated camera call,
        not resource reservation.
    - pattern: (?m)^[^·\n]*(?:카메라 세션|camera session)
      message: This gate checks camera_->start(), not all of CameraSession::startCapture.
