  question: 기록된 출력 싱크 미요청 경로에서 완료 콜백은 어떤 처리와 종료로 이어집니까?
  prompt: 현재 그래프의 구조·소스 인용을 유지하고 한영 라벨을 새로 간결하게 작성하세요. 노드는 한 행동 또는 한 질문, 간선은 1~3단어의 짧은 관계나 결과만 표시합니다.
    노드의 전체 조건이나 행동을 간선에 반복하지 않습니다. 실제 조건은 condition_ref와 인용에서 유지하고 true/false는 자동 표시를 사용합니다. 함수·변수 이름은
    source symbol과 근거에서 보존하며 화면은 쉬운 행동으로 설명합니다. 노드와 간선의 ID·shape·quote_ids, from·to·condition_ref 및 분기·반복·후속
    처리 구조는 그대로 유지합니다. 한국어와 영어의 주체·조건·결과는 같습니다. 각 간선의 한영 authored 라벨은 20자 이하입니다. 실패를 성공으로 바꾸거나 호출을 제출 성공으로
    강화하지 않습니다. 기록된 출력 싱크 미요청 경로입니다. 취소 시 requestComplete 반환, callLater 후 이벤트 루프 processRequest 진입, 한도
    설정 AND 도달의 진입 검사와 증가 후 검사, 서로 다른 반환·captureDone 결과, Request::ReuseBuffers 후 제출 도우미 호출을 구분합니다. 아래는
    라벨을 제거한 기존 구조이며 실제 새 CLI가 라벨을 작성하고 모든 검사를 통과해야 합니다.
  sources:
  - callback-and-processing
  - app-start
  - session-state
  max_label_chars: 52
  condition_display: evidence
  answer_contract_en:
    basis: implementation
    reject_patterns:
    - pattern: \bretry\b
      message: Resubmission is not retry after failure.
    - pattern: \btrue\b[^\n]*\btrue\b|\bfalse\b[^\n]*\bfalse\b
      message: Avoid duplicate automatic branch markers.
  require_connected: true
  answer_contract:
    basis: implementation
  max_edge_label_chars: 20
