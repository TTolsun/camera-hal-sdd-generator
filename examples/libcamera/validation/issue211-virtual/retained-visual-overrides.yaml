    완료 표시, Camera/requestCompleted 통지 주체와 후속 큐 처리의 차이는 유지합니다. authored true/false를
    시스템 표시와 중복하지 않습니다. 각 노드는 72자, authored 간선은 40자 이내이며 영어는 자연스러운 짧은 문장을 우선합니다. 최종
    가독성 보완: 실제 큐 반복·세 결정·서로 다른 두 결과와 source 인용은 보존하고 n4의 queuedRequests_, n7의 doQueueRequests,
    함수 종료 아님 같은 내부 이름·부정 주석은 한영 화면 라벨에서 빼세요. n4는 제출 큐에 요청이 남았는지, n5는 맨 앞 요청이 아직 미완료인지,
    n6는 완료된 맨 앞을 꺼내 cam에 순서대로 알림, n7은 다음 대기 요청 처리라는 짧은 동작이면 됩니다. 근거의 함수·변수 식별자와 고정
    symbol은 그대로 보존합니다. n2 남은 버퍼 대기와 n7 후속 요청 처리는 별도 노드로 유지합니다. 종료·반환을 새로 주장하지 마세요.'
