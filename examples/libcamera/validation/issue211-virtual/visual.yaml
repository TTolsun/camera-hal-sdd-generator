question: 선택한 NV12 가상 캡처에서 실제 버퍼 준비와 요청 전달, CPU 패턴 쓰기, 버퍼·요청 완료 및 cam 콜백은 어떻게 연결됩니까?
prompt: '선택한 Virtual2 NV12 가상 캡처의 핵심 원리를 11개 노드로 설명하세요. schema가 고정한 symbol과 실제 quote_ids를
