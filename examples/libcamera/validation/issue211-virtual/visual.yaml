    message: 화면 라벨은 짧은 행동·판정으로 쓰고 함수 식별자는 본문·근거에 남기세요. 내부 symbol·quote_ids는 보존하세요.
  - pattern: (?i)returns\s+0|0\s*반환|큐\s*처리|\bdrain\b
    message: 핵심 독자 경로에 필요하지 않은 반환값·후속 큐 설명은 본문과 근거로 옮기세요.
  - pattern: (?i)sync,\s*then|동기화 후
    message: CPU 쓰기 동기화가 매핑·변환 접근을 감싸는 범위임을 표시하세요.
  - pattern: 버퍼를\s*확보합니다|매핑합니다
    message: Allocation and mapping labels describe attempts, not guaranteed success. Use Korean attempt
      verbs for n0/n3.
  - pattern: (?m)^[^·\n]*(?:exportFrameBuffers|queueRequestDevice|\baddBuffer\b|generateFrame|ret\s*[<>=])
    message: Keep implementation function names and literal return-value guards in evidence. Use brief
      actions/decisions in authored visible labels; preserve actual symbol bindings and conditions. VirtualCameraData::processRequest
      remains the necessary scheduled target identity.
  - pattern: 변환하고|변환한 뒤
    message: Both conversion and mapped-buffer writing are attempted; do not assert prior conversion success.
  - pattern: (?m)^[^·\n]*(?:실패|\bfail(?:ed|s|ure)?\b|cancelRequest|\bprepare\b)
    message: 'This selected virtual handler returns zero: omit generic failure cancellation. Keep the
      pre-cancelled request branch. Use plain preparation wording and error for frame-generation errors.'
  - pattern: (?m)^[^·\n]*(?:\blog\b|로그)
    message: Keep logging details in evidence; the sole conversion-to-result edge returns either success
      or error, not only an error.
  - pattern: (?i)버퍼\s*요청|\bbuffer requests?\b|\brequests? cam attaches\b
    message: cam attaches DMA-BUF buffers TO a request; PipelineHandler prepares that request. Do not
      call the request a buffer request or say cam attaches the request.
  - pattern: 프레임 처리를 예약
    message: The queued action processes a request with its target timestamp; make the actual request-processing
      action explicit.
  - pattern: cam.{0,12}통지|다음\s*그림
    message: Buffer completion is not immediate cam request notification; keep separate request-completion/order
      checks explicit.
  - pattern: 가상 장치가.{0,35}예약
    message: The virtual pipeline handler schedules request processing on the virtual camera data object;
      identify the actual caller.
  - pattern: '정상: FrameSuccess 설정|Sets FrameSuccess'
    message: FrameSuccess is initialized before generation; successful generation preserves it instead
      of setting it afterward.
