question: 가상 파이프라인은 실제 DMA-BUF 버퍼를 어떻게 확보하고 CPU 패턴을 기록해 버퍼 완료를 알립니까?
prompt: 고정된 7개 symbol 바인딩만 사용하여 버퍼 완료 신호까지 설명합니다. n0 cam이 virtual 파이프라인을 통해 실제 DMA-BUF
  확보, n1 Camera가 버퍼가 붙은 요청을 파이프라인에 제출, n2 VirtualCameraData::processRequest의 queued
  호출 예약, n3 패턴 생성기가 CPU 쓰기 동기화 범위 안에서 버퍼 쓰기 매핑, n4 CPU가 Virtual2 lines 패턴을 NV12로 변환해
  매핑된 버퍼에 쓰기를 시도, n5 NV12 변환 오류 여부, n6 가상 데이터의 버퍼 완료 알림입니다. n0→n1→n2→n3→n4→n5와 n5의
  참/거짓→n6만 그립니다. n5 참이면 버퍼 메타데이터 FrameError, 거짓이면 FrameSuccess 유지입니다. 변환 결과와 무관하게
  버퍼 완료 신호는 나가므로 성공 보장으로 쓰지 않습니다. n2 호출 예약이 비동기이고 queueRequestDevice 자체가 비동기 호출되는
  뜻은 아닙니다. n3의 매핑 주체는 패턴 생성기입니다. source-bound 실제 변환 결과 조건을 인용하고 나머지는 always인 핵심 경로
  요약입니다. 요청 완료·큐 순서 검사는 다음 별도 그림이 설명합니다. 노드와 간선은 짧은 행동·결과만 쓰고 함수명 괄호 주석과 긴 반환값 설명은
  근거로 남깁니다. n2는 VirtualCameraData::processRequest, n4는 CPU·Virtual2·lines·NV12와 mapped
  buffer에 쓰기 시도 의미를 유지합니다. requestCompleted나 후속 요청 완료 노드를 이 버퍼 그림에 넣지 않습니다. source
  인용에는 양 끝 symbol과 실제 guard가 있어야 합니다. 동기화는 매핑과 CPU 접근을 감싸는 범위이며 sync then/동기화 후라고
  쓰지 않습니다. 간선은 가상 전달임을 분명히 하고 변환 오류 판정 전체를 반복하지 않습니다.
