question: 선택한 NV12 가상 캡처에서 실제 버퍼 준비와 요청 전달, CPU 패턴 쓰기, 버퍼·요청 완료 및 cam 콜백은 어떻게 연결됩니까?
prompt: 선택한 Virtual2 NV12 가상 캡처의 핵심 원리를 11개 노드로 설명하세요. schema가 고정한 symbol과 실제 quote_ids를 보존하되 화면 라벨에는 함수명 접두사를 쓰지 말고 짧은 동작·판정만
  한영 각각 44자 이내로 씁니다. 앞부분은 캡처 전 DMA-BUF 준비, 버퍼가 붙은 요청 제출, 준비된 요청의 가상 비동기 전달, 쓰기 방향 CPU 접근 동기화와 쓰기 가능한 DMA-BUF 매핑, 소프트웨어 줄무늬
  템플릿의 CPU NV12 변환 시도, 생성·변환 결과 판정 순서입니다. MappedFrameBuffer 노드는 쓰기 매핑을, ARGBToNV12 노드는 소프트웨어 패턴을 CPU가 NV12로 변환해 매핑된 버퍼에 기록하려는
  시도를 보여 주세요. Virtual2·NV12·CPU를 라벨에 유지하세요. generateFrame 노드는 선택한 NV12 변환 함수의 반환값이 0이 아닌가를 판정합니다. 별도의 CPU 메모리 쓰기 오류 검사나 모든
  오류를 잡는 검사라고 쓰지 마세요. 변환 결과 true(0 아님)는 버퍼 프레임 메타데이터 FrameError 설정, false(0)는 FrameSuccess 유지 후 같은 버퍼 완료 신호로 이어집니다. 신호는 연결된
  핸들러가 받아 요청의 모든 버퍼가 완료됐는지를 completeBuffer 심볼의 결정에서 검사합니다. true면 현재 요청 완료 표시·제출 순서 확인으로, false면 이번 핸들러 호출만 끝나는 말단으로 갑니다. 마지막
  필수 심볼 PipelineHandlerVirtual::bufferCompleted는 말단이며 나가는 간선이 없습니다. 완료 표시에서 cam 콜백으로 가는 선은 순서가 된 완료 요청에 한해 신호를 보낸다는 요약이며,
  앞선 요청이 아직 미완료이면 뒤 통지를 보류하는 조건을 짧게 유지합니다. 모든 11개 노드를 연결하고 두 실제 결정의 true/false 결과를 모두 표시하세요. 전체 큐 순회·후속 큐 처리·일반 호출자의 취소·내부
  반환 0 설명은 생략합니다. 사전 준비에서 요청 제출, 요청 제출에서 가상 전달, 가상 전달에서 매핑, 매핑에서 CPU 변환, CPU 변환에서 결과 판정으로 가는 선은 핵심 경로 요약이므로 condition_ref
  always를 사용합니다. 준비 여부나 스트림 찾기 assert를 별도 분기로 그리지 마세요. 실제 두 결정에만 source-bound condition_ref를 사용하세요. 라벨에 = ! < > 기호를 직접 쓰지
  않습니다. Edge 인용은 양 끝의 symbol을 모두 포함해야 하므로 함수 선언이 다른 구절에 있으면 선언 구절도 함께 인용하세요. 예를 들어 virtual-queue:0에 queueRequestDevice 선언이
  있습니다. 영어 once/only once를 쓰지 마세요.
