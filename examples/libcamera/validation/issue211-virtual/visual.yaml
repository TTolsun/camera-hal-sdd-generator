  보존하고 선은 한국어 약 16자·영어 약 32자를 우선합니다. 한영 authored 간선 라벨에는 true/false를 직접 쓰지 말고 변환 성공·변환
  오류·모든 버퍼 완료·미완료 버퍼 남음처럼 핵심 조건·결과만 짧게 쓰세요. 시스템이 조건 참/거짓 표시를 붙입니다. 간선에 노드의 전체 행동을
