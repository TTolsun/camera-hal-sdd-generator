answer_contract:
  basis: implementation
  reject_patterns:
  - pattern: cancelRequest|취소
    message: 이 가상 queueRequestDevice는 0을 반환합니다. 일반 호출자의 오류 취소를 가상 경로 라벨에 섞지 마세요.
  - pattern: ENOBUFS|errno|할당기 무효
    message: 원시 할당 오류는 접힌 소스 근거에 두고 핵심 성공 경로를 짧게 표시하세요.
  - pattern: (?m)^(?:exportFrameBuffers|queueRequest|queueRequestDevice|generateFrame|bufferCompleted|completeBuffer|completeRequest|requestCompleted|MappedFrameBuffer|(?:libyuv::)?ARGBToNV12)\s*[:：]
    message: 화면 라벨은 짧은 행동·판정으로 쓰고 함수 식별자는 본문·근거에 남기세요. 내부 symbol·quote_ids는 보존하세요.
  - pattern: (?i)returns\s+0|0\s*반환|큐\s*처리|\bdrain\b
    message: 핵심 독자 경로에 필요하지 않은 반환값·후속 큐 설명은 본문과 근거로 옮기세요.
  - pattern: (?i)sync,\s*then|동기화 후
    message: CPU 쓰기 동기화가 매핑·변환 접근을 감싸는 범위임을 표시하세요.
  - pattern: 버퍼를\s*확보합니다|매핑합니다
    message: Allocation and mapping labels describe attempts, not guaranteed success. Use Korean attempt
      verbs for n0/n3.
  required_terms:
  - - Virtual2
  - - NV12
  - - CPU
  - - lines
  - - VirtualCameraData::processRequest
