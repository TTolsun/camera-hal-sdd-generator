question: 가상 파이프라인은 실제 DMA-BUF 버퍼를 어떻게 확보하고 CPU 패턴을 기록해 버퍼 완료를 알립니까?
prompt: 앞 준비 그림에서 실제 Camera 큐 호출을 통과한 요청부터 정확히 9개 노드 n0..n8로 새로 작성합니다. n0 PipelineHandler::queueRequest는
  실제 큐 전달 수신과 prepare 준비 시작, n1 PipelineHandler::doQueueRequest는 준비 완료·큐 차례 후 cancelled_ 판정입니다. n0→n1는
  준비 완료 신호와 대기 큐 차례 조건을 짧게 명시한 주요 경로 요약 always입니다. 실제 cancelled_ guard true→n2 completeRequest는 취소 상태
  완료를 표시하고 순서 통지 경로로 보냅니다. n2 라벨은 앞선 Pending 요청이 있으면 취소 통지도 보류됨을 한영 모두 명시하며 즉시 통지를 보장하지 않습니다. false→n3
  queueRequestDevice는 queued 예약→n4 VirtualCameraData::processRequest 실행과 목표 시각 대기→n5 MappedFrameBuffer
  쓰기 동기화 범위 안 쓰기용 매핑 시도→n6 ARGBToNV12 CPU의 Virtual2 lines 패턴 NV12 변환 및 매핑 버퍼 쓰기 두 동작 시도→n7 generateFrame
  변환 오류 판정→n8 bufferCompleted입니다. n7 실제 ret<0 true/false 두 결과 모두 n8로 가며 true는 FrameError, false는 FrameSuccess입니다.
  n8는 상태와 무관한 버퍼 완료 신호이며 다음 완료·순서 그림으로 이어집니다. n0/n1 source pipeline-register와 pipeline-dispatch, n2 request-status-completion
  및 pipeline-completion 근거를 함께 확인합니다. 준비 도우미/할당/Camera API/제출 카운터를 이 그림에 다시 넣지 않습니다. 노드 60자, authored
  간선 20자, 한국어·영어 모두 짧은 행동·질문으로 씁니다. 쓰기 방향 동기화는 매핑/변환/쓰기를 둘러싸는 범위이며 그 뒤 따로 시작한다고 쓰지 마세요. 취소 분기 true/false와
  변환 오류 true/false는 실제 guard를 보존합니다. 현재 그래프 구조·노드 수·간선·심볼·실제 조건 양쪽·인용을 보존하고 지정한 라벨만 수정합니다. 다른 라벨은 유지합니다.
  현재 n5에서 프레임 생성 호출 전 FrameSuccess 초기화가 먼저 있고, 그 뒤 CPU 쓰기 동기화 범위 안에서 쓰기용 DMA-BUF 매핑을 시도함을 한영으로 명시합니다.
  초기화는 CPU 동기화 범위보다 먼저이며 매핑·변환은 동기화 범위 안입니다. 필요하면 virtual-frame의 초기화 구절을 n5 quote_ids에 추가합니다. n7 오류 true
  간선은 FrameError로 변경, false 간선은 이미 초기화된 FrameSuccess 유지로 표현합니다. 성공 상태를 결과 판정 뒤 새로 설정한다고 쓰지 않습니다. n2 영어에도
  RequestCancelled와 큐 앞부터 통지 및 앞 RequestPending에서 중단하는 관계를 최대64자로 명시합니다. 취소 상태가 해당 요청의 상태이고 큐 통지 전체가 취소
  요청만을 뜻하지 않게 합니다.
