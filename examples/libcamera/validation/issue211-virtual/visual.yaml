  MappedFrameBuffer 노드는 쓰기 동기화가 끝난 뒤 매핑한다는 의미가 아니라 CPU 쓰기 동기화 범위 안의 쓰기 매핑임을 표현하세요.
  이어지는 CPU 변환도 같은 쓰기 동기화 범위 안에서 이뤄짐을 그 연결선에서 짧게 유지합니다. sync, then 또는 동기화 후 같은 완료 선행
