question: 선택한 NV12 가상 캡처에서 실제 버퍼 준비와 요청 전달, CPU 패턴 쓰기, 버퍼·요청 완료 및 cam 콜백은 어떻게 연결됩니까?
prompt: 핵심 프레임 경로를 설명하는 9노드 개념도입니다. schema가 각 노드에 고정한 symbol과 실제 quote_ids를 보존하세요. 화면 라벨에는 함수명 접두사와 내부 반환 0·후속 큐 처리 설명을 넣지
  않고 짧은 독자 행동·판정만 씁니다. 한영 라벨 최대 44자입니다. 버퍼 준비는 캡처 전 준비이며, 버퍼 붙은 요청 제출과 가상 비동기 전달을 거쳐 CPU가 Virtual2 대각선 패턴을 NV12에 쓰기를 시도합니다.
  패턴 쓰기 노드는 시도와 반환값이 0이 아닌가를 묻는 결정입니다. true는 버퍼 프레임 메타데이터의 FrameError 설정, false는 FrameSuccess 유지 후 같은 버퍼 완료 신호로 이어집니다. Virtual2·NV12·CPU를
  라벨에 유지하세요. 스트림을 찾았다는 assert는 분기로 그리지 않으며 가상 전달에서 쓰기 시도로 가는 간선의 condition_ref는 always입니다. 버퍼 완료 신호는 연결된 핸들러로 전달되어 모든 요청 버퍼가
  완료됐는지 판정합니다. true는 현재 요청 완료 표시와 순서상 가능한 통지 처리로, false는 이번 핸들러 호출만 끝나는 말단 노드로 갑니다. 마지막 필수 심볼 PipelineHandlerVirtual::bufferCompleted
  노드는 말단이며 나가는 간선이 없습니다. 그 노드로 다시 돌아가 검사를 반복하지 마세요. 완료 표시에서 cam 콜백으로 가는 간선은 통지 순서가 된 완료 요청에 한해 신호가 나간다는 요약입니다. 앞선 요청이 아직 미완료이면
  뒤 통지가 보류된다는 조건을 짧게 유지하세요. 전체 큐 순회·후속 큐 처리·일반 호출자의 오류 취소는 이 그림의 범위가 아닙니다. 본문과 접힌 근거가 함수 이름과 상세를 제공합니다. 새 조건 ID를 사용하고 실제 두
  결정의 조건을 condition_ref에 보존하며 라벨에 = ! < > 기호를 직접 쓰지 마세요. 영어 once/only once를 쓰지 마세요. 9개 노드를 모두 실제 연결선으로 이어야 합니다. 양 결정은 각각 true와
  false 두 결과의 간선을 가지며, 단일 연결선만 내거나 노드를 고립시키면 실패합니다. 캡처 준비부터 cam 콜백까지의 핵심 경로와 이번 호출 종료 분기를 모두 연결하세요.
