question: 선택한 NV12 가상 캡처에서 실제 버퍼 준비와 요청 전달, CPU 패턴 쓰기, 버퍼·요청 완료 및 cam 콜백은 어떻게 연결됩니까?
prompt: '아홉 필수 노드만 사용해 읽기 쉬운 NV12 경로 개요를 그리세요. 사전 DMA-BUF 준비(exportFrameBuffers), cam 요청 제출(queueRequest), 가상 큐 전달(queueRequestDevice),
  CPU 패턴·NV12 버퍼 쓰기(generateFrame), 가상 버퍼 완료 알림(bufferCompleted), 모든 버퍼 완료 확인(completeBuffer), 요청 완료(completeRequest), 앱 신호(requestCompleted),
  cam 콜백(requestComplete)입니다. 함수 직접 호출과 여러 단계를 요약한 전달·데이터 공급을 구별하세요. 사전 버퍼 준비는 요청마다 실행되는 것이 아니며 cam이 Request에 붙여 큐에 넣는 관계를
  근거로 표시하세요. queueRequestDevice는 VirtualCameraData::processRequest에 비동기 전달하며 그 처리가 generateFrame을 호출합니다. generateFrame은 CPU가
  쓰기 동기화와 매핑으로 패턴을 NV12 버퍼에 쓰는 노드이고, 호출자가 반환 후 bufferCompleted를 발신합니다. 이 둘 사이의 화살표는 직접 호출이라고 쓰지 마세요. 생성 실패시 FrameError로 알림에
  실린다는 조건을 간결한 라벨에 남기세요. completeBuffer가 모든 버퍼 완료를 반환한 경우에만 completeRequest로 가며 이 조건을 condition_ref와 한영 라벨로 유지하세요. 일반 파이프라인의
  제출 순서 완료와 requestCompleted의 cam requestComplete 연결을 근거로 사용하세요. 여러 소스 구절을 함께 인용하되 새로운 호출을 추측하지 마세요. 라벨에는 짧은 독자 설명을 쓰고, 제어·타임스탬프·errno·반복
  경고·C++ 포인터 화살표나 비교식은 적지 마세요. 조건식과 세부 호출은 접힌 근거에 보존됩니다. 한영 노드 라벨은 각각 24자·52자, 간선은 15자·40자 이내로 쓰세요. 노드에 문단을 옮기지 말고 명확한 주어와
  행동만 쓰세요. NV12 선택 경로와 정상 실행을 설명하며 완성 알림을 무조건 성공으로 바꾸지 마세요. 최신 Terra 지적: completeRequest 뒤에 앞 요청이 RequestPending인지 검사하는 결정
  노드를 추가하세요. true면 앞 요청 완료까지 알림을 보류하는 queuedRequests_ 대기 노드로 가며 false면 제출 순서로 requestCompleted 신호에 도달합니다. 이 두 노드를 포함하여 총 11개만
  사용하세요. 조건식의 true/false가 무엇을 가리키는지 결정 노드에서 한영 모두 명확히 보이게 하세요. completeBuffer가 모든 버퍼 완료를 반환해야 completeRequest로 가는 조건도 유지하세요.
  CPU 작성 노드 라벨에는 소프트웨어 Virtual2 lines(대각선 줄무늬) 패턴을 NV12 버퍼에 쓴다는 출처·동작을 한영 모두 짧게 표시하고 새로 제공된 virtual2-config도 인용하세요. virtual
  큐 전달을 물리 장치로 표현하지 마세요. 이전 초안의 올바른 부분을 보존하되 ''여러 단계 요약'' 같은 작성 지침을 간선 라벨로 쓰지 말고 실제 요청 전달 동작을 적으세요. 원래 9노드 지시는 이번 11노드 지시로
  대체하며 노드 36자/영어 64자까지 사용할 수 있습니다.'
