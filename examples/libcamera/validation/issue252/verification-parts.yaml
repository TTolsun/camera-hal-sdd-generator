question: 기존 호출의 기록과 함께 준비·제출·완료·정지의 실패 주입별 예상 분기와 변경 불변조건을 연결하는 검증 계획을 제시하세요. 실행 결과를 만들지 마세요. 완료 횟수는 신호 발생
  또는 특정 수신 연결을 기준으로 구분하고 여러 연결의 콜백을 중복 완료로 세지 마세요.
parts:
- id: completion-invariants
  question: 정상 내부 버퍼 완료에서는 Request::Private::completeBuffer의 pending_.erase 결과가 1이어야 하지만, bulk 취소의 doCancelRequest는
    pending 버퍼에 취소와 bufferCompleted를 직접 발생시킨 뒤 pending_를 clear하며 각 버퍼에 completeBuffer를 호출하지 않는 예외를 먼저 구분하세요.
    두 경로의 버퍼·요청 중복 완료 부재, 요청 완료 전 pending 없음, completeRequest 반환 뒤 핸들러 접근 금지와 ASSERT를 연결하고 cookie·sequence·status·버퍼
    status·pending_·신호 발생 또는 특정 연결별 알림 횟수를 기록하는 검증 계획을 세 문장 이내로 제시하세요. 여러 수신 연결을 중복 완료로 세지 마세요. bulk 취소는 정상
    경로의 setRequest(nullptr)을 실행하지 않더라도 FrameBuffer::request의 포인터 유효 구간은 버퍼 완료까지라는 계약을 적용하고 저장된 비null 값으로 수명을
    추정하지 않도록 두 경로별 재사용·지연 콜백 검증을 연결하세요.
  sources:
  - request-invariant
  - cancellation-flow
  - completion-flow
  - buffer-request
  max_statements: 2
- id: preparation-case
  question: '준비 취소 시험 계획: fence가 신호되지 않는 입력에서 timeout의 cancel→prepared 발행과 cancelled_·prepared_를 기록하고, 준비 취소도
    순번 등록·공통 완료 경로로 전달되는지 확인하도록 하세요. 미준비 선두·장치 큐 한도와 앞선 Pending 요청 때문에 실제 통지가 지연될 수 있으므로 300ms를 촬영 또는 정지 완료
    시간 보장으로 쓰지 마세요. 기대 분기와 중복 처리·반환 순서·pending 잔존 검사를 두 문장 이내로 연결하세요.'
  sources:
  - prepare-flow
  - dispatch-flow
  - completion-flow
  max_statements: 2
- id: control-qbuf-case
  question: 제출 실패 시험을 세 짧은 평서문 문단으로 계획합니다. 개별 processControl 오류가 무시되는 경우와 setControls 음수가 UVC를 거쳐 취소되는 경우를
    나누어 변환 ret·구성 제어 수·setControls ret를 기록합니다. 빈 제어 목록과 ioctl 이전 검증 실패를 먼저 분리하고 실제 제어 ioctl이 실행된 경우에만 그 호출의
    error_idx를 조사합니다. error_idx를 QBUF 구조체의 필드로 쓰지 않습니다. 다음은 cache get 성공 뒤 VIDIOC_QBUF에 음수를 주입하는 경우입니다. 확보
    index·ioctl ret·이번 scope_exit의 put 횟수와 항목 free 상태·이번 버퍼 신규 queuedBuffers_ 등록 부재를 기록하고 원래 ret 전달과 공통 취소·요청별
    알림 횟수를 앞의 완료 불변조건에 맞춰 대조합니다. 제어 처리는 선행해도 전체 요청 제어 적용이나 롤백을 단정하지 않습니다. 성공 대조군에서는 등록과 guard.release를 기록하여
    이번 queueBuffer 반환 시 자동 put이 없음을 대조하고 이후 dequeue의 별도 put과 구별합니다. cache_ 자체 부재 Fatal은 정상 음수 반환 및 cancelRequest
    도달을 보장하지 않는 별도 경우입니다. 실제 오류 주입 실행이나 복구 성공이 아니라 기록·기대 분기의 시험 계획으로 쓰고 ~인지 나열을 피하세요. 성공 대조군의 다음 DQBUF는 정적
    예상 분기로 분리합니다. DQBUF 성공과 queuedBuffers_에 존재하는 index일 때만 cache_->put 뒤 항목 erase가 실행되므로 put 횟수와 큐 상태를 대조합니다.
    DQBUF 오류와 예상 밖 index는 그 전에 nullptr로 반환하므로 이번 dequeue의 put·erase가 없다는 분기를 대조합니다. 이 소스 분기를 미확인이라고 쓰지 말고 실행
    결과나 실제 put 관측값을 만들지도 마세요.
  sources:
