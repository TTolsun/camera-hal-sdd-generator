- id: pre-qbuf-case
  question: QBUF 이전 실패를 함수 단위·계측 시험 계획으로 두 경우에 나누어 평서문으로 설명하세요. cache_는 존재하지만 free 항목이 없어 get이 실패하는 경우에는 반환
    -ENOENT, 새 예약 인덱스 부재와 이번 scope_exit put 부재, VIDIOC_QBUF 호출 횟수 0 및 이번 버퍼 신규 등록 부재를 기록합니다. 인덱스를 얻고 공통 plane
    수·필요 연속성 검증에 실패하는 경우에는 두 실제 조건을 각각 주입하고 -EINVAL, 해당 인덱스의 guard put, QBUF 호출 0과 신규 등록 부재를 대조합니다. 두 경우 모두
    UVC에서 processControls가 0을 반환한 제어 처리 선행을 기록합니다. 개별 processControl 반환값·구성된 ControlList·setControls 반환값으로
    실제 요청 제어의 적용 범위를 구분하며 성공한 처리에도 전체 요청 제어 적용이나 롤백을 단정하지 않습니다. 이어  음수의 전달과 공통 cancelRequest의 요청·버퍼 취소 및 알림을
    요청 식별자별로 대조합니다. 다른 요청의 queuedBuffers_ 항목까지 없어야 한다고 일반화하지 말고, 실제 장치에서 공개 입력만으로 이 조건이 재현된다는 보장이나 실행 완료를 만들지
    마세요. ~인지·~되는지 나열 대신 기록합니다·대조합니다로 마무리하세요.
