  - id: bookkeeping
    question: completeBuffer는 bufferCompleted.emit 뒤에 Request 내부 pending_를 지우고 buffer의 request 연결을 해제합니다. 직접
      콜백은 이 내부 갱신보다 먼저 실행될 수 있으므로 버퍼 신호에서 요청이 완료됐다고 판단하거나 요청을 파괴·재사용하지 말고 addBuffer의 요청 완료 콜백까지 버퍼 유지 계약을 지키도록
      설명하세요. completeRequest가 모든 pending 버퍼 처리 뒤 상태를 갱신하고 제출 순서로 requestCompleted를 내며 반환 뒤 핸들러가 요청에 접근하면 안
      되는 경계를 세 문장 이내로 연결하세요. 선택한 UVC는 PipelineHandler::completeBuffer 반환 뒤 명시적으로 completeRequest를 호출하므로 pending
      제거·연결 해제보다 먼저 요청 완료로 병렬 진행한다고 쓰지 마세요.
    sources:
    - completion
    - status
    - connections
    - lifetime
    - notification
    - uvc-return
    max_statements: 2
  - id: early-reuse
    question: 직접 bufferCompleted 콜백에서는 아직 Request::Private::completeBuffer의 pending_ 제거와 buffer의 Request 연결
      해제가 끝나지 않았다는 조건을 설명하세요. 이 콜백에서 다른 Request::addBuffer로 같은 버퍼의 연결을 바꾸면 뒤따르는 이전 내부 완료가 그 연결을 nullptr로 바꿀
      수 있다는 구현상 반례를 제시하고, 신호만으로 재초기화·재연결이 안전하다고 판단하지 않도록 하세요. 기존 요청 완료 콜백까지 버퍼를 유지하는 계약과 지연된 다른 수신자의 포인터 수명도
      구분하여 세 문장 이내로 설명하세요. 버퍼 데이터 읽기를 금지하는 새로운 API 의무나 실제 장애 관찰을 만들지 마세요.
    sources:
    - completion
    - status
    - connections
    - lifetime
    - add-code
    max_statements: 1
  - id: bulk-pointer
    question: 정상 completeBuffer는 setRequest(nullptr)을 호출하지만 doCancelRequest의 bulk 취소는 직접 신호와 pending_.clear만
      하고 같은 연결 해제를 하지 않는 차이를 두 문장 이내로 설명하세요. FrameBuffer::request 계약상 반환 포인터의 유효 구간은 addBuffer 연결부터 버퍼 완료까지이므로,
      취소 뒤 저장된 비null 연결 값이 남아 있어도 유효한 Request 포인터나 소유권·수명 연장으로 읽지 말아야 함을 연결하세요. 요청·버퍼의 기존 유지 계약과 지연 수신자 수명을
      지키며 두 경로별 재사용을 검증하도록 하세요.
