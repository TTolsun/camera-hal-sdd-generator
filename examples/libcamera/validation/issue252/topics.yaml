  parts:
  - id: control-errors
    question: processControls는 각 processControl의 반환값을 검사하지 않으며, 구성한 ControlList를 setControls에 전달합니다. setControls의
      빈 목록 0, 미등록 제어 또는 일반 검증 -EINVAL, 특정 제어 실패 -EIO와 실패 인덱스 앞의 updateControls 범위를 구분하세요. setControls 쓰기 오류
      자체에서도 일부 제어가 이미 적용됐을 수 있다는 API 계약을 명시하고 error_idx 앞의 제어 상태를 조사하도록 연결하세요. 개별 변환 오류가 항상 요청 취소로 전달되거나 controls
      설정이 원자적으로 롤백된다고 보장하지 말고 원래 호출의 반환값과 error_idx를 관찰하는 소스 기반 조사로 세 문장 이내에 설명하세요.
    sources:
    - controls
    - control-conversion
    - set-controls
    max_statements: 2
  - id: failure
    question: UVC는 findBuffer가 비면 -ENOENT, processControls가 음수면 장치 제출 전 반환, queueBuffer가 음수면 그 값을 반환합니다. 공통
      doQueueRequest가 sequence와 queuedRequests_ 등록 뒤 비0 반환을 cancelRequest로 보내므로 Camera::queueRequest의 앞선 0과
      별도로 취소가 발생함을 설명하세요. processControls 성공 뒤 QBUF가 실패하더라도 이 경로는 제어 변경 롤백을 보장하지 않음을 세 문장 이내로 연결하세요.
    sources:
    - submit
    - controls
    - dispatch
    - complete
    max_statements: 2
  - id: device
    question: V4L2VideoDevice::queueBuffer에서 Stopping의 -ESHUTDOWN, VIDIOC_QBUF 오류 반환, 성공 후 queuedBuffers_ 등록이라는
      필수 조사 분기를 설명하세요. cache_ 부재는 LOG(V4L2, Fatal) 뒤에 -ENOENT 반환문이 있으므로 정상 반환·공통 취소 도달을 보장하지 않는 별도 경계입니다. Camera
      제출 0·QBUF 성공·프레임 완료를 구분하고 실제 ret·인덱스·큐 등록을 관찰하는 계획을 세 문장 이내로 연결하세요. 일반 출력 버퍼의 플레인 검증 상세는 이 소개 본문에 늘리지
      말고 기존 전체 소스 연결로 남기세요. 언급해야 한다면 V4L2_TYPE_IS_OUTPUT이면서 numV4l2Planes != planes.size()인 분기에서만 마지막이 아닌 플레인의
      빈 부분을 검사한다는 조건을 생략하지 마세요.
    sources:
    - qbuf
    - submit
    max_statements: 2
  - id: completion
    question: bufferAvailable의 dequeueBuffer 실패 또는 예상 밖 인덱스는 nullptr로 알림을 내지 않으며, 정상 반환은 bufferReady→UVC imageBufferReady→completeBuffer→completeRequest로
      이어지는 점을 설명하세요. V4L2_BUF_FLAG_ERROR는 FrameError로 남지만 Request::Private::complete는 cancelled_만으로 RequestComplete/RequestCancelled를
      정하므로 RequestComplete를 FrameSuccess나 촬영 성공 보장으로 쓰지 마세요. 완료 누락은 pending_와 queuedRequests_ 선두 status를 함께
      확인하고 후속 완료가 제출 순서 때문에 지연될 수 있음을 세 문장 이내로 연결하세요. FrameError는 오류 플래그 외에 유효하지 않은 플레인 수 또는 분할에 부족한 bytesused에서도
      발생하므로 해당 값을 조사하도록 간결히 추가하세요. 단일 V4L2 플레인을 여러 버퍼 플레인으로 분할할 때에는 각 플레인 처리를 시작하기 전에 remaining이 0이면 FrameError이며,
      마지막 플레인은 길이보다 적은 양의 bytesused를 가질 수 있는 허용을 구분하세요. 부족한 모든 bytesused나 모든 플레인 수 불일치를 오류라고 일반화하지 마세요.
    sources:
    - dequeue
    - uvc-ready
    - uvc-wiring
    - complete
    - status
    max_statements: 2
  - id: frame-validity
    question: 선택한 경로에서 프레임 상태를 판정할 때 완전히 한정된 FrameMetadata::FrameSuccess·FrameMetadata::FrameError·FrameMetadata::FrameCancelled를
      각 문장의 주어로 사용하여 FrameMetadata::Status의 API 주석 계약을 세 짧은 문장으로 대조하세요. FrameMetadata::FrameSuccess는 프레임 데이터와
      모든 metadata 필드가 유효합니다. FrameMetadata::FrameError는 데이터가 일부·전체 손상되거나 없거나 유효하지 않으며 sequence·timestamp만 유효하고
      나머지 필드는 유효하지 않을 수 있습니다. FrameMetadata::FrameCancelled는 데이터가 유효하지 않고 status 외의 metadata 필드는 유효하지 않습니다.
      RequestComplete는 cancelled_ 기준이므로 이 판정을 대신할 수 없다는 기존 설명에 연결하되 되풀이하지 말고, 실제 하드웨어·DMA 검증을 했다는 주장으로 확대하지
      마세요. FrameStartup/IPA 등 선택 밖 상태를 포함한 전체 열거형 완료 표라고 쓰지 마세요.
    sources:
    - frame-validity
    max_statements: 1
- id: stop-depth
  title: UVC 정지의 정상 경로와 실패 경계
