  - id: queued-lifetime
    question: Queued 전달에서 인자를 복사해도 포인터가 가리키는 객체의 수명을 연장하지 않는다는 조건, Camera 상태 변경 함수의 호출자 동기화 책임, stop의 Blocking
      반환이 별도 Queued 콜백 처리 완료나 잠금 보호를 보장하지 않는다는 경계를 세 문장 이내의 한 문단으로 연결하세요. 이 인자 복사 설명을 모든 타스레드 슬롯이나 명시적 Direct까지
      확대하지 말고, 서로 다른 두 의무에 근거 없는 인과관계를 만들지 마세요. Queued의 수신 실행은 수신 객체가 유효하고 이벤트 루프가 실제 메시지를 처리하는 경우에만 비동기로 이루어진다고
      조건을 명시하세요. 스레드 정지 전 실행 보장이 없으며 Object 소멸 시 대기 메시지가 제거될 수 있으므로 단순 이벤트 루프 복귀나 stop 반환을 실행·처리 완료 보장으로 쓰지
      마세요.
