    file: src/libcamera/pipeline_handler.cpp
    start: void PipelineHandler::doQueueRequest(Request *request)
    end: \brief Queue prepared requests to the device
  parts:
  - id: control-errors
    question: processControls는 각 processControl의 반환값을 검사하지 않으며, 구성한 ControlList를 setControls에 전달합니다. setControls의
      빈 목록 0, 미등록 제어 또는 일반 검증 -EINVAL, 특정 제어 실패 -EIO와 실패 인덱스 앞의 updateControls 범위를 구분하세요. setControls 쓰기 오류
      자체에서도 일부 제어가 이미 적용됐을 수 있다는 API 계약을 명시하고 error_idx 앞의 제어 상태를 조사하도록 연결하세요. 개별 변환 오류가 항상 요청 취소로 전달되거나 controls
      설정이 원자적으로 롤백된다고 보장하지 말고 원래 호출의 반환값과 error_idx를 관찰하는 소스 기반 조사로 세 문장 이내에 설명하세요.
    sources:
    - controls
    - control-conversion
    - set-controls
    max_statements: 2
  - id: failure
    question: UVC는 findBuffer가 비면 -ENOENT, processControls가 음수면 장치 제출 전 반환, queueBuffer가 음수면 그 값을 반환합니다. 공통
      doQueueRequest가 sequence와 queuedRequests_ 등록 뒤 비0 반환을 cancelRequest로 보내므로 Camera::queueRequest의 앞선 0과
      별도로 취소가 발생함을 설명하세요. processControls 성공 뒤 QBUF가 실패하더라도 이 경로는 제어 변경 롤백을 보장하지 않음을 세 문장 이내로 연결하세요.
    sources:
    - submit
    - controls
    - dispatch
    - complete
    max_statements: 2
  - id: device
    question: V4L2VideoDevice::queueBuffer에서 Stopping의 -ESHUTDOWN, 캐시·플레인 검증, VIDIOC_QBUF 실패와 성공 후 queuedBuffers_
      등록을 조사 분기로 연결하세요. Camera 제출 0·장치 QBUF 성공·프레임 완료를 구분하고 실제 반환 ret와 큐 인덱스를 관찰하되 없는 로그나 지연 기준은 만들지 마세요. 세
      문장 이내로 답하세요. cache_ 부재는 LOG(V4L2, Fatal) 뒤에 -ENOENT 반환문이 있는 별도 분기이므로 정상 반환이나 공통 취소 도달을 보장하지 마세요. 반환 가능한
      입력 오류와 Fatal 경계를 구별하세요.
    sources:
    - qbuf
    - submit
    max_statements: 2
  - id: completion
    question: bufferAvailable의 dequeueBuffer 실패 또는 예상 밖 인덱스는 nullptr로 알림을 내지 않으며, 정상 반환은 bufferReady→UVC imageBufferReady→completeBuffer→completeRequest로
      이어지는 점을 설명하세요. V4L2_BUF_FLAG_ERROR는 FrameError로 남지만 Request::Private::complete는 cancelled_만으로 RequestComplete/RequestCancelled를
      정하므로 RequestComplete를 FrameSuccess나 촬영 성공 보장으로 쓰지 마세요. 완료 누락은 pending_와 queuedRequests_ 선두 status를 함께
      확인하고 후속 완료가 제출 순서 때문에 지연될 수 있음을 세 문장 이내로 연결하세요. FrameError는 오류 플래그 외에 유효하지 않은 플레인 수 또는 분할에 부족한 bytesused에서도
      발생하므로 해당 값을 조사하도록 간결히 추가하세요.
    sources:
    - dequeue
    - uvc-ready
    - uvc-wiring
    - complete
    - status
    max_statements: 2
- id: stop-depth
  title: UVC 정지의 정상 경로와 실패 경계
  question: 정상 정지의 대기 격리·장치 반환·호출자 복귀와 STREAMOFF 실패 반례를 구분하고 변경 후 검사 조건을 제시하세요.
  covers:
  - stop-depth
  sources:
  - id: common-stop
    file: src/libcamera/pipeline_handler.cpp
    start: \brief Stop capturing from all running streams and cancel pending requests
    end: \brief Determine if the camera has any requests pending
  - id: uvc-stop
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: void PipelineHandlerUVC::stopDevice(Camera *camera)
    end: int PipelineHandlerUVC::processControl(
  - id: streamoff
    file: src/libcamera/v4l2_videodevice.cpp
    start: int V4L2VideoDevice::streamOff()
    end: \brief Set the dequeue timeout value
  - id: release
    file: src/libcamera/v4l2_videodevice.cpp
    start: int V4L2VideoDevice::releaseBuffers()
    end: \brief Queue a buffer to the video device
  - id: camera-stop
    file: src/libcamera/camera.cpp
    start: \brief Stop capture from camera
    end: \brief Handle request completion and notify application
  - id: dispatch
    file: src/libcamera/pipeline_handler.cpp
    start: void PipelineHandler::doQueueRequest(Request *request)
    end: \brief Queue prepared requests to the device
  - id: uvc-ready
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: void UVCCameraData::imageBufferReady(FrameBuffer *buffer)
    end: REGISTER_PIPELINE_HANDLER
  - id: dequeue
    file: src/libcamera/v4l2_videodevice.cpp
    start: void V4L2VideoDevice::bufferAvailable()
    end: \brief Start the video stream
  parts:
  - id: order
    question: PipelineHandler::stop가 waitingRequests_를 지역 큐로 swap해 stopDevice 내부 완료에서 재투입되지 않게 하고, 장치 정지 후
      지역 대기를 cancel→doQueueRequest로 순번을 부여해 완료시키는 이유를 소스 주석 범위 안에서 설명하세요. 정상 UVC streamOff는 Stopping 상태에서 각
      장치 버퍼를 취소하고 bufferReady를 내므로 같은 imageBufferReady가 요청을 완료합니다. 공통 ASSERT와 CameraStopping→Blocking stop→CameraConfigured를
      연결하되 ASSERT를 복구·실행 보장으로 쓰지 마세요. 세 문장 이내로 답하세요.
    sources:
    - common-stop
    - uvc-stop
    - streamoff
    - camera-stop
    - dispatch
    - uvc-ready
    max_statements: 2
  - id: failure
    question: streamOff의 비스트리밍·빈 큐 0 단축 반환과 VIDIOC_STREAMOFF 실패 시 ret를 반환하며 Stopping/버퍼 반환 루프 이전에 빠지는 예외를 설명하세요.
      UVC stopDevice는 이 ret와 releaseBuffers ret를 확인하지 않습니다. releaseBuffers는 cache_를 먼저 reset한 뒤 requestBuffers(0)의
      결과를 반환하므로 STREAMOFF 실패 뒤에도 이 해제 호출로 진행하는 사실과 큐·알림 잔존 확인을 연결하세요. 공통 stop은 void이고 Camera::stop은 ASSERT
      등을 지나 정상 경로 끝에 도달한 경우 0을 반환하며, 장치 오류를 그 반환값으로 전달하지 않습니다. ASSERT 실패 시에도 Camera::stop이 실제로 반환한다고 보장하지 말고
      stop 0을 모든 장치 버퍼의 반환·콜백 처리 완료 보장으로 확대하지 마세요. 원래 호출의 ret·state_·queuedBuffers_·queuedRequests_·cache_와
      ASSERT 도달 여부를 관찰하는 조사 계획으로 세 문단 이내에 답하세요. 실제 장치에서 이 오류를 관찰했다고 쓰지 마세요.
    sources:
    - streamoff
    - uvc-stop
    - release
    - common-stop
    - camera-stop
    max_statements: 3
  - id: verification
    question: 선택 경로를 바꾼 뒤 필요한 실패 주입 검증을 조사 계획으로 제시하세요. 준비 대기와 장치 대기를 섞은 정지, STREAMOFF 실패·releaseBuffers 실패,
      취소 콜백 재진입에서 요청별 1회 완료·제출 순서·큐 잔존·정지 후 재투입을 각각 기록하도록 하세요. 이 소스 기반 계획을 실행 완료나 오류 복구 보장으로 쓰지 말고 두 문장 이내로
      답하세요.
    sources:
    - common-stop
    - uvc-stop
    - streamoff
    - release
    - dispatch
    max_statements: 2
  - id: residual-event
    question: STREAMOFF 실패로 queuedBuffers_ 정리·notifier 비활성화 전에 반환한 뒤 UVC가 releaseBuffers를 호출하여 cache_를 reset하는
      경계를 설명하세요. 잔존 알림에서 DQBUF가 알려진 인덱스를 실제 반환하는 조건이면 dequeueBuffer의 cache_->put이 null cache_에 접근할 가능성을 조사해야
      한다는 소스 기반 반례를 세 문장 이내로 연결하세요. 오류 주입 후 이벤트 실행 여부·인덱스·cache_·큐·notifier 상태와 정지·재구성의 안전한 후속 처리 조건을 검증하는
      계획이며 실제 이벤트 발생·오류 복구·Camera::stop의 정상 반환을 보장하지 마세요.
    sources:
    - streamoff
    - uvc-stop
    - release
    - dequeue
    - common-stop
    - camera-stop
    max_statements: 2
