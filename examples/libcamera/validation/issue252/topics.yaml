  - id: pre-qbuf-planes
    question: cache 인덱스를 얻은 뒤 queueBuffer가 검사하는 두 공통 조건을 대조하세요. planes.size() < numV4l2Planes이면 -EINVAL이며,
      planes.size() != numV4l2Planes && !buffer->_d()->isContiguous()이어도 -EINVAL입니다. 단순한 수 불일치를 모두 오류로 일반화하지
      마세요. 이 두 반환에서는 scope_exit가 이번 buf.index를 cache_->put으로 반환하며 VIDIOC_QBUF 호출과 이번 버퍼의 queuedBuffers_ 신규
      등록에 도달하지 않습니다. 제어 처리·호출자 반환·공통 취소의 공통 전제는 앞의 cache 인덱스 항목이 소유하므로 여기에서 반복하지 마세요. 이 항목은 두 plane 조건, 각각의
      반환과 확보한 인덱스의 정리만 소유합니다. 위 두 공통 검사에 집중하고 다른 형식의 bytesused 합치기 세부 검사를 이 사례로 확대하지 마세요. 실제 UVC 하드웨어에서 부적합
      plane을 재현했다는 결과가 아니라 이 함수에 도달한 조건의 정적 분기입니다. 두 짧은 문단으로 답하세요.
    sources:
