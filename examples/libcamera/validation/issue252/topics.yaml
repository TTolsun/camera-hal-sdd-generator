  parts:
  - id: message
    question: queueRequest가 0을 반환했지만 PipelineHandler::queueRequest 진입 자체가 없는 경우를 waitingRequests_ 준비 대기보다 먼저
      구분하는 조사 경로를 두 문장 이내로 설명하세요. queued 메시지의 대상 스레드·이벤트 루프 진행과 메서드 진입을 관찰하고, Request 포인터는 값 복사로 소유되지 않으므로
      실제 메서드 호출까지 유효해야 하며 Queued 호출은 스레드가 멈추기 전에 실행된다는 보장이 없다는 계약을 연결하세요. 메시지가 버려지면 요청이나 버퍼를 즉시 해제해도 된다는 결론은
      내리지 마세요.
    sources:
    - submit-message
    - invocation
    - dispatch
    max_statements: 1
  - id: fence
    question: 완료 누락을 조사할 때 waitingRequests_ 선두의 prepared_와 각 fence의 notifiers_, prepare(300ms), notifierActivated
      및 timeout을 연결하세요. fence가 없으면 동기 prepared 신호를 내고, 모두 신호되거나 타임아웃되면 prepared_를 참으로 바꾼 뒤 신호를 냅니다. 타임아웃은 취소
      후 준비 완료 신호를 내므로 prepared_가 촬영 준비 성공을 뜻하지 않음을 설명하세요. 300ms를 촬영·정지 완료 시간 보장으로 확대하지 마세요. 조사 계획과 구현 사실을 구분하여
      세 문장 이내로 답하세요.
    sources:
    - dispatch
    - prepare
    - cancel
    max_statements: 2
  - id: recursive
    question: doQueueRequests의 선두 미준비와 queuedRequests_.size()==maxQueuedRequestsDevice_ 중단 조건, 준비된 선두를 pop한
      뒤 doQueueRequest를 호출하는 재진입 방어를 연결하세요. 준비 취소 또는 장치 제출 실패는 완료 처리 중 다시 doQueueRequests를 호출할 수 있으므로 pop 순서
      변경 전에 중복 처리·순서·대기 큐 관찰을 검사하도록 설명하세요. 후속 준비 요청이 앞선 미준비 요청을 추월한다고 쓰지 마세요. 세 문장 이내로 설명하세요.
    sources:
    - dispatch
    - completion
    max_statements: 2
  - id: stop-crossing
    question: Camera 상태 변경 호출의 호출자 동기화 의무를 전제로, queueRequest의 상태 검사와 실제 queued 메서드 실행 사이에 정지가 교차하는 경우의 조사 분기를
      세 문장 이내로 설명하세요. Camera::queueRequest가 실행 도중 상태 변화가 가능하다고 명시하는 계약과, PipelineHandler::queueRequest는 CameraStopping을
      재검사하지 않고 waitingRequests_ 추가·prepare를 실행한다는 구현을 연결하세요. 메시지가 stop의 대기 큐 분리 뒤에 실행된다는 조건이 실제로 성립하는지는 게시·실행·CameraStopping·stopDevice·준비·장치
      제출·Camera::requestComplete 상태 검사의 순서를 기록해 확인해야 하며 정상 지원 동작·발생 보장·복구 성공으로 단정하지 마세요. 이미 제출된 요청과 새로운 상태
      변경 호출을 호출자가 동기화해야 하는 의무를 제거하지 마세요. 게시된 호출이 대기 큐 분리 뒤 실행되고 요청 완료가 CameraConfigured 상태에서 Camera::requestComplete까지
      도달하는 조건이면 상태 검사 실패의 Trying to complete a request when stopped Fatal 로그 경계에 이릅니다. 이 조건부 다음 분기를 명시하고 신호·정상
      반환을 보장하지 마세요. 실제 교차 발생이나 그 경계 도달을 관측했다고 쓰지 마세요.
    sources:
    - submit-message
    - invocation
    - dispatch
    - completion
    - stop-entry
    - common-stop
    - camera-notice
    max_statements: 3
  - id: submission-order
    question: 선택한 단일 카메라 경로에서 API 계약의 제출 순서와 동시 호출의 관찰 경계를 구분하세요. 서로 다른 스레드의 Camera::queueRequest 호출 시작 순서만으로
      게시 순서를 확정할 수 없으며 Thread::postMessage는 mutex를 얻은 뒤 메시지를 큐에 추가합니다. 실제 파이프라인 진입과 waitingRequests_ 등록, doQueueRequest의
      Request sequence_·queuedRequests_ 등록, completeRequest의 선두 통지 순서를 연결하고 Request 소프트웨어 sequence와 V4L2에서
      받은 FrameMetadata sequence를 같다고 가정하지 마세요. API 시작·0 반환, 잠금 안의 메시지 추가 순서, 핸들러 진입·doQueueRequest 등록·Request
      sequence, 신호 발생과 특정 수신 연결의 실제 콜백을 구분해 기록하는 검증 조건을 최대 네 문장으로 설명하세요. source-caller 진입 시각을 전역 제출 순서로 단정하거나
      여러 수신 연결을 중복 완료로 세지 마세요. object-template·bound-overloads·connections·object-message·invoke-message·thread-dispatch의
      실제 호출 연결도 제공되어 있으므로 이 게시·처리 관계를 불명으로 대체하지 마세요. registerRequest는 생성 시 prepared 신호만 연결하며 순번과 queuedRequests_는
      doQueueRequest가 담당한다는 실제 함수 경계를 유지하세요.
    sources:
    - submit-message
    - post-order
    - dispatch
    - camera-notice
    - frame-sequence
    - common-stop
    - object-template
    - bound-overloads
    - connections
    - object-message
    - invoke-message
    - thread-dispatch
    max_statements: 2
    answer_contract:
      basis: investigation
  - id: fence-timer-tie
    question: 선택한 기본 EventDispatcherPoll의 같은 처리 회차에서 poll 결과가 유효한 fence fd의 Read 준비를 보고하고 그 요청의 타이머 기한도 지난
      경우를 설명하세요. processEvents는 ret가 양수일 때 processNotifiers를 처리한 다음 processTimers를 호출합니다. 이 회차 안에 notifierActivated가
      마지막 notifiers_ 항목을 제거하면 timer_.reset으로 Timer 소멸·stop·dispatcher 등록 제거를 거친 뒤 prepared를 발행하므로, 기한 경과만으로
      timeout이 먼저 호출되었다고 판정할 수 없습니다. 다른 fence가 남아 타이머가 여전히 등록·만료 상태라면 뒤의 timer 처리에서 timeout이 실행될 수 있다는 분기를
      구분하세요. 이는 timeout 경로의 판정이며 후속 장치 제출 오류의 취소를 배제하지 않습니다. fd와 revents는 handler 전에, notifier/timer 진입 순서·등록
      제거·cancelled_·prepared_는 각 경계에 기록하는 검증 계획을 최대 네 문장으로 설명하고 실제 경합 시험 성공이나 다른 dispatcher의 같은 우선순위를 주장하지
      마세요.
    sources:
    - poll-dispatch
    - timer-lifetime
    - prepare
    - request-private
    - bound-overloads
    max_statements: 2
    answer_contract:
      basis: investigation
- id: uvc-depth
  title: UVC의 장치 제출과 완료를 추적하기
  question: 선택한 UVC 구체 경로의 실패·장치 큐잉·버퍼 및 요청 완료를 연결하세요. 다른 파이프라인이나 실제 장치 관찰로 확대하지 마세요.
  covers:
  - uvc-depth
  sources:
  - id: submit
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: int PipelineHandlerUVC::queueRequestDevice(Camera *camera, Request *request)
    end: bool PipelineHandlerUVC::match(DeviceEnumerator *enumerator)
  - id: controls
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: int PipelineHandlerUVC::processControls(
    end: int PipelineHandlerUVC::queueRequestDevice(
  - id: control-conversion
