  parts:
  - id: delivery
    question: CameraManager 문맥에서 완료 신호를 내는 위치와 Object 슬롯의 수신 문맥을 두 문장 이내로 구분하세요. Auto의 현재·수신 스레드 비교와 Direct
      즉시 호출·Queued 수신 이벤트 루프 실행을 연결하고, 다른 스레드의 Object에도 Direct를 명시하면 송신 문맥에서 즉시 실행함을 포함하세요. 인자 수명과 Object 외
      수신자는 다음 항목에서 설명하므로 반복하지 마세요. Queued의 수신 실행은 수신 객체가 유효하고 수신 스레드가 실제 메시지를 소비하는 경우에만 비동기로 이루어진다고 조건을 명시하세요.
      스레드 정지 전 실행 보장이 없으며 Object 소멸 시 대기 메시지가 제거될 수 있으므로 단순 이벤트 루프 복귀나 stop 반환을 실행·처리 완료 보장으로 쓰지 마세요. 이벤트 루프는
      일반 전달 경로이며 유일한 실행 진입점이 아닙니다. 명시적·재귀 Thread::dispatchMessages도 해당 수신 스레드에서 메시지를 소비할 수 있으므로 이벤트 루프 복귀가
      필수라고 한정하지 마세요. 상세 호출 조건과 검증 계획은 별도 항목이 담당하므로 반복하지 마세요.
    sources:
    - connections
    - notification
    - completion
    - invocation
    - receiver-lifetime
    - dispatch-contract
    max_statements: 1
  - id: non-object-delivery
    question: Signal의 Object 외 멤버·functor 수신자와 정적 함수 연결이 각각의 activate에서 호출 문맥상 즉시 함수를 실행하는 동작을 한 문장으로 묶어 설명하세요.
      세 주체마다 같은 즉시 호출을 따로 반복하지 마세요. Object Auto의 스레드 비교와 인자 수명은 다른 항목이 담당하므로 추가하지 마세요.
    sources:
    - signal-overloads
    - bound-overloads
    max_statements: 1
  - id: queued-lifetime
    question: Object::invokeMethod의 Queued 인자 복사는 포인터 대상의 수명을 연장하지 않으므로 실제 메서드 호출까지 대상을 유효하게 유지해야 한다는 의무를 설명하세요.
      수신 객체가 유효하고 해당 수신 스레드가 실제 메시지를 소비하는 조건을 명시하되 이벤트 루프를 유일한 소비 경로로 한정하지 마세요. Camera 상태 변경 함수의 호출자 동기화 의무는
      별도 짧은 문장으로 구분하고 인자 복사와 잠금 사이의 근거 없는 인과를 만들지 마세요. Blocking의 스레드 분기와 별도 Queued 수신 종료 경계는 blocking-context와
      sender-lifetime-duty가 소유하므로 여기서 반복하지 마세요. 최대 두 문단·세 문장으로 쓰세요.
    sources:
    - connections
    - signals
    - sync
    - invocation
    - receiver-lifetime
    - dispatch-contract
    max_statements: 2
  - id: sender-lifetime-duty
    question: 기존 자원 절의 Request 소유권·완료 핸들러 삭제/재사용 허용과 버퍼 유지 계약은 되풀이하지 마세요. 이 항목은 다른 스레드의 Object 슬롯으로 인자 복사본을
      비동기 전달하는 Signal 발신자가 포인터·참조의 유효성을 신호 발생 이후에도 보장할 책임과, 각 별도 Queued 수신자의 마지막 사용 확인이라는 새 조건만 설명합니다. 안전한
      변경 검증 계획으로 발신자와 요청 소유자의 완료/해제 협의, 지연 수신자별 마지막 사용 추적·동기화, 확인 전 삭제·재사용으로 수명을 끊지 않음이라는 실행 가능한 조건을 두세 문장으로
      연결하세요. 요청 완료 신호·한 핸들러 복귀·stop 반환이 모든 지연 수신자의 마지막 사용까지 보장한다고 쓰거나 자동 잠금·대기 및 실행한 시험을 만들지 마세요. Signal Doxygen의
      일반적인 타스레드 슬롯 설명에 emit 반환 뒤라는 문구가 있다는 사실과 실제 구현을 구분하세요. Auto가 서로 다른 스레드를 보아 Queued로 선택되거나 명시적 Queued를
      쓰는 경우의 게시로 한정하고, 명시적 Direct는 타스레드 affinity에서도 발신 스레드에서 즉시 실행됩니다. Signal::emit의 activate 반복, Queued postMessage의
      무대기 반환, Thread 큐 잠금 해제와 수신 dispatchMessages→Object::message→InvokeMessage::invoke를 연결하면 타스레드 수신 실행이 emit
      반환 전에도 시작될 수 있으므로 일반적인 반환 전후 순서를 보장하지 않는다고 설명하세요. 같은 스레드의 Queued에도 항상 병렬 실행이 있다는 일반화는 하지 마세요. 이 구현·주석
      차이와 책임·검증 계획을 최대 네 문장으로 명확히 구분하세요.
    sources:
    - signals
    - buffer-duty
    - connections
    - invocation
    - signal-overloads
    - thread-post
    - thread-dispatch
    - object-message
    - invoke-message
    max_statements: 3
    answer_contract:
      basis: investigation
  - id: validation
    question: 안전한 변경을 위한 소스 기반 검증 계획을 두 문장 이내로 쓰세요. 수신자 Object 유무·연결 종류·현재/수신 TID·이벤트 루프·요청 cookie/sequence/status·버퍼
      status·콜백 진입/복귀와 stop 앞뒤를 함께 기록하고 Direct 재진입과 Queued 지연에서 수명·중복 완료·정지 후 제출을 확인하도록 하세요. 애플리케이션 표식을 정확한
      C++ 반환 명령 관측이나 실제 새 실행 결과로 표시하지 마세요.
    sources:
    - connections
    - signals
    - sync
    - completion
    - status
    max_statements: 2
  - id: reentrancy
    question: libcamera의 thread-safe와 reentrant 정의는 같은 스레드의 콜백에서 동일 함수로 중첩 진입할 수 있다는 허용이 아니며, 별도 문서화가 없으면 허용되지
      않고 교착될 수 있음을 두 문장 이내로 설명하세요. doQueueRequests의 특정 재진입 방어를 모든 Camera API의 콜백 재진입 허용으로 확대하지 말고 정지·재구성 호출은
      호출자 동기화와 수신 이벤트 루프 진행을 검토하도록 하세요. Queued 수신을 이벤트 루프 복귀 때로만 한정하지 마세요. 해당 수신 스레드의 명시적·재귀 Thread::dispatchMessages가
      type·receiver 필터에 맞는 메시지를 더 일찍 소비할 수 있으며, 스레드 정지 전 실제 소비가 보장되지 않는다고 바로 연결하세요. 상세 필터·재귀 조건은 explicit-dispatch에서
      설명하므로 반복하지 마세요.
    sources:
    - thread-rules
    - sync
    - connections
    - dispatch-contract
    max_statements: 2
  - id: application-loop
    question: CameraManager::start()를 호출한 애플리케이션 메인 스레드는 Thread 인스턴스에 연결되지만 libcamera가 접근할 수 있는 이벤트 루프가 없다는
      기본 조건을 설명하세요. 그 스레드에 묶인 Object의 Queued 또는 타스레드 Auto 수신을 조사할 때 이를 먼저 확인하고 실제 애플리케이션의 메시지 소비 경로와 진행 여부를
      별도로 기록하도록 두 문장으로 연결하세요. 기본 메시지 전달 보장이나 모든 UI 루프와의 자동 통합을 만들지 말고 별도 내부 Thread 프로브를 일반화하지 마세요.
    sources:
    - thread-support
    max_statements: 1
    answer_contract:
      basis: investigation
  - id: blocking-context
    question: ConnectionTypeBlocking에서 Thread::current()와 수신 Object의 thread가 같으면 Direct로 바꾸어 즉시 호출하고, 다르면 InvokeMessage를
      게시한 뒤 해당 호출의 semaphore를 기다리는 구현을 두 문장 이내로 설명하세요. 이 대기가 다른 Queued 수신자들의 처리 완료나 전체 큐 drain을 뜻한다고 확대하지 마세요.
    sources:
    - connections
    - stop-entry
    - object-template
    max_statements: 1
  - id: explicit-dispatch
    question: 이벤트 루프 외에도 수신 스레드에서 Thread::dispatchMessages를 명시 호출해 type·receiver 필터에 맞는 게시 메시지를 즉시 전달할 수 있음을
      설명하세요. 같은 스레드의 Object 메시지 핸들러에서 재귀 호출은 허용되지만 thread-safe가 아니며 해당 스레드 밖 호출은 undefined behaviour입니다. 같은
      스레드 Queued 게시 뒤 명시적·재귀 dispatch가 외부 핸들러 복귀 전에 InvokeMessage를 처리할 수 있는 조건을 구분하고, 수신 TID·type·receiver·재귀
      깊이·메시지/콜백 진입과 복귀·포인터 마지막 사용을 기록하는 변경 검증 계획을 세 문장으로 연결하세요. 이벤트 루프 복귀만 기다린다는 설명·모든 메시지 무조건 배출·새 실제 시험 성공으로
      쓰지 마세요.
    sources:
    - dispatch-contract
    - object-message
    - invoke-message
    - invocation
    max_statements: 2
    answer_contract:
      basis: investigation
