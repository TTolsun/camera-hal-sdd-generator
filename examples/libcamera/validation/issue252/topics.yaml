  - id: uvc-ready
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: void UVCCameraData::imageBufferReady(FrameBuffer *buffer)
    end: REGISTER_PIPELINE_HANDLER
  - id: uvc-wiring
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: video_->bufferReady.connect(this, &UVCCameraData::imageBufferReady);
    end: /* Generate the camera ID. */
    scope:
      start: int UVCCameraData::init(std::shared_ptr<MediaDevice> media)
      end: '

        }'
  - id: complete
    file: src/libcamera/pipeline_handler.cpp
    start: \brief Complete a buffer for a request
    end: \brief Retrieve the absolute path to a platform configuration file
  - id: status
    file: src/libcamera/request.cpp
