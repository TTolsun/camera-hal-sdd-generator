topics:
- id: preparation-depth
  title: 준비 대기와 재진입을 좁히기
  question: 준비 대기의 생산자·소비자와 중첩 재진입을 연결하여 완료 누락의 조사 위치와 변경 불변조건을 설명하세요.
  covers:
  - preparation-depth
  sources:
  - id: dispatch
    file: src/libcamera/pipeline_handler.cpp
    start: void PipelineHandler::registerRequest(Request *request)
    end: \fn PipelineHandler::queueRequestDevice()
  - id: prepare
    file: src/libcamera/request.cpp
    start: void Request::Private::emitPrepareCompleted()
    end: '#endif /* __DOXYGEN_PUBLIC__ */'
  - id: cancel
    file: src/libcamera/request.cpp
    start: void Request::Private::doCancelRequest()
    end: \brief Reset the request internal data
  - id: completion
    file: src/libcamera/pipeline_handler.cpp
    start: \brief Complete a buffer for a request
    end: \brief Retrieve the absolute path to a platform configuration file
  - id: submit-message
    file: src/libcamera/camera.cpp
    start: \brief Queue a request to the camera
    end: \brief Start capture from camera
  - id: invocation
    file: src/libcamera/base/object.cpp
    start: \fn R Object::invokeMethod()
    end: \fn Object::thread()
  - id: stop-entry
    file: src/libcamera/camera.cpp
    start: \brief Stop capture from camera
    end: \brief Handle request completion and notify application
  - id: common-stop
    file: src/libcamera/pipeline_handler.cpp
    start: \brief Stop capturing from all running streams and cancel pending requests
    end: \brief Determine if the camera has any requests pending
  - id: camera-notice
    file: src/libcamera/camera.cpp
    start: \brief Handle request completion and notify application
    end: '} /* namespace libcamera */'
  parts:
  - id: message
    question: queueRequest가 0을 반환했지만 PipelineHandler::queueRequest 진입 자체가 없는 경우를 waitingRequests_ 준비 대기보다 먼저
      구분하는 조사 경로를 두 문장 이내로 설명하세요. queued 메시지의 대상 스레드·이벤트 루프 진행과 메서드 진입을 관찰하고, Request 포인터는 값 복사로 소유되지 않으므로
      실제 메서드 호출까지 유효해야 하며 Queued 호출은 스레드가 멈추기 전에 실행된다는 보장이 없다는 계약을 연결하세요. 메시지가 버려지면 요청이나 버퍼를 즉시 해제해도 된다는 결론은
      내리지 마세요.
    sources:
    - submit-message
    - invocation
    - dispatch
    max_statements: 1
  - id: fence
    question: 완료 누락을 조사할 때 waitingRequests_ 선두의 prepared_와 각 fence의 notifiers_, prepare(300ms), notifierActivated
      및 timeout을 연결하세요. fence가 없으면 동기 prepared 신호를 내고, 모두 신호되거나 타임아웃되면 prepared_를 참으로 바꾼 뒤 신호를 냅니다. 타임아웃은 취소
      후 준비 완료 신호를 내므로 prepared_가 촬영 준비 성공을 뜻하지 않음을 설명하세요. 300ms를 촬영·정지 완료 시간 보장으로 확대하지 마세요. 조사 계획과 구현 사실을 구분하여
      세 문장 이내로 답하세요.
    sources:
    - dispatch
    - prepare
    - cancel
    max_statements: 2
  - id: recursive
    question: doQueueRequests의 선두 미준비와 queuedRequests_.size()==maxQueuedRequestsDevice_ 중단 조건, 준비된 선두를 pop한
      뒤 doQueueRequest를 호출하는 재진입 방어를 연결하세요. 준비 취소 또는 장치 제출 실패는 완료 처리 중 다시 doQueueRequests를 호출할 수 있으므로 pop 순서
      변경 전에 중복 처리·순서·대기 큐 관찰을 검사하도록 설명하세요. 후속 준비 요청이 앞선 미준비 요청을 추월한다고 쓰지 마세요. 세 문장 이내로 설명하세요.
    sources:
    - dispatch
    - completion
    max_statements: 2
  - id: stop-crossing
    question: Camera 상태 변경 호출의 호출자 동기화 의무를 전제로, queueRequest의 상태 검사와 실제 queued 메서드 실행 사이에 정지가 교차하는 경우의 조사 분기를
      세 문장 이내로 설명하세요. Camera::queueRequest가 실행 도중 상태 변화가 가능하다고 명시하는 계약과, PipelineHandler::queueRequest는 CameraStopping을
      재검사하지 않고 waitingRequests_ 추가·prepare를 실행한다는 구현을 연결하세요. 메시지가 stop의 대기 큐 분리 뒤에 실행된다는 조건이 실제로 성립하는지는 게시·실행·CameraStopping·stopDevice·준비·장치
      제출·Camera::requestComplete 상태 검사의 순서를 기록해 확인해야 하며 정상 지원 동작·발생 보장·복구 성공으로 단정하지 마세요. 이미 제출된 요청과 새로운 상태
      변경 호출을 호출자가 동기화해야 하는 의무를 제거하지 마세요.
    sources:
    - submit-message
    - invocation
    - dispatch
    - completion
    - stop-entry
    - common-stop
    - camera-notice
    max_statements: 3
- id: uvc-depth
  title: UVC의 장치 제출과 완료를 추적하기
  question: 선택한 UVC 구체 경로의 실패·장치 큐잉·버퍼 및 요청 완료를 연결하세요. 다른 파이프라인이나 실제 장치 관찰로 확대하지 마세요.
  covers:
  - uvc-depth
  sources:
  - id: submit
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: int PipelineHandlerUVC::queueRequestDevice(Camera *camera, Request *request)
    end: bool PipelineHandlerUVC::match(DeviceEnumerator *enumerator)
  - id: controls
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: int PipelineHandlerUVC::processControls(
    end: int PipelineHandlerUVC::queueRequestDevice(
  - id: control-conversion
    file: src/libcamera/pipeline/uvcvideo/uvcvideo.cpp
    start: int PipelineHandlerUVC::processControl(
    end: int PipelineHandlerUVC::processControls(
  - id: set-controls
    file: src/libcamera/v4l2_device.cpp
    start: int V4L2Device::setControls(
    end: \brief Retrieve the v4l2_query_ext_ctrl information
  - id: qbuf
    file: src/libcamera/v4l2_videodevice.cpp
    start: int V4L2VideoDevice::queueBuffer(
    end: void V4L2VideoDevice::bufferAvailable()
  - id: dequeue
