    question: streamOff의 즉시 반환·ioctl 오류·성공 버퍼 반환은 언제 합류하여 UVC releaseBuffers 호출로 이어집니까?
    prompt: UVC stopDevice에서 streamOff를 호출하고, 그 함수가 실제 반환한 뒤에만 releaseBuffers를 호출하는 순서를 최대 9노드로 그리세요. streamOff
      진입의 즉시 0 반환, ioctl 음수 오류 반환, 성공 시 Stopping·버퍼 취소/알림 루프·큐 정리·Stopped 후 0 반환을 반드시 공통 streamOff 반환 노드로 합류시키세요.
      이 반환 노드에 streamOff 심볼을 다시 써도 되며 고유 id를 사용하세요. 분기 진입 노드에서 releaseBuffers로 직접 연결하지 말고 공통 반환에서만 연결하세요. 성공
      루프의 완료와 오류 조기 반환 모두 함수가 실제 반환했다는 조건 후 다음 호출로 갑니다. UVC는 반환 오류를 검사하지 않고 releaseBuffers도 호출하며 cache_ reset과
      requestBuffers의 실패 가능성을 보존합니다. ASSERT/Fatal 또는 콜백 안의 비정상 종료까지 정상 반환한다고 보장하지 마세요. common stop 전체를 이 그림에
      반복하지 말고 이 세 반환 경계에 집중하세요.
