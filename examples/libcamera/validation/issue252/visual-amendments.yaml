  prompt: 지정한 여덟 노드를 모두 연결하세요. emit→activate→activatePack은 실제 호출이고 Direct는 invokePack으로, Queued는 postMessage로
    분기합니다. 게시된 메시지는 해당 수신 스레드가 type·receiver 필터에 맞춰 dispatchMessages로 소비한 조건에서 Object::message로 전달됩니다. 일반 이벤트
    루프뿐 아니라 명시적·같은 스레드 메시지 핸들러의 재귀 dispatch가 가능하며, 이 수신의 시작을 emit 반환 전후로 고정하지 마세요. emit이 실제 반환한 뒤 Request::Private::completeBuffer가
    pending을 갱신합니다. Direct 수신의 동기 복귀와 Queued 게시의 무대기를 구분하세요. stop의 Blocking 반환은 별도 stop-lifetime-flow가 설명하므로
    이 그림에 stop 노드를 넣지 마세요. emit 노드는 연결 슬롯의 activate를 순서대로 호출한다고 정확히 쓰고, 수신 함수들을 연결 순서대로 실행·완료한다고 쓰지 마세요. Queued
