- id: failure-investigation-flow
  topic: review
  kind: flow
  title: 실패 주입별 다음 관찰 분기
  generation: llm
  max_nodes: 9
  question: 준비 timeout, 제출 실패, DQBUF 실패, STREAMOFF 실패에서 각각 무엇을 기록하고 어느 다음 분기를 확인합니까?
  prompt: 네 가지 독립된 실패 조사 경로를 지정한 9개 심볼 노드로 그리세요. timeout은 cancel 뒤 emitPrepareCompleted로 가며 prepared_를 기록합니다.
    UVC queueRequestDevice는 findBuffer·processControls·queueBuffer 실패를 반환하며, 호출한 doQueueRequest의 비0 ret 검사가
    cancelRequest로 이어지는 실제 경로를 반드시 연결하세요. 제어 처리 음수와 제어 적용 뒤 QBUF 음수를 노드 레이블에서 구분하고 부분 적용·롤백 보장 없음·ret·error_idx를
    기록합니다. 이 호출자는 dispatch-flow 원문에 제공되어 있으므로 미확인이라고 쓰지 마세요. bufferAvailable→dequeueBuffer 호출과 nullptr의 해당
    bufferReady 부재에서 ret·index·queuedBuffers_를 확인합니다. streamOff 실패의 조기 반환 뒤에도 UVC stopDevice가 반환을 무시하고 releaseBuffers를
    호출하는 경로에서 cache_ reset·잔존 큐·후속 DQBUF 접근 조건을 확인합니다. 이 네 작은 경로 사이에 실행 순서나 자동 복구 화살표를 만들지 마세요. cache_ 부재 Fatal은
    정상 음수 반환과 구분합니다. 실제 오류 주입 실행이 아닌 소스 기반 검증 위치입니다.
