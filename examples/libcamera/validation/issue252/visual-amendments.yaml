overrides:
  callback-order-flow:
    prompt: 상태 검사를 통과하는 선택 UVC의 내부 호출 순서입니다. 11개 노드를 사용해 PH completeBuffer 진입, bufferCompleted 신호 발생과 emit
      반환, Private completeBuffer, pending 제거·연결 해제, PH 반환, UVC 명시적 completeRequest, complete, 선두 Pending 검사,
      pop_front, Camera requestComplete, requestCompleted 신호 발생을 구분하세요. bufferCompleted와 requestCompleted 노드는
      한국어와 영어 모두 신호 발생/emit 반환으로 명시하고 애플리케이션 수신 함수 실행·복귀로 쓰지 마세요. Queued 수신 실행은 이 순서에 속하지 않으며 pending 갱신보다
      앞이나 뒤일 수 있습니다. Direct 수신만 emit 안에서 동기 호출됩니다. 이 그림에 수신 함수를 추가하지 말고 별도 콜백 경계 그림으로 연결하세요. pending 제거에서 요청
      완료로 병렬 분기하지 마세요.
  uvc-depth-flow:
    question: 제어 적용 뒤 QBUF 실패의 취소와, 성공 제출 뒤 별도로 도착한 장치 완료 알림은 어디에서 갈라집니까?
    prompt: 최대 9노드로 queueRequestDevice, processControls, queueBuffer, queuedBuffers_, cancelRequest, bufferAvailable,
      imageBufferReady, completeRequest를 구분하세요. 제어 음수는 QBUF 전에 취소로, 제어 성공 뒤 QBUF 실패는 제어 롤백 보장 없이 취소로 연결합니다.
      QBUF 성공은 큐 등록으로 연결하고, 여기에서 장치 알림이 별도로 발생하고 DQBUF가 성공한 조건에만 bufferAvailable→imageBufferReady→버퍼 뒤 요청 완료로
      이어집니다. 이 연결은 동기 호출이나 하드웨어 완료 보장이 아니라 별도 장치 이벤트 조건입니다. 등록→장치 알림을 무조건 즉시 실행으로 그리지 마세요. DQBUF 실패의 알림 부재를
      표시하고 성공 경로와 섞지 마세요. Fatal cache_ 부재는 정상 음수 반환으로 일반화하지 마세요.
    sources:
    - submit
    - controls
    - qbuf
    - dequeue
    - uvc-ready
    - uvc-wiring
    - complete
    - dispatch
    whole_sources:
    - submit
    - controls
    - qbuf
    - dequeue
    - uvc-ready
    - uvc-wiring
    - complete
    - dispatch
additions:
- id: callback-boundaries-flow
  topic: callback-depth
  kind: flow
  title: 직접 중첩 호출과 별도 Queued 수신의 경계
  generation: llm
  max_nodes: 9
  question: emit 안의 Direct 실행, emit 뒤 내부 갱신, 별도 Queued 수신과 stop 반환의 수명 협의는 어떻게 다릅니까?
  prompt: 지정한 8개 노드로 Signal::emit→슬롯의 activate→BoundMethodBase::activatePack 실제 호출 간선을 반드시 연결하세요. Object 멤버
    슬롯의 activate에서 activatePack으로 이어지는 원문은 bound-overloads에 있습니다. activatePack의 Direct→invokePack과 Queued→postMessage를
    분기하고, Direct 수신은 emit 안에서 동기 실행합니다. postMessage 뒤 Object::message 처리는 수신 객체와 실제 메시지 소비가 성립한 조건이며 emit 반환·completeBuffer
    내부 갱신보다 앞이나 뒤일 수 있으므로 그 선후를 고정하지 마세요. emit 반환 뒤에만 Request::Private::completeBuffer 내부 갱신으로 연결합니다. Camera::stop
    노드에서는 해당 Blocking 호출의 완료와 다른 Queued 수신자의 마지막 사용을 확인하는 수명 협의를 검증 계획으로 구분하세요. stop 반환에서 모든 수신 처리가 끝났다는 간선을
    만들지 마세요. Direct에서 같은 함수 중첩은 별도 허용 문서가 없으면 금지이며 임의 Camera 상태 변경의 재진입 허용으로 쓰지 않습니다. 신호 발생과 수신 실행을 같은 노드로
    쓰지 마세요. 경계·협의의 그림이며 지원·실행 성공 보장을 만들지 마세요.
