    않으며 0 반환은 게시 뒤임을 보존하세요. 정상 선택 경로의 메시지 소비→대기/준비→등록→완료된 큐 선두 통지라는 경계를 연결합니다. 준비·장치 한도와 정지 취소의 상세는 기존 그림으로
    연결하고 즉시 실행·촬영 성공을 보장하지 마세요. Request 소프트웨어 sequence와 장치 FrameMetadata sequence를 같다고 쓰지 말고, 마지막 노드는 신호 발생과
