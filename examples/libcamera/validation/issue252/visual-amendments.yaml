    호출하는 경로에서 cache_ reset·잔존 큐·후속 DQBUF 접근 조건을 확인합니다. 이 네 작은 경로 사이에 실행 순서나 자동 복구 화살표를 만들지 마세요. cache_ 부재 Fatal은
