schema: 1
sections:
  overview:
    - id: session-states
      topic: lifecycle
      kind: state
      title: 세션의 상태와 허용 전이
      question: >-
        실제 HAL의 초기화·구성·시작·정지 상태와 허용 전이를 설명하세요.
        소스가 확인하는 상태와 조건만 연결하고 없는 전이를 추정하지 마세요.
      generation: llm
  vendor-contract:
    - id: request-flow
      topic: completion
      kind: flow
      title: 요청 제출과 결과 통지
      question: >-
        제출 호출의 반환 결과와 큐에 들어간 요청의 완료 통지가 각각 어떤 조건에 적용되는지 보여 주세요.
        두 사건 사이에 소스가 보장하는 순서만 연결하세요.
      prompt: >-
        제출 함수의 반환과 큐 진입을 구별하고, 완료 통지로 이어지는 조건이 소스에서 확인되면 라벨에 적으세요.
        큐 진입을 전제로 하는 완료 통지 계약에서 제출 함수가 먼저 반환한다는 화살표나 순서 표현을 만들지 마세요.
        두 언어에서 노드와 화살표가 뜻하는 조건과 순서가 같아야 합니다.
      revision_prompt: >-
        한국어와 영어에서 제출 반환과 큐 진입을 같은 사건처럼 표현했는지 확인하세요.
        큐에 들어갔다는 조건은 반환 이후 통지라는 시간 보장으로 읽히지 않게 고치고, 반환 결과와 완료 통지의 조건을 모두 남기세요.
      generation: llm
    - id: buffer-ownership
      topic: ownership
      kind: ownership
      title: 버퍼 준비와 반환, 재사용 조건
      question: >-
        요청에 연결한 동기화 자원은 언제 대기하고 실패 후 어떻게 정리합니까? 정지하면서 모든 접수 요청이 반환되는 경계와 덮어쓰기 전 외부 소비자 확인을 어떻게 구분합니까?
      prompt: >-
        펜스가 있으면 버퍼에 연결하는 단계에서 실제 큐 접수 후의 준비·대기 단계로 향하게 하고, 대기에서 실패 처리와 재사용 전 조치로 분기하세요.
        실패 이후 재사용 조치는 이전 요청의 버퍼 연결보다 앞에 놓지 마세요. 제출 함수의 반환 시점은 큐 진입이나 완료 통지와 묶지 마세요.
        정지 경로에는 소스가 명시한 반환 대상 전체와 반환을 마쳤을 때의 상태를 적으세요. 이는 개별 버퍼 완료와 별개입니다.
        외부 소비자의 사용 종료와 동기화는 덮어쓰기 전 별도 노드에 두고, 한국어는 연동 확인 항목, 영어는 Integration check로 표시하세요.
        이 노드는 연동 측에서 정하고 검증할 확인입니다. 근거가 없는 API 의무·주체·신호·종료 보장은 만들지 마세요.
        원문이 should not으로 표현한 권고는 한국어로 사용하지 않는 것이 권장됨, 영어로 should not 또는 is not recommended처럼 같은 강도로 쓰세요.
        각 화살표는 두 언어에서 같은 조건과 방향을 표현하세요. 제품에 없는 단계는 만들지 않고, 요청한 경계를 발췌에서 확인할 수 없으면 확인할 조건을 라벨에 명시하세요.
      audit_prompt: >-
        소스에 펜스 계약이 있으면 버퍼 연결, 실제 큐 진입 후 준비·대기, 대기 실패와 정리, 재사용 전 조치가 이 방향으로 읽혀야 합니다.
        실패 노드에서 같은 요청의 처음 연결로 되돌아가는 역순을 거절하세요. 새 요청의 재연결을 그리면 그 전에 필요한 정리와 새 요청이라는 범위를 명시해야 합니다.
        정지 중 모든 접수 요청이 호출자에 반환되는 상태 계약이 있다면 대상과 경계를 남겨야 합니다.
        외부 소비자 종료와 동기화 노드에 한국어 연동 확인 항목과 영어 Integration check가 명시되어야 합니다.
        두 언어에서 연동 측이 정할 확인 조건으로 읽혀야 합니다. 정지 경계나 완료 통지의 보장, 원문에 없는 API 의무, 제출 반환이 완료 통지보다 먼저라는 순서를 암시하면 거절하세요.
        should not을 사용해서는 안 됨 또는 must not으로 강화하거나 원문상의 의무를 권고로 약화하면 거절하세요.
        두 방향과 경계를 두 언어에서 확인하세요. 제품의 실제 동작을 따르고, 발췌에서 확인할 수 없는 단계·주체는 명시적인 확인 항목으로 남겨야 합니다.
      generation: llm
    - id: request-failures
      topic: failure
      kind: decision
      title: 요청 제출 검사와 반환 결과
      question: >-
        요청 제출을 시도하면 어떤 입력을 검사하고, 각각의 조건에서 어떤 성공 또는 오류 값을 반환합니까?
      prompt: >-
        시작 노드를 제출 함수의 호출 시도로 쓰고, 소스에서 확인한 입력 검사를 거쳐 성공 반환과 거부 반환으로 분기하세요.
        성공·오류 반환은 각각 shape outcome으로 표시하고 여기서 그림을 끝내세요. 끝에서 다른 노드로 화살표를 그리지 마세요.
        이 그림의 범위는 제출 함수의 반환까지입니다. 접수된 요청의 펜스·장치 처리, 완료 통지와 개별 프레임 상태는 다른 설명에서 다룹니다.
        근거가 있는 검사와 반환값을 연결하고, 한국어와 영어의 라벨은 각각 같은 사건과 조건을 표현하세요.
        원문이 오류 조건을 나열하고 검사 순서나 조건이 겹칠 때의 우선순위를 보장하지 않으면, 시작 노드의 한국어·영어 레이블에 그 범위를 명시하세요.
      revision_prompt: >-
        제출 오류로 이어지는 모든 화살표의 시작 라벨을 한국어와 영어에서 읽어 보세요.
        큐 진입이 완료되었다는 결과와 제출 호출을 혼동했다면 호출 단계로 바로잡으세요.
        그림 전체가 연결되고, 입력 검사를 거쳐 성공·오류 반환에서 각각 끝나는지 확인하세요.
        모든 반환 노드에 shape outcome을 사용하고, 반환에서 후속 처리나 통지로 나가는 화살표와 범위 밖 프레임 상태는 제거하세요.
        소스에서 확인되는 입력 검사와 반환값은 유지하세요.
        나란히 표시한 반환 조건이 배타적 검사 순서나 오류 우선순위로 읽히지 않도록 두 언어를 대조하세요. 실제 코드에 순서가 있으면 관찰한 구현 범위만 쓰고, API 보장은 원문에 명시된 경우에만 남기세요.
      require_connected: true
      require_terminal_outcomes: true
      generation: llm
