schema: 1
sections:
  overview:
    - id: session-states
      topic: lifecycle
      kind: state
      title: 세션의 상태와 허용 전이
      question: >-
        실제 HAL의 초기화·구성·시작·정지 상태와 허용 전이를 설명하세요.
        소스가 확인하는 상태와 조건만 연결하고 없는 전이를 추정하지 마세요.
      generation: llm
  vendor-contract:
    - id: request-flow
      topic: completion
      kind: flow
      title: 요청 제출과 결과 통지
      question: >-
        제출 호출의 반환 결과와 큐에 들어간 요청의 완료 통지가 각각 어떤 조건에 적용되는지 보여 주세요.
        두 사건 사이에 소스가 보장하는 순서만 연결하세요.
      prompt: >-
        제출 함수의 반환과 큐 진입을 구별하고, 완료 통지로 이어지는 조건이 소스에서 확인되면 라벨에 적으세요.
        큐 진입을 전제로 하는 완료 통지 계약에서 제출 함수가 먼저 반환한다는 화살표나 순서 표현을 만들지 마세요.
        두 언어에서 노드와 화살표가 뜻하는 조건과 순서가 같아야 합니다.
      revision_prompt: >-
        한국어와 영어에서 제출 반환과 큐 진입을 같은 사건처럼 표현했는지 확인하세요.
        큐에 들어갔다는 조건은 반환 이후 통지라는 시간 보장으로 읽히지 않게 고치고, 반환 결과와 완료 통지의 조건을 모두 남기세요.
      generation: llm
    - id: buffer-ownership
      topic: ownership
      kind: ownership
      title: 요청과 버퍼를 유지할 기간
      question: >-
        실제 소스가 정한 요청·버퍼·fence의 소유자와 참조·반환·재사용 경계를 보여 주세요.
        코드에서 확인되는 마지막 반환 지점까지 그리고, 후속 소비자의 사용 종료를 누가 확인할지는
        근거가 있을 때만 연결하세요. 완료 통지에서 바로 덮어쓸 수 있다는 전이를 추정하지 마세요.
      generation: llm
    - id: request-failures
      topic: failure
      kind: decision
      title: 요청 제출 검사와 반환 결과
      question: >-
        요청 제출을 시도하면 어떤 입력을 검사하고, 각각의 조건에서 어떤 성공 또는 오류 값을 반환합니까?
      prompt: >-
        시작 노드를 제출 함수의 호출 시도로 쓰고, 소스에서 확인한 입력 검사를 거쳐 성공 반환과 거부 반환으로 분기하세요.
        성공·오류 반환은 각각 shape outcome으로 표시하고 여기서 그림을 끝내세요. 끝에서 다른 노드로 화살표를 그리지 마세요.
        이 그림의 범위는 제출 함수의 반환까지입니다. 접수된 요청의 펜스·장치 처리, 완료 통지와 개별 프레임 상태는 다른 설명에서 다룹니다.
        근거가 있는 검사와 반환값을 연결하고, 한국어와 영어의 라벨은 각각 같은 사건과 조건을 표현하세요.
      revision_prompt: >-
        제출 오류로 이어지는 모든 화살표의 시작 라벨을 한국어와 영어에서 읽어 보세요.
        큐 진입이 완료되었다는 결과와 제출 호출을 혼동했다면 호출 단계로 바로잡으세요.
        그림 전체가 연결되고, 입력 검사를 거쳐 성공·오류 반환에서 각각 끝나는지 확인하세요.
        모든 반환 노드에 shape outcome을 사용하고, 반환에서 후속 처리나 통지로 나가는 화살표와 범위 밖 프레임 상태는 제거하세요.
        소스에서 확인되는 입력 검사와 반환값은 유지하세요.
      require_connected: true
      require_terminal_outcomes: true
      generation: llm
