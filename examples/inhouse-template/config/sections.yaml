- id: vendor-contract
  group: For Vendor
  nav_section: 연동 구현
  title: 연동 가이드
  output: vendor-contract.md
  kind: prose
  lead: 정지 중 결과를 받았다면 ‘제출·완료·정지’에서 프레임을 읽을 조건을 확인하세요. 같은 버퍼를 다시 제출할 때 필요한 조건은 ‘요청과 버퍼 수명’에서 확인하세요.
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  facts:
    classes: []
  watch:
  - '**/*.cpp'
  - '**/*.h'
  reader_profile: vendor
  show_evidence: true
  design_requirements:
  - id: integration
    question: 연동 호출 하나를 골라, 호출자가 먼저 준비할 자원과 제공 측이 검사하거나 반환하는 결과를 설명하세요. 다음 호출로 넘어갈 수 있는 조건은 무엇입니까?
    aspects:
    - inputs
  - id: inputs
    question: 실제 호출에서 입력 하나가 거절되거나 조정되는 조건은 무엇입니까? 호출자가 넘긴 값과 검사한 코드, 관찰할 수 있는 반환값이나 상태를 연결하세요.
    aspects:
    - inputs
  - id: ownership
    question: 요청 준비와 동기화 실패 후 처리, 정지에서 큐가 비워질 때까지의 반환 경계, 덮어쓰기 전 후속 소비자 확인을 각각 설명하세요.
    aspects:
    - ownership
  - id: completion
    question: 정지 중 결과를 받으면 어떤 상태를 확인해 프레임과 메타데이터를 사용합니까? 제출 호출의 반환, 요청의 큐 진입, 완료 통지의 조건과 개별 버퍼의 결과를 구분하세요. 오류 상태에서 어떤 필드가 유효하며 나머지 필드에는 어떤 유효성 조건이 적용됩니까?
    aspects:
    - completion
  - id: failure
    question: 요청 제출이나 처리에서 확인되는 실패를 골라, 호출 시도, 접수 결과, 접수 후 처리 가운데 어느 단계에서 어떤 신호로 드러나는지 설명하세요. 호출자는 어떤 결과를 사용할 수 있고 무엇을 확인해야 합니까?
    aspects:
    - failure
  - id: verification
    question: 개별 버퍼의 메타데이터가 언제부터 언제까지 유효하며, 실제 실행에서 영상 사용과 재사용을 판단하려면 무엇을 관찰해야 합니까?
    aspects:
    - verification
  design_topics:
  - id: integration
    title: 연동 순서와 책임
    question: 카메라 연동자가 캡처를 구성하거나 요청을 제출하는 경로에서 직접 넘겨야 할 자원은 무엇입니까? 호출 전 조건과 반환 결과를 연결해 다음 동작을 결정하세요. 내부 유틸리티의 실행 조건만 확인되면 캡처 경로의 근거를 더 찾으세요.
    sources: []
    covers:
    - integration
  - id: inputs
    title: 입력 조건과 구현 책임
    question: 실제 호출에서 입력 하나가 거절되거나 조정되는 조건은 무엇입니까? 호출자가 넘긴 값과 검사한 코드, 관찰할 수 있는 반환값이나 상태를 연결하세요.
    sources: []
    covers:
    - inputs
  - id: ownership
    title: 요청과 버퍼 수명
    question: 요청에 연결한 동기화 자원은 언제 대기하며 실패한 뒤 어떻게 정리합니까? 정지 시 소스에서 확인되는 반환 경계와 버퍼를 다시 쓰기 전에 남는 외부 소비자·동기화 확인은 무엇입니까?
    evidence_roles: [stop, fence, use, notification]
    prompt: >-
      근거를 고를 때 동기화 자원의 연결·큐 접수 후 준비·대기 실패 및 재사용 전 정리를 설명하는 발췌와
      정지 중 접수된 요청들이 언제 호출자에게 반환되는지 밝히는 상태 계약을 우선하세요.
      반환이 끝나는 경계와 마지막 외부 소비자의 사용 종료는 별개입니다.
      확인 가능한 반환 조건을 남기고, 소스가 외부 소비자 또는 동기화 완료의 확인자를 확정하지 않으면 연동 시 확인할 항목으로 쓰세요.
      원문이 should not 또는 not recommended로 표현한 권고는 사용하지 않는 것이 권장된다고 쓰세요. must not이나 shall not의 금지와 강도를 섞지 마세요.
      펜스나 큐가 없는 제품에는 발췌에 나타난 실제 대체 경계만 설명하세요.
    revision_prompt: >-
      펜스나 버퍼 재사용의 조건과 의무 강도를 각각 원문에 대조하세요.
      should not은 사용하지 않는 것이 권장된다고 쓰고, 실제 금지나 실패 후 필수 조치와 구분하세요.
      확인 주체와 방법이 발췌에 없다면 마지막 외부 소비자 종료와 동기화는 연동 확인 항목으로 표시하세요.
    sources: []
    covers:
    - ownership
  - id: completion
    title: 제출·완료·정지
    question: 정지 중 결과 통지를 받은 호출자는 어떤 프레임과 메타데이터를 사용할 수 있습니까? 해당 버퍼의 상태에 따른 행동부터 설명하고 제출 반환과 요청 완료가 각각 무엇을 보장하는지 연결하세요. 프레임을 읽는 판단과 그 버퍼를 덮어쓰는 판단에 각각 어떤 조건이 필요합니까?
    prompt: >-
      제출 함수의 반환이 뜻하는 결과와 완료 통지가 적용되는 요청의 조건을 각각 답하세요.
      큐에 들어간 요청을 완료 시 통지한다는 계약은 그 통지가 제출 함수에서 반환한 뒤에만 발생한다는 보장과 다릅니다.
      두 사건의 순서나 실행 스레드가 문서화된 경우에만 확정하고, 독자의 판단에 필요한 미확인 관계는 따로 밝히세요.
      상태별 프레임과 메타데이터 유효성을 설명하고, 오류 상태에서 유효하다고 명시된 필드와 나머지 필드에 적용되는 조건을 모두 다루세요.
      특정 필드가 유효하고 나머지가 유효하지 않을 수 있다는 조건을 나머지가 모두 무효라고 바꾸지 마세요.
      전부 무효나 특정 필드만 유효하다고 명시한 다른 상태는 그 제한을 그대로 쓰세요.
    revision_prompt: >-
      제출 반환, 큐 진입, 완료 통지 사이의 보장을 인용 구절과 하나씩 대조하세요.
      큐 진입 조건을 반환 이후의 완료 통지 보장으로 표현했다면 고치세요.
      오류 상태에서는 유효하다고 명시된 필드와 나머지의 가능성 또는 제한을 빠짐없이 써서 서로 같은 조건처럼 보이지 않게 하세요.
      확인 가능한 계약을 삭제하고 통과하려 하지 말고, 나머지 프레임 사용 및 버퍼 재사용 조건 중 근거가 있는 내용도 유지하세요.
    sources: []
    covers:
    - completion
  - id: failure
    title: 실패 처리
    question: 요청 제출이나 처리에서 소스가 보여 주는 실패는 어느 단계에서 어떤 신호로 드러납니까? 호출자는 어떤 결과를 사용할 수 있고 무엇을 확인해야 합니까?
    prompt: >-
      실패가 제출 호출에서 반환되는 경우와 접수된 요청의 처리 중 통지되는 경우를 구분하세요.
      제출 함수 이름이 큐 삽입을 가리키더라도 호출 시도와 실제 큐 진입을 동일한 사건으로 표현하지 마세요.
    sources: []
    covers:
    - failure
  - id: verification
    title: 실행 확인
    question: 한 건의 캡처에서 어느 시점에 무엇을 관찰하면 영상 사용으로 넘어갈 수 있습니까? 버퍼 재사용으로 넘어가려면 연동 측에서 무엇을 더 확인해야 합니까? 소스가 보장하는 진행 조건과 실제 기기에서 관찰해야 할 결과를 구분하세요.
    evidence_roles: [buffer_completion, frame, stop]
    prompt: >-
      개별 버퍼 완료를 알리는 실제 지점과 그 버퍼의 동적 메타데이터 유효 기간을 함께 설명할 발췌를 우선하세요.
      원문이 버퍼 완료부터 새 요청에서의 재사용 또는 삭제 전까지 유효하다고 규정했다면 시작·종료 조건을 모두 쓰세요.
      요청 완료 통지만으로 개별 버퍼 메타데이터의 유효 시점이나 두 사건의 상대 순서를 확정하지 마세요.
      버퍼 완료 지점이나 유효 기간을 확인할 수 없다면 무엇을 추가로 확인할지 표시하세요.
      이 조건을 근거로 어느 시점의 어떤 값을 관찰할지 설명하고, 개별 상태의 뜻을 다시 나열하지 마세요.
    revision_prompt: >-
      영상 사용을 판단하는 조건에서 요청 완료 통지와 개별 버퍼의 완료 지점을 구분했는지 확인하세요.
      메타데이터를 읽을 수 있는 시작점과 끝점이 발췌에 있으면 모두 인용해 남기고, 발췌가 두 사건의 순서를 보장하지 않으면 미확인 관계로 표시하세요.
      요청 완료 통지만 관찰하면 메타데이터가 유효하다는 문장은 개별 버퍼에 적용되는 조건으로 바로잡으세요.
    sources: []
    covers:
    - verification
  routes:
  - q: 제품 개요에서 필요한 내용을 확인합니다.
    to: vendor-overview.md
  - q: 지원 범위와 검증에서 필요한 내용을 확인합니다.
    to: vendor-assurance.md
  next:
    title: 지원 범위와 검증
    link: vendor-assurance.md
  design_generation: llm
