    tasks:
    - id: adoption
      goal: '실제 HAL 자료 확보 후: 고객사가 기능과 근거 있는 강점, 적용 조건을 이해하고 도입 범위를 고릅니다.'
      completion: 제품의 목적·기능·조건에 답하는 절과 근거에 도달합니다.
      requirements:
      - capabilities
      - benefits
    optional:
    - id: implementation-detail
      location: vendor-contract.md
      reason: 내부 상세는 과업에 필요한 조건과 예외를 유지한 채 연결해서 읽습니다.
    excluded:
    - id: all-features
      reason: 전체 기능·모든 하드웨어 조합의 참조서는 이 개요의 목적이 아닙니다.
    removed_requirements: []
