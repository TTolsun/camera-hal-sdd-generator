# 사내 HAL 템플릿: 생성기의 config/sections.yaml 을 바탕으로, components 를 모델 없는 구성 요소 색인으로 바꿨다.
# SDD 섹션 정의.
# 각 섹션은 "어떤 사실(facts)에서 나오는가" 와 "어떤 소스 변경에 영향을 받는가(watch)" 를 고정한다.
# 페이지 뼈대는 style/README.md 규칙을 따른다: 할 일 한 문장으로 시작(lead), 확인할 내용 -> 절 표(routes),
# 본문, 근거와 검토 정보, 다음 단계 하나(next).
#
# kind:
#   prose        - 결정적 표 + LLM 서술 한 번.
#   per-package  - 패키지(디렉터리)마다 클래스 표 + LLM 서술. 소형 모델 입력 상한 대응.
#   per-scenario - config/scenarios.yaml 의 시나리오마다 문서 하나. 시퀀스 다이어그램과 호출 순서는 도구가, 설명만 LLM 이.
#   table        - LLM 없이 사실만으로 표를 만든다.
#   index        - 문서 목록 한 장. 다른 섹션의 title·reader·lead 를 그대로 옮긴다. LLM 을 부르지 않는다.
#                  mkdocs 와 사이트가 첫 페이지로 찾는 index.md 를 파이프라인이 만들게 하는 종류다.
#   manual       - 사람이 쓰는 문서. 파일이 없으면 무엇을 써야 하는지 적은 자리를 만들고, 내용이 있으면 덮어쓰지 않는다. frontmatter 의 evidence_files 가 바뀌면 영향 보고에 올린다.
#
# watch: 소스 루트 기준 glob. 이 경로가 변경되면 섹션을 재생성 대상으로 잡는다.
#        빌드 파일은 그 섹션이 다루는 영역으로 좁힌다. `**/Android.mk` 처럼 전역으로 두면 관계 없는
#        디렉터리의 빌드 파일 변경이 모든 섹션을 끌고 온다. libcamera 두 커밋으로 실측했을 때
#        전역 `**/meson.build` 때문에 7개 섹션이 전부 재생성 대상이 됐고, 좁히자 5개로 줄었다.
#        기능 추가 커밋은 거의 항상 빌드 파일을 건드리므로, 좁히지 않으면 증분이 전체 재생성이 된다.
# facts.classes / facts.packages / facts.functions: fnmatch 패턴.
# group: 사이트 왼쪽 메뉴에서 이 문서를 묶을 제목. 생략하면 sdd.yaml 의 site.nav_group 또는 "설계 문서" 로 묶는다.
#        같은 그룹끼리 처음 나온 순서대로 모이므로, 섹션 순서를 바꿔도 제목이 두 번 나오지 않는다.
#        그룹이 메뉴에 나오는 차례는 sdd.yaml 의 site.nav_groups 로 따로 정한다.
# lead: 페이지 첫 문장. 독자가 먼저 할 일 또는 결론. 굵게 표시된다.
# routes: "지금 확인할 내용 -> 이동할 절" 표. 생략하면 본문의 ## 제목에서 자동 생성한다.
# next: 페이지 끝에 연결할 문서 하나.

sections:
  - id: index
    group: 시작하기
    title: 문서 안내
    output: index.md
    kind: index
    lead: 아래 표에서 지금 필요한 문서를 고르세요.
    reader: 이 문서 묶음을 처음 여는 개발자
    next: {title: 시스템 개요, link: overview.md}

  - id: overview
    group: For Users
    title: 시스템 개요
    output: overview.md
    kind: prose
    lead: 수정할 기능이 어느 패키지에 있는지 아래 표에서 먼저 찾으세요.
    reader: 이 HAL 을 처음 읽는 개발자
    answers:
      - 이 HAL 은 어떤 패키지로 나뉘고, 각 패키지는 무엇을 담당하는가?
      - 패키지 사이의 의존 방향은 어디에서 어디로 향하는가?
      - 프레임워크가 HAL 을 부르는 진입점은 어디인가?
    facts:
      packages: ["*"]
      functions: ["camera_*", "HAL_*", "*_open", "*_close", "get_*"]
      classes: ["*"]         # 인용할 file:line 을 주기 위해 사실로는 넘기되,
      class_table: false     # 개요 페이지에 클래스 표는 그리지 않는다 (components.md 가 담당).
      impact_classes: []     # 클래스 변경으로는 개요를 다시 만들지 않는다. watch 만 본다.
      reading_order: process_capture_request   # "코드를 처음 읽는 순서" 를 만들 시나리오
    routes:
      - q: 수정할 패키지를 찾습니다.
        to: "#패키지별-역할"
      - q: 프레임워크에서 HAL 로 들어오는 진입점을 찾습니다.
        to: "#관련-자유-함수"      # 생성기가 facts.functions 로 만드는 절 제목
      - q: 코드를 처음 읽습니다.
        to: "#코드를-처음-읽는-순서"
      - q: 클래스 단위 책임을 확인합니다.
        to: components.md
    watch: ["**/*.h", "**/*.hpp", "Android.mk", "**/Android.mk"]
    next: {title: 컴포넌트 구조와 책임, link: components.md}

  - id: components
    group: For Developers
    title: 컴포넌트 구조와 책임
    output: components.md
    kind: per-package
    # 빌드한 모든 클래스·함수를 패키지별 표로 싣는다. 모델을 부르지 않는다.
    # 이 색인이 있으면 문서가 다루지 않는 코드 변경 때문에 sdd update 가 멈추는 일이 크게 줄어든다.
    narration: facts
    lead: 수정할 클래스가 속한 패키지의 절로 이동해 책임과 상속 관계부터 확인하세요.
    reader: 특정 클래스를 수정하려는 개발자
    answers:
      - 이 패키지의 클래스들은 각각 무엇을 책임지는가?
      - 클래스 사이의 상속, 소유, 의존 관계는 어떻게 되는가?
      - 버퍼, 요청, 콜백을 누가 만들고 누가 해제하는가? (사실에 없으면 확인 필요로 남긴다)
    facts:
      diagram: class_overview
      packages: ["*"]
      classes: ["*"]
      functions: ["*"]
    watch: ["**/*.h", "**/*.hpp", "**/*.cpp", "**/*.cc"]
    next: {title: 핵심 시나리오 시퀀스, link: scenarios/index.md}

  - id: scenarios
    group: For Users
    title: 핵심 시나리오
    output: scenarios/index.md
    kind: per-scenario
    lead: 추적하려는 동작의 시나리오를 표에서 고르세요. 주요 호출과 추적 경계를 먼저 확인하고 전체 기록을 펼쳐 보세요.
    reader: 특정 동작의 호출 경로를 추적하는 개발자
    answers:
      - 진입점에서 어떤 컴포넌트의 호출이 추출되었는가?
      - 어디서 분기하고, 어디서 정적 추적이 끊기는가?
    facts:
      scenarios: "*"
    watch: ["**/*.cpp", "**/*.cc"]
    next: {title: Feature flag 매트릭스, link: feature-flags.md}

  - id: feature-flags
    group: For Developers
    title: Feature flag 매트릭스
    output: feature-flags.md
    kind: table
    reader: 빌드 구성에 따라 동작이 갈리는 지점을 찾는 개발자
    lead: 바꾸려는 동작이 어떤 -D 플래그 아래에 있는지 표에서 확인하세요. 이 표는 NDK-build 구성 기준입니다.
    facts:
      defines: "*"
    watch: ["Android.mk", "Application.mk", "**/*.mk", "**/*.h", "**/*.cpp"]
    next: {title: 스레드와 큐 모델, link: threading.md}

  - id: threading
    group: For Developers
    title: 스레드와 큐 모델
    output: threading.md
    kind: prose
    lead: 콜백이 어느 스레드에서 실행되는지는 정적 분석으로 확인되지 않았습니다. 아래 표의 클래스를 수정하기 전에 실행 스레드를 직접 확인하세요.
    reader: 스레드 경계를 넘는 코드를 수정하는 개발자
    answers:
      - 어떤 클래스가 스레드나 큐를 소유하는가?
      - 어떤 메서드가 스레드 경계에서 호출되는가?
    facts:
      packages: []
      classes: ["*Thread*", "*Queue*", "*Looper*", "*Worker*", "*Handler*"]
    watch: ["**/*Thread*", "**/*Queue*", "**/*Looper*"]
    needs_human: true
    next: {title: 변경 시 지켜야 할 제약, link: constraints.md}

  # ---- 사람이 쓰는 문서 --------------------------------------------------------
  # 코드로 확인한 동작(위 섹션)과 설계 결정·기기 관찰(아래 문서)을 구분한다 (style/README.md 5항).

  - id: constraints
    group: For Developers
    title: 변경 시 지켜야 할 제약
    output: constraints.md
    kind: manual
    next: {title: 설계 결정 기록, link: decisions.md}

  - id: decisions
    group: For Developers
    title: 설계 결정 기록
    output: decisions.md
    kind: manual
    next: {title: 시스템 개요, link: overview.md}
