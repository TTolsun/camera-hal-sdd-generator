- id: team-overview
  group: For Developer
  nav_section: 구조 이해
  title: 타팀이 확인할 역할과 책임
  kind: prose
  output: team-overview.md
  reader_profile: team
  reader: HAL과 연동하는 다른 팀의 개발자
  lead: 실제 HAL의 역할·입출력·책임 경계를 확인하세요.
  design_generation: llm
  show_evidence: true
  facts:
    classes: []
  watch:
  - '**/*.cpp'
  - '**/*.h'
  design_requirements:
  - id: role
    question: 이 프로젝트는 무엇을 하며 누구의 어떤 문제를 풉니까?
    aspects:
    - role
  - id: inputs
    question: 이 프로젝트는 무엇을 입력으로 받습니까?
    aspects:
    - inputs
  - id: outputs
    question: 이 프로젝트는 무엇을 결과로 내놓습니까?
    aspects:
    - outputs
  - id: boundaries
    question: 어느 계층·팀과 책임이 나뉩니까?
    aspects:
    - boundaries
