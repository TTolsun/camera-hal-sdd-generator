- id: overview
  group: For Developer
  title: 시스템 개요
  output: overview.md
  kind: prose
  lead: 첫 파일과 진입점부터 요청과 결과를 따라가고, 수정·디버깅할 코드를 찾으세요.
  reader: 이 HAL을 처음 읽는 신입·타팀 개발자
  answers:
  - 이 HAL 은 어떤 패키지로 나뉘고, 각 패키지는 무엇을 담당하는가?
  - 패키지 사이의 의존 방향은 어디에서 어디로 향하는가?
  - 프레임워크가 HAL 을 부르는 진입점은 어디인가?
  facts:
    functions:
    - camera_*
    - HAL_*
    - '*_open'
    - '*_close'
    - get_*
    classes:
    - '*'
    class_table: false
    impact_classes: []
    reading_order: process_capture_request
  watch:
  - '**/*.h'
  - '**/*.hpp'
  - Android.mk
  - '**/Android.mk'
  next:
    title: 컴포넌트 구조와 책임
    link: components.md
  reader_profile: developer
  show_evidence: true
  design_requirements:
  - id: entry
    question: 처음 읽을 파일과 진입점, 요청을 따라갈 순서는 무엇입니까?
    aspects:
    - entry
  - id: responsibility
    question: 컴포넌트의 책임은 어떻게 나뉩니까?
    aspects:
    - responsibility
  - id: boundaries
    question: 제어와 데이터는 어떤 경계를 통과합니까?
    aspects:
    - boundaries
  - id: lifecycle
    question: 상태와 자원 수명은 어떻게 변합니까?
    aspects:
    - lifecycle
  - id: concurrency
    question: 스레드와 동기화 책임은 어디에 있습니까?
    aspects:
    - concurrency
  - id: verification
    question: 증상별로 어느 코드부터 확인하고, 수정 후 어떤 조건을 검증해야 합니까?
    aspects:
    - verification
  design_topics:
  - id: entry
    title: 처음 읽을 코드와 순서
    question: 처음 읽을 파일과 진입점, 요청을 따라갈 순서는 무엇입니까?
