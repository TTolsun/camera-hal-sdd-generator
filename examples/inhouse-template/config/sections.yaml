    - benefits
  design_topics:
  - id: capabilities
    title: 제공 기능과 지원 범위
    question: 어떤 기능을 제공하며 지원 범위는 어떤 구현에 달려 있습니까?
    sources: []
    covers:
    - capabilities
  - id: benefits
    title: 구현 근거로 보는 강점
    question: 공통 구현을 활용할 수 있는 강점과 그 조건은 무엇입니까?
    sources: []
    covers:
    - benefits
  routes:
  - q: 연동 가이드에서 필요한 내용을 확인합니다.
    to: vendor-contract.md
