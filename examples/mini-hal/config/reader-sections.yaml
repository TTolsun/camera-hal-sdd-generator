sections:
- id: vendor-overview
  title: 제품 개요
  kind: prose
  output: vendor-overview.md
  group: For Vendor
  reader_profile: vendor-overview
  lead: 제공 기능과 공통 설계의 강점을 확인하고 도입할 범위를 판단하세요.
  narration: facts
  facts:
    classes: []
  diagram:
    enabled: false
  show_evidence: true
  design_requirements:
  - id: capabilities
    question: 어떤 기능을 제공하며 지원 범위는 어떤 구현에 달려 있습니까?
    aspects:
    - capabilities
  - id: benefits
    question: 공통 구현을 활용할 수 있는 강점과 그 조건은 무엇입니까?
    aspects:
    - benefits
  design_topics:
  - id: capabilities
    title: 제공 기능과 지원 범위
    question: 어떤 기능을 제공하며 지원 범위는 어떤 구현에 달려 있습니까?
    sources:
    - &id001
      id: device
      file: src/device/CameraDevice.cpp
      start: '#include "device/CameraDevice.h"'
      end: '}  // namespace halcam'
      sha256: 7d9a81a09adcd15ccb946a7ffdb74417ecff5ed5f512c9c81fd7d9978094295e
    statements:
    - text: initialize()로 콜백을 등록하고 configureStreams()로 스트림을 구성한 뒤 요청을 제출하는 작은 HAL 예제입니다. 실제 제품의 지원 기종이나 촬영 성능을 입증하는
        예제는 아닙니다.
      covers:
      - capabilities
      evidence:
      - device
  - id: benefits
    title: 구현 근거로 보는 강점
    question: 공통 구현을 활용할 수 있는 강점과 그 조건은 무엇입니까?
    sources:
    - *id001
    - id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    statements:
    - text: RequestManager는 submit()에서 프레임 등록과 작업 큐 전달을 맡고, 성공한 runPipes()의 결과를 콜백으로 전달합니다. 요청 관리와 파이프 작업을 나누어 읽을
        수 있는 구조이지만, 실패와 종료 시 자원 정리는 완성되어 있지 않습니다.
      covers:
      - benefits
      evidence:
      - device
      - requests
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  routes:
  - q: 연동 가이드에서 필요한 내용을 확인합니다.
    to: vendor-contract.md
  - q: 지원 범위와 검증에서 필요한 내용을 확인합니다.
    to: vendor-assurance.md
  next:
    title: 연동 가이드
    link: vendor-contract.md
- id: vendor-contract
  title: 연동 가이드
  kind: prose
  output: vendor-contract.md
  group: For Vendor
  reader_profile: vendor
  lead: 연동 순서와 구현 책임을 확인하고 설정·요청·정지 계약을 적용하세요.
  narration: facts
  facts:
    classes: []
  diagram:
    enabled: false
  show_evidence: true
  design_requirements:
  - id: integration
    question: 연동을 시작할 순서와 제공 측·Vendor의 구현 책임은 무엇입니까?
    aspects:
    - inputs
  - id: inputs
    question: 입력 조건과 구현 책임은 무엇입니까?
    aspects:
    - inputs
  - id: ownership
    question: 요청과 버퍼를 누가 유지하고 반환합니까?
    aspects:
    - ownership
  - id: completion
    question: 제출과 완료, 정지를 어떻게 구분합니까?
    aspects:
    - completion
  - id: failure
    question: 실패를 어떻게 구분하고 처리합니까?
    aspects:
    - failure
  - id: verification
    question: 어떤 조건을 실행에서 확인해야 합니까?
    aspects:
    - verification
  design_topics:
  - id: integration
    title: 연동 순서와 책임
    question: 연동을 시작할 순서와 제공 측·Vendor의 구현 책임은 무엇입니까?
    sources:
    - &id002
      id: device
      file: src/device/CameraDevice.cpp
      start: '#include "device/CameraDevice.h"'
      end: '}  // namespace halcam'
      sha256: 7d9a81a09adcd15ccb946a7ffdb74417ecff5ed5f512c9c81fd7d9978094295e
    - &id003
      id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    statements:
    - text: 연동 호출자는 initialize()로 콜백을 등록하고 configureStreams()로 스트림을 설정한 뒤 processCaptureRequest()로 요청을 전달합니다. 호출자는
        고유한 frame_number를 제공하고, 구현 담당자는 큐 거절·파이프 실패·종료 중 요청 정리를 보완해야 합니다.
      covers:
      - integration
      evidence:
      - device
      - requests
  - id: inputs
    title: 입력 조건
    sources:
    - *id002
    statements:
    - text: 콜백을 initialize()로 등록한 뒤 configureStreams()를 호출합니다. null 구성과 0개 또는 MAX_PIPES 초과 스트림은 거절합니다. USE_DUAL_CAMERA
        구성에서는 홀수 스트림 수도 거절합니다.
      covers:
      - inputs
      evidence:
      - device
    question: 입력 조건과 구현 책임은 무엇입니까?
  - id: ownership
    title: 프레임 소유권
    sources:
    - *id003
    statements:
    - text: 프레임 소유권과 작업 스레드의 포인터 관계는 [개발자 안내](architecture-contract.md#자원-수명)에서 확인합니다. 요청 제출자는 고유한 frame_number를
        전달해야 기존 inFlight_ 항목을 덮어쓰지 않습니다.
      covers:
      - ownership
      evidence:
      - requests
    question: 요청과 버퍼를 누가 유지하고 반환합니까?
  - id: completion
    title: 제출과 완료
    sources:
    - *id002
    - *id003
    statements:
    - text: submit()의 0 반환은 큐 등록 성공입니다. 결과 콜백은 runPipes()가 0을 반환할 때 호출합니다. flush()는 drain()을 호출하지만, 이 예제의 drain()은
        완료를 기다리지 않고 inFlight_를 지웁니다.
      covers:
      - completion
      evidence:
      - device
      - requests
    question: 제출과 완료, 정지를 어떻게 구분합니까?
  - id: failure
    title: 실패 처리
    sources:
    - *id003
    statements:
    - text: enqueue() 실패는 -1로 반환되지만 이미 등록된 inFlight_ 항목은 그 자리에서 제거하지 않습니다. runPipes() 실패 시에는 결과 콜백 없이 onFrameDone()으로
        항목을 지웁니다. 오류 알림을 완성한 제품 구현으로 사용할 수 없습니다.
      covers:
      - failure
      evidence:
      - requests
    question: 실패를 어떻게 구분하고 처리합니까?
  - id: verification
    title: 실행 확인
    sources:
    - *id003
    - id: thread
      file: src/pipeline/PipeThread.cpp
      start: '#include "pipeline/PipeThread.h"'
      end: '}  // namespace halcam'
      sha256: 2a2fd50d3f77d29e97c6306058935c854e998f2139abf77f2220eac52bc6c166
    statements:
    - text: 이 예제는 정적 문서 파이프라인 검증용입니다. 큐 거절과 파이프 오류에서 요청이 정리되는지, flush()와 close() 중 작업 포인터가 유효한지는 별도 실행 검증 대상입니다.
        소스에는 대기 없이 프레임을 지우는 경로가 있습니다.
      covers:
      - verification
      evidence:
      - requests
      - thread
    question: 어떤 조건을 실행에서 확인해야 합니까?
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  routes:
  - q: 제품 개요에서 필요한 내용을 확인합니다.
    to: vendor-overview.md
  - q: 지원 범위와 검증에서 필요한 내용을 확인합니다.
    to: vendor-assurance.md
  next:
    title: 지원 범위와 검증
    link: vendor-assurance.md
- id: vendor-assurance
  title: 지원 범위와 검증
  kind: prose
  output: vendor-assurance.md
  group: For Vendor
  reader_profile: vendor-assurance
  lead: 지원 조건과 구성 제약을 확인하고 제품 도입 전에 검증할 범위를 정하세요.
  narration: facts
  facts:
    classes: []
  diagram:
    enabled: false
  show_evidence: true
  design_requirements:
  - id: constraints
    question: 지원 전제와 제약은 무엇이며 별도 검증할 항목은 무엇입니까?
    aspects:
    - constraints
  - id: verification
    question: 어떤 조건을 실행에서 확인해야 합니까?
    aspects:
    - verification
  design_topics:
  - id: constraints
    title: 지원 조건과 제약
    question: 지원 전제와 제약은 무엇이며 별도 검증할 항목은 무엇입니까?
    sources:
    - id: device
      file: src/device/CameraDevice.cpp
      start: '#include "device/CameraDevice.h"'
      end: '}  // namespace halcam'
      sha256: 7d9a81a09adcd15ccb946a7ffdb74417ecff5ed5f512c9c81fd7d9978094295e
    - id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    statements:
    - text: configureStreams()는 null 구성과 0개 또는 MAX_PIPES 초과 스트림을 거절하며, USE_DUAL_CAMERA에서는 홀수 스트림도 거절합니다. drain()이
        작업 완료를 기다리지 않고 inFlight_를 지우므로 종료 시 포인터 수명을 보장하는 제품 구현으로 사용할 수 없습니다.
      covers:
      - constraints
      evidence:
      - device
      - requests
  - id: verification
    title: 실행 확인
    sources:
    - id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    - id: thread
      file: src/pipeline/PipeThread.cpp
      start: '#include "pipeline/PipeThread.h"'
      end: '}  // namespace halcam'
      sha256: 2a2fd50d3f77d29e97c6306058935c854e998f2139abf77f2220eac52bc6c166
    statements:
    - text: RequestManager의 drain()은 inFlight_를 지우며 작업 완료를 기다리지 않습니다. PipeThread의 작업 종료와 프레임 수명을 함께 검증해야 하므로, 이
        정적 예제를 제품의 안전한 종료 동작을 입증하는 시험 결과로 사용할 수 없습니다.
      covers:
      - verification
      evidence:
      - requests
      - thread
    question: 어떤 조건을 실행에서 확인해야 합니까?
  reader: 기술 채택을 검토하고 연동·구현 범위를 정하는 Vendor 담당자
  routes:
  - q: 제품 개요에서 필요한 내용을 확인합니다.
    to: vendor-overview.md
  - q: 연동 가이드에서 필요한 내용을 확인합니다.
    to: vendor-contract.md
  next:
    title: 처음 읽는 개발자 안내
    link: architecture-contract.md
- id: architecture-contract
  title: 처음 읽는 개발자 안내
  kind: prose
  output: architecture-contract.md
  group: For Developer
  reader_profile: developer
  lead: CameraModule.cpp에서 시작해 요청 제출과 결과 콜백을 따라가세요.
  narration: facts
  facts:
    classes: []
  diagram:
    enabled: false
  show_evidence: true
  design_requirements:
  - id: entry
    question: 처음 읽을 파일과 진입점, 요청을 따라갈 순서는 무엇입니까?
    aspects:
    - entry
  - id: responsibility
    question: 컴포넌트의 책임은 어떻게 나뉩니까?
    aspects:
    - responsibility
  - id: boundaries
    question: 제어와 데이터는 어떤 경계를 통과합니까?
    aspects:
    - boundaries
  - id: lifecycle
    question: 상태와 자원 수명은 어떻게 변합니까?
    aspects:
    - lifecycle
  - id: concurrency
    question: 스레드와 동기화 책임은 어디에 있습니까?
    aspects:
    - concurrency
  - id: verification
    question: 정적 근거의 한계와 실행 확인 대상은 무엇입니까?
    aspects:
    - verification
  design_topics:
  - id: entry
    title: 처음 읽을 코드와 순서
    question: 처음 읽을 파일과 진입점, 요청을 따라갈 순서는 무엇입니까?
    sources:
    - id: module
      file: src/module/CameraModule.cpp
      start: // HAL module entry points.
      end: '    return ret;'
      sha256: 9459549a21f00a638a0a90a0c5ce2e12e6e6f48671cc6c11a965bbef545be179
    - id: device
      file: src/device/CameraDevice.cpp
      start: '#include "device/CameraDevice.h"'
      end: '}  // namespace halcam'
      sha256: 7d9a81a09adcd15ccb946a7ffdb74417ecff5ed5f512c9c81fd7d9978094295e
    - id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    statements:
    - text: src/module/CameraModule.cpp에서 camera_device_open()을 먼저 읽으세요. 이 함수는 CameraDevice를 만들고 호출자에게 넘기며, 호출자는
        camera_device_close()로 닫고 삭제합니다.
      covers:
      - entry
      evidence:
      - module
    - text: 다음은 src/device/CameraDevice.cpp입니다. initialize()로 콜백을 등록하고 configureStreams()로 구성한 뒤 processCaptureRequest()에서
        요청이 어디로 전달되는지 확인하세요. 콜백은 결과를 알리기 위해 등록한 함수를 호출하는 방식입니다.
      covers:
      - entry
      evidence:
      - device
    - text: src/device/RequestManager.cpp의 submit() → onFrame() → sendResult()를 이어서 읽으세요. submit()은 큐 등록 결과를 반환하고,
        sendResult()는 process_capture_result를 호출합니다. 두 경로 사이에는 작업 스레드가 있으므로 함수 목록을 동기 호출 순서로 읽지 마세요.
      covers:
      - entry
      evidence:
      - requests
  - id: responsibility
    title: 책임 분리
    sources:
    - &id004
      id: device
      file: src/device/CameraDevice.cpp
      start: '#include "device/CameraDevice.h"'
      end: '}  // namespace halcam'
      sha256: 7d9a81a09adcd15ccb946a7ffdb74417ecff5ed5f512c9c81fd7d9978094295e
    - &id005
      id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    - &id006
      id: thread
      file: src/pipeline/PipeThread.cpp
      start: '#include "pipeline/PipeThread.h"'
      end: '}  // namespace halcam'
      sha256: 2a2fd50d3f77d29e97c6306058935c854e998f2139abf77f2220eac52bc6c166
    statements:
    - text: CameraDevice는 구성 상태와 진입 조건을 확인합니다. RequestManager는 프레임 생성, 큐 전달과 결과 콜백을 연결합니다. PipeThread는 작업 큐와 작업
        스레드를 관리합니다.
      covers:
      - responsibility
      evidence:
      - device
      - requests
      - thread
    question: 컴포넌트의 책임은 어떻게 나뉩니까?
  - id: boundaries
    title: 호출 경계
    sources:
    - *id004
    - *id005
    - *id006
    statements:
    - text: processCaptureRequest()는 submit()의 반환값을 호출자에게 돌려줍니다. submit()은 프레임 포인터를 작업 큐에 넘깁니다. 작업 스레드의 handler_가
        onFrame()을 실행하므로 결과 콜백은 제출 함수의 반환과 별개입니다.
      covers:
      - boundaries
      evidence:
      - device
      - requests
      - thread
    question: 제어와 데이터는 어떤 경계를 통과합니까?
  - id: lifecycle
    title: 자원 수명
    sources:
    - *id005
    - *id006
    statements:
    - text: inFlight_는 unique_ptr로 프레임을 소유하고 작업 큐는 원시 포인터를 보관합니다. onFrameDone()은 해당 프레임을 지웁니다. drain()도 컨테이너를 즉시
        지우므로 큐에 남거나 실행 중인 포인터의 수명을 보장하지 못합니다.
      covers:
      - lifecycle
      evidence:
      - requests
      - thread
    question: 상태와 자원 수명은 어떻게 변합니까?
  - id: concurrency
    title: 스레드와 동기화
    sources:
    - *id006
    - *id005
    statements:
    - text: PipeThread는 큐를 잠근 상태에서 포인터를 꺼낸 뒤 잠금 밖에서 handler_를 호출합니다. RequestManager의 잠금은 별도로 inFlight_를 보호합니다. 두
        잠금이 프레임의 전체 사용 기간을 함께 보호하지는 않습니다.
      covers:
      - concurrency
      evidence:
      - thread
      - requests
    question: 스레드와 동기화 책임은 어디에 있습니까?
  - id: verification
