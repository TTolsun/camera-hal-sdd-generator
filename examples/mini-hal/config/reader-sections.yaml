sections:
- id: vendor-contract
  title: Vendor 구현 계약
  kind: prose
  output: vendor-contract.md
  group: For Vendors
  reader_profile: vendor
  lead: 이 작은 HAL의 실제 구현과 남아 있는 수명 제약을 확인하세요.
  narration: facts
  facts:
    classes: []
  diagram:
    enabled: false
  show_evidence: true
  design_requirements:
  - id: inputs
    question: 입력 조건과 구현 책임은 무엇입니까?
    aspects:
    - inputs
  - id: ownership
    question: 요청과 버퍼를 누가 유지하고 반환합니까?
    aspects:
    - ownership
  - id: completion
    question: 제출과 완료, 정지를 어떻게 구분합니까?
    aspects:
    - completion
  - id: failure
    question: 실패를 어떻게 구분하고 처리합니까?
    aspects:
    - failure
  - id: verification
    question: 어떤 조건을 실행에서 확인해야 합니까?
    aspects:
    - verification
  design_topics:
  - id: inputs
    title: 입력 조건
    sources:
    - &id001
      id: device
      file: src/device/CameraDevice.cpp
      start: '#include "device/CameraDevice.h"'
      end: '}  // namespace halcam'
      sha256: 7d9a81a09adcd15ccb946a7ffdb74417ecff5ed5f512c9c81fd7d9978094295e
    statements:
    - text: 콜백을 initialize()로 등록한 뒤 configureStreams()를 호출합니다. null 구성과 0개 또는 MAX_PIPES 초과 스트림은 거절합니다.
        USE_DUAL_CAMERA 구성에서는 홀수 스트림 수도 거절합니다.
      covers:
      - inputs
      evidence:
      - device
    question: 입력 조건과 구현 책임은 무엇입니까?
  - id: ownership
    title: 프레임 소유권
    sources:
    - &id002
      id: requests
      file: src/device/RequestManager.cpp
      start: '#include "device/RequestManager.h"'
      end: '}  // namespace halcam'
      sha256: 2e5518f45bdc653e2cce8c3bb1263a9064eb6da2bb02feb22fc0ab4bd0db083a
    statements:
    - text: 프레임 소유권과 작업 스레드의 포인터 관계는 [아키텍처 계약](architecture-contract.md#자원-수명)에서 확인합니다. 요청 제출자는 고유한 frame_number를
        전달해야 기존 inFlight_ 항목을 덮어쓰지 않습니다.
      covers:
      - ownership
      evidence:
      - requests
    question: 요청과 버퍼를 누가 유지하고 반환합니까?
  - id: completion
    title: 제출과 완료
    sources:
    - *id001
    - *id002
    statements:
    - text: submit()의 0 반환은 큐 등록 성공입니다. 결과 콜백은 runPipes()가 0을 반환할 때 호출합니다. flush()는 drain()을 호출하지만, 이
        예제의 drain()은 완료를 기다리지 않고 inFlight_를 지웁니다.
      covers:
      - completion
      evidence:
      - device
      - requests
    question: 제출과 완료, 정지를 어떻게 구분합니까?
  - id: failure
    title: 실패 처리
    sources:
    - *id002
    statements:
    - text: enqueue() 실패는 -1로 반환되지만 이미 등록된 inFlight_ 항목은 그 자리에서 제거하지 않습니다. runPipes() 실패 시에는 결과 콜백 없이
        onFrameDone()으로 항목을 지웁니다. 오류 알림을 완성한 제품 구현으로 사용할 수 없습니다.
      covers:
      - failure
      evidence:
      - requests
    question: 실패를 어떻게 구분하고 처리합니까?
  - id: verification
    title: 실행 확인
    sources:
    - *id002
    - &id003
      id: thread
      file: src/pipeline/PipeThread.cpp
      start: '#include "pipeline/PipeThread.h"'
      end: '}  // namespace halcam'
      sha256: 2a2fd50d3f77d29e97c6306058935c854e998f2139abf77f2220eac52bc6c166
    statements:
    - text: 이 예제는 정적 문서 파이프라인 검증용입니다. 큐 거절과 파이프 오류에서 요청이 정리되는지, flush()와 close() 중 작업 포인터가 유효한지는 별도 실행
        검증 대상입니다. 소스에는 대기 없이 프레임을 지우는 경로가 있습니다.
      covers:
      - verification
      evidence:
      - requests
      - thread
    question: 어떤 조건을 실행에서 확인해야 합니까?
  next:
    title: 다른 독자의 계약
    link: architecture-contract.md
- id: architecture-contract
  title: 아키텍처 계약
  kind: prose
  output: architecture-contract.md
  group: For Architects
  reader_profile: architecture
  lead: 이 작은 HAL의 실제 구현과 남아 있는 수명 제약을 확인하세요.
  narration: facts
  facts:
    classes: []
  diagram:
    enabled: false
  show_evidence: true
  design_requirements:
  - id: responsibility
    question: 컴포넌트의 책임은 어떻게 나뉩니까?
    aspects:
    - responsibility
  - id: boundaries
    question: 제어와 데이터는 어떤 경계를 통과합니까?
    aspects:
    - boundaries
  - id: lifecycle
    question: 상태와 자원 수명은 어떻게 변합니까?
    aspects:
    - lifecycle
  - id: concurrency
    question: 스레드와 동기화 책임은 어디에 있습니까?
    aspects:
    - concurrency
  - id: verification
    question: 정적 근거의 한계와 실행 확인 대상은 무엇입니까?
    aspects:
    - verification
  design_topics:
  - id: responsibility
    title: 책임 분리
    sources:
    - *id001
    - *id002
    - *id003
    statements:
    - text: CameraDevice는 구성 상태와 진입 조건을 확인합니다. RequestManager는 프레임 생성, 큐 전달과 결과 콜백을 연결합니다. PipeThread는
        작업 큐와 작업 스레드를 관리합니다.
      covers:
      - responsibility
      evidence:
      - device
      - requests
      - thread
    question: 컴포넌트의 책임은 어떻게 나뉩니까?
  - id: boundaries
    title: 호출 경계
    sources:
    - *id001
    - *id002
    - *id003
    statements:
    - text: processCaptureRequest()는 submit()의 반환값을 호출자에게 돌려줍니다. submit()은 프레임 포인터를 작업 큐에 넘깁니다. 작업 스레드의
        handler_가 onFrame()을 실행하므로 결과 콜백은 제출 함수의 반환과 별개입니다.
      covers:
      - boundaries
      evidence:
      - device
      - requests
      - thread
    question: 제어와 데이터는 어떤 경계를 통과합니까?
  - id: lifecycle
    title: 자원 수명
    sources:
    - *id002
    - *id003
    statements:
    - text: inFlight_는 unique_ptr로 프레임을 소유하고 작업 큐는 원시 포인터를 보관합니다. onFrameDone()은 해당 프레임을 지웁니다. drain()도
        컨테이너를 즉시 지우므로 큐에 남거나 실행 중인 포인터의 수명을 보장하지 못합니다.
      covers:
      - lifecycle
      evidence:
      - requests
      - thread
    question: 상태와 자원 수명은 어떻게 변합니까?
  - id: concurrency
    title: 스레드와 동기화
    sources:
    - *id003
    - *id002
    statements:
    - text: PipeThread는 큐를 잠근 상태에서 포인터를 꺼낸 뒤 잠금 밖에서 handler_를 호출합니다. RequestManager의 잠금은 별도로 inFlight_를
        보호합니다. 두 잠금이 프레임의 전체 사용 기간을 함께 보호하지는 않습니다.
      covers:
      - concurrency
      evidence:
      - thread
      - requests
    question: 스레드와 동기화 책임은 어디에 있습니까?
  - id: verification
    title: 변경 검증
    sources:
    - *id002
    - *id003
    statements:
    - text: 종료 시 먼저 drain()하고 그다음 thread_.stop()을 호출하는 순서를 검토해야 합니다. stop()은 작업 스레드를 join하지만 이미 삭제된 프레임을
        복원하지 못합니다. 실제 HAL 적용 전 종료·재구성·오류 경로의 수명 동기화를 구현하고 실행 검증해야 합니다.
      covers:
      - verification
      evidence:
      - requests
      - thread
    question: 정적 근거의 한계와 실행 확인 대상은 무엇입니까?
  next:
    title: 다른 독자의 계약
    link: vendor-contract.md
