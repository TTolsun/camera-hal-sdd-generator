# camera-hal-sdd-generator 파이프라인 설정.
# 상대 경로는 이 파일이 있는 디렉터리를 기준으로 해석한다.
# 로컬에서만 다른 값을 쓰려면 sdd.local.yaml 에 같은 구조로 덮어쓴다 (git 제외).

source:
  # Camera HAL 소스 루트. 이 저장소 옆에 hal-camera 가 clone 되어 있다고 가정한다.
  root: ../hal-camera
  # NDK-build 가 생성한 compile DB. 없으면 ndk_build 설정으로 생성한다.
  compile_commands: ../hal-camera/compile_commands.json
  # 사실에서 뺄 파일 (소스 루트 기준 glob). third_party 헤더처럼 compile DB 에 딸려 들어오는 코드를 제외한다.
  exclude: []
  ndk_build:
    enabled: true
    # `ndk-build compile_commands.json` 을 실행할 디렉터리 (jni/ 의 부모 또는 NDK_PROJECT_PATH)
    project_dir: ../hal-camera
    # Android.mk 위치가 기본과 다르면 여기서 지정한다.
    args: []
    # NDK r25 이상을 권장한다. 그 이하는 compile_commands.json 의 인자 escaping 이 불안정하다.

output:
  facts_dir: build/facts          # canonical knowledge model (facts.json)
  sdd_dir: sdd                    # 생성된 SDD Markdown (MkDocs docs_dir)
  diagrams_dir: sdd/diagrams      # clang-uml 이 만든 Mermaid 다이어그램 복사본

facts:
  # 패키지를 선언 파일 경로의 앞 몇 개 디렉터리로 묶을지 정한다 (clang-uml 을 쓰지 않는 추출 경로에 적용).
  # 소스가 src/ 와 include/ 아래로만 나뉘면 1 은 패키지가 두세 개로 뭉쳐서 개요 표가 쓸모없어진다.
  package_depth: 1

tools:
  clang_uml: clang-uml

agent:
  # ollama | openai-compatible | dry-run
  # dry-run 은 LLM 을 호출하지 않고 build/prompts/ 에 프롬프트만 기록한다.
  kind: ollama
  # 사내 운영 모델. Hermes 서비스를 쓰면 kind 를 openai-compatible 로 바꾸고 base_url 을 그 엔드포인트로 지정한다.
  model: qwen3.5:4b
  base_url: http://localhost:11434
  # 소형 모델 기준 입력 상한. 한국어+코드 혼합에서 약 3 자 = 1 토큰으로 보고 6k 토큰에 맞춘 값이다.
  # 초과분은 budget.py 가 우선순위 낮은 사실 블록부터 통째로 제외하고, 제외 목록을 문서 frontmatter 에 남긴다.
  max_input_chars: 18000
  temperature: 0.1
  timeout_sec: 300
  # 컨텍스트 창을 명시해야 하는 런타임(ollama num_ctx)용. 0 이면 지정하지 않는다.
  num_ctx: 8192
  # true 이면 style/i-have-adhd.md, style/fluent-korean.md 전문도 system 프롬프트에 넣는다 (약 13k 자).
  # 4B 급 모델에서는 false 로 두고 style/README.md 의 번안 규칙 5개만 넣는다.
  full_style_guides: false

review:
  # true 이면 LLM 출력의 모든 file:line 인용이 facts 에 존재해야 통과한다.
  require_citations: true
  # 검증 실패 시 재시도 횟수. 초과하면 status: needs-review 로 기록하고 사람에게 넘긴다.
  max_retries: 1

# See docs/document-lifecycle.md. Limits measure prose separately from code/tables.
documentation:
  enabled: true
  limits:
    max_chars: 18000
    max_markdown_chars: 120000
    max_growth_ratio: 1.5
    min_growth_chars: 1000
    duplicate_min_chars: 180

site:
  enabled: true
  title: Camera HAL 설계 문서
  # 인용을 코드로 연결할 주소와 형식. Gerrit Gitiles 는 gitiles, GitHub/GHE 는 github(기본).
  # 다른 호스트는 source_link_template 로 지정한다 ({url} {commit} {file} {line}).
  source_url: https://gerrit.example.com/plugins/gitiles/hal-camera
  source_link: gitiles
  # `sdd fetch-mermaid` 가 준비한 Mermaid ESM 사본. 사이트에 동봉되어 CDN 없이 그림을 렌더링한다.
  mermaid_dir: assets/mermaid
  # 사람 검토 승인(sdd accept) 없는 문서가 있으면 게시를 중단한다.
  require_approval: true

update:
  # `sdd update` 가 커밋마다 compile DB 를 새로 만들 명령 (소스 루트에서 실행). 없으면 기존 DB 를 쓴다.
  # compdb_cmd: ["ndk-build", "compile_commands.json"]
